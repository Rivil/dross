phases = ["complete-base-truth", "state-json-branch-safety", "completion-state-truth", "milestone-stacking", "provider-merge-parity", "dross-repair", "config-trust-hardening", "exec-trust-followups"]

[milestone]
  version = "v1.2"
  title = "1.2 branch-model truth — the base is a fact, not a guess"
  status = "complete"
  started = "2026-07-31"

[scope]
  success_criteria = ["Every refusal path in dross phase complete leaves the repo exactly as it found it: HEAD stays on phase/<id>, no branch is checked out, and no ref is moved — for gate, fetch, and safety-net-push failures alike", "A phase's base branch is recorded when the phase is created or shipped and read back at completion, so dross phase complete reconciles against the branch the work actually landed on — never one inferred from current_milestone. A phase cut from main while a stale milestone branch exists completes correctly, and never fast-forwards or deletes anything on the wrong branch", "Checking out a long-lived milestone/* branch cannot destroy live .dross/state.json history — a stale copy on that branch either doesn't exist or doesn't overwrite the working state — while release.yml can still read the project version from a clean CI checkout", "--recover and dross ship recover only ever reset the phase's recorded base, and only ever source the restored .dross/ tree from a commit that actually holds this phase's work — never from a branch the command itself checked out mid-run", "A regression suite reproduces both real incidents — a phase forked from main completed while a stale milestone branch exists, and a stale long-lived branch checked out over live state — and each test fails against the pre-milestone code", "Completion's authoritative merge-and-base lookup works on Forgejo/Gitea and GitLab, not just GitHub; no configured provider silently degrades to the ancestry fallback without saying so", "dross milestone create cuts the new integration branch from the current milestone's tip when that milestone is unmerged, instead of unconditionally from main", "dross detects a clobbered or incomplete .dross/ and repairs it from git history in one command, rather than requiring hand-reconstruction", "No config-derived or user-supplied value can be parsed as a flag: leading-dash rejection, -- separators before positional args, and an auth_env host allowlist"]
  non_goals = ["Shipping the .dross/ repair command is in scope; running it against other repos (feastahead, infra) and validating their reconstructed histories is manual work outside this milestone", "Stacked milestones is the only branch-topology change — no git worktree support, no parallel in-flight milestones, no rework of the phase/<id> fork model beyond recording the base", "The v0.9 merge-gate design stays locked (merge_authority, offline_fallback, pr_persistence) — provider parity extends its reach, it does not revisit the design", "No board or tracker work — Jira/YouTrack/GitHub board sync stays untouched even though phase completion writes tracker state"]
