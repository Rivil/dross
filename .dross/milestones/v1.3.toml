phases = ["mutation-diff-scope", "survivor-lifecycle", "survivor-drain", "milestone-lifecycle-close", "board-sync-truth", "red-proof-reachability", "remote-mutation-runner", "config-value-truth", "guard-remedy-ordering", "deferred-add-command", "multilang-verify-signal", "plan-gray-area-walkthrough", "mutation-score-truth", "phase-create-adoption", "board-task-mirror", "red-proof-repoint"]

[milestone]
  version = "v1.3"
  title = "1.3 finish the tool — the standing backlog, drained"
  status = "active"
  started = "2026-08-09"
  base = "main"

[scope]
  success_criteria = ["A phase's mutation run reports only mutants inside that phase's own diff — a survivor in an untouched file in the same Go package is not attributed to the phase", "Every survivor a verify run reports carries exactly one state — in-diff, routed, or accepted-with-reason — and an accepted survivor is never re-emitted by a later run", "The standing pre-existing survivor debt is gone: each of the ~76 survivors across 23 internal/cmd files is either killed by a test or recorded accepted-with-reason, and a full verify run reports zero unclassified survivors", "No mutation config error fails silently: a typo in [mutation].adapters is rejected by name instead of filtering out every adapter and landing all files in Skipped", "The drain-don't-relist policy ships as a builtin rule — dross rule show lists it in a repo with no project rules configured, so every dross repo inherits it rather than just this one", "The milestone lifecycle closes itself: dross milestone complete --finalize owns the status flip and is idempotent (re-running after success says already-finalized, never a misleading not-merged), a missing branch ref is distinguished from an unmerged one, and /dross-milestone dispatches on status — scope when there is no active milestone, drive completion (gating merge-commit-not-squash) when all phases are done, report what is left otherwise", "Board sync is honest: dross issue pull builds a valid query for any label set (multiple labels OR together, labels absent from the project do not error the request), a board failure surfaces in the /dross-status inbox line instead of being silently counted as zero, and board field names are configurable rather than hardcoded to YouTrack's State/Type/version-bundle", "No proof or config lies: a red proof pins the phase's recorded fork point and dross doctor fails when a pinned red-proof SHA is unreachable from any branch, and every documented-and-settable config value either changes behaviour or is rejected — runtime.mode='hybrid' branches somewhere or goes", "Guards lead with the cheapest correct fix: when local main is merely an ancestor of its remote, the branch-switch state.json guard offers the fast-forward as the lead remedy instead of only move-aside or untrack", "A fault found outside a phase can be routed by CLI — dross deferred add exists — so a finding never has to live in handoff.md for want of a home", "Non-Go stacks get a real verify signal: at least one non-Go stack runs mutation and analyzer coverage end-to-end rather than landing every file in Skipped", "/dross-plan walks every area Claude is genuinely unsure about, one focused turn each, with no multiSelect pre-selection — matching the walk-all treatment /dross-spec already received in the v0.6 gray-area-walkthrough phase", "Milestone list fields are correctable through the CLI: a wrong entry in phases or scope.success_criteria can be removed or replaced without hand-editing the toml, closing the write-only gap that forced a bypass while scoping v1.3", "The gremlins switch-case and const-initializer attribution ceiling is proven by a test — a fully-tested switch case still reports NOT-COVERED — and those survivors are recorded accepted-with-reason so they stop being reported", "Every command dross narrates in its own output or prompts resolves against the real CLI tree — the parity guard covers unbackticked and concatenation-split narrations, not only backticked spans", "Board mirroring reaches task granularity and drives the tracker's own workflow field: every plan task gets a child issue under its phase issue, execute moves that child to in-progress when it picks it and to a review state when it commits, verify moves the phase to a UAT state, and a mapped state value absent from the tracker is created in a project-private bundle rather than silently skipped — across every board provider that can express it (youtrack, jira, github projects, forge REST), with an explicit warn-and-continue floor where it cannot", "Mutation runs execute off-box on demand: with a machine-local [mutation.remote] host configured, a phase's gremlins run happens on that host and its per-package reports land in the local reports/gremlins/, so verify's scoping, scoring and survivor lifecycle are identical to a local run — a remote host is refused from tracked project.toml and only ever read from untracked local config, and gremlins' worker/test-cpu parallelism is settable rather than hardcoded to NumCPU/2"]
