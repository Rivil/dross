phases = ["test-hermeticity-guard", "cli-surface-completeness", "pull-envelope-truth", "mutation-score-weighting", "adopter-upgrade-note", "plan-review-tiers", "runtime-command-runner", "ci-mutation-leg", "remote-host-pool", "board-task-inbound", "scratch-volume-guard"]

[milestone]
  version = "v1.4"
  title = "1.4 the backlog burn — every parked idea, routed or killed"
  status = "complete"
  started = "2026-08-17"
  base = "main"

[scope]
  success_criteria = ["`dross deferred list --someday` returns an empty list at milestone close: every idea routed into v1.4 is delivered or explicitly dismissed, and no phase in this milestone parks a new item as someday without routing it", "A mutation run reaches a bare host without hand-administration and picks between more than one: dross installs pinned language runtimes on a host that has none, selects a ready host from a configured set, and a re-run against an unchanged tree does no full resync — with the run's report identical to a local one", "The non-Go mutation leg runs on every PR in CI, on a pinned toolchain: a PR that breaks the JS/TS mutation run fails CI on a machine where no developer installed anything, and the workflow adding it passes the supply-chain checklist (pinned action SHAs, lockfile-scoped install, no lifecycle scripts)", "No dross output claims more than it knows: `dross issue pull --json` returns its envelope with a non-null .error on any failure including a missing auth variable, a pooled multi-language mutation score is weighted by leg size rather than raw-counted, and a test that reads the real repo's .dross tree fails locally instead of only in CI", "Nothing dross supports requires hand-editing a dross artefact or a config value that nothing reads: `dross task add`/`task edit` set test_contract, `dross phase create --adopt` takes over a started slug, and every runtime command in project.toml is executable via `dross run <name>`", "Dragging a task's card on the board moves that task in plan.toml on the next sync, and a task changed on both sides since the last sync is refused with both values named rather than silently resolved"]
  non_goals = ["No new someday items: a phase in this milestone routes every idea it surfaces to a destination or dismisses it — parking nothing back into the list this milestone exists to empty", "No scratch-cache treatment for the security/quality scanners: dross spawns no scanner (they are agent-driven via Bash), the Go analyzers compile the package graph once and are helped by a warm shared cache rather than hurt by it, and trivy's vulnerability DB is a cache to persist rather than wipe — the item was dismissed on those grounds, not deferred", "No gremlins workdir pin: measured this milestone, Go's build cache is ~97% path-independent — the same source built at a different path recompiles 1-2 units of 60, not the graph — so gremlins' random workdir costs almost nothing and the phase was chasing a cost that does not exist. Stock gremlins v0.6.0 also has no workdir flag and no newer release", "No remote language-runtime installation: it reverses the locked install_scope decision (dross installs adapter packages into an existing runtime, never a runtime itself — that is root, PATH ownership and version policy), and it is blocked in practice because dross probes with 'command -v' over a non-interactive shell, which cannot see a version-manager shim", "No remote-run latency work: measured against the reference host, an ssh round trip costs ~0.07s and a no-change rsync scan 0.27s, so a 20-package verify spends ~4s on transport in a run that takes minutes. rsync is already incremental, so 'skip when nothing changed' saves a tree scan, not a copy. Folding the per-package prepare into the tool's script was attempted and reverted: it rewrites the connection-sequence invariant six tests pin, and it launders a failed rm into the tool's exit-code band, where a non-zero exit is deliberately tolerated because gremlins exits 1 on survivors", "No remote test_watch: the deferral named three blockers and this milestone resolved two of them — dross run test-watch now reads the field and ends cleanly on Ctrl-C. The third is decisive rather than merely hard: a watch's value is sub-second feedback on save, the edits happen locally, and a remote watcher observes the remote tree, so it would need a local-change-to-rsync daemon and would then add a tree scan, a transfer and an ssh to every save. Remote buys laptop-freedom, not speed; for a watch that trade is inverted, and the local runner is the better answer rather than a step toward a worse one"]
