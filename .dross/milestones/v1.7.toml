phases = ["exec-consent-completeness", "tracked-path-containment", "tool-output-not-persisted", "push-gates-on-origin", "scanner-self-exclusion", "supply-chain-currency", "mutation-range-provenance", "ast-aware-mutation-ranges", "secret-detection", "cmd-package-decomposition"]

[milestone]
  version = "v1.7"
  title = "1.7 symmetric controls — every path to a dangerous operation goes through the gate"
  status = "active"
  started = "2026-09-03"
  base = "main"

[scope]
  success_criteria = ["Every command that spawns the repository's own code goes through the exec-consent gate, proven by a test that ENUMERATES spawn sites rather than checking a hand-maintained list — so a newly added command cannot reach gremlins or the suite ungated.", "A filesystem path loaded from a tracked artifact is containment-checked before any file I/O, on the READ path as well as the write path — a changes.json naming ../ escapes nothing — and the check is one shared implementation rather than a second copy.", "No raw subprocess output is persisted to verify.toml or rendered into a PR body: a failing adapter leg records its exit status, the bytes captured and a pointer to the run's own stderr, while the live diagnostic keeps streaming to the terminal unchanged.", "A push that failed is retried on the next run because its gate compares local against origin rather than against the local index — a PR record that did not reach origin is never reported as shipped, and the failure path has a test.", "Running dross's own scans against dross reports zero self-referential findings: language detection skips testdata and fixtures, the secret scanner does not match dross's own identity hashes, and the tech-debt scanner does not flag its own marker definitions.", "No reachable stdlib vulnerability ships, and the release build measures the dependency graph it actually ships — the toolchain is current, and workflow values reach the shell through env: rather than template interpolation.", "Mutation ranges are AST-aware: a range covers the enclosing syntactic construct, so no mutant that covers a changed line goes ungenerated — retiring the line-pad heuristic and its documented residue rather than tuning its constant.", "No persisted artifact or published PR body carries recognisable secret material, enforced by BOTH halves: captured subprocess output is not persisted at all, and what is persisted is scanned by a pattern-based detector — detection alone is false assurance, since a scrubber cannot recognise a secret shape it was never told about.", "internal/cmd holds cobra wiring only: every domain it currently carries — board reconciliation, consent and fingerprinting, diagnostics, mutation-adapter construction — lives in a package of its own, provable by import direction rather than by file size."]
