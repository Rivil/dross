  notes = "TestReachabilityLooseObject is the criterion stated exactly: an object that still exists in the local repo but no branch reaches must NOT pass, which is what a squash-merge leaves behind. The ref topology is built with update-ref rather than a real clone, so each test's reachability graph is explicit rather than a side effect of fetch."

