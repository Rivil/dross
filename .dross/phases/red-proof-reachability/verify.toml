  notes = "The delegation gate greps the fixture suite for git containment probes (rev-parse, for-each-ref, merge-base, is-shallow-repository) and fails if it asks any of them itself, then asserts it still calls classifyReachability. Its probe list is built by string concatenation so the gate cannot match its own source — without that it would pass vacuously forever."

