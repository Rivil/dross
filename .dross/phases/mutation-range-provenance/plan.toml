[[task]]
  id = "t-1"
  wave = 1
  title = "Land the two ranged-runner cherry-picks on HEAD"
  files = ["internal/mutation/adapter.go", "internal/mutation/stryker.go", "internal/mutation/range_test.go", "internal/mutation/argv_test.go", "internal/mutation/stryker_test.go", "internal/verify/verify.go", "internal/verify/range_dispatch_test.go"]
  description = "`git cherry-pick -x 1da3f73` then `git cherry-pick -x 21e354b`, in that order (the second edits range_dispatch_test.go the first creates and hooks padAndMerge into the first's runAdapter). 1da3f73 applies clean on HEAD (checked at plan time); the work is idiom adaptation, not conflict resolution: in stryker.go's narrowed-tolerant checkInstrumented use `head.contains(strykerDropWarningText)` (toolfail.go:184) rather than the pick's `strings.Contains(head.buf.String(), ...)`; in verify.go RunScoped the `report, err := runAdapter(a, byAdapter[name], scope)` line replaces `a.Run(...)` and sits beside HEAD's `mutation.RecordLegError(err)` / RemoteTransport branch — keep both. Lands: mutation.Range, mutation.RangeRunner, Stryker.RunRanges, runArgs(files, ranges), rangeKey, narrowedSet; verify.hunkContextLines = 25 (UNTOUCHED — pad_constant lock), padAndMerge, runAdapter; the ported tests from both commits. Add one new test, TestGremlinsDoesNotImplementRangeRunner. No new behaviour beyond that. This task deliberately carries two pick commits plus an adapt commit if needed — the landing_method lock preserves both commit messages (the measured mutant-count table). `make install` after (r-01). Gate on `go test -count=1 ./internal/mutation/ ./internal/verify/` + `go vet ./...` observed locally, internal/cmd via `dross test` (remote), never --local.\n"
  covers = ["c-1"]
  test_contract = ["if runArgs ignores its ranges map, TestRunArgsEmitsLineRanges fails — {\"src/a.ts\":[{10,12}]} must put `src/a.ts:10-12` in --mutate", "if the `:10-12` suffix is glued on before escapeGlobMeta, TestRunArgsAppendsTheRangeAfterEscaping fails — for a `[id]` route path the suffix must follow the escaped `[[]id[]]` form", "if one malformed range in a file's set lets the good ranges through beside the bare path, TestRunArgsFallsBackWholesaleWhenAnyRangeIsMalformed fails — the bare path appears once and no `:s-e` entry beside it", "if RunScoped still calls Run on a RangeRunner, or pads by anything other than 25, TestRunScopedPassesPaddedRanges fails — raw hunk {100,104} must reach the adapter as {75,129}", "if the RangeRunner type assertion is unchecked, TestRunScopedStillRunsAnAdapterThatCannotRange panics/fails — a plainAdapter under a hunked Scope has Run called exactly once", "if fail-open is lost at the scope level, TestRunScopedWithNoHunksRunsWholeFiles / TestRunScopedWithANilScopeRunsWholeFiles / TestRunScopedWithHunksForOtherFilesRunsWholeFiles fail — RunRanges never called, Run is", "if padAndMerge drifts, the exact-value asserts fail: TestPadAndMergeWidensEachHunk ({100,104}→{75,129}), TestPadAndMergeClampsToTheFirstLine ({3,4}→start 1), TestPadAndMergeMergesOverlappingHunks ({100,101}+{120,121}→{75,146}), TestPadAndMergeKeepsDistantHunksSeparate ({10,11}+{900,901}→two), TestPadAndMergeOnNoHunksIsNil", "if the stryker drop-warning guard is deleted while narrowing tolerance is added, TestCheckInstrumentedStillRefusesWhenStrykerWarnedItDropped fails while TestCheckInstrumentedToleratesANarrowedFileWithNoMutants must still pass", "if Gremlins ever grows a RunRanges method, TestGremlinsDoesNotImplementRangeRunner fails (`_, ok := any(&Gremlins{}).(RangeRunner); !ok`) — the criterion's gremlins-runs-whole-files clause is pinned; TestStrykerImplementsRangeRunner pins the other side", "if a fallback message is routed through errors.New/fmt.Errorf/fmt.Sprintf over the head buffer, TestNoToolOutputInsideAnErrorConstructor fails — the pick's messages go through fmt.Fprintf(os.Stderr, ...)"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Kill the three compilefence survivors in their own package"
  files = ["internal/compilefence/compilefence_test.go", ".dross/survivors.toml"]
  description = "Add a recording testing.TB to compilefence_test.go (embeds *testing.T; overrides Fatalf to capture the formatted message and return instead of Goexit; Helper no-op) and drive AssertDoesNotCompile / AssertCompiles through it from INSIDE package compilefence using the existing fixtures (importsInternal, setsUnexportedField, setsUnknownField, emptyLiteral). Today every test in the file calls build() directly, so :61/:80/:81 read count=0 under gremlins' per-package scope — tracked-path-containment/verify.toml:102 names exactly this fix. Gate behind !testing.Short() like the file's other build tests. Then run `dross survivor drain --packages internal/compilefence --phase mutation-range-provenance` (NoArgs; needs exec consent) and READ its output. Tests are the primary disposition. ONLY if the drain still lists :81 after coverage — ARITHMETIC_BASE turning a string `+` into `-` does not compile, so it should surface as non-viable, not survived — accept it via `dross survivor accept internal/compilefence/compilefence.go:81 --op ARITHMETIC_BASE --reason \"...\"` citing the compile-failure mechanism. survivors.toml is written by the CLI in that case only, never hand-edited.\n"
  covers = ["c-4"]
  test_contract = ["if `err == nil` at compilefence.go:61 is negated, TestAssertDoesNotCompileRefusesACompilingFixture fails — AssertDoesNotCompile(rec, importsInternal, \"x\") must record exactly one Fatalf containing \"COMPILED but should not have\"", "if the :61 negation fires on every fixture instead, TestAssertDoesNotCompileAcceptsTheRightRefusal fails — (rec, setsUnexportedField, \"cannot refer to unexported field\") must record zero Fatalfs", "if the wrong-reason branch below :61 is bypassed, TestAssertDoesNotCompileRefusesTheWrongReason fails — (rec, setsUnknownField, \"cannot refer to unexported field\") must record a Fatalf containing \"WRONG reason\"", "if `err != nil` at :80 is negated, TestAssertCompilesRefusesABrokenFixture fails — AssertCompiles(rec, setsUnexportedField) must record a Fatalf whose text contains BOTH \"compile fence itself is broken\" and \"so every AssertDoesNotCompile\" (the two halves of :81's concatenation)", "if :80 fires on a clean fixture, TestAssertCompilesAcceptsACleanFixture fails — AssertCompiles(rec, importsInternal) records zero Fatalfs", "observed, not unit-asserted: `dross survivor drain --packages internal/compilefence --phase mutation-range-provenance` reports 0 outstanding and lists none of 365503d33114f65e, 5d74aadbbae679b7, 695a2b44f32b1b43 — killed, or (:81 only) accepted with a reason naming non-viability"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 2
  title = "One range validator; classify each file's fate pre-dispatch"
  files = ["internal/mutation/adapter.go", "internal/mutation/stryker.go", "internal/verify/range_provenance.go", "internal/verify/range_provenance_test.go"]
  description = "Add `func (r Range) Valid() bool` on mutation.Range (Start >= 1, End >= Start) and make stryker.runArgs call it in place of its inline `r.Start <= 0 || r.End < r.Start` — ONE definition both layers share. Add `EffectiveRange{Start, End, Pad int}` (json start/end/pad), the CLOSED reason set as string constants — WholeFileNoRangeRunner = \"adapter-lacks-range-runner\", WholeFileNoHunks = \"scope-has-no-hunks\", WholeFileAbsentFromHunks = \"file-absent-from-hunks\", WholeFileMalformedRange = \"malformed-range\" — and an exported pure planner `PlanRanges(a mutation.Adapter, files []string, scope *Scope) RangePlan`, where RangePlan carries the dispatch map (map[string][]mutation.Range), `Ranges map[string][]EffectiveRange`, `WholeFile map[string]string`, and the Degraded lines to append. Malformed is checked on the RAW hunk (converted to mutation.Range, .Valid()) BEFORE padAndMerge — padding would clamp {0,3} into a legal range and hide the malformation; the hunk's numbers go into the Degraded line, never into the closed reason value. Severity per the fallback_severity lock: NoRangeRunner and AbsentFromHunks add no Degraded line; MalformedRange and NoHunks-on-a-RangeRunner each add one. Pure: no dispatch, no I/O; nothing calls it until t-4. Tags ranges / whole_file / pad / start / end sit outside both walker vocabularies; the reason lives in a map VALUE, never a `reason`-tagged string field.\n"
  covers = ["c-2", "c-3"]
  depends_on = ["t-1"]
  test_contract = ["if verify and stryker ever validate ranges differently, TestVerifyNeverDispatchesARangeStrykerWouldRefuse fails — for raw hunks {0,5}, {5,2}, {-3,4} PlanRanges puts the file under WholeFile=malformed-range and omits it from the dispatch map, and runArgs given that dispatch map emits `file:start-end` for EVERY key (no wholesale fallback)", "if the malformed check runs after padding, TestMalformedRawHunkIsCaughtBeforePadding fails — hunk {0,3} on a.ts is classified malformed, NOT clamped to {1,28} and dispatched; the Degraded line contains \"a.ts\" and the raw numbers", "if one malformed file takes its neighbours down, TestMalformedHunkFallsBackOnlyItsOwnFile fails — a.ts malformed, b.ts {10,12}: b.ts is dispatched as {1,37} pad 25 and a.ts is not", "if file-absent-from-hunks ever degrades, TestFileAbsentFromHunksIsInformational fails — files a.ts,b.ts with hunks only for a.ts: WholeFile[b.ts]==file-absent-from-hunks, Ranges has a.ts only, Degraded delta empty", "if adapter-lacks-range-runner ever degrades, TestNoRangeRunnerIsInformational fails — a plainAdapter under a hunked Scope: WholeFile[f]==adapter-lacks-range-runner for EVERY file, Ranges nil, Degraded delta empty", "if the severity split collapses to all-degraded or none, TestHunklessScopeOnACapableAdapterDegrades fails — a RangeRunner with Hunks nil: every file → scope-has-no-hunks AND exactly one Degraded line naming the adapter; the same scope on a plainAdapter adds nothing", "if the recorded range is the raw hunk or the pad is not 25, TestEffectiveRangesArePostPadPostMerge fails — hunks {10,12} and {30,31} on one file record ONE EffectiveRange {1,56,25} equal to padAndMerge's output", "if any WholeFile value is outside the four constants, TestWholeFileReasonsAreAClosedSet fails", "if the new fields land under a toolfence or path-shaped tag, TestEveryPersistedTextSinkIsDeclared / TestEveryPathShapedFieldIsDeclared (internal/cmd) go red — they must stay green with NO registry edit"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 3
  title = "Record provenance on every leg — attached, detached, failed"
  files = ["internal/verify/verify.go", "internal/verify/range_dispatch_test.go", "internal/verify/range_record_test.go", "internal/cmd/verify.go", "internal/cmd/verify_results_test.go"]
  description = "LanguageRun gains `Ranges map[string][]EffectiveRange json:\"ranges,omitempty\"` and `WholeFile map[string]string json:\"whole_file,omitempty\"` (range_record_home lock). RunScoped calls PlanRanges once per leg, dispatches the SAME dispatch map it records (RunRanges when the map is non-empty and the adapter is a RangeRunner, else Run), appends the plan's Degraded lines to scope.Degraded nil-safe and deduped, and stamps Ranges/WholeFile on BOTH the success leg and the RecordLegError branch (provenance is known before the tool runs). The pick's runAdapter is replaced by this, not kept beside it. collectDetached (internal/cmd/verify.go:646) builds its gremlins leg through the same PlanRanges call — it has no adapter in hand, so pass a zero `&mutation.Gremlins{}`: PlanRanges is pure and only type-asserts RangeRunner, so do NOT wire the mutationTuning.gremlins constructor (:982) into a path that must not run anything. The detached leg then carries whole_file=adapter-lacks-range-runner for every file rather than nothing."
  covers = ["c-2", "c-3"]
  depends_on = ["t-3"]
  test_contract = ["if the recorded ranges are derived by a second loop rather than being the dispatched map, TestRecordedRangesAreTheDispatchedRanges fails — the rangingAdapter's captured map deep-equals lr.Ranges' start/end for every file", "if tests.json does not carry raw and effective side by side, TestLegRecordsEffectiveRangesWithPad fails — after Tests.Save the RAW bytes contain `\"ranges\":{\"src/a.ts\":[{\"start\":1,\"end\":37,\"pad\":25}]}` under languages[0] and `\"hunks\":{\"src/a.ts\":[{\"start\":10,\"end\":12}]}` under scope; LoadTests round-trips Ranges and WholeFile DeepEqual", "if the assignment is deleted from the error branch, TestFailedLegKeepsItsProvenance fails — an adapter whose RunRanges errors still yields a leg with Error set AND Ranges/WholeFile populated", "if the Degraded append is not nil-safe, TestNilScopeRecordsNoProvenanceAndDoesNotPanic fails — Run() with nil scope produces legs with no ranges/whole_file and no panic", "if degraded lines repeat, TestDegradedLinesAreDeduped fails — two RangeRunner adapters on a hunk-less scope produce ONE degraded line per adapter, never an identical duplicate", "if the detached path hand-builds its leg, TestCollectRecordsWholeFileProvenance fails — extend TestCollectWritesTheSameArtefactsAnAttachedRunWould: the collected go leg's whole_file names every dispatched file with adapter-lacks-range-runner and ranges is absent", "if a gremlins leg emits an empty `ranges` key, TestGremlinsLegHasNoRanges fails — `ranges` must be ABSENT from the bytes (omitempty) on a leg that ranged nothing"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 4
  title = "State ranges and fallbacks in verify.toml and output"
  files = ["internal/verify/verify.go", "internal/verify/range_summary_test.go", "internal/cmd/verify.go", "internal/cmd/verify_scoping_test.go"]
  description = "LegSummary gains `Pad int toml:\"pad,omitempty\"`, `Ranges []string toml:\"ranges,omitempty\"` (\"file:start-end\", sorted) and `WholeFile []string toml:\"whole_file,omitempty\"` (\"file — reason\", sorted); Skeleton fills them from LanguageRun for success AND error legs. Flat strings, not tables — verify.toml is read by agent and human; tests.json / --json are the machine record. printScopeSummary prints, per leg, `  ranged <tool> N file(s) (pad 25)` when Ranges is non-empty and `  whole-file <tool> ×N — <reason>` once per distinct reason, capped like the file list. A leg with no ranges never prints the word \"ranged\". `make install` after.\n"
  covers = ["c-2", "c-3"]
  depends_on = ["t-4"]
  test_contract = ["if verify.toml stops stating the effective ranges, TestVerifyTomlStatesEffectiveRanges fails — Skeleton+Save over one ranged stryker leg and one gremlins leg: the RAW bytes contain `pad = 25`, `ranges = [\"src/a.ts:1-37\"]`, and a whole_file entry \"src/b.ts — file-absent-from-hunks\"; LoadVerify round-trips all three", "if a whole-file leg claims a pad or ranges, TestGremlinsLegHasNoPad fails — the gremlins [[summary.leg]] omits `pad` and `ranges` entirely (grep the bytes) and its whole_file names every file", "if the new keys break old records, TestLegacyVerifyTomlLoads (measured_on_test.go:82) fails — a verify.toml without them round-trips unchanged", "if a whole-file leg ever prints as ranged, TestVerifyOutputNamesWholeFileLegs fails — TestScopingAttributionHoldsEndToEnd's fixture through captureStdout: stdout contains \"whole-file\" on the same line as \"adapter-lacks-range-runner\" and NOT the word \"ranged\"; a stub RangeRunner in the same harness prints \"ranged stryker 1 file(s) (pad 25)\" and never \"whole-file\" for that file"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 5
  title = "Add `dross verify scope <phase-id>`"
  files = ["internal/cmd/verifyscope.go", "internal/cmd/verifyscope_test.go", "internal/cmd/verify.go", "internal/verify/range_provenance.go", "assets/prompts/verify.md", "internal/cmd/verify_prompt_test.go", "README.md"]
  description = "New cobra subcommand `scope <phase-id>` registered at verify.go:162-164 beside finalize/results/status. internal/cmd/verifyscope.go ALREADY EXISTS and holds phaseScope/gitReason/containScope — the scope-derivation pipeline t-7 depends on; APPEND the subcommand to it (or add a sibling verify_scope_cmd.go), never recreate it. Loads tests.json via verify.LoadTests(verify.FilePaths(root, id)); missing → error \"no verify run recorded for <id> — run `dross verify <id>` first\" through the RunE path (non-zero exit), nothing on stdout. Text mode: scope header (source, base, N files), each in-scope file with its raw hunks, then per leg the ranged files as `s-e (pad N)` and the whole-file files with their reason. `--json` marshals a `verify.Provenance{Phase, GeneratedAt, Files, Hunks, Legs[]{Name, Tool, Files, Ranges, WholeFile}}` — the type lives in internal/verify/range_provenance.go (t-3's file) beside the fields it projects — copied field-for-field from the loaded Tests, nothing else on stdout. Reading of c-5's \"verbatim\": the same VALUES with no re-rendering (a projection of the loaded record, not the raw tests.json bytes); verify judges against that reading. verify.md gains one paragraph under \"The score covers only this phase's changed files\" (line 72) naming per-leg `ranges` / `whole_file`, the `dross verify scope <phase>` command, and the rule that a whole-file leg is never called ranged. README verify command table gains the row. Runs after t-5 because both edit internal/cmd/verify.go. `make install` after (r-01)."
  covers = ["c-5"]
  depends_on = ["t-4", "t-5"]
  test_contract = ["if the no-run path returns nil or a generic not-found, TestVerifyScopeWithoutARunNamesTheFix fails — runCmd returns a non-nil error whose text contains the phase id and \"dross verify <id>\"; stdout is empty", "if any of the four sections is dropped, TestVerifyScopePrintsRawAndEffective fails — a seeded tests.json under chdirDross (stryker leg ranged src/a.ts {1,37} pad 25 with raw hunk {10,12}; gremlins leg whole-file): stdout contains \"src/a.ts\", \"10-12\", \"1-37 (pad 25)\", and \"whole-file\" on the same line as \"adapter-lacks-range-runner\"", "if --json re-renders instead of copying, TestVerifyScopeJSONIsTheRecordVerbatim fails — stdout unmarshals into verify.Provenance; Legs[i].Ranges / .WholeFile DeepEqual LoadTests(...).Languages[i].Ranges / .WholeFile and Files/Hunks equal Scope.Files/Scope.Hunks; a pretty-printed \"1-37\" string in place of {start,end,pad} fails; no prose before the \"{\"", "if a pre-provenance record panics or prints as ranged, TestVerifyScopeOnAPreProvenanceRecordSaysSo fails — a tests.json with no ranges/whole_file on any leg prints each leg as \"no range provenance recorded\"", "if the verify prompt loses the provenance paragraph, TestVerifyPromptReadsRangeProvenance fails — verify.md contains \"whole_file\", \"ranges\" and \"dross verify scope <phase>\"", "if the README row is missing, TestReadmeDocumentsVerifyScope fails — README.md contains a row starting \"| `dross verify scope <phase>`\""]
  status = "done"

[[task]]
