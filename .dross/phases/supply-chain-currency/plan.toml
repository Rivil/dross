[phase]
id = "supply-chain-currency"

[[task]]
id            = "t-1"
wave          = 1
title         = "Pin toolchain in go.mod, workflows read it"
files         = [
  "go.mod",
  ".github/workflows/ci.yml",
  ".github/workflows/release.yml",
  "internal/cmd/toolchain_source_test.go",
]
description   = """
go.mod: `go 1.27.0` + `toolchain go1.27.1`. Every setup-go step in ci.yml (test,
mutation-ts) and release.yml switches from `go-version: '1.25.13'` to
`go-version-file: go.mod`; rewrite the pin comments to point at go.mod as the
source. New test parses go.mod with x/mod/modfile and scans both workflows.
Audit both workflow edits against the CI supply-chain hardening checklist.
"""
covers        = ["c-1", "c-2"]
test_contract = [
  "if go.mod loses its `toolchain` directive, or the toolchain is below the `go` directive, TestToolchainSingleSource fails",
  "if any actions/setup-go step in any .github/workflows/*.yml carries a `go-version:` key or lacks `go-version-file: go.mod`, TestToolchainSingleSource fails",
  "if any advisory is reachable on the go1.27.1 toolchain, the ci.yml `govulncheck ./...` step fails (c-1 evidence: the executor's observed local `govulncheck ./...` exit 0 plus the CI step)",
]
status        = "pending"

[[task]]
id            = "t-2"
wave          = 2
depends_on    = ["t-1"]
title         = "Bump direct deps, gate tidy drift in CI"
files         = ["go.mod", "go.sum", ".github/workflows/ci.yml"]
description   = """
Bump the four direct deps to latest (toml v1.6.0, cobra v1.10.2, x/mod v0.41.0,
x/term v0.46.0 as of 2026-09-14 — re-check at execute time), `go mod tidy` on
the final `go` directive. Add a `go mod tidy -diff` step to the ci.yml test job
so drift fails CI. GitHub Action pins are out of scope (deferred to
dependency-update-automation).
"""
covers        = ["c-3"]
test_contract = [
  "if the committed go.mod/go.sum drift from a tidy tree, the ci.yml `go mod tidy -diff` step fails",
  "if cobra 1.8→1.10 changes help/usage rendering, the commands_parity and prompt/help tests under internal/cmd fail",
]
status        = "pending"

[[task]]
id            = "t-3"
wave          = 1
title         = "Release builds readonly + runs govulncheck"
files         = [
  ".github/workflows/release.yml",
  ".goreleaser.yaml",
  "internal/cmd/release_pipeline_test.go",
]
description   = """
release.yml job env gains `GOFLAGS: -mod=readonly`; remove the goreleaser
`before: hooks: go mod tidy`. Add install-govulncheck (pinned to the same tag
ci.yml uses — bump both to the current latest) and `govulncheck ./...` steps
after setup-go and before goreleaser, gated on `new_tag != ''`, no `|| true`.
New test follows the readRepoFile pattern in release_signing_test.go.
"""
covers        = ["c-4"]
test_contract = [
  "if the release job env lacks `GOFLAGS: -mod=readonly`, TestReleaseJobBuildsReadonly fails",
  "if .goreleaser.yaml carries any `before:` hook, TestGoreleaserHasNoBeforeHooks fails",
  "if release.yml has no `govulncheck ./...` step, or it appears after the goreleaser step, or is followed by `|| true`, TestReleaseJobRunsGovulncheck fails",
  "if ci.yml and release.yml pin different govulncheck versions, TestGovulncheckPinAgrees fails",
]
status        = "pending"

[[task]]
id            = "t-4"
wave          = 1
title         = "Ban ${{ }} inside run: blocks"
files         = [
  ".github/workflows/release.yml",
  "internal/cmd/workflow_run_expressions_test.go",
]
description   = """
Move release.yml's two run-block expressions (`github.event.inputs.version`,
`steps.tag.outputs.new_tag`) to step `env:` and read them as shell vars. New
test: a line-based scanner (no YAML dependency) that tracks `run:` single-line
and `|`/`>` block forms by indentation and flags any `${{` inside; unit table
over inline fixtures plus a sweep over .github/workflows/*.yml.
"""
covers        = ["c-5"]
test_contract = [
  "if the scanner misses a single-line `run: echo ${{ x }}` or a `${{` line inside a `run: |` block, TestRunBlockScanner fails",
  "if the scanner flags a `${{ }}` in an `env:` or `with:` value, TestRunBlockScanner fails (false-positive guard)",
  "if any .github/workflows/*.yml contains `${{` inside a run: block, TestWorkflowsHaveNoExpressionsInRun fails",
]
status        = "pending"
