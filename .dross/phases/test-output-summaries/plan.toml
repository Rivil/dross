    "if the human loses live output, TestTTYLegStillStreams fails: with the TTY seam on, mutant lines go to stderr and to the log",
    "if an idle leg churns the window, TestVerifyIdleLegOpensNoLog fails: with two adapters and one dispatched, exactly one verify log exists",
    "if the collected stream is lost, TestCollectFetchesHostLog fails: the fake fetch copies a host log → a new verify log holds it, and its path is printed",
    "if the log can fail a collect, TestCollectLogFetchFailureIsANote fails: the fetch returns a transport error → tests.json and verify.toml are still written, the exit is as before, and \"log unavailable\" is printed",
    "if the fetch skips the audited seams, TestEverySpawnSiteGatedOrExempt fails (the argv is remote.FetchArgs(target, <runDir>/log, local))",
    "if the taint gate breaks, TestNoSpawnOutputEscapes fails: the leg streams reach only os.Stderr or a runlog.Log, with no new //dross:taint-cleared marker",
    "if codes move, TestVerifyExitCodesWithLogs fails: --no-wait on a held host still exits 15, and an unwritable .dross/logs still yields the same verdict",
  ]
  depends_on = ["t-2", "t-5", "t-6"]
  status = "pending"

