[[task]]
  id = "t-12"
  wave = 2
  title = "Write verify leg streams to run logs"
  files = ["internal/cmd/verify.go", "internal/cmd/verify_log_test.go"]
  description = """
Attached runs: before RunScoped, every adapter implementing mutation.Streamer gets a lazy runlog writer for
verify-<phase>-<adapter.Name()>-<ts>.log (TTY: log + os.Stderr; non-TTY: log only), and each leg prints its absolute log path.
Collected runs: a detachFetchLog seam built on remote.FetchArgs + runDetachArgv pulls <runDir>/log (written on the host) into a fresh
verify log. A fetch failure prints 'log unavailable: <why>' and the collect carries on. If a log can't be opened, that leg streams to
stderr with one warning. Runlog writes pass the taint gate through t-2's terminal class — no marker."""
