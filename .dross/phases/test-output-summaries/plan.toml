[[task]]
  id = "t-10"
  wave = 3
  title = "Route dross test output through the run log"
  files = ["internal/cmd/test.go", "internal/cmd/test_output.go", "internal/cmd/test_output_test.go", "internal/cmd/test_lane_consent_test.go", "internal/cmd/test_lane_prepare_test.go", "internal/cmd/test_lane_selector_test.go"]
  description = "test_output.go opens a per-invocation runlog sink after FindRoot. dross writes a `$ <line>` header before each spawn, so a silent\ncommand still logs; that first write creates the file (D8: lazy — refusals write nothing), and `log: <abs path>` prints before the\nfirst spawn and again at the end (D9). TTY: t-2's runlog.Log with Terminal=Stdout and Echo on. Non-TTY: one writer = log + segment feed. The same writer\nvalue goes to every spawn's stdout and stderr (runTest, runOneLane, runLanePrepare, syncTreeTo, runRemoteLine); dross's own lines\nstill reach stdout and are copied to the log. Until t-14 lands, every non-TTY run prints t-3's fallback. An unopenable log falls back through t-2's sink: live stream, one warning. The Long help drops 'streams'. No new flag. Granularity exception: the three lane-ordering\ntests read lane output from captured (non-TTY) stdout and go red the moment non-TTY runs stop streaming, so they ride this commit."
