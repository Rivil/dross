raction show each define exactly `full`", "if hermeticity regresses, TestInteractionShowEmitsPlaybook (existing) fails when the suite runs from inside a Claude Code session", "if the CLI tree drifts, TestCLITreeGolden (existing, ./cmd/dross) fails until cmd/dross/testdata/cli_tree.txt lists `--full` on rule show and interaction show"]
