  test_contract = [
    "if a killed run leaves no path, TestLogPathBeforeSpawn fails: the fake spawn sees stdout already holding \"log: /…/.dross/logs/test-\"",
    "if a run skips the log, TestEveryRunWritesLog fails: bare, selector, --files, lanes-only bare, local and remote (recorders) each leave exactly one new test-*.log holding OUT-MARK (written to stdout) and ERR-MARK (written to stderr), and the remote shape's log also holds the rsync segment",
