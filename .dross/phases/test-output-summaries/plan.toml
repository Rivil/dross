  test_contract = [
    "if mutant lines reach the conversation, TestAttachedLegLogsStream fails: verify with a fake Streamer adapter (configuredAdaptersFn) printing 300 mutant lines, non-TTY → stdout and stderr hold none of them, verify-<phase>-<name>-*.log holds all, and its absolute path is printed",
