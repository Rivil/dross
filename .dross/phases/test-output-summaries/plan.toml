[[task]]
  id = "t-2"
  wave = 1
  title = "Add run-log sink and TTY seam"
  files = ["internal/runlog/runlog.go", "internal/runlog/runlog_test.go", "internal/secretscan/writers.go", "internal/cmd/secretscan_writer_enum_test.go"]
  description = "Open(root, Name{Kind test|verify, Phase, Leg}, Options{Terminal runlog.Stdout|runlog.Stderr, Echo bool}) returns a *Log created lazily on the first Write. Before the file exists, write or\nrewrite .dross/logs/.gitignore to `*`; refuse a .gitignore that is not a regular file. Names test-<ts>.log / verify-<phase>-<leg>-<ts>.log,\nts in UTC to the nanosecond, O_EXCL plus a -N suffix on collision; Phase and Leg pass pathfence.Segment. Prune `^(test|verify)-.*[.]log$`\nto the newest 20 by mtime, never the file just created, ENOENT ignored. Write is mutex-guarded and always returns (len(p), nil); Err()\nreports the first failure (io.MultiWriter would otherwise stop the child's pipe copy). Path() is absolute and \"\" until the first write.\nThe one shared sink for t-10/t-12/t-17 (not three copies): with Echo set (a TTY) every byte also goes to the chosen terminal; if\nthe log can't be opened, bytes go to that terminal with one warning. Terminal is an enum, never an io.Writer, so nothing can be\nlaundered through the sink. StdoutIsTerminal over golang.org/x/term, with a seam. Declared in secretscan/writers.go as MachineLocal\nunder a new RunlogIgnoreSeed, with a seed preparer in the enum test (debugsession's DebugIgnoreSeed is the precedent). The taint\nterminal class is t-18's."
  covers = ["c-1", "c-5"]
  test_contract = ["if logs dirty the tree, TestLogDirIgnored fails: in a git temp repo with .dross/ tracked, Open+Write leaves `git status --porcelain -uall` empty and `git check-ignore -q` matches the log", "if an edited ignore file is trusted, TestLogDirIgnored fails: a pre-existing .dross/logs/.gitignore holding `foo` is rewritten to `*` before the log exists", "if a non-file ignore is accepted, TestGitignoreDirRefused fails: a .gitignore that is a directory makes the first Write's Err() non-nil", "if the log precedes its ignore file, TestIgnoreBeforeLog fails: the create-order seam records .gitignore before the log", "if an unwritten log leaves debris, TestUnwrittenLogCreatesNothing fails: Open + Close with no Write leaves no .dross/logs/", "if same-instant runs clobber, TestSameInstantDistinctFiles fails: two Opens under a frozen clock seam yield two distinct paths, each holding only its own bytes", "if pruning is wrong, TestPruneNewest20 fails: 25 mixed test-/verify- logs with distinct mtimes plus .gitignore and notes.txt → after one Open+Write the 20 newest by mtime survive (including the new one, and an old-named log whose mtime is newest), .gitignore and notes.txt remain, and a log deleted mid-prune (ENOENT) is not an error", "if a log error can kill the child, TestWriteNeverFails fails: with the file seam failing after 1 KiB, every Write returns (len(p), nil) and Err() names the first failure", "if a name escapes, TestNameStaysInDir fails: Phase \"../../etc\" or Leg \"go/x\" is refused or yields a separator-free base name inside .dross/logs/", "if logs cross the wire, TestLogsOffTheWire fails: after a log is written in a git temp repo, the exclude list remote.SyncArgs builds (from `ls-files --others --ignored`) excludes /.dross/logs/", "if writes race, `go test -race` TestConcurrentWrites fails: 8 goroutines × 1,000 writes → no race, and file length == bytes written", "if TTY detection inverts, TestPipeIsNotTerminal fails: with an os.Pipe swapped into os.Stdout, StdoutIsTerminal() is false", "if the sink is triplicated or the echo is lost, TestEchoTeesTerminal fails: Open with Terminal=Stderr and echo on → every byte reaches both the log and the stderr seam; echo off → only the log", "if a broken log dir drops output, TestUnavailableLogFallsBack fails: with .dross/logs a regular file, Writes reach the chosen terminal seam, exactly one warning is printed across 3 writes, and Err() is non-nil", "if the sink can launder, TestTerminalIsAnEnum fails: Options.Terminal is runlog.Stdout or runlog.Stderr, and neither Options nor Log has an io.Writer field a caller can set", "if the writer is undeclared, TestEveryDrossWriterIsDeclared and TestMachineLocalWritersAreReallyIgnored (existing) fail: runlog.go's O_CREATE|O_EXCL open and its .gitignore write are declared MachineLocal under RunlogIgnoreSeed, and the enum test's seeds map prepares that seed"]
  status = "done"

[[task]]
  id = "t-18"
  wave = 2
  title = "Add runlog terminal class to taint gate"
  files = ["internal/cmd/taint_engine_test.go", ".dross/phases/exec-taint-enumeration/spec.toml"]
  description = "Taint policy (D1): values of type *runlog.Log (parameter, field or local) join the exec-taint engine's terminal set by type: one\nnamed type, never a generic io.Writer. Safe because a runlog.Log's only outputs are its gitignored file and a terminal chosen by\nenum (t-2). Amend exec-taint-enumeration's terminal_definition: the choice names *runlog.Log, and the why gains 'Amended 2026-10-09\nby test-output-summaries: …'. No //dross:taint-cleared marker anywhere. Its own commit, so the gate policy change is reviewable and\nrevertable apart from the runlog package."
  covers = ["c-1", "c-5"]
  test_contract = ["if the runlog terminal class is missing, TestRunlogSinkIsTerminal fails: a synthetic program writing a spawn's Cmd.Stdout stream through a runlog.Log yields no exec-taint finding", "if a setter breaks the class, TestRunlogSinkIsTerminal fails: a struct field of type *runlog.Log set only through a SetStream(*runlog.Log) parameter, then teed with io.MultiWriter(field, head), yields no finding", "if the terminal class widens, TestRunlogSinkIsTerminal fails: the same stream written to a plain *os.File, a bytes.Buffer, or a generic io.Writer parameter is still reported as an escape", "if the live gate breaks, TestNoSpawnOutputEscapes and TestLiveTreeHasNoUnresolvedDispatch (existing) fail with the class added"]
  status = "done"
  depends_on = ["t-2"]

[[task]]
  id = "t-3"
  wave = 1
  title = "Add bounded summary core and renderer"
  files = ["internal/runsummary/summary.go", "internal/runsummary/render.go", "internal/runsummary/summary_test.go"]
  description = "A streaming line splitter that cuts lines at 64 KiB (no ErrTooLong stop) and strips CR and ANSI SGR. A Parser interface\n(Claims/Feed/Result) with an init()-registered list, a 40-line tail ring and a per-run Budget. Render(outcome{exit, ran}, results,\nbudget, logPath, wall) prints green only when exit == 0, a parser claimed the output and failures == 0; otherwise red (counts and\nfailures, failure_bound: first 10 failures as blocks, then '+N more failing — see <log>'). A block is the failure's name line, up to 30 output\nlines or ~2,800 bytes of them, whichever comes first, then '… N more lines — see <log>' when cut; the name and marker lines sit\noutside the 30, so 10 blocks always fit the ~30,000-char Bash window) or the fallback (exit status,\nlast 40 lines, log path). Printed lines are cut at 240 chars. The '+N more failing — see' prefix is an exported constant t-15 quotes."
  covers = ["c-2", "c-3", "c-4"]
  test_contract = ["if a non-zero exit can read green, TestNonZeroNeverGreen fails: a fake parser reporting 12 ok / 0 failures with exit 1 renders the fallback (exit 1, last 40 lines, log path) and no green line", "if a run that didn't happen shows counts, TestRunDidNotHappenNeverCounts fails: exit 3 and exit 4 over output that parses green print the exit status and the tail, never counts", "if unparseable output is mishandled, TestUnparseableFallback fails: 100 unclaimed lines at exit 2 → an `exit 2` line, lines 61-100 verbatim (line 60 absent) and the log path; at exit 0 the same shape and no counts", "if the bound slips, TestFailureBound fails: 14 failures × 50 lines of 40 chars → 10 blocks, each a name line + 30 output lines + `… 20 more lines — see <log>`, then exactly `+4 more failing — see <log>`", "if a mass break overflows the Bash window, TestMassBreakSize fails: 500 failures × 100 lines of 2,000 chars render exactly 10 failure blocks, ≤ 330 lines and ≤ 30,000 bytes", "if long lines starve the window, TestBlockByteShare fails: a failure of 30 lines × 240 chars prints its name line, the whole lines that fit in 2,800 bytes, then `… N more lines — see <log>` with N counting the rest; a failure of 30 lines × 60 chars prints all 30", "if a long line stops parsing, TestLongLineKeepsParsing fails: a 10 MiB line with no newline, then `SENTINEL` → the fake parser still receives SENTINEL", "if memory is unbounded, TestBoundedRetention fails: 2,000,000 fed lines retain ≤ 1 MiB (Retained()), and the tail ring holds exactly the last 40", "if colour or CRLF breaks matching, TestStripsANSIAndCR fails: an SGR-red `FAIL` line ending in CRLF reaches Feed as exactly \"FAIL\"", "if dross guesses between runners, TestAmbiguousClaimFallsBack fails: two fake parsers both claiming one segment → fallback render", "if the budget isn't shared, TestBudgetSpansSegments fails: two segments × 8 failures through one Budget → 10 full blocks in total, then `+6 more failing`", "if green is chatty, TestGreenIsShort fails: a fake 60-package green over 72s → ≤ 3 lines (counts, \"1m12s\", log path) and no package name"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Add show-marker store; make cmd tests session-hermetic"
  files = ["internal/gatestate/showmark.go", "internal/gatestate/showmark_test.go", "internal/cmd/hermetic_env_test.go", "internal/secretscan/writers.go", "internal/gatestate/store.go"]
  description = "Under .dross/gate/show/ (already self-ignored by gatestate's ensureDir), BumpContext(root, sid) replaces a repo-wide epoch nonce and\nmarks sid as seen. ShownCurrent(root, sid, kind, sha) is read-only and true only when sid is non-empty, sid is seen, and sid's kind\nrecord holds {current epoch, sha}. RecordShown writes that record through store.go's saveBytes (no new writer site); store.go's writers.go entry gains gate/show/<name> in Also. Session keys are hashed the way nudgeKey hashes\nthem. Records and seen-marks older than 7 days are pruned on write, inside show/ only. The hermetic TestMain also unsets\nCLAUDE_CODE_SESSION_ID and CLAUDE_CODE_CHILD_SESSION (today it clears only HOME and CLAUDE_CONFIG_DIR)."
  covers = ["c-6", "c-7"]
  test_contract = ["if an unhooked session gets the marker, TestUnseenSessionNeverCurrent fails: RecordShown(s, rules, h) with no BumpContext(s) → ShownCurrent false", "if one session's start doesn't reset the others, TestAnyBumpInvalidates fails: Bump(s1); Record(s1, rules, h); Bump(s2) → ShownCurrent(s1, rules, h) false", "if content isn't compared, TestShaMismatch fails: Record(s, rules, h1) → ShownCurrent(s, rules, h2) false", "if kinds clobber, TestKindsIndependent fails: Record(s, rules, h) leaves ShownCurrent(s, playbook, h) false; 32 goroutines recording both kinds leave both readable", "if an id escapes, TestShowKeyContained fails: sids \"../../x\" and \"a/b\" land in .dross/gate/show/; an empty sid → ShownCurrent false and RecordShown errors", "if records dirty the tree, TestShowRecordsIgnored fails: `git status --porcelain` is empty after Bump+Record in a git temp repo", "if prune overreaches, TestShowPrune fails: an 8-day-old record is pruned on the next write, while nudge claims and green.json are untouched", "if the read path writes, TestShownCurrentReadOnly fails: a fresh root gets no .dross/gate/show/", "if tests read the developer's store, TestHermeticSessionEnv fails: CLAUDE_CODE_SESSION_ID and CLAUDE_CODE_CHILD_SESSION are empty inside the cmd package", "if showmark grows its own write site, TestEveryDrossWriterIsDeclared (existing) fails: showmark.go has no write verb, and store.go's entry lists gate/show/<name>"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 3
  title = "Route gremlins stream to a run-log sink"
  files = ["internal/mutation/adapter.go", "internal/mutation/gremlins.go", "internal/mutation/gremlins_stream_test.go", "internal/mutation/toolfail.go", "internal/mutation/toolfail_test.go", "internal/verify/persist_toolfence_test.go", "internal/boardsync/toolfence_composer_test.go", ".dross/phases/tool-output-not-persisted/spec.toml"]
  description = "Add `Streamer interface{ SetStream(*runlog.Log) }` to adapter.go, plus Gremlins.SetStream (nil → os.Stderr, today's behaviour). The\nparameter is the concrete type, never io.Writer: a setter storing an io.Writer parameter makes the field non-terminal\n(precomputeTerminal), and t-18's class keys on the type. The gremlins tee becomes MultiWriter(stream, head), and the per-package\ninvocation echo goes to the stream. printHead and the 'skipped' lines stay on os.Stderr. No taint-cleared marker in gremlins.go.\nstderr_pointer amendment: toolFailure records whether a stream was set; set → 'the full output of <tool> went to this run's log in\n.dross/logs (machine-local, not committed)', unset → today's stderr prose; never a file name (pruning makes it stale, a timestamp\nchurns tracked tests.json/verify.toml, an absolute path leaks a home dir into PR bodies). Exported constants hold both forms; the two\npinning tests assert through them. Amend tool-output-not-persisted's stderr_pointer choice and why ('Amended 2026-10-09 by\ntest-output-summaries: …'). Granularity exception: the pinning tests are assertion updates."
  covers = ["c-5"]
  test_contract = ["if the stream still leaks, TestGremlinsStreamToSink fails: the gremlinsBuildCmd seam prints 300 KILLED/LIVED lines and writes a valid report; with SetStream(buf), captured os.Stderr holds none of them, buf holds all 300, the Report counts are unchanged, and headBuffer still holds them so the failure re-print is not starved", "if the remote arm leaks, TestGremlinsRemoteArmStreamToSink fails: the same split via scriptRemote with g.Remote set", "if diagnosis is lost, TestGremlinsFailureHeadStaysOnStderr fails: a reportless exit 2 → os.Stderr holds the bounded head (≤ strykerHeadLines lines), and the error keeps its RecordToolFailure kind", "if the default moves, TestGremlinsNilStreamKeepsStderr fails, and gremlins_failure_test.go and remote_failure_test.go go red unmodified", "if a marker sneaks in, TestToolRunnersCarryNoMarker (existing) fails", "if the pointer lies, TestRecordErrorClauses fails: RecordToolFailure with no stream says \"went to this run's stderr\"; with a stream set it says \"went to this run's log in .dross/logs\" and not \"stderr\"; neither form contains \".log\" as a file suffix or an absolute path (the old \"/\" guard narrows to those)", "if a persisted record drops the pointer, the persist_toolfence_test.go and toolfence_composer_test.go pins fail: they assert through toolfail's exported pointer constants and still find the pointer in tests.json, verify.toml and the composed body", "if the taint gate breaks at this task's own gate, TestNoSpawnOutputEscapes and TestLiveTreeHasNoUnresolvedDispatch (existing) fail"]
  status = "done"
  depends_on = ["t-2", "t-18"]

