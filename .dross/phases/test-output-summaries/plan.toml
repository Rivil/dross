[[task]]
  id = "t-1"
  wave = 1
  title = "Record before-numbers on the base-commit binary"
  files = [".dross/phases/test-output-summaries/flow-cost-before.toml"]
  description = """
Run FIRST, before any `make install` in this phase (r-01: t-15's install re-links the edited prompts). Build dross from changes.json
base_commit 54ad9064 into a temp dir, put it first on PATH and record `dross version`. Fixed scratch repos: a Go module with 6 packages
and one seeded failing test; a gremlins phase on a 2-package module (local gremlins v0.6.0). Record green_test_bytes, red_test_bytes,
verify_leg_bytes and rule_show_repeat_bytes as `dross … >f 2>&1; wc -c <f`. The human drives one pair-mode /dross-execute task over
§1e red → fix → green → §1f full `dross test` → commit; count agent_turns, turn_tools, wall_clock_s, dross_calls and log_reads with jq
over the transcript (the context-boundaries method, structural only). Write [scenario] and [before] to flow-cost-before.toml — never
flow-cost.toml, which TestFlowCostRecords globs and fails without an [after] leg."""
  covers = ["c-8"]
  test_contract = [
    "if the half record is globbed, TestFlowCostRecords fails on every later commit gate: after t-1 no phases/test-output-summaries/flow-cost.toml exists, and the phases/*/flow-cost.toml glob (flowcost_record_test.go) does not match flow-cost-before.toml",
    "if before ran on a rebuilt or stale binary, t-16's TestFlowCostRecords fails: before.binary_version is the base-commit build's and must differ from after.binary_version",
    "if a field is missing, t-16's merge fails TestFlowCostRecords: [scenario] carries repo_shape, wave_position, flow_start, flow_end and jq_method; [before] has agent_turns > 0, len(turn_tools) == agent_turns, non-empty dross_calls and every *_bytes > 0",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add run-log sink, TTY seam, taint terminal class"
  files = ["internal/runlog/runlog.go", "internal/runlog/runlog_test.go", "internal/cmd/taint_engine_test.go", ".dross/phases/exec-taint-enumeration/spec.toml"]
  description = """
Open(root, Name{Kind test|verify, Phase, Leg}) returns a *Log created lazily on the first Write. Before the file exists, write or
rewrite .dross/logs/.gitignore to `*`; refuse a .gitignore that is not a regular file. Names test-<ts>.log / verify-<phase>-<leg>-<ts>.log,
ts in UTC to the nanosecond, O_EXCL plus a -N suffix on collision; Phase and Leg pass pathfence.Segment. Prune `^(test|verify)-.*[.]log$`
to the newest 20 by mtime, never the file just created, ENOENT ignored. Write is mutex-guarded and always returns (len(p), nil); Err()
reports the first failure (io.MultiWriter would otherwise stop the child's pipe copy). Path() is absolute and "" until the first write.
StdoutIsTerminal over golang.org/x/term, with a seam, for t-10/t-12/t-17. Taint policy (D1): the concrete runlog.Log file sink joins
the exec-taint engine's terminal set — one named type, never a generic io.Writer — and exec-taint-enumeration's terminal_definition
decision gains a why naming it. No //dross:taint-cleared marker anywhere."""
  covers = ["c-1", "c-5"]
  test_contract = [
    "if logs dirty the tree, TestLogDirIgnored fails: in a git temp repo with .dross/ tracked, Open+Write leaves `git status --porcelain -uall` empty and `git check-ignore -q` matches the log",
    "if an edited ignore file is trusted, TestLogDirIgnored fails: a pre-existing .dross/logs/.gitignore holding `foo` is rewritten to `*` before the log exists",
    "if a non-file ignore is accepted, TestGitignoreDirRefused fails: a .gitignore that is a directory makes the first Write's Err() non-nil",
    "if the log precedes its ignore file, TestIgnoreBeforeLog fails: the create-order seam records .gitignore before the log",
    "if an unwritten log leaves debris, TestUnwrittenLogCreatesNothing fails: Open + Close with no Write leaves no .dross/logs/",
    "if same-instant runs clobber, TestSameInstantDistinctFiles fails: two Opens under a frozen clock seam yield two distinct paths, each holding only its own bytes",
    "if pruning is wrong, TestPruneNewest20 fails: 25 mixed test-/verify- logs with distinct mtimes plus .gitignore and notes.txt → after one Open+Write the 20 newest by mtime survive (including the new one, and an old-named log whose mtime is newest), .gitignore and notes.txt remain, and a log deleted mid-prune (ENOENT) is not an error",
    "if a log error can kill the child, TestWriteNeverFails fails: with the file seam failing after 1 KiB, every Write returns (len(p), nil) and Err() names the first failure",
    "if a name escapes, TestNameStaysInDir fails: Phase \"../../etc\" or Leg \"go/x\" is refused or yields a separator-free base name inside .dross/logs/",
    "if logs cross the wire, TestLogsOffTheWire fails: after a log is written in a git temp repo, the exclude list remote.SyncArgs builds (from `ls-files --others --ignored`) excludes /.dross/logs/",
    "if writes race, `go test -race` TestConcurrentWrites fails: 8 goroutines × 1,000 writes → no race, and file length == bytes written",
    "if TTY detection inverts, TestPipeIsNotTerminal fails: with an os.Pipe swapped into os.Stdout, StdoutIsTerminal() is false",
    "if the runlog terminal class is missing, TestRunlogSinkIsTerminal fails: a synthetic program writing a spawn's Cmd.Stdout stream through a runlog.Log yields no exec-taint finding",
    "if the terminal class widens, TestRunlogSinkIsTerminal fails: the same stream written to a plain *os.File, a bytes.Buffer, or a generic io.Writer parameter is still reported as an escape",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Add bounded summary core and renderer"
  files = ["internal/runsummary/summary.go", "internal/runsummary/render.go", "internal/runsummary/summary_test.go"]
  description = """
A streaming line splitter that cuts lines at 64 KiB (no ErrTooLong stop) and strips CR and ANSI SGR. A Parser interface
(Claims/Feed/Result) with an init()-registered list, a 40-line tail ring and a per-run Budget. Render(outcome{exit, ran}, results,
budget, logPath, wall) prints green only when exit == 0, a parser claimed the output and failures == 0; otherwise red (counts and
failures, failure_bound: 30 lines per failure, first 10 in full, then '+N more failing — see <log>') or the fallback (exit status,
last 40 lines, log path). Printed lines are cut at 240 chars. The '+N more failing — see' prefix is an exported constant t-15 quotes."""
  covers = ["c-2", "c-3", "c-4"]
  test_contract = [
    "if a non-zero exit can read green, TestNonZeroNeverGreen fails: a fake parser reporting 12 ok / 0 failures with exit 1 renders the fallback (exit 1, last 40 lines, log path) and no green line",
    "if a run that didn't happen shows counts, TestRunDidNotHappenNeverCounts fails: exit 3 and exit 4 over output that parses green print the exit status and the tail, never counts",
    "if unparseable output is mishandled, TestUnparseableFallback fails: 100 unclaimed lines at exit 2 → an `exit 2` line, lines 61-100 verbatim (line 60 absent) and the log path; at exit 0 the same shape and no counts",
    "if the bound slips, TestFailureBound fails: 14 failures × 50 lines → 10 blocks of 30 lines, each ending `… 20 more lines — see <log>`, then exactly `+4 more failing — see <log>`",
    "if a mass break overflows the Bash window, TestMassBreakSize fails: 500 failures × 100 lines of 2,000 chars render ≤ 320 lines and ≤ 30,000 bytes",
    "if a long line stops parsing, TestLongLineKeepsParsing fails: a 10 MiB line with no newline, then `SENTINEL` → the fake parser still receives SENTINEL",
    "if memory is unbounded, TestBoundedRetention fails: 2,000,000 fed lines retain ≤ 1 MiB (Retained()), and the tail ring holds exactly the last 40",
    "if colour or CRLF breaks matching, TestStripsANSIAndCR fails: an SGR-red `FAIL` line ending in CRLF reaches Feed as exactly \"FAIL\"",
    "if dross guesses between runners, TestAmbiguousClaimFallsBack fails: two fake parsers both claiming one segment → fallback render",
    "if the budget isn't shared, TestBudgetSpansSegments fails: two segments × 8 failures through one Budget → 10 full blocks in total, then `+6 more failing`",
    "if green is chatty, TestGreenIsShort fails: a fake 60-package green over 72s → ≤ 3 lines (counts, \"1m12s\", log path) and no package name",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Add show-marker store; make cmd tests session-hermetic"
  files = ["internal/gatestate/showmark.go", "internal/gatestate/showmark_test.go", "internal/cmd/hermetic_env_test.go"]
  description = """
Under .dross/gate/show/ (already self-ignored by gatestate's ensureDir), BumpContext(root, sid) replaces a repo-wide epoch nonce and
marks sid as seen. ShownCurrent(root, sid, kind, sha) is read-only and true only when sid is non-empty, sid is seen, and sid's kind
record holds {current epoch, sha}. RecordShown writes that record by atomic rename. Session keys are hashed the way nudgeKey hashes
them. Records and seen-marks older than 7 days are pruned on write, inside show/ only. The hermetic TestMain also unsets
CLAUDE_CODE_SESSION_ID and CLAUDE_CODE_CHILD_SESSION (today it clears only HOME and CLAUDE_CONFIG_DIR)."""
  covers = ["c-6", "c-7"]
  test_contract = [
    "if an unhooked session gets the marker, TestUnseenSessionNeverCurrent fails: RecordShown(s, rules, h) with no BumpContext(s) → ShownCurrent false",
    "if one session's start doesn't reset the others, TestAnyBumpInvalidates fails: Bump(s1); Record(s1, rules, h); Bump(s2) → ShownCurrent(s1, rules, h) false",
    "if content isn't compared, TestShaMismatch fails: Record(s, rules, h1) → ShownCurrent(s, rules, h2) false",
    "if kinds clobber, TestKindsIndependent fails: Record(s, rules, h) leaves ShownCurrent(s, playbook, h) false; 32 goroutines recording both kinds leave both readable",
    "if an id escapes, TestShowKeyContained fails: sids \"../../x\" and \"a/b\" land in .dross/gate/show/; an empty sid → ShownCurrent false and RecordShown errors",
    "if records dirty the tree, TestShowRecordsIgnored fails: `git status --porcelain` is empty after Bump+Record in a git temp repo",
    "if prune overreaches, TestShowPrune fails: an 8-day-old record is pruned on the next write, while nudge claims and green.json are untouched",
    "if the read path writes, TestShownCurrentReadOnly fails: a fresh root gets no .dross/gate/show/",
    "if tests read the developer's store, TestHermeticSessionEnv fails: CLAUDE_CODE_SESSION_ID and CLAUDE_CODE_CHILD_SESSION are empty inside the cmd package",
  ]
  status = "pending"

