    "if a broken log dir breaks the run, TestLogUnavailableStreams fails: with .dross/logs a regular file, the sentinel is on stdout, one warning is printed, and the exit code equals the fake's suite outcome",
    "if the taint gate breaks, TestNoSpawnOutputEscapes fails: every spawn stream reaches only os.Stdout or a runlog.Log (t-2's terminal class), with no new //dross:taint-cleared marker",
    "if a streaming flag appears, TestNoStreamingFlag fails: Test().Flags() defines exactly local, files and wait",
  ]
