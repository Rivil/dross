[[task]]
  id = "t-8"
  wave = 2
  title = "Parse plain go test output"
  files = ["internal/runsummary/gotest.go", "internal/runsummary/gotest_test.go", "internal/runsummary/testdata/gotest/green.txt", "internal/runsummary/testdata/gotest/red_subtests.txt", "internal/runsummary/testdata/gotest/panic.txt", "internal/runsummary/testdata/gotest/timeout.txt", "internal/runsummary/testdata/gotest/build_failed.txt", "internal/runsummary/testdata/gotest/setup_and_vet.txt"]
  description = """
Fixtures captured from a scratch module with a real `go test -count=1 ./...` (go1.26.1), stdout and stderr on one fd, each starting
with a `# captured:` header naming the go version and command. Counts are ok / FAIL / no test files / no tests to run packages. A
failure is a LEAF `--- FAIL` with its indented output (D7). A FAIL package with no test failure (build failed, setup failed, timeout
panic, TestMain exit) becomes a package-named failure; each `# pkg` block is one build failure. Granularity: fixtures are one artifact."""
  covers = ["c-2", "c-3"]
  test_contract = [
    "if counts drift, TestGoGreenCounts fails: green.txt → 4 ok, 2 no test files, 1 no tests to run, 0 failures",
    "if subtests double-count, TestGoSubtestsAreLeaves fails: red_subtests.txt → TestTable/a, /b, /c and not TestTable",
    "if failure output bleeds, TestGoRedNamesOwnLines fails: TestAdd's block holds its `_test.go:` assertion line and none of TestTable's lines",
    "if panic text is lost, TestGoPanicAttributed fails: panic.txt → TestBoom's block holds \"panic: boom\" and its first stack frame",
    "if a timeout reads as unparseable, TestGoTimeout fails: timeout.txt (-timeout 2s) → a package failure starting \"panic: test timed out after 2s\" that names the running test",
    "if build errors vanish, TestGoBuildFailed fails: build_failed.txt → the `# dep` block's \"undefined: foo\" printed once, and every `[build failed]` package counted as failed",
    "if setup/vet/test-file compile errors are missed, TestGoSetupAndVet fails: a `[setup failed]` package and a `# pkg [pkg.test]` block each become a failure carrying their error line",
    "if go claims foreign text, TestGoClaimsOnlyGo fails: a make transcript with \"ok  done\" and t-9's vitest fixtures are not claimed",
    "if a fixture is invented, TestGoFixturesCaptured fails: any testdata/gotest file lacks the `# captured: go1.` header",
  ]
  depends_on = ["t-3"]
  status = "pending"

