  description = "First step is `make build && make install` — per rule r-01 the installed\nbinary can be stale versus source, and every line of reap is Go written\nearlier in this phase. Then run the sweep against the live DRO board namespace\nby namespace: dry run, then --apply, recording per-lane before/after counts and\nthe resolved state of each closed card in proof.md. Ends with a re-run showing\nan empty plan. t-10 is a dependency so a bad batch is reversible.\n"
  covers = ["c-1"]
  depends_on = ["t-8", "t-10"]
  test_contract = ["proof.md records the `dross --version` output and the git commit of the binary that produced the live run — a proof whose recorded version predates this phase's commits is not evidence for c-1", "proof.md records, per lane, the stranded count before the run and the resolved count after, accounting for the 88 record-backed cards c-1 names, plus the 2 quicks listed as unattributable and closed by hand, each named by issue id; a lane whose after-count is short of its before-count is a recorded failure, not a silent omission", "proof.md records the 8 correctly-open cards by issue id as still unresolved after the run", "proof.md names each of DRO-33/36/37/38/95/96 by issue id with the lane and justifying record the marker sweep recovered for it — c-7's concrete sentence, which t-4 only proves in shape against synthetic fixtures", "the final re-run transcript in proof.md shows `dross issue reap` classifying zero cards and exiting 0"]
  status = "done"

[[task]]
  id = "t-13"
  wave = 1
  title = "StateWriter capability for raw state writes"
  files = ["internal/forge/forge.go", "internal/forge/youtrack.go", "internal/forge/jira.go", "internal/forge/github.go", "internal/forge/state_map_test.go"]
  description = "Add a StateWriter capability interface — SetStateRaw(key, state string) error —\nalongside BoardClient rather than on it, matching the IssueLinker precedent\ndocumented at forge.go:184-191. It writes a literal tracker state instead of a\nmapped dross lifecycle status; today CloseIssueAs and SetState both map, and\nClient closes via UpdateIssue(IssuePatch{State}), so restoring an arbitrary\nprior column such as \"In Review\" is unimplementable. Implemented on\nYouTrackClient, JiraClient and Client. GitHubClient deliberately does NOT\nimplement it: GitHub has no column model, so it must fail the assertion rather\nthan satisfy it with a lossy reopen. Keeping it off BoardClient also leaves the\ntwo in-cmd fakes compiling untouched. No caller yet; t-10 consumes it.\n"
  covers = ["c-9"]
  test_contract = ["TestSetStateRawBypassesTheStateMap: SetStateRaw(key, \"In Review\") writes \"In Review\" verbatim on each implementing client — an implementation routing through defaultYouTrackStateMap or defaultJiraStateMap turns it into a mapped lifecycle status and fails", "TestGitHubIsNotAStateWriter: a compile-time assertion that *GitHubClient does NOT satisfy StateWriter, and that YouTrackClient, JiraClient and Client do — a lossy reopen/close stub added to GitHub to make the assertion pass reddens this", "TestStateWriterIsNotOnBoardClient: a BoardClient value has no SetStateRaw method, so the two in-cmd fakes still satisfy the interface without change", "TestSetStateRawVerifiesReadBack: a write whose read-back still reports the old state returns an error naming the key rather than reporting success"]
  status = "done"

