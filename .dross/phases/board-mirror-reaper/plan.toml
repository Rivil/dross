[[task]]
id         = "t-10"
wave       = 4
title      = "Reverse the last applied run with --undo"
depends_on = ["t-3", "t-8", "t-13"]
files = [
  "internal/cmd/issue_reap_undo.go",
  "internal/cmd/issue_reap_undo_test.go",
  "internal/cmd/issue_reap_cmd.go",
]
description = """
`dross issue reap --undo` reads the last applied run from the journal and
writes each card back to its recorded prior state unconditionally via t-13's
StateWriter, verifying the read-back the way the close does, and re-adds any
board.json link the sweep dropped. Refuses --undo alongside --apply or
--namespace. The StateWriter assertion happens at this call site: a backend
that does not implement it (GitHub) makes --undo refuse by provider name and
write nothing, the same shape the no-linker path already uses.
"""
covers = ["c-9"]
test_contract = [
  "TestUndoRestoresTheRecordedPriorState: after an apply of 3–4 cards, --undo returns each to the exact prior state string the journal recorded, per card, not one blanket state — hardcoding \"Open\" fails",
  "TestUndoRestoresDroppedBoardLinks: a backlog key deleted at apply is present again in board.json after --undo",
  "TestUndoRestoresACardMovedSinceTheSweep: a card whose current state no longer matches what the sweep wrote is still returned to its journalled prior state — a conflict check that skips it fails",
  "TestUndoContinuesPastAFailure: a card whose restore is refused by the forge is named by issue id while the remaining cards are still restored",
  "TestUndoReversesOnlyTheLastRun: after two applies, --undo restores the second run's cards and touches none from the first",
  "TestUndoWithNoJournalIsClean: --undo with no reap-log.json writes nothing and says there is nothing to undo",
  "TestUndoRefusesOnABackendWithoutStateWriter: with a GitHub client, --undo names the provider, exits non-zero and issues zero write requests — a best-effort reopen that lands an In-Review card in `open` and reports success fails here",
]
status = "pending"

