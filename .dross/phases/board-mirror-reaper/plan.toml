[[task]]
  id = "t-8"
  wave = 3
  title = "Apply the sweep with journalling and failure isolation"
  files = ["internal/cmd/issue_reap_apply.go", "internal/cmd/issue_reap_apply_test.go", "internal/cmd/issue_reap_cmd.go", "internal/cmd/issue_reap_cmd_test.go"]
  description = "`--apply` walks the classified plan, captures each card's pre-write state into\nthe t-3 journal, then writes the lane terminal through closeBoardIssue (mapped\nwrite plus verified read-back), collecting a per-card failure instead of\nreturning on the first — the taskCloseError shape issue_task.go already uses. This is where the inventory\nbecomes whole-board: t-4's marker sweep is unioned into t-2's board.json links,\ndeduped by issue id.\nDrops the board.json link only for lanes whose forward path drops it, recording\nthe drop. Ends by printing every failure by issue id and exiting non-zero if\nany occurred. t-6's TestApplyIsDeclaredButNotWired is deleted here — it is a\nscaffolding assertion with an explicit retirement point, and leaving it would\nfail t-8's own commit gate.\n"
  covers = ["c-1", "c-4", "c-5", "c-9"]
  depends_on = ["t-2", "t-3", "t-4", "t-6"]
  test_contract = ["TestReapApplyClosesEveryLane: one stranded card per lane ends Resolved on the fake forge, each written with its own lane terminal (task cards task-complete, phase cards complete) — one shared terminal fails", "TestApplyContinuesPastAWriteFailure: the forge 500s on card 2 of 4; cards 3 and 4 are still attempted and Resolved, the run exits non-zero, and the closing report names the failing issue id exactly once", "TestUnverifiedCloseIsNotCountedClosed: a close whose read-back still reads unresolved is reported failed, not counted closed", "TestReapLogCapturesStateBeforeTheWrite: the journal entry records the state read before the close — a log written from the post-close read-back records the terminal state and makes undo a no-op, and that fixture fails", "TestJournalRecordsOnlyRealCloses: the journal for a partially failed run holds only the cards that actually closed", "TestSecondApplyIsANoOp: a second --apply over the same fixture classifies zero cards, issues zero write requests and exits 0", "TestReapNeverTouchesCorrectlyOpenCards: cards whose record is not complete, and cards with no marker, are still open after apply"]
  status = "done"

