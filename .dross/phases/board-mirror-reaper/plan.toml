[[task]]
  id = "t-1"
  wave = 1
  title = "Nest the five dross issue verbs and repoint the prompt corpus"
  files = ["internal/cmd/issue.go", "internal/cmd/issue_task.go", "internal/cmd/issue_task_pull.go", "internal/cmd/deferred_add.go", "internal/cmd/issue_verb_shape_test.go", "internal/cmd/issue_test.go", "internal/cmd/issue_task_test.go", "internal/cmd/issue_task_close_test.go", "internal/cmd/issue_task_state_test.go", "internal/cmd/issue_task_pull_test.go", "internal/cmd/issue_close_truth_test.go", "internal/cmd/issue_backlog_close_test.go", "internal/cmd/issue_backlog_id_test.go", "internal/cmd/issue_milestone_close_test.go", "internal/cmd/issue_phase_resolve_test.go", "internal/cmd/deferred_link_test.go", "internal/cmd/deferred_routed_sync_test.go", "internal/cmd/deferred_board_test.go", "internal/cmd/task_lifecycle_test.go", "internal/cmd/token_leak_test.go", "internal/configenum/configenum_test.go", "assets/prompts/execute.md", "assets/prompts/ship.md", "assets/prompts/verify.md", "assets/prompts/plan.md", "assets/prompts/milestone.md", "assets/prompts/inbox.md", "internal/cmd/board_lifecycle_divergence_test.go", "internal/cmd/ship_prompt_test.go"]
  description = "Split each compound verb into a parent+child cobra pair — `phase sync`,\n`task sync`, `task pull`, `milestone sync`, `backlog sync`. Flags, args and\nRunE bodies move unchanged onto the child. No aliases.\nAtomic by necessity, not by omission, and the boundary is wider than the plan\nfirst drew it: cobra rejects the old spelling the moment the tree changes, AND\ncmd/dross's TestShipPromptCommandsExist resolves every ship.md invocation\nagainst that same tree — so the prompt corpus reddens in the same instant the\nGo call sites do. Folded in from the former t-5 at execution time for that\nreason; there is no green intermediate to split at in either direction.\nAlso update taskSyncEdgeRE, mirrorLanes' emission literals, and ship_prompt_test's\nliteral needles to the nested spelling. The forge comment tidy rides with t-13."
  covers = ["c-8"]
  test_contract = ["runCmd(t, Issue(), \"phase-sync\", \"01-auth\") returns EnforceSubcommandKnown's unknown-subcommand error and exits non-zero, while runCmd(t, Issue(), \"phase\", \"sync\", \"01-auth\") runs issue_test.go's existing body assertions unchanged", "TestIssueVerbsAreNested walks Issue()'s whole command tree and fails on any Use whose first word contains a hyphen — restoring \"task-sync\" reddens it", "TestNestedIssueVerbsResolve fails when Find([\"task\",\"sync\"]) or Find([\"backlog\",\"sync\"]) returns cobra's unknown-command error", "TestIssueTaskPullReportsPlanMoved fails while the printed remedy still reads `dross issue task-sync`", "TestNoHyphenatedIssueVerbInGoSource: a scan of internal/**/*.go for `dross issue [a-z]+-[a-z]+` reports zero hits — deferred_add.go's user-facing Printf naming `dross issue backlog-sync` fails here while the compiler stays green", "TestNoHyphenatedIssueVerbInThePromptCorpus: a regexp scan of assets/prompts/*.md for `dross issue [a-z]+-[a-z]+` reports zero hits", "TestEveryPromptIssueInvocationResolves: each `dross issue …` line in the corpus is walked against the real cobra tree via Issue().Find(args), failing by prompt and line — a prompt repointed to a verb the tree never registered fails here, not on a live board; not a regexp allowlist of the five new spellings", "TestTaskSyncEdgeRegexIsNotVacuous: taskSyncEdgeRE matching zero prompt lines is a failure — without it the rename silently empties board_lifecycle_divergence_test's emit-set and the lifecycle guard passes on nothing", "TestEveryMirrorLaneHasATerminalEmission, TestShipPromptEmitsTerminalBoardStatuses and cmd/dross's TestShipPromptCommandsExist still pass against the rewritten prompts, so a half-done rewrite fails"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Record-derived reap classifier"
  files = ["internal/cmd/issue_reap.go", "internal/cmd/issue_reap_classify_test.go"]
  description = "classifyReap(ctx, namespaces) returns a verdict over on-disk records with no\nforge write and no card-state read for the verdict itself. Evidence per class:\nphaseDone(changes.json) for phase and task cards; milestone.toml status for\nepics; phase dir existence for `slug:` backlog keys; the target phase's\nchanges.json for `[routed]`; deferred dismissal for `someday:`. Quicks have no\ncompletion record — version monotonicity proves another bump happened, not that\nthe quick finished — so they classify unattributable and are never closed by the\nsweep; the plan lists them for the operator to close by hand.\nVerdicts reap / open / unattributable, deny by default. Reuses\nbacklogVerdictFor. A card already in its class's terminal state classifies\nnot-stranded, so a post-sweep dry run prints an honestly empty plan.\nreapCard carries {Key, Lane, Terminal, Why}; Why is the justifying record path.\n"
  covers = ["c-3", "c-4"]
  test_contract = ["TestPhaseCardIsClassifiedFromItsCompletionRecord: two fixtures with the card's board state held identical — a phase whose changes.json reads complete yields its phase card and its task cards, the same board state over a record with status removed yields zero; a classifier reading iss.State or the dross/status label fails here", "TestEpicFollowsMilestoneStatusNotTheCard: an epic whose milestone.toml status is \"active\" classifies open, status \"complete\" yields it", "TestSlugBacklogNeedsItsPhaseDir: a `slug:` key whose phase directory is absent classifies unattributable, not reap", "a `[routed]` entry yields a card only when the target phase's changes.json reads complete", "TestQuickIsNeverAutoClosed: a quick card whose ref is older than the current state.json version still classifies unattributable, not reap — a classifier that closes it on version ordering alone fails here; the card appears in the plan's unattributable list so it is not lost", "TestAlreadyTerminalIsNotStranded: a card already sitting in its class's terminal state classifies not-stranded", "the fake forge fails the test on any non-GET request issued during classify"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Reap journal: write, load, prior state"
  files = ["internal/reaplog/reaplog.go", "internal/reaplog/reaplog_test.go", ".gitignore"]
  description = ".dross/reap-log.json: runs, each holding started-at plus per-card\n{issue, class, prior_state, prior_resolved, prior_labels, dropped_link,\noutcome}. Append-on-apply, Last() for the undo target. A missing file is an\nempty log, not an error. Standalone package — board.go's package doc commits\nto holding nothing but the cross-references, and a map on Board would register\nas a mirror namespace with t-7's guard.\nThe ledger is machine-local and gitignored, with the reason stated inline the\nway the state.json and local.toml entries already are: it records one machine's\nwrites to one tracker, so a tracked file would dirty the tree on every apply,\nride ship's clean-tree auto-commit into the phase branch, and drag a stale undo\ntarget through the squash into every later tree.\n"
  covers = ["c-9"]
  test_contract = ["TestJournalRoundTripsPriorState: an entry that drops prior_state fails the marshal → load → compare", "TestMissingJournalIsNotAnError: Load on an absent .dross/reap-log.json returns an empty log and a nil error, so a first --undo says there is nothing to undo instead of erroring", "TestFailedCardIsNotUndoable: a card recorded with outcome=failed is excluded from Last().Closed()", "TestReapLogIsNotABoardNamespace: reflection over board.Board finds no new map field, so t-7's guard does not demand a reap path for the ledger", "TestReapLogIsGitignored: `git check-ignore .dross/reap-log.json` succeeds — a tracked ledger dirties the tree on every apply and ship's clean-tree auto-commit carries it into the squash"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Discover unlinked mirrors by marker label"
  files = ["internal/cmd/issue_reap_discover.go", "internal/cmd/issue_reap_discover_test.go"]
  description = "Second classify source: ListIssues{Labels:[dross marker]} minus everything\nboard.IsLinked already covers, then recover each orphan's lane from its own\nidentity labels (dross/phase:<id>, dross/task:<phase>/<task>,\ndross/deferred:<id>, dross/target:<slug>, the quick label) and run it through\nthe same record-derived verdict t-2 owns — discovery gets no verdict path of\nits own. An orphan with no recognisable identity label is reported\nunclassifiable and never closed.\n"
  covers = ["c-7"]
  depends_on = ["t-2"]
  test_contract = ["TestUnlinkedMirrorIsDiscovered: a marker-labelled card in no board.json namespace carrying dross/phase:<complete-slug> appears in the plan with lane Phases — the DRO-33/36/37/38/95/96 shape; deleting the marker sweep drops it", "TestUnattributableMarkerCardIsNamedNotGuessed: deleting the dross/phase label from that same fixture moves the card to the unclassifiable list rather than dropping it silently", "an orphan whose recovered phase is not complete is absent from the plan", "TestHumanFiledCardIsNeverInInventory: a card carrying no marker label never reaches the plan or the unclassifiable list", "a card present both in board.json and in the marker sweep appears exactly once, deduped by issue key"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "dross issue reap — dry-run plan and --namespace"
  files = ["internal/cmd/issue_reap_cmd.go", "internal/cmd/issue_reap_cmd_test.go", "internal/cmd/issue.go"]
  description = "Register `reap` under `issue`. Inventory here is every board.json link, from\nt-2's classifier alone; t-8 is the first task that unions in t-4's marker sweep,\nso this task carries no intra-wave dependency. No flag prints the whole-board plan:\none line per card — issue id, lane, justifying record — grouped by lane with\nper-lane and total counts. `--namespace` is repeatable and validated against\nboard.Board's map-field set, not a literal list. `--apply` is declared here and\nwired in t-8.\n"
  covers = ["c-1", "c-2"]
  depends_on = ["t-2"]
  test_contract = ["TestReapWithoutApplyNeverWrites: the fake forge fails the test on any POST/PUT/PATCH/DELETE and records zero CreateIssue/UpdateIssue/CloseIssue/SetState calls; the run exits 0 and prints a plan", "TestReapPlanNamesTheJustifyingRecord: each plan line carries issue key, lane, and the record (phase id / milestone / backlog key) that justified it — a line printing only the key fails", "TestReapNamespaceFilterScopesThePlan: `--namespace tasks` over a fixture stranded in all five lanes prints only task cards with a matching footer; two --namespace flags print both lanes; an unknown `--namespace bogus` errors naming the valid set", "TestReapWholeBoardCoversFiveLanes: with no flag the plan's lane set equals board.Board's map-field set", "TestApplyIsDeclaredButNotWired: at t-6 `--apply` exits non-zero with a \"not implemented\" message and issues zero write requests — a flag that silently no-ops on a board-writing verb fails here"]
  status = "done"

