[[task]]
id    = "t-2"
wave  = 1
title = "Record-derived reap classifier"
files = [
  "internal/cmd/issue_reap.go",
  "internal/cmd/issue_reap_classify_test.go",
]
description = """
classifyReap(ctx, namespaces) returns a verdict over on-disk records with no
forge write and no card-state read for the verdict itself. Evidence per class:
phaseDone(changes.json) for phase and task cards; milestone.toml status for
epics; phase dir existence for `slug:` backlog keys; the target phase's
changes.json for `[routed]`; deferred dismissal for `someday:`. Quicks have no
completion record — version monotonicity proves another bump happened, not that
the quick finished — so they classify unattributable and are never closed by the
sweep; the plan lists them for the operator to close by hand.
Verdicts reap / open / unattributable, deny by default. Reuses
backlogVerdictFor. A card already in its class's terminal state classifies
not-stranded, so a post-sweep dry run prints an honestly empty plan.
reapCard carries {Key, Lane, Terminal, Why}; Why is the justifying record path.
"""
covers = ["c-3", "c-4"]
test_contract = [
  "TestPhaseCardIsClassifiedFromItsCompletionRecord: two fixtures with the card's board state held identical — a phase whose changes.json reads complete yields its phase card and its task cards, the same board state over a record with status removed yields zero; a classifier reading iss.State or the dross/status label fails here",
  "TestEpicFollowsMilestoneStatusNotTheCard: an epic whose milestone.toml status is \"active\" classifies open, status \"complete\" yields it",
  "TestSlugBacklogNeedsItsPhaseDir: a `slug:` key whose phase directory is absent classifies unattributable, not reap",
  "a `[routed]` entry yields a card only when the target phase's changes.json reads complete",
  "TestQuickIsNeverAutoClosed: a quick card whose ref is older than the current state.json version still classifies unattributable, not reap — a classifier that closes it on version ordering alone fails here; the card appears in the plan's unattributable list so it is not lost",
  "TestAlreadyTerminalIsNotStranded: a card already sitting in its class's terminal state classifies not-stranded",
  "the fake forge fails the test on any non-GET request issued during classify",
]
status = "pending"

[[task]]
id    = "t-3"
wave  = 1
title = "Reap journal: write, load, prior state"
files = [
  "internal/reaplog/reaplog.go",
  "internal/reaplog/reaplog_test.go",
  ".gitignore",
]
description = """
.dross/reap-log.json: runs, each holding started-at plus per-card
{issue, class, prior_state, prior_resolved, prior_labels, dropped_link,
outcome}. Append-on-apply, Last() for the undo target. A missing file is an
empty log, not an error. Standalone package — board.go's package doc commits
to holding nothing but the cross-references, and a map on Board would register
as a mirror namespace with t-7's guard.
The ledger is machine-local and gitignored, with the reason stated inline the
way the state.json and local.toml entries already are: it records one machine's
writes to one tracker, so a tracked file would dirty the tree on every apply,
ride ship's clean-tree auto-commit into the phase branch, and drag a stale undo
target through the squash into every later tree.
"""
covers = ["c-9"]
test_contract = [
  "TestJournalRoundTripsPriorState: an entry that drops prior_state fails the marshal → load → compare",
  "TestMissingJournalIsNotAnError: Load on an absent .dross/reap-log.json returns an empty log and a nil error, so a first --undo says there is nothing to undo instead of erroring",
  "TestFailedCardIsNotUndoable: a card recorded with outcome=failed is excluded from Last().Closed()",
  "TestReapLogIsNotABoardNamespace: reflection over board.Board finds no new map field, so t-7's guard does not demand a reap path for the ledger",
  "TestReapLogIsGitignored: `git check-ignore .dross/reap-log.json` succeeds — a tracked ledger dirties the tree on every apply and ship's clean-tree auto-commit carries it into the squash",
]
status = "pending"

