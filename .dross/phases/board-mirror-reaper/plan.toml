Split each compound verb into a parent+child cobra pair — `phase sync`,
`task sync`, `task pull`, `milestone sync`, `backlog sync`. Flags, args and
RunE bodies move unchanged onto the child. No aliases. Prompts are not
touched here (t-5).
Atomic by necessity, not by omission: cobra rejects the old spelling the moment
the tree changes, so every call site in the suite reddens in the same commit and
there is no green intermediate to split at. The forge comment tidy rides with
t-13, which is editing those files anyway.
"""
covers = ["c-8"]
test_contract = [
  "runCmd(t, Issue(), \"phase-sync\", \"01-auth\") returns EnforceSubcommandKnown's unknown-subcommand error and exits non-zero, while runCmd(t, Issue(), \"phase\", \"sync\", \"01-auth\") runs issue_test.go's existing body assertions unchanged",
  "TestIssueVerbsAreNested walks Issue()'s whole command tree and fails on any Use whose first word contains a hyphen — restoring \"task-sync\" reddens it",
  "TestNestedIssueVerbsResolve fails when Find([\"task\",\"sync\"]) or Find([\"backlog\",\"sync\"]) returns cobra's unknown-command error",
  "TestIssueTaskPullReportsPlanMoved fails while the printed remedy still reads `dross issue task-sync`",
  "TestNoHyphenatedIssueVerbInGoSource: a scan of internal/**/*.go for `dross issue [a-z]+-[a-z]+` reports zero hits — deferred_add.go's user-facing Printf naming `dross issue backlog-sync` fails here while the compiler stays green",
]
