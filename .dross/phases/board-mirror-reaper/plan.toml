[[task]]
id    = "t-13"
wave  = 1
title = "StateWriter capability for raw state writes"
files = [
  "internal/forge/forge.go",
  "internal/forge/youtrack.go",
  "internal/forge/jira.go",
  "internal/forge/github.go",
  "internal/forge/state_map_test.go",
]
description = """
Add a StateWriter capability interface — SetStateRaw(key, state string) error —
alongside BoardClient rather than on it, matching the IssueLinker precedent
documented at forge.go:184-191. It writes a literal tracker state instead of a
mapped dross lifecycle status; today CloseIssueAs and SetState both map, and
Client closes via UpdateIssue(IssuePatch{State}), so restoring an arbitrary
prior column such as "In Review" is unimplementable. Implemented on
YouTrackClient, JiraClient and Client. GitHubClient deliberately does NOT
implement it: GitHub has no column model, so it must fail the assertion rather
than satisfy it with a lossy reopen. Keeping it off BoardClient also leaves the
two in-cmd fakes compiling untouched. No caller yet; t-10 consumes it.
"""
covers = ["c-9"]
test_contract = [
  "TestSetStateRawBypassesTheStateMap: SetStateRaw(key, \"In Review\") writes \"In Review\" verbatim on each implementing client — an implementation routing through defaultYouTrackStateMap or defaultJiraStateMap turns it into a mapped lifecycle status and fails",
  "TestGitHubIsNotAStateWriter: a compile-time assertion that *GitHubClient does NOT satisfy StateWriter, and that YouTrackClient, JiraClient and Client do — a lossy reopen/close stub added to GitHub to make the assertion pass reddens this",
  "TestStateWriterIsNotOnBoardClient: a BoardClient value has no SetStateRaw method, so the two in-cmd fakes still satisfy the interface without change",
  "TestSetStateRawVerifiesReadBack: a write whose read-back still reports the old state returns an error naming the key rather than reporting success",
]
status = "pending"
