[[task]]
id         = "t-9"
wave       = 4
title      = "Reproduce the stale-milestone incident end to end"
depends_on = ["t-4", "t-5", "t-6", "t-7", "t-11"]
files = [
  "internal/cmd/phase_base_truth_test.go",
]
description = """
New fixture reproducing the incident: phase forked from main (base recorded as
main), current_milestone set with a stale local milestone/<v> branch present, PR #42
squash-merged onto origin/main, PRMergedFunc stubbed merged. One test asserts the
success shape, one asserts the refusal shape (base record stripped); both assert the
never-touch-the-milestone-branch invariant.
"""
covers = ["c-5"]
test_contract = [
  "if completion fast-forwards the milestone branch, rev-parse milestone/<v> and origin/milestone/<v> differ across the run in either the success or the refusal case",
  "if the success path lands on the wrong branch, HEAD is not \"main\", main != origin/main, or phase/auth survives locally or on origin",
  "if a refusal path deletes the phase branch, `branch --list phase/auth` or `ls-remote --heads origin phase/auth` comes back empty",
  "if base resolution regresses to resolveNewWorkBase, the run's stdout or error names milestone/<v> as the reconcile target and the needle assertion fires",
  "if the run ends in a state that is neither clean success nor clean refusal, the test's explicit two-outcome switch has no matching arm and fails",
]
status = "pending"
