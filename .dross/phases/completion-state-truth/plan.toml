  "TestQuickPromptHandlesShippedWindow: quick.md's in-phase routing names the shipped state and does not send work to `phase/<current_phase>` unconditionally. Reverting to the bare branch rule fails it.",
  "TestCompleteHelpNamesRecordOwner: `dross phase complete --help` contains \"writes the completed-state transition\" and the word \"machine-local\", and does not contain \"'dross ship' folds\". Deleting that sentence fails it, so the positive claim cannot rot the way the old one did.",
