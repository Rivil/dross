"""
covers        = ["c-2", "c-3"]
test_contract = [
  "if reconcilablePhases reads history again, a complete-record phase whose branch still exists after its breadcrumb ages out is counted and the reconcile-count test fails",
  "if the shipped reader reads history again, visiting a complete-record phase from its old branch prints the waiting-on-merge line and the test fails",
  "if either swap widens to phaseDone, a shipped-not-merged phase stops being counted and stops being announced, failing the mid-flight fixture",
]
status        = "pending"

[[task]]
id            = "t-4"
wave          = 2
depends_on    = ["t-1", "t-2"]
title         = "Rewrite suggestNext's terminal advice"
files         = [
  "internal/cmd/status.go",
  "internal/cmd/status_test.go",
  "internal/cmd/reentry_test.go",
]
description   = """
Consult t-2's oracle BEFORE the verdict switch, not in the terminal region: with
verdict=pass and recorded tasks, status.go:293-296 returns /dross-ship first, so
a merged phase never reaches the terminal branch at all. merged →
`dross phase complete <id>`; open → the existing "merge the open PR, then …"
text; no-PR and unknown fall through to today's logic.
Add an unfinalized-verdict arm OUTSIDE the `verdict != ""` guard, reusing
pendingVerdicts' own predicate (v == "" || v == "pending"), routing to
`dross verify finalize <id>` — the verb status already names four lines earlier,
not /dross-verify, which would re-run mutation on an already-written verify.toml.
Then remove the `phase looks complete` branch.
The terminal-region contracts share one fixture family — a zero-task changes
record, the only pass-verdict shape that reaches there — varying only PR and
merge state.
"""
covers        = ["c-4"]
test_contract = [
  "if the merged arm is dropped or never reached, a phase whose recorded PR is an ancestor of origin/<base> and carries no completion status is advised /dross-ship instead of `dross phase complete <id>` and the test fails",
  "if the merged arm fires on anything but merged, a phase with no PR recorded and HEAD on main is advised `dross phase complete` rather than falling through and the test fails",
  "if the open case is folded into the merged one, a phase with a recorded but unmerged PR is advised `dross phase complete` instead of \"merge the open PR, then …\" and the test fails",
  "if the unfinalized arm is placed inside the `verdict != \"\"` guard, a phase whose verify.toml carries verdict=\"\" falls through instead of yielding `dross verify finalize <id>` and the test fails",
  "if the unfinalized arm names /dross-verify, one `dross status` output names two different verbs for the same signal — its pending: line and its re-entry line — and the cross-surface test fails",
  "if the terminal branch returns, a phase with verdict=\"pass\" and a changes record carrying zero tasks yields \"phase looks complete\" instead of /dross-ship and the test fails",
  "if reentryLine and status's final line diverge, the test comparing the two byte-for-byte fails",
]
status        = "pending"

[[task]]
id            = "t-5"
wave          = 3
depends_on    = ["t-1", "t-3", "t-4"]
title         = "Widen the doneness guard to the re-entry surfaces"
files         = [
  "internal/cmd/reentry_signal_truth_test.go",
  "internal/cmd/completion_record_truth_test.go",
]
description   = """
New git-backed guard covering the watch drift classifier, the reconcile count,
the shipped/waiting reader and the re-entry line. The existing truthFixture is
git-free and asserts on N/M count regexes, which none of these four print — copy
reconcileFixture's shape instead and assert per-surface. The original
three-command guard stays as it is, with a pointer to the new file; the header
records that c-5's "one fixture" means one across these four surfaces, not a
merge of the two guards.
The guard is behavioral, not a source scan. Keep the fixture's reconcilable
count at one: above one, suggestNext returns the reconcile suggestion ahead of
every doneness-sensitive arm and the re-entry assertion stops testing what it
names.
"""
covers        = ["c-5"]
test_contract = [
  "if any of the four surfaces is reverted to a state.History `completed <id>` read, the one fixture — complete record plus an aged-out history — makes that surface disagree with the other three and the guard fails",
  "if any of the four is reverted to deriving doneness from verify.toml's verdict, the fixture's inverted verdict (record complete, verdict absent) makes that surface disagree and the guard fails",
]
status        = "pending"
