[phase]
id = "reentry-signal-truth"

[[task]]
id            = "t-1"
wave          = 1
title         = "Add changes.Complete, point watch drift at it"
files         = [
  "internal/changes/changes.go",
  "internal/changes/changes_test.go",
  "internal/watch/drift.go",
  "internal/watch/drift_test.go",
  "internal/cmd/issue_reap.go",
]
description   = """
Add a Complete(root, slug) predicate to internal/changes that is true only for
status="complete" — the narrower sibling of cmd.phaseDone, documented as such
per the reentry_predicate decision. Replace watch's stateHasCompleted history
read in classifyPhase with it and delete the helper.
Route phaseRecordVerdict (internal/cmd/issue_reap.go) through Complete too — it
already implements the same narrowing inline, and two narrow readers of one
field is the divergence this phase removes. Its unattributable/unreadable arms
stay as they are.
Fix the two comments the swap falsifies: DriftVerifiedUnshipped's doc and
ClassifyDrift's 50-entry-cap scoping rationale.
"""
covers        = ["c-1"]
test_contract = [
  "if the digest reads the history breadcrumb again, a fixture with status=\"complete\" and a 50-entry history that no longer carries `completed <id>` reappears as verified-unshipped drift and the test fails",
  "if Complete widens to accept status=\"shipped\", a fixture whose changes.json carries status=\"shipped\" with no open PR stops classifying as verified-unshipped drift and the test fails",
  "if phaseRecordVerdict keeps its own inline status check, changing Complete's definition leaves the reap lane on the old answer and the shared-predicate test fails",
]
status        = "pending"

[[task]]
id            = "t-2"
wave          = 1
title         = "Add a three-valued phase merge oracle"
files         = [
  "internal/cmd/status.go",
  "internal/cmd/status_test.go",
]
description   = """
New helper answering merged-ness for a named phase id, not for HEAD: no-PR /
open / merged / unknown. shippedUnmergedPhase cannot be inverted for this — its
own doc says ok=false covers "not a phase branch, not shipped, no origin, or
genuinely merged", and the SessionStart hook usually runs from main. Reuses the
existing squash-aware ancestry check against the recorded base; stays
network-free.
Every uncertainty is `unknown`, never `open`: missing local refs/heads/phase/
<slug> (dross phase complete deletes it, and a fresh clone never had it),
missing origin/<base>, a base more than staleSquashScanLimit commits ahead, and
every git error path.
The doc comment carries two caveats: network-free means `merged` is "merged as
of the last fetch" and `open` silently includes "merged but unfetched"; and why
this deliberately stays separate from the merge check inside
shippedUnmergedPhase rather than absorbing it.
"""
covers        = ["c-4"]
test_contract = [
  "if the oracle keys on HEAD instead of the phase id, a fixture run from main reports unknown for a phase whose recorded PR is merged and the test fails",
  "if the no-PR case is folded into any other, a phase with ch.PR == 0 reports merged or open instead of no-PR and the test fails",
  "if unknown collapses into merged or open, a phase whose origin/<base> ref is absent reports something other than unknown and the test fails",
  "if the deleted-branch path is not unknown, a phase whose refs/heads/phase/<slug> is gone reports open and the test fails",
  "if the scan-limit path is not unknown, a base more than staleSquashScanLimit commits ahead of the phase branch reports open and the test fails",
]
status        = "pending"

[[task]]
id            = "t-3"
wave          = 2
depends_on    = ["t-1"]
title         = "Swap cmd's two breadcrumb reads for the record"
files         = [
  "internal/cmd/phase_reconcile.go",
  "internal/cmd/status.go",
