task_seq = 0

[phase]
  id = "board-sync-truth"

[[task]]
  id = "t-1"
  wave = 1
  title = "OR label clauses in YouTrack + Jira queries"
  files = ["internal/forge/youtrack.go", "internal/forge/jira.go", "internal/forge/youtrack_test.go", "internal/forge/jira_test.go"]
  description = "Emit a single OR'd label clause per query instead of AND-joining one clause per\nlabel. YouTrack: one brace-wrapped `tag:` token. Jira: `labels IN (...)`.\n"
  covers = ["c-1"]
  test_contract = ["buildQuery({bug,enhancement}) emits exactly ONE `tag:` token (`tag: bug, enhancement`); today's two space-joined `tag:` clauses (the AND bug) fail it", "a label `dross/phase:01-x` is brace-wrapped in the query; an unquoted emission fails — the phase resolver in t-9 depends on it", "buildJQL({bug,enhancement}) contains `labels IN (\"bug\",\"enhancement\")` and contains no ` AND labels = ` substring", "`statusCategory != Done` is still AND-joined — proof the OR change did not widen the state scope"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Fan out GitHub label queries and dedupe"
  files = ["internal/forge/github.go", "internal/forge/github_test.go"]
  description = "GitHub's issues API ANDs its `labels=` param, so issue one request per label and\nunion the responses, deduping by issue number.\n"
  covers = ["c-1"]
  test_contract = ["fake serves #1 for `labels=bug`, #2 for `labels=enhancement`; ListIssues with both returns both, via exactly 2 GETs", "an issue returned by both requests appears exactly once", "an unlabelled filter issues exactly 1 request", "a `pull_request`-carrying entry in one label's response is excluded from the union"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Drop unknown labels, name them on stderr"
  files = ["internal/forge/forge.go", "internal/forge/youtrack.go", "internal/forge/jira.go", "internal/forge/github.go", "internal/forge/forge_test.go", "internal/forge/youtrack_test.go", "internal/forge/jira_test.go", "internal/forge/github_test.go"]
  description = "Add an exported FilterKnownLabels helper in forge and call it from each provider's\nListIssues, reading that provider's label index. Unknown labels are dropped and\nnamed on stderr; a failed index read refuses the query rather than degrading.\n"
  covers = ["c-1", "c-2"]
  test_contract = ["FilterKnownLabels([\"bug\",\"typo\"], [\"bug\"]) → kept [\"bug\"], dropped [\"typo\"]; a helper returning all or nothing fails", "YouTrack/Jira/GitHub each read their label index (/api/issueTags, /rest/api/3/label, /repos/o/r/labels) and query only kept labels; the dropped name never reaches the wire", "captured stderr contains the literal dropped name `typo`; a silent drop fails — silence here is the same zero-vs-failure confusion c-2 exists to kill", "when EVERY requested label is unknown the call returns zero issues; a query carrying no label clause (i.e. the whole board) fails the test", "a 500 from the label endpoint surfaces as an error and zero ListIssues calls — never an unfiltered query", "an empty Labels filter issues ZERO label-index requests on every provider; `dross watch` calls collectInbound unlabelled on a /loop timer and promises it never errors out, so a label-index blip must not become a failed heartbeat"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Emit a pull envelope and update prompt consumers"
  files = ["internal/cmd/issue.go", "assets/prompts/status.md", "assets/prompts/inbox.md", "internal/cmd/pull_envelope_test.go", "internal/cmd/status_prompt_test.go"]
  description = "`dross issue pull --json` emits `{\"issues\": [...], \"error\": null|\"...\"}` and keeps\nexit 0 on a board failure. The status and inbox prompts read the envelope and\nreport an unreachable board instead of counting it as zero.\n"
  covers = ["c-2"]
  test_contract = ["success: stdout unmarshals into `{Issues []forge.Issue; Error *string}` with Error nil; today's bare array fails the unmarshal", "board 500: RunE returns nil (exit 0) AND Error is non-empty and names the failure. Returning the error fails the first half; `{\"issues\":[]}` fails the second", "board.enabled=false emits `{\"issues\":[],\"error\":null}`, not `[]`", "human (non-JSON) mode on the 500 prints a line containing \"unreachable\" and does NOT print \"no new issues on the board\"", "`--mark` against a failing board leaves board.json's last_pull byte-identical — stamping a pull that never happened is the silent-zero fault wearing a different hat", "status.md and inbox.md both reference `.issues` / `.error` and the unreachable wording; no bare `--json`-as-array step survives", "status.md no longer carries the \"on any error, skip that source's contribution silently\" instruction — that line, not the array shape, is what makes an unreachable board read as zero"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 1
  title = "Add the [board.fields] config surface"
  files = ["internal/project/project.go", "internal/cmd/project.go", "internal/forge/forge.go", "internal/cmd/issue.go", "internal/cmd/project_test.go", "README.md"]
  description = "Nested [board.fields] table with state / type / fix_versions keys, mirroring the\nexisting board.state_map plumbing, and carried through boardConfig into\nforge.Config.\n"
  covers = ["c-3"]
  test_contract = ["board.fields.state / .type / .fix_versions survive writeDotted → Save → Load → readDotted (same harness as TestBoardDottedArmsRoundTrip)", "`--unset board.fields.state` reads back empty and leaves .type untouched", "`project set board.fields.bogus x` is rejected naming the three accepted keys, and project.toml is byte-unchanged after refusal", "a project.toml with no [board.fields] table reads back \"\" per key — no nil-map panic, matching the state_map path", "boardConfig(project.Board{Fields:{State:\"Статус\"}}, …) returns a forge.Config whose Fields.State is \"Статус\"; a forgotten copy here makes every downstream field test unreachable"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 1
  title = "Apply tags on YouTrack issue create and update"
  files = ["internal/forge/youtrack.go", "internal/forge/youtrack_test.go"]
  description = "CreateIssue sends no tags at all today, so no dross marker has ever reached a\nYouTrack issue. Ensure each tag entity exists via /api/issueTags, then write the\nissue's tags via /api/issues/{id}/tags on both create and update, with replace\nsemantics so removals remove.\n"
  covers = ["c-4", "c-6"]
  test_contract = ["CreateIssue(Labels:[\"dross\",\"dross/phase:01-x\"]) makes the fake observe both tag names; today's create fails it", "an issue tagged [\"dross\",\"dross/target:a\"] patched with [\"dross\",\"dross/target:b\"] ends with exactly those two — a purely additive implementation leaves `dross/target:a` and fails", "a tag name absent from the tag index is created once via POST /api/issueTags before the issue write; an existing one triggers no create", "UpdateIssue with Labels nil sends no tag write at all", "a 500 on the tag write during create still returns the created issue's key with a warning — a tagging blip must not orphan a real issue", "GetIssue maps `tags` back into Issue.Labels (pinned; t-9 reads it)"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 1
  title = "Add an issue-link capability to YouTrack and Jira"
  files = ["internal/forge/forge.go", "internal/forge/youtrack.go", "internal/forge/jira.go", "internal/forge/youtrack_test.go", "internal/forge/jira_test.go"]
  description = "New IssueLinker interface with a relates-to LinkIssues on YouTrack and Jira.\nYouTrack's existing LinkSubtask is subtask-shaped, so this is a new method, not a\nrename. GitHub deliberately does not implement it.\n"
  covers = ["c-7"]
  test_contract = ["YouTrack LinkIssues(\"PROJ-9\",\"PROJ-3\") POSTs /api/commands with a query naming PROJ-3 and an issues array naming PROJ-9", "Jira LinkIssues POSTs /rest/api/3/issueLink exactly once for a new pair, with inwardIssue/outwardIssue and a non-empty type", "on a re-run where the issue's issuelinks already show the pair, zero POSTs are sent (duplicate-link regression)", "an empty/404 /issueLinkType yields ErrNoLinkType, not a generic HTTP error — t-12 must be able to tell the difference", "compile-time `var _ IssueLinker = (*YouTrackClient)(nil)` plus a runtime assertion that (*GitHubClient)(nil) does NOT satisfy it; a future no-op stub would silence c-7's warn arm undetectably"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 2
  title = "Read YouTrack field names from config"
  files = ["internal/forge/youtrack.go", "internal/forge/youtrack_test.go"]
  description = "Replace the hardcoded \"State\" / \"Type\" / \"Fix versions\" literals with the\nconfigured field names, defaulting to today's literals when unset.\n"
  covers = ["c-3"]
  depends_on = ["t-5"]
  test_contract = ["Fields.State=\"Статус\" makes SetState POST customFields[0].name == \"Статус\"; with Fields unset it POSTs \"State\"", "Fields.FixVersions=\"Release\" makes CreateBacklogItem send that name on the fix-versions custom field", "Fields.Type=\"Kind\" makes ensureEpic's search query read `Kind: Epic` AND its create payload carry \"Kind\" — query and payload must move together or an epic is created then never found", "with two VersionBundle-typed fields on the project, ensureVersion writes to the one whose name matches Fields.FixVersions, not the first in the response", "a zero-value Config yields exactly \"State\" / \"Type\" / \"Fix versions\", so an existing project syncs unchanged"]
  status = "done"

[[task]]
  id = "t-9"
  wave = 2
  title = "Resolve a phase's issue from the tracker"
  files = ["internal/cmd/issue.go", "internal/board/board.go", "internal/cmd/issue_phase_resolve_test.go"]
  description = "phase-sync resolves an existing issue by querying the dross marker label plus the\nphase label before creating. board.json becomes a cache: a hit is verified against\nthe tracker and rewritten when stale. A legacy issue carrying the marker and the\nexact `<id> — <title>` summary is adopted and back-filled with the phase label.\n"
  covers = ["c-4"]
  depends_on = ["t-1", "t-6"]
  test_contract = ["create payload AND update patch both carry `dross` and `dross/phase:01-auth` (a wholesale label replace that forgets it orphans the issue on the NEXT run, not this one)", "fake already holds PROJ-7 labelled `dross/phase:01-auth`, board.json empty: after sync ZERO creates, one update to PROJ-7, board.json maps 01-auth→PROJ-7 (the deleted-branch case in c-4)", "the resolver's filter carries exactly ONE label and State \"all\"; a two-label filter fails (t-1 makes it OR and it would adopt an arbitrary dross issue), and an open-only query mints an orphan on every re-ship", "a ListIssues hit whose labels lack `dross` is NOT adopted", "board.json points at PROJ-99 which 404s while PROJ-7 carries the label: sync adopts PROJ-7, zero creates, board.json rewritten (board.Board gains DeletePhase)", "a legacy issue carrying the marker label and the exact `<id> — <title>` summary but no phase label is adopted and back-filled with the phase label; a match whose labels lack the `dross` marker is NOT adopted", "two issues carrying the same phase label produce one update on the lower key plus a stderr duplicate warning, never two writes", "an empty query result yields exactly one create — proof the resolver did not turn \"no issue yet\" into \"never create\"", "two consecutive syncs on a fresh repo leave exactly one issue"]
  status = "done"

[[task]]
  id = "t-10"
  wave = 2
  title = "Sync routed deferred items with a target label"
  files = ["internal/cmd/issue.go", "internal/cmd/deferred_add.go", "internal/cmd/deferred_routed_sync_test.go"]
  description = "Backlog sync covers routed items, not only unrouted ones. A routed item gets the\nsame single issue with a `dross/target:<slug>` label that updates when the route\nchanges, and is resolved from the tracker by a `dross/deferred:<id>` tag before\ncreating — mirroring t-9, because mirrorDeferredAdd already mints the issue at\n`deferred add` time and board.json dies with the phase branch.\n"
  covers = ["c-6"]
  depends_on = ["t-6"]
  test_contract = ["a spec with one routed and one someday item produces TWO creates; today's `Target != \"\"` skip produces one and fails", "the routed item's create carries `dross/target:host` and `dross/deferred:<id>`", "board.json empty but an issue already carries `dross/deferred:<id>`: zero creates, one update to that key — the post-ship case where mirrorDeferredAdd's mapping died with the phase branch; a create here is the duplicate t-9 closes for phases", "the resolver checks the `dross` marker on the matched issue before adopting it, same post-filter as t-9", "edit the item's text and re-sync: ONE update on the same key, zero creates (c-6's \"stays current\" half)", "re-route to another slug and re-sync: the same issue key ends carrying `dross/target:other` and not `dross/target:host` (relies on t-6's replace semantics)", "a dismissed routed item produces no issue — proof the skip removal was scoped to routed items only", "the stale \"left to board-sync-truth\" note in mirrorDeferredAdd's doc comment is removed"]
  status = "done"

[[task]]
  id = "t-13"
  wave = 2
  title = "OR label clauses in REST backends"
  files = ["internal/forge/forge.go", "internal/forge/forge_test.go"]
  description = "The shared REST Client comma-joins labels into one `labels=` param, which\nforgejo/gitea/gitlab all treat as AND. Fan out per label and union, and feed\nFilterKnownLabels from the existing loadLabels index.\n"
  covers = ["c-1"]
  depends_on = ["t-3"]
  test_contract = ["forgejo/gitea ListIssues with {bug,enhancement} issues one request per label and unions the results; today's single comma-joined `labels=bug,enhancement` (AND) fails it", "an issue returned under both labels appears exactly once in the union", "gitlab's ListIssues returns issues carrying either label, asserted against the fake — no live server verification is claimed for this backend", "FilterKnownLabels is fed by the existing loadLabels() index; an unknown label is dropped and its literal name reaches stderr, matching t-3's arm", "a 500 from /labels surfaces as an error with zero issue queries, same refusal as t-3"]
  status = "done"

[[task]]
  id = "t-11"
  wave = 3
  title = "Resolve on close and verify the read-back"
  files = ["internal/forge/forge.go", "internal/forge/youtrack.go", "internal/forge/jira.go", "internal/cmd/issue.go", "internal/cmd/issue_close_truth_test.go", "internal/forge/youtrack_test.go", "internal/forge/jira_test.go"]
  description = "YouTrackClient.CloseIssue is `return nil` today. Write the mapped resolved state,\nthen GET the issue back and fail unless it reads resolved. An unmapped status on\n--close is an error, not a warning.\n"
  covers = ["c-5"]
  depends_on = ["t-8"]
  test_contract = ["GetIssue on `\"resolved\":1700000000000` yields Resolved true; `\"resolved\":null` yields false; a Jira statusCategory key \"done\" yields Resolved true and State \"closed\"", "YouTrackClient.CloseIssue no longer returns a bare nil — either it resolves for real or it errors naming the state write; a nil return fails, because that silent nil IS the c-5 bug", "`phase-sync 01-x --status complete --close` makes the fake observe a State write of the mapped value AND a follow-up read-back GET, then prints the closed line", "state_map.complete = \"\": the command returns a NON-NIL error naming the status and stdout contains no \"closed\" line; today's warn-and-continue exits 0 and fails both halves", "the fake accepts the State write but reports `\"resolved\":null`: the command errors. Without the read-back this test cannot fail", "the close-on-create edge (issue minted then closed in one run) takes the same path — that branch is the one that regressed", "a Jira board with no done-category transition errors instead of printing the closed line", "phase-sync WITHOUT --close on an unmapped status still warns and exits 0 — the lenient path is preserved"]
  status = "done"

[[task]]
  id = "t-12"
  wave = 3
  title = "Link routed items to their target phase issue"
  files = ["internal/cmd/issue.go", "internal/cmd/deferred_link_test.go"]
  description = "Where the provider implements IssueLinker and the target phase has an issue, link\nthe routed item's issue to it. Otherwise keep the target label, warn, and continue\n— the link is established on a later sync.\n"
  covers = ["c-7"]
  depends_on = ["t-7", "t-9", "t-10"]
  test_contract = ["target phase already has an issue: backlog-sync records exactly one link call naming both keys", "no target phase issue: ZERO link calls, exit 0, stderr names the target slug, and the created issue still carries `dross/target:<slug>`. Erroring fails the exit-0 assertion; silence fails the stderr assertion", "sync (warn, no link) → create the phase issue → re-sync: exactly one link call. This is c-7's \"established on a later sync\" clause and it cannot pass unless the warn path leaves the item relinkable", "a GitHub board records zero link attempts, warns once, exits 0 — the capability check must be an interface assertion, not a provider-string switch", "ErrNoLinkType from the linker warns and continues rather than aborting the whole backlog sync", "the link call 500s: backlog-sync still exits 0 with the issue created and labelled"]
  status = "done"
