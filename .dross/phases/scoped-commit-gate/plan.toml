  test_contract = ["if the evidence is unreal, the acceptance record fails: its SHA must resolve with `git -C ~/Development/barktime cat-file -e`, and its run log must exist", "if the run was not scoped, the record fails: the log must show relate mapping a .svelte path to its tests, the batched line carrying only those tests, tests collected, no `uncovered:` line and no bare in-container suite", "if the gate was lifted, the record fails: `dross gate status` in barktime, run right after the commit, must show commit-green not lifted", "if a full run admitted it, the record fails: barktime's green.json tree must differ from that commit's tree", "if the cost model is wrong, the record fails: it must hold runs beside wall_clock_s for a multi-path leaf task commit, the figure for two runs must fit t-20's 600s budget, and a hot-file task is recorded rather than failed", "if relate fails open, the same-session check fails: a .svelte with no related test, and a misspelled path, must each give exit 5, no lane spawn, scoped.json unchanged and no record for that tree", "if a miss admits on the real repo, the check fails: a commit touching one covered and one test-less .svelte must be refused, naming the second", "if dependencies reach the site another way, the record fails: the lane's `prepare` is t-20's lockfile-guarded install, and the log shows it ran before relate"]
  status = "done"

[[task]]
