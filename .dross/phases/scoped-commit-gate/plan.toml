[[task]]
  id = "t-28"
  wave = 1
  title = "Let task status clear an ambiguous in_progress"
  files = ["internal/gate/engine.go", "internal/gate/scope.go", "internal/gate/pair.go", "internal/gate/engine_test.go", "internal/cmd/task.go", "internal/cmd/task_test.go"]
  description = "Reported from feastahead (fix-phone-cooking-timers, dross a025c09b). When a phase has two tasks in_progress, ArmedScope (scope.go) and armedRun (pair.go) return ambiguous(), and engine.go turns any Judge error into a refusal. So every Bash call is refused, including the 'dross task status <phase> <id> pending' that ambiguous() itself names as the remedy. Only the human's ! prefix recovers. Fix, two parts: (1) ambiguous returns a typed error (errors.As-able, carrying the phase and its in_progress ids). In engine.go, when a Judge error is that type and the call is a Bash line whose every command is 'dross task status <that phase> <one of those ids> pending|failed', the call passes. Any other call is still refused, and the refusal text names both pending and failed. (2) cmd 'task status <phase> <id> in_progress' refuses, before writing, when a different task in that phase is already in_progress. It names that task and the 'dross task status <phase> <other> pending' that parks it. Re-setting the same task to in_progress stays allowed. Found 2026-11-09 by feastahead-6c."
  test_contract = ["if the remedy stays refused, a Bash 'dross task status <phase> <id> pending' with two tasks in_progress is refused and the engine_test case for the ambiguous escape fails", "if the escape is too wide, any other Bash call (git status, or 'dross task status ... done', or a remedy chained with another command) with two tasks in_progress passes, and the engine_test negative cases fail", "if a second in_progress can still be created, 'dross task status <phase> B in_progress' while A is in_progress writes the plan, and the task_test case fails; re-setting A to in_progress must still succeed"]
  status = "done"

[[task]]
  id = "t-29"
  wave = 2
  title = "Keep one task armed through the ambiguous escape"
  files = ["internal/gate/pair.go", "internal/gate/engine_test.go"]
  description = "t-28's review FLAG. AmbiguousError.Parks lets through a line that parks EVERY in_progress task (e.g. 'dross task status p t-1 pending && dross task status p t-3 pending'). The engine returns before solo-review's judgeDowngrade runs, so with uncommitted solo code that line disarms the solo scope, which the downgrade guard otherwise refuses. Fix: Parks accepts a line only when it parks at most len(Tasks)-1 distinct ids, leaving one task in_progress. That task is the armed scope, and judgeDowngrade governs it on the next call. A line parking all of them is refused with the existing ambiguous refusal text."
  test_contract = ["if a line parking every in_progress id still passes, the engine_test case with two in_progress and both parked in one line is not refused and fails", "if the fix over-tightens, a line parking one of two in_progress ids is refused and the existing allowed-line cases in TestAmbiguousEscape fail"]
  status = "done"
  depends_on = ["t-28"]

[[task]]
  id = "t-30"
  wave = 3
  title = "Prove a solo task's tests go red at base"
  files = ["internal/cmd/test.go", "internal/cmd/test_redproof.go", "internal/cmd/test_redproof_test.go", "cmd/dross/testdata/cli_tree.txt", "assets/agents/dross-task-writer.md", "assets/prompts/_execute.solo.md", "internal/cmd/test_output_test.go", "internal/review/writer_test.go"]
  description = "From feastahead's report: in solo runs no one can show a task's new test fails without its fix. The solo-writer gate blocks main-loop edits, and the writer's own file copies too. User chose the 'tests at base' shape. New 'dross test --red-proof --files <test paths>': dross builds a scratch copy of HEAD's tree (git archive or checkout-index into a temp dir, never a git worktree: rsyncing a worktree to helicon clobbers its .git) and overlays only the named test files from the working tree. It runs the lanes those paths hit at the same run site as a normal --files run, and REQUIRES a red: exit 1 from the suite means proven. A green means the tests pass without the fix, so the result is not proven and the exit is non-zero. Not run (2-8) stays its own exit, never counted as proof. The working tree, scoped.json and green.json are never touched or written. Refuse non-test paths: overlaying source would prove nothing. Writer prompt: run it on the task's new or changed tests before reporting, and add a 'red-proof:' line to dross-writer-report. Solo partial: the main loop reads that line; a not-proven result is surfaced in the commit body, and the task does not fail."
  test_contract = ["if --red-proof runs against the working tree instead of HEAD, a fixture where the fix makes the test pass reports proven-green and TestRedProofRunsAtBase fails", "if a green at base counts as proof, TestRedProofGreenIsNotProven fails", "if the run touches the working tree or records a green, TestRedProofLeavesTreeAndRecords fails (tree fingerprint, scoped.json and green.json unchanged)", "if a non-test path is overlaid, TestRedProofRefusesSourcePaths fails", "if the CLI tree drifts, cli_tree.txt's golden test fails"]
  status = "done"
  depends_on = ["t-29"]

[[task]]
  id = "t-31"
  wave = 4
  title = "Name only reds from the named tests as proof"
  files = ["internal/cmd/test_redproof.go", "internal/cmd/test_redproof_test.go", "assets/agents/dross-task-writer.md"]
  description = "t-30's review FLAGs plus a compile-failure case seen in t-30's own run. 'dross test --red-proof' currently reports 'proven (red at base)' for any red at base. Three of those reds have nothing to do with the fix: (1) a compile failure at base (the new tests call functions HEAD lacks); (2) the scratch copy has no .git, so a git-calling test anywhere in a whole-package run (Go) goes red regardless; (3) on a granted host the push keeps the host's stale .git beside HEAD's files. Fix: (a) give the scratch copy a .git at HEAD, made locally and pushed whole so the host does not keep its old one; (b) a red counts as proven only when the run's parsed failures (runsummary) name at least one of the named test files or packages AND the run compiled. A build failure, or reds only in un-named tests, prints 'red at base, but not from the named tests: <first failing>' and is NOT proven (exit 1). An unparsed red is not proven either. (c) dross-task-writer.md line 27: say tests run as 'dross test --files <path>', plus '--red-proof' for the red-proof, so the two bullets agree."
  test_contract = ["if a compile failure at base still counts as proof, TestRedProofBuildFailureNotProven fails", "if a red only in an un-named test counts as proof, TestRedProofUnnamedRedNotProven fails", "if the scratch copy lacks .git at HEAD, a git-calling test at base fails and TestRedProofScratchHasGitAtHead fails", "if a red in a named test no longer counts, TestRedProofRunsAtBase fails"]
  status = "pending"
  depends_on = ["t-30"]
