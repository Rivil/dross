Add a Scoped record (Tree, Covered, Lanes, At, Runner) with SaveScoped, LoadScoped and ClearScoped beside the green record, and list scoped.json in the writers table. Lanes holds LaneLine fingerprints, not names. Green and scoped stay separate files.
