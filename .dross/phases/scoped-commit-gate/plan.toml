  test_contract = ["if a scoped-to-nothing miss still renders the sync segment, a remote --files run over a missing path prints 'output not recognised' and TestScopedToNothingMissNoTail fails", "if the fix swallows the miss itself, the run no longer exits 5 or no longer prints 'selector miss:', and TestScopedToNothingMissNoTail fails"]
