    "if a red can be read as a miss, validate's test fails: `vouch = true` with empty_exit listing 1 is a problem",
    "if the exempt fence weakens, validate's test fails: `test_exempt` entries `**`, `*`, `**/*`, `*/**` and `**/**` are all problems, and `[\"docs/[\"]` is one naming the glob",
    "if the new fields churn other repos, the lossless test fails: a project.toml with neither field saves byte-identical",
