[[task]]
  id = "t-3"
  wave = 1
  title = "Add vouch and test_exempt fields with validation"
  files = ["internal/project/project.go", "internal/cmd/validate.go", "internal/cmd/validate_lane_test.go", "internal/project/save_lossless_test.go", "internal/pathfence/fields.go", "internal/pathfence/fields_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt", "ARCHITECTURE.md"]
  description = """
Add `vouch` to [[runtime.test_lane]] and `runtime.test_exempt` globs. Validate requires a vouching lane to have a `path` selector and a non-empty empty_exit, in a repo with a runtime.test_command so the full run is never a vouching lane, and rejects catch-all or malformed exempt globs. Both rules are shared helpers that t-7, t-8 and t-9 reuse. Omitted fields leave the file byte-identical.
"""
  covers = ["c-2", "c-3", "c-4", "c-9"]
  test_contract = ["if a selector-less lane can vouch, validate's test fails: `vouch = true` with no selector is a problem naming the lane", "if an aggregate lane can vouch, validate's test fails: `vouch = true` on a `dir` or `go-package` selector is a problem naming the lane, because `go test` exits 0 on `[no test files]`", "if a vouching lane can be the only full run, validate's test fails: `vouch = true` in a repo with no runtime.test_command is a problem naming the lane", "if a lane can vouch without an empty signal, validate's test fails: `vouch = true` with an empty empty_exit is a problem naming the lane", "if a red can be read as a miss, validate's test fails: `vouch = true` with empty_exit listing 1 is a problem", "if the exempt fence weakens, validate's test fails: `test_exempt` entries `**`, `*`, `**/*`, `*/**` and `**/**` are all problems, and `[\"docs/[\"]` is one naming the glob", "if the new fields churn other repos, the lossless test fails: a project.toml with neither field saves byte-identical", "if test_exempt goes unfiled, TestEveryPathShapedFieldIsDeclared fails: project.Runtime.TestExempt is filed exactly once, in pathfence.Fields() or not_paths.txt", "if the Save anchor drifts, TestArchitectureNamesLosslessWriter fails: ARCHITECTURE.md's project.Project.Save and saveLossless anchors name their current project.go lines"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Add pure scoped path classifier"
  files = ["internal/testlane/coverage.go", "internal/testlane/coverage_test.go", "internal/testlane/match.go", "internal/testlane/match_test.go"]
  description = """
Add a pure classifier over changed paths, covered paths and exempt globs that returns the paths needing a full green. A fixed list beats both coverage and exempt: package.json, lockfiles (package-lock.json, pnpm-lock.yaml, yarn.lock, go.mod, go.sum), tsconfig*.json, *.config.{js,ts,mjs,cjs}, Dockerfile*, docker-compose*.yml and Makefile, at any depth. Add MatchAny for exempt globs.
"""
  covers = ["c-3", "c-9"]
  test_contract = [
    "if exempt beats the config list, the classifier test fails: package.json in both covered and an exempt `*.json` glob still needs a full green",
    "if coverage beats the config list, the classifier test fails: src/vite.config.ts in covered needs a full green",
    "if the list has a gap, the classifier test fails: package-lock.json under an exempt `*.json` glob, svelte.config.js, tsconfig.json, vitest.mutation.config.ts, Dockerfile.test and docker-compose.test.yml in covered each need a full green",
    "if path spelling splits, the classifier test fails: `./src/a.ts` in changed matches `src/a.ts` in covered",
    "if exempt globs match too widely, the test fails: docs/x.md matches `docs/**`, and src/docs.md does not",
    "if `*` crosses segments, match_test fails: MatchAny([\"docs/**\"], \"docs/a/b.md\") is true and MatchAny([\"*.md\"], \"docs/a.md\") is false",
    "if an empty cover set admits anything, the classifier test fails: it returns every non-exempt path, in input order, for the refusal to name",
  ]
  status = "done"

