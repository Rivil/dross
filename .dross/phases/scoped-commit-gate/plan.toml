  description = """
Update the README roadmap: v1.8 complete with its criteria ticked, v1.9 active with its 5 criteria, no Azure DevOps line. Extend the test to guard ticks and box counts. Runs first by position: every commit here needs a full green, and the suite is red until this lands.
