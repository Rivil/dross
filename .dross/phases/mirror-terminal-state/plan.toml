[phase]
id = "mirror-terminal-state"

[[task]]
id            = "t-1"
wave          = 1
title         = "Exclude every mirror namespace from pull"
files         = [
  "internal/board/board.go",
  "internal/cmd/issue.go",
  "internal/board/board_test.go",
  "internal/cmd/issue_test.go",
]
description   = """
IsLinked walks Milestones, Phases, Quicks, Backlog and Tasks (Tasks by .Issue,
not the struct), and never matches an empty id. Milestone values are matched only
when the recorded value has an issue-key shape — package board cannot read
[board].milestone_mode, so the gate is shape inference on the value itself:
^[A-Za-z][A-Za-z0-9_]*-[0-9]+$, which a YouTrack epic idReadable (DRO-134) takes
and nothing else stored in that slot does. A YouTrack version bundle stores the
version NAME ("v1.5") and agile mode the board name, neither of which matches;
the REST forges and GitHub store a numeric milestone id ("7") whose id space
collides with their own issue keys, since issueResponse.toIssue sets
Key: strconv.Itoa(r.Number) — so milestone 7 and issue #7 are the same string and
an unconditional match would suppress the human issue. This replaces the existing
TestIsLinkedExcludesMilestones, whose blanket exclusion the exclusion_basis lock
supersedes. collectInbound additionally drops any issue carrying labelMarker.
"""
covers        = ["c-1"]
test_contract = [
  "a board.json whose only link to PROJ-9 is a `tasks` entry makes `issue pull` omit PROJ-9; reverting IsLinked to phases+quicks fails TestPullExcludesEveryNamespace, which runs one subtest per namespace so a dropped namespace names itself",
  "an issue carrying the `dross` label and linked in no namespace is omitted while the identical issue without the label is present; deleting the marker clause in collectInbound fails TestPullExcludesMarkerLabelledIssue",
  "TestIsLinkedExcludesMilestones is replaced by a shape-gated trio: a milestone value of DRO-134 IS linked, a value of \"7\" is NOT, and a value of \"v1.5\" is NOT — dropping the shape predicate reddens the \"7\" case by suppressing forge issue #7, and dropping milestones from the walk entirely reddens the DRO-134 case",
  "the \"7\" and \"v1.5\" cases fail differently and both are asserted: \"7\" collides with a real issue key on the REST forges and GitHub, while \"v1.5\" collides with nothing but proves the predicate is not merely \"contains a dash\"",
  "the epic case is load-bearing rather than belt-and-braces: ensureEpic sets no labelMarker, so an epic excluded only by the marker clause would still reach the feed — a test that clears the epic's labels and still expects it omitted fails if milestones are dropped from the walk",
  "a board.json holding an empty task issue id plus a forge issue whose Key is \"\" leaves that issue in the feed: TestEmptyIdNeverMatches fails if IsLinked(\"\") returns true, which would blank the whole feed",
  "loading this repo's real .dross/board.json and feeding every id it links back as a ListIssues response leaves the feed empty — the reduction pinned to the file, with no assertion on the number 116",
  "a dismissed id and a plain human issue keep today's verdicts: deleting either existing filter clause fails this test",
]
status        = "pending"

[[task]]
id            = "t-2"
wave          = 1
title         = "Make closeBoardIssue the one verified close"
files         = [
  "internal/cmd/issue.go",
  "internal/cmd/issue_close_truth_test.go",
  "internal/cmd/issue_quick_close_test.go",
]
description   = """
closeBoardIssue writes the [board].state_map terminal state and re-reads the
issue, failing unless the tracker's own verdict says done. The verdict differs by
backend and that is deliberate: YouTrack and Jira populate Issue.Resolved, so
they are verified on it (Jira's mapped write via its existing SetState, driven
from closeBoardIssue — jira.go itself is untouched). Every other provider is
verified on State == "closed", which their toIssue does populate. The branch is
by EXCLUSION — not YouTrack, not Jira — never a three-name allowlist: GitHub is a
fourth flat board (github.go populates State and never Resolved), so an allowlist
would either demand Resolved of it and strand every card, or refuse it by name.
Requiring Resolved everywhere would strand the flat boards outright, which the
flat_board_close lock forbids. `issue quick --close` routes through
closeBoardIssue instead of calling client.CloseIssue directly.
"""
covers        = ["c-4"]
test_contract = [
  "`issue quick --close` against a YouTrack fake whose read-back reports resolved:false exits non-zero and prints no \"(closed)\" line — TestQuickCloseFailsWhenTheIssueStaysUnresolved",
  "a [board].state_map override of `complete` reaches the quick close: the fake records the overridden State value, not the built-in \"Verified\" — TestQuickCloseHonoursStateMap fails while the nil-override CloseIssue path is used",
  "TestFlatBoardCloseVerifiesOnStateNotResolved runs a subtest per flat provider — forgejo, gitea, gitlab AND github — each with a read-back reporting State == \"closed\" and Resolved == false, and each must exit ZERO; a Resolved-based read-back reddens all four, and a three-name allowlist reddens the github subtest alone",
  "the same fakes, with the read-back left State == \"open\", exit non-zero — the flat path verifies rather than assuming",
  "a Jira board offering no transition to the mapped Done status fails the close, and a transition landing on a non-done category fails the read-back rather than reporting success",
  "no flat provider attempts a state write or raises an unmapped-status error — the state-map write is the YouTrack/Jira path only",
  "the phase path is unchanged — the existing TestPhaseSyncClose* suite in issue_close_truth_test.go stays green, including TestPhaseSyncWithoutCloseKeepsTheLenientPath",
]
status        = "pending"

[[task]]
id            = "t-3"
wave          = 2
depends_on    = ["t-2"]
title         = "Add task-sync --status validation and --close"
files         = [
  "internal/cmd/issue_task.go",
  "internal/cmd/issue.go",
  "internal/cmd/issue_task_close_test.go",
]
description   = """
task-sync validates --status against configenum.LifecycleStatuses before
openBoard and normalizes it, matching phase-sync's shape. A new --close flag
drives each synced task through closeBoardIssue; on the flat boards it plainly
closes rather than refusing by name. --close REQUIRES --status: closeBoardIssue
defaults an empty status to "complete", which is the phase lane's terminal state,
and writing it onto task cards is the exact label collision the
task_terminal_status lock exists to prevent. A failed close names the task and
fails the command.

Waves in this plan are commit order, not concurrency: t-3, t-4 and t-5 all edit
internal/cmd/issue.go and must run one at a time regardless of their dependency
edges.
"""
covers        = ["c-2"]
test_contract = [
  "`task-sync <phase> --status bogus` exits non-zero naming configenum.LifecycleStatuses.List() and makes no tracker call at all — the fake records zero requests — TestTaskSyncValidatesStatusBeforeTouchingTheBoard",
  "`task-sync <phase> --close` with no --status exits non-zero and makes no tracker call — TestTaskCloseRequiresAStatus fails the moment the closeBoardIssue default is allowed through, which would write the phase lane's `complete` state onto task cards",
  "`task-sync <phase> --status \" Task-In-Review\"` reaches the state map: the fake sees label dross/status:task-in-review, not the padded form — TestTaskSyncNormalizesStatus",
  "on each flat provider, `task-sync <phase> --status uat --close` issues one close per task, exits zero, writes no state field, and prints no provider-refusal message — TestFlatBoardTaskCloseClosesEveryCard fails if task-pull's refuse-by-name shape is copied here, and fails on the exit code if the flat read-back demands Resolved",
  "with three tasks where the second close read-back reports unresolved, the command exits non-zero, the message names that task id, the third task is still attempted, and board.json records no agreement point for the failed one — TestTaskClosePartialFailureNamesTheTaskAndKeepsGoing",
]
status        = "pending"

[[task]]
id            = "t-4"
wave          = 2
depends_on    = ["t-2"]
title         = "Close the milestone epic, entity-gated"
files         = [
  "internal/cmd/issue.go",
  "assets/prompts/milestone.md",
  "internal/cmd/issue_milestone_close_test.go",
]
description   = """
milestone-sync gains --close: it resolves the milestone entity and closes it
through closeBoardIssue only when that entity is an issue (YouTrack epic mode).
A version bundle, an agile board or a numeric forge milestone id is refused by
name with a non-zero exit, closing nothing. milestone.md's finalize step emits
the command after `dross milestone complete --finalize`. The t-2 edge is the
shared closeBoardIssue seam plus contention on internal/cmd/issue.go rather than
a capability need — the epic lane already verifies today via CloseIssueAs, so
this task would join wave 1 if the file were split.
"""
covers        = ["c-3"]
test_contract = [
  "in epic mode, `milestone-sync v1.5 --close` writes the mapped resolved State to the epic's idReadable and verifies the read-back — TestEpicCloseResolvesForReal",
  "in version mode, and on a forgejo board whose milestone id is the numeric milestone 7, --close makes no close request — the fake fails the test if any close or transition endpoint is hit — and exits non-zero naming the mode: TestMilestoneCloseRefusesANonIssueEntity, which without the gate would close forge issue #7",
  "an epic whose read-back still reads unresolved fails the command and prints no closed line — TestEpicCloseFailsWhenUnresolved",
  "`milestone-sync v1.5` without --close still only ensures the link: the fake records no state write, so the ensure path cannot start closing epics by accident",
  "milestone.md contains `dross issue milestone-sync <version> --close` positioned after the --finalize step; deleting or reordering it fails TestMilestonePromptClosesTheEpicAtFinalize",
]
status        = "pending"

[[task]]
id            = "t-5"
wave          = 2
depends_on    = ["t-2"]
title         = "Reconcile and close resolved backlog mirrors"
files         = [
  "internal/cmd/issue.go",
  "assets/prompts/ship.md",
  "internal/cmd/issue_backlog_close_test.go",
]
description   = """
After pushing the live set, syncBacklog walks board.BacklogKeys() and closes each
recorded mirror that has both left the live set and is provably resolved: a
`slug:` whose phase directory now exists, a deferred item that is dismissed, a
`[routed]` item whose target phase issue reads Resolved. The board.json key is
dropped only after a verified close; an unattributable key is warned about and
left open. ship.md's finalize step runs `dross issue backlog-sync`, whose version
argument the verb resolves from the shipping phase's spec.toml [phase].milestone
rather than from the prompt — the finalize steps carry only <phase-id>, and a
Go-side resolution is greppable and testable where prose in a prompt is not. It
no-ops for a phase with no milestone. Shares internal/cmd/issue.go with t-2, t-3
and t-4, so this wave is commit order rather than concurrency.
"""
covers        = ["c-6"]
test_contract = [
  "a `slug:x` mirror whose phase dir now exists is closed and its board.json key dropped, while the issue for a still-unscaffolded slug stays open — TestBacklogClosesScaffoldedSlugOnly",
  "a second run closes nothing: the fake counts close calls, so a non-idempotent reconcile fails",
  "a `[routed]` mirror is closed when lookupPhaseIssue's target issue reads Resolved and left open when it reads unresolved, the two cases differing only in the target's read-back — TestRoutedBacklogClosesOnlyWhenTargetResolved",
  "a dismissed deferred item is closed and unlinked rather than silently skipped, leaving the live set the same way a scaffolded slug does",
  "a recorded key for another milestone's slug — absent from this version's live set, phase not scaffolded — is left open and warned about: TestUnattributableBacklogKeyIsNeverClosed fails if the reconcile closes by set-difference alone",
  "a close whose read-back fails leaves the board.json key in place so the next run retries, since an unlinked-but-open mirror would be unreachable by every later run — TestFailedBacklogCloseKeepsTheLink",
  "invoked for a phase whose spec.toml carries [phase].milestone = \"v1.5\", the verb reconciles the v1.5 backlog; invoked for a phase whose spec carries no milestone, it exits zero having made no tracker call — TestBacklogSyncResolvesVersionFromThePhaseSpec",
  "ship.md's finalize section calls `dross issue backlog-sync`; removing the line fails TestShipPromptReconcilesTheBacklog",
]
status        = "pending"

[[task]]
id            = "t-6"
wave          = 3
depends_on    = ["t-3"]
title         = "Introduce task-complete and emit it at finalize"
files         = [
  "internal/configenum/configenum.go",
  "internal/forge/youtrack.go",
  "internal/forge/jira.go",
  "internal/forge/state_map_test.go",
  "internal/cmd/task_lifecycle.go",
  "assets/prompts/ship.md",
  "internal/cmd/ship_prompt_test.go",
  "internal/cmd/task_lifecycle_test.go",
]
description   = """
Adds `task-complete` to LifecycleStatuses, maps it to YouTrack `Verified` and
Jira `Done`, gives the board->plan inverse its one-way terminal entry, and emits
`dross issue task-sync <phase-id> --status task-complete --close` from ship.md's
finalize step after `dross phase complete`. All of it lands in one commit: the
existing divergence guard is red with any one part missing. task_lifecycle.go's
comment claiming boardStatusToPlan is a pure inversion of taskLifecycle is
updated to say why the terminal status is deliberately asymmetric. This is also
where c-2's headline claim is proved, since `task-complete` is not a valid
--status until this task adds it.
"""
covers        = ["c-2"]
test_contract = [
  "after a `--status task-complete --close` run, no mirrored task issue carries dross/status:task-in-review — the label set the patch writes carries the terminal status instead, and each card's read-back reports its provider's done verdict",
  "dropping the `task-complete` key from defaultYouTrackStateMap or defaultJiraStateMap fails the existing TestStateMapsKeyExactlyTheEmittedStatuses for that provider alone, since the two maps are checked independently",
  "adding the Set member without the ship.md line fails the existing TestEmittedStatusesAreTheLifecycleSet with \"in the Set but nothing emits it\"",
  "resolveYouTrackState(\"task-complete\", nil) == \"Verified\" and resolveJiraState(\"task-complete\", nil) == \"Done\"",
  "state_map_test.go's distinctPairs table gains `task-complete` != `task-in-review`: mapping both to the same state in either provider map fails, since c-2 turns on a card leaving the review column",
  "planStatusForLifecycle(\"task-complete\") returns done, so a card dragged to the terminal column reads back as a done task instead of as an unmirrored column",
  "lifecycleForPlanStatus(\"done\") still returns task-in-review and the existing TestTaskEdgesPairTheBoardStatusWithThePlanStatus stays green — `task-complete` never appears at a per-task execute edge",
  "ship.md emits the task close after `dross phase complete <phase-id>` and before the wrap section; swapping the two lines fails TestShipPromptClosesTaskCardsAfterPhaseComplete",
]
status        = "pending"

[[task]]
id            = "t-7"
wave          = 4
depends_on    = ["t-1", "t-4", "t-5", "t-6"]
title         = "Guard namespace and terminal-path escapes"
files         = [
  "internal/board/namespace_guard_test.go",
  "internal/cmd/board_lifecycle_divergence_test.go",
]
description   = """
Two guards. One reflects over board.Board's map-typed link fields, plants a
sentinel id in each, and asserts IsLinked reports it, so a namespace added to the
struct and not to the filter fails by field name. The other extends the existing
lifecycle divergence file with two checks: every mirror lane has a terminal
emission in assets/prompts, with the lane set derived from the same namespace
enumeration the reflection guard uses rather than hand-written; and each lane's
terminal status maps, in both provider maps, to a state none of THAT LANE's own
non-terminal statuses map to. The distinctness is deliberately per-lane: `shipped`
and `complete` both map to Jira "Done" today, a pre-existing flattening this phase
neither introduced nor covers, and a global assertion would be red on day one.
Both guards read repo source rather than a live tracker, so neither depends on
`make install` (r-01) — a manual board check during execute still would.
"""
covers        = ["c-5"]
test_contract = [
  "adding a field `Epics map[string]string` to board.Board and not wiring it into IsLinked fails TestEveryBoardNamespaceIsFiltered with \"Epics\" in the message, because the guard enumerates by reflection over map-typed fields and never by a hand-written list",
  "the reflection selects map-typed fields only, so Dismissed ([]string) and LastPull (time.Time) are skipped rather than failing the guard on day one",
  "each covered namespace populated with a sentinel makes IsLinked(sentinel) true: reverting IsLinked to phases+quicks fails on backlog, tasks and milestones by name",
  "the per-lane distinctness check reddens when `task-complete` is mapped to the same state as `task-in-review` or `task-in-progress` in either provider map, naming the provider and the collision — and stays green over the pre-existing (shipped, complete) -> \"Done\" pair, which belongs to a different lane",
  "every mirror lane has its terminal emission in the prompt corpus: deleting the phase or task `--close` line from ship.md, the `--close` line from milestone.md, the `quick --close` line from quick.md, or the `backlog-sync` line from ship.md fails TestEveryMirrorLaneHasATerminalEmission, naming the lane whose cards would now strand",
  "the lane set is derived from the namespace enumeration, not typed out: adding a sixth namespace to board.Board with no terminal emission fails this guard as well as the reflection one, so the two cannot disagree about how many lanes exist",
  "the backlog lane is checked for its reconcile call rather than a `--close` flag, since backlog_close gives that lane no flag — asserting a flag there would guard something the plan never builds",
  "every --close emission in the prompt corpus that carries a --status passes a LifecycleStatuses member, so emitting `--status bogus --close` fails at guard time rather than at runtime",
  "the guard scans a non-empty prompt corpus and a non-empty namespace set: an empty scan t.Fatal's rather than passing vacuously, matching the scanned == 0 shape the existing divergence guard uses",
]
status        = "pending"
