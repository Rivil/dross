  "all four statuses named: the prompt names measured|unmeasurable|skipped|out-of-scope — adding the Go constant without the prompt line fails; this test is the only gate, since mutation_status is absent from internal/configenum and no enum-divergence check exists",
  "non-threshold branch: \"out-of-scope\" appears in the verdict branch that does NOT apply the 0.80/0.60 cutoffs, so pasting it into the measured branch fails",
  "reads the out-of-scope list: substring assertion on `out_of_scope`, with the instruction not to re-list those survivors as phase findings (r-02's routing lives with the count NOTE and the named successor phase, not per-survivor FLAGs)",
  "origin weighting: the cross-check is told to read the in-hunk vs inherited tag when weighting a survivor",
  "report block agrees with the CLI: the §4 template carries the in-scope count alongside score, matching printVerifySummary",
  "docs no longer claim package-wide attribution: README's `dross verify` row says the score covers only the phase's changed files",
]
status        = "pending"

[[task]]
id            = "t-8"
wave          = 5
depends_on    = ["t-6"]
title         = "Regression: untouched survivor never gates"
files         = ["internal/cmd/verify_scoping_test.go"]
description   = """
End-to-end through `dross verify` over a real temp git repo with a stub adapter: mutants in
a touched file and in an untouched file of the same package.
"""
covers        = ["c-1", "c-3", "c-5"]
test_contract = [
  "attribution holds end to end: the untouched sibling's survivor appears only under out_of_scope in tests.json and produces no FLAG in verify.toml, while the touched file's survivor produces one",
  "the vacuous pass is not reachable: an adapter whose report paths match nothing in scope yields mutation_status=\"out-of-scope\" and a NOTE naming the count — never verdict inputs indistinguishable from a clean measured run",
