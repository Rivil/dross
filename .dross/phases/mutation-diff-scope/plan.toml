[[task]]
id            = "t-9"
wave          = 2
depends_on    = ["t-1"]
title         = "Make stryker-net paths repo-relative"
files         = ["internal/mutation/stryker_net.go", "internal/mutation/stryker_net_test.go"]
description   = """
Settle the .NET leg's path shape against a real stryker.NET report and make its per-file
keys and Surviving[].File repo-relative. StrykerNet.Run delegates to ParseStrykerJSON (so
it inherits t-1's per-file counters for free) but has no Workdir field and never calls
rePrefixFiles, so a solution- or project-relative shape needs a re-prefix step here.
Split out of t-1 deliberately: this is the plan's one genuine unknown and must not sit on
the critical path the whole graph blocks on. strykerNetBuildCmd is a stubbable var.
"""
covers        = ["c-4"]
test_contract = [
  "repo-relative keys: a real stryker.NET report fixture (tracked under internal/mutation/testdata/) parsed through StrykerNet.Run yields per-file keys and Surviving[].File that a repo-relative scope's Contains() matches — the vacuous outcome this pins is every C# mutant filtering out as out-of-scope and the leg scoring 0/0",
  "re-prefix parity with stryker: if the report's paths are project-relative, the applied prefix produces the same shape Stryker.rePrefixFiles yields for its Workdir case, so t-4's adapter-agnostic table treats both legs identically",
  "no regression when already repo-relative: a report whose paths are already repo-relative passes through unchanged rather than being double-prefixed",
]
status        = "pending"
