  covers = ["c-4"]
  depends_on = ["t-2"]
  test_contract = ["if a file gains a .dross write with no registry line, TestEveryDrossWriterIsDeclared fails naming it — the live walk resolves ≥ 30 writer files and every one is in Writers()", "if a MachineLocal claim is false, TestMachineLocalWritersAreReallyIgnored fails — for each MachineLocal entry, `git check-ignore -q .dross/<path>` exits 0 in a temp repo seeded by ensureDrossGitignore + the security/quality/techdebt scaffolds; remove handoff.md from the seeded ignore block and its entry fails", "if the walker filters an artifact name out (e.g. by extension), TestEveryScannedArtifactIsReached fails — for each UnderDross artifact name (board.json, changes.json, spec.toml, plan.toml, verify.toml, tests.json, survivors.toml, deferred.toml, milestones/*.toml, rules.toml, project.toml, red-proof docs, watch.state.json, panel/*.md …), one concrete instance at a plausible depth holding a synthesized token, git add → scanDrossArtifacts reports ≥ 1 finding AT that path, in BOTH the git and non-git walker modes", "if an OutsideDross entry actually lands under .dross, TestOutOfScopeEntriesAreNotUnderDross fails — ARCHITECTURE.md, telemetry.jsonl, defaults.toml … must not resolve to a path under .dross/", "if the residual arm cannot see a write verb, TestWriterScanTripsOnTheFixture fails — unregistered_writer.go.txt with an os.WriteFile in an undeclared file name is flagged; its second func using os.ReadFile only is not", "if a declared writer file is deleted, TestStaleWriterDeclarationFails fails — a synthetic entry naming internal/nothing/here.go is reported by the stale arm; agent-authored entries are exempt from resolution", "if a new persisted artifact name has no registry line, TestEveryFileConstIsDeclared fails — every `*File = \"…\"` const under internal/ (15 today) matches an artifact name in some Writers() entry"]
  status = "pending"

[[task]]
  id = "t-8"
  wave = 4
  title = "Self-scan the tree; pin the marker set"
  files = ["internal/cmd/secretscan_selfscan_test.go", "internal/cmd/env_test.go", "internal/cmd/hermetic_env_test.go", "internal/forge/hostallow_test.go", "internal/forge/hostile_config_test.go", "internal/argfence/policy.go", "internal/security/gitleaks_test.go", ".dross/phases/scanner-self-exclusion/panel/risk.md", ".dross/phases/scanner-self-exclusion/panel/synthesis.md"]
  description = "Append ` // dross:allow-secret` (Go) or ` dross:allow-secret` (md) to the lines that are genuinely secret-shaped fixtures and that t-1's rules fire on: env_test.go:31 (FORGEJO_TOKEN fixture), hermetic_env_test.go:146 (absent-token sentinel), hostallow_test.go:25, hostile_config_test.go:60 (sentinel tokens), argfence/policy.go:69 (`Token: \"--end-of-options\"` — exactly 16 chars, entropy 3.08), gitleaks_test.go:86-87 (password/token-context 16-hex rows), and the two scanner-self-exclusion panel notes carrying the same rows. The AWS placeholder sites (8 lines, 4 files) need no marker (t-1's EXAMPLE carve-out); the four `\"Bearer \"+c.token` prod lines need none either (t-1's auth-header value class). If the self-scan surfaces anything else — including this phase's own panel/ notes and REVIEW.md — the fix is a marker on that line or a carve-out with a benign-corpus entry, never a rule deletion. A \"silencing marker\" throughout means: the line hits when the marker is stripped; the `const AllowMarker` in secretscan.go, the remedy line in Report(), and ship.go's refusal message are INERT markers (nothing to silence) and are excluded from every marker assertion by that definition, not by name. The self-scan test runs `git ls-files -z` at the repo root (skip with a message if not a git checkout), scans every tracked file through secretscan.Scan, asserts zero hits; a second assertion collects the silencing markers and compares the multiset of basename → count against a pinned table. TestValidateOnDrossItself is hermetic: it runs `runCmd(Validate())` inside a `git clone --no-hardlinks` of the repo's HEAD into t.TempDir() (tracked set only, no working-tree scratch), so untracked panel/ notes or an uncommitted REVIEW.md cannot turn it red."
