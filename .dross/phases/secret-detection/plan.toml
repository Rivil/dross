[[task]]
  id = "t-5"
  wave = 3
  title = "Gate auto-commit and ship pre-flight"
  files = ["internal/cmd/cleantree.go", "internal/cmd/ship.go", "internal/cmd/secretscan_gate_test.go"]
  description = "autoCommitDrossDirt calls scanDrossArtifacts(repoDir) BEFORE `git add .dross` and returns *secretscan.ErrHit wrapped as `refusing to auto-commit .dross: …` on a hit — the primitive that turns an untracked note into a commit is the one that refuses, which also covers phase complete / record completion / phase start / milestone prune. ship.go: a new pre-flight step at the top of \"3) Pre-flight gates\" (before the verdict switch, before the --print-body/--no-push returns, before repointDoomedRedProofs/autoCommitDrossDirt) calls scanDrossArtifacts(repoDir) — the repo root ship.go already holds at :98, not `root` — and refuses with `secret in tracked .dross artifact — fix it by hand or mark the line dross:allow-secret, then re-run ship`, so a CLEAN tree with an already-committed token still refuses. Ship calls the shared scanner, not the whole `dross validate` — recorded as the `ship_gate_scope` decision in spec.toml: pulling all of validate into ship would newly fail ships on schema problems. internal/cmd tests gate on `dross test` (remote), never --local."
  covers = ["c-3"]
  depends_on = ["t-2"]
  test_contract = ["if the ship gate lives only inside autoCommitDrossDirt, TestShipRefusesCommittedSecretOnCleanTree fails — shipFixture + shipMockFlow with a verified phase whose `.dross/phases/p/notes.md` carrying a synthesized token is COMMITTED (tree clean) → `dross ship p` errors naming `notes.md:<line>` before any push: the mock provider records zero requests AND the origin bare repo has no phase/p ref", "if the scan is reordered after `git add`, TestAutoCommitRefusesUntrackedSecretNote fails — untracked `.dross/phases/p/notes.md` with a token; autoCommitDrossDirt(repoDir, \"shipping\") errors, `git status --porcelain` still lists the note as untracked, `git log` has no new chore(dross) commit", "if the secret check pre-empts the existing code-dirt refusal, TestAutoCommitStillRefusesCodeDirtFirst fails — dirty main.go plus a secret note → the error is the existing dirtyTreeError; with only the note → the secret refusal", "if the cleantree placement does not reach non-ship callers, TestPhaseCompleteRefusesOnSecret fails — `dross phase complete p` on a repo whose `.dross/phases/p/changes.json` carries a token → refused, state.json unchanged, no completion event recorded", "if --print-body returns before the scan, TestShipPrintBodyStillScans fails — `dross ship p --print-body` with the committed-secret fixture errors instead of printing the body", "if the ship gate is placed after the commit or push, TestShipGateOrderingIsBeforeAutoCommit fails — AST over ship.go's RunE: the scanDrossArtifacts call has a lower token.Pos than autoCommitDrossDirt and than every pushPhaseBranch/ship.OpenPR call", "if validate and ship drift onto two scanners, TestShipAndValidateShareOneScanner fails — AST over validate.go, ship.go, cleantree.go: each calls scanDrossArtifacts; a second inline walk or a second secretscan.Scan call in any of the three files fails"]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 3
  title = "Transport registry + residual scan"
  files = ["internal/secretscan/sinks.go", "internal/secretscan/sinks_test.go", "internal/cmd/secretscan_transport_enum_test.go", "internal/cmd/testdata/secretscan/leaky_transport.go.txt"]
  description = "sinks.go: `Transport{Package, Func, Screened *Screened{Call string}, ReadOnly *ReadOnly{Why}, Seam *Seam{ScreenedCaller string}}` — exactly one disposition non-nil — and `Transports()` listing the TEN outbound seams: forge.(*Client).doRaw, forge.(*GitHubClient).doRaw, forge.(*JiraClient).doRaw, forge.(*YouTrackClient).doRaw, ship.jsonPost, ship.bbRequest, ship.gitlabReq (Screened, Call = ScanPayload), ship.screenedGH (Screened, Call = ScanArgv), ship.jsonGet (ReadOnly: method literal \"GET\", nil body), ship.ghCommand (Seam: the exec.Command primitive lives in a func literal bound to the package var `ghCommand` at open.go:69 with no enclosing FuncDecl; ScreenedCaller = \"ship.screenedGH\"). `Validate([]Transport) []error` in the toolfence shape. The enum test walks ../ship and ../forge non-test files for every call to http.NewRequest, http.NewRequestWithContext, http.Post, http.Get, (*http.Client).Do, exec.Command, and the ghCommand identifier; the enclosing FUNCTION of each site is the FuncDecl it sits in, or — for a FuncLit that is the initialiser of a package-level var — that var's name. Each must be a registered Transport; Screened must contain a secretscan.ScanPayload/ScanArgv call whose Pos() precedes the request call; ReadOnly must have a literal \"GET\" method and nil body; Seam must have its named ScreenedCaller registered as Screened and be the ONLY function that references the seam identifier as a call (t-4's TestNoRawGhCommandCallOutsideTheSeam folds in here). Stale arm: every registered Func resolves to a FuncDecl or a package-level var."
  covers = ["c-4"]
  depends_on = ["t-3", "t-4"]
  test_contract = ["if a new egress site is added unregistered, TestEveryOutboundSeamIsRegistered fails naming file:line — over the live tree the walk resolves ≥ 10 transport sites across BOTH ../ship and ../forge (per-package vacuity floor) and reports none undeclared; add http.Post(…) anywhere in ship or forge and this fires", "if the walker cannot attribute a FuncLit-bound primitive, TestEveryOutboundSeamIsRegistered fails on open.go:69 — the exec.Command call inside the `ghCommand` var initialiser resolves to Transport ship.ghCommand (Seam), not to an undeclared site; the leaky fixture gains case (f): a package var bound to a FuncLit calling exec.Command with no Seam entry, which must be flagged", "if a screen is moved after its request, TestScreenPrecedesRequestInEveryScreenedTransport fails naming the function — for each Screened entry, Pos(ScanPayload|ScanArgv call) < Pos(http.NewRequest | ghCommand call) inside that FuncDecl", "if a Seam entry names a ScreenedCaller that is not registered as Screened, or a second function calls the seam identifier, TestSeamHasExactlyOneScreenedCaller fails naming the function — Validate rejects a Seam with empty ScreenedCaller; the AST arm requires the only call expression whose callee is `ghCommand` to sit inside `screenedGH`", "if jsonGet starts sending a body, TestReadOnlyTransportsSendNoBody fails — its http.NewRequest call must have a \"GET\" literal first arg and nil third arg", "if the residual arm is calibrated on the post-fix tree instead of a known answer, TestTransportScanTripsOnTheLeakyFixture fails — leaky_transport.go.txt holds (a) POST with no screen, (b) screen AFTER the request, (c) clean screened func, (d) ghCommand( outside screenedGH, (e) GET/nil declared ReadOnly, (f) FuncLit-bound exec.Command with no Seam entry; the scan must flag a, b, d, f and pass c, e", "if a registered func is renamed away, TestStaleTransportDeclarationFails fails — a registry entry naming a func or package var that does not exist is reported by the stale arm (fed synthetically)", "if Validate accepts a malformed entry, TestTransportRegistryValidate fails — synthetic entries with no disposition, two dispositions, empty Func, empty ReadOnly.Why, empty Seam.ScreenedCaller, and a duplicate each produce one specific error; the real registry produces none", "if the registry silently shrinks, TestPublishSinkFuncsAreQualified fails — every Func is pkg.Recv.Method, pkg.func or pkg.var over exactly {ship, forge}; count is 10"]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 3
  title = "Writer/artifact registry + residual scan"
  files = ["internal/secretscan/writers.go", "internal/cmd/secretscan_writer_enum_test.go", "internal/cmd/testdata/secretscan/unregistered_writer.go.txt"]
