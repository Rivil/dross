  description = "Wiring only. Insert `if err := secretscan.ScanPayload(method+\" \"+endpoint, body); err != nil { return err }` as the FIRST statement of (*Client).doRaw (forge.go:837), (*GitHubClient).doRaw (github.go:368), (*JiraClient).doRaw (jira.go:689), (*YouTrackClient).doRaw (youtrack.go:927), ahead of the encoder and http.NewRequest. The wrapping `do` still applies redact.Err. Four one-line edits cover CreateIssue, UpdateIssue, EnsureMilestone(Entity), labels, comments and every future method.\n"
