[[task]]
  id = "t-1"
  wave = 1
  title = "Build secretscan rules, scanner, echo-free report"
  files = ["internal/secretscan/rules.go", "internal/secretscan/secretscan.go", "internal/secretscan/payload.go", "internal/secretscan/secretscan_test.go"]
  description = "New package. rules.go: fixed table of `Rule{Name, Regex, Prefix}` — github (ghp_/gho_/ghu_/ghs_/ghr_ + 36, github_pat_ + 22..), gitlab (glpat- + 20), atlassian (ATATT + 20..), aws (AKIA|ASIA + 16 upper/digit, carve-out: match ending `EXAMPLE`), slack (xox[abprs]- + 10..), openai/anthropic (sk- optional proj-/ant- + 20..), pem (BEGIN…PRIVATE KEY header line, reported once at the BEGIN line), authorization-header (`authorization` then Basic|Bearer then ≥8 value chars drawn from the SAME value class as key-context — `$`, `<>`, `\"` and `+` outside it, so `\"Bearer \"+c.token` (forge.go:863, github.go:386, youtrack.go:944, ship/gitlab.go:228) and `Bearer <token-from-auth_env>` never match), key-context (key ending in password|passwd|pwd|secret|api_key|access_key|token|authorization, `:` or `=`, value ≥16 chars of `[A-Za-z0-9+/=_.~@!#%^*-]` — `$` and `<>` outside the class so `$GITHUB_TOKEN` and `<your-token>` never match — Shannon entropy ≥ 3.0 bits/char, and the line does NOT match `security.IdentityIDAllowlist`). secretscan.go: `const AllowMarker = \"dross:allow-secret\"`; `Scan(name string, r io.Reader) ([]Hit, error)` line-oriented over `bufio.Reader.ReadBytes('\\n')` (no 64 KB ceiling; CRLF tolerated); a line containing AllowMarker yields no hits; `Hit{Rule, Location, Line, Length, Prefix}`; `(Hit) String()` = `<rule> at <location>:<line> (len=<n>, prefix=<fixed>)`; `Report(hits)` adds one remedy line naming AllowMarker; `ErrHit` typed error carrying `[]Hit` whose `Error()` is `Report`. Prefix is the RULE's fixed literal (ghp_, AKIA, Bearer, -----BEGIN), never bytes of the match; key-context hits carry an empty prefix. payload.go: `ScanPayload(surface string, body any) error` — json.Marshal then json.Unmarshal into `any`, walk every string leaf through `Scan(surface+\":\"+jsonPath, …)`, return `*ErrHit` on the first non-empty hit set, nil body → nil; `ScanArgv(tool string, args []string) error` scans each element with location `<tool> <preceding --flag>` when there is one, else `<tool> argv[i]`. Both pure, so t-3/t-4 are wiring only. Hit corpus is BUILT AT RUNTIME (`\"ghp_\" + strings.Repeat(\"A1b2\", 9)`), never a literal token shape — otherwise t-8's self-scan trips on the tests that prove c-1."
  covers = ["c-1", "c-5"]
  test_contract = ["if a rule is added without a corpus entry, or a regex edit stops matching its own shape, TestEveryRuleHasAHitCase fails — the set of rule names equals the hit-corpus map's key set, and each key's runtime-built line yields exactly one Hit whose Rule equals the key", "if any benign shape fires, TestBenignCorpusZeroHits fails naming row and rule — runtime-built rows: 16-hex under `\"key\":`/`id =`/`\"Key\":`, a bare 40-hex SHA and one under `sha = `, a UUID bare and under `id = `, a 60-char base64 run under `\"snippet\":` and `expected =`, `auth_env = \"GITHUB_TOKEN\"`, `token = \"$GITHUB_TOKEN\"`, `Authorization: Bearer <token>`, `[redacted $GITHUB_TOKEN]`, the AWS doc placeholder ending EXAMPLE, a 21-char repetitive value (entropy < 3.0) under `password =`, a 15-char value under `secret =`", "if a carve-out is dead rather than doing work, TestCarveOutsAreNotVacuous fails — each benign carve-out row's one-char mutation DOES fire: 17-hex under `\"key\":` fires key-context, AKIA+16 not ending EXAMPLE fires aws, the repetitive password with entropy pushed ≥3.0 fires", "if the identity carve-out is value-only instead of key-aware, TestKeyContextIdentityCarveOutIsKeyAware fails — `\"password\": \"<16hex>\"` and `token = \"<16hex>\"` DO hit; `\"key\": \"<16hex>\"` does not (pins reuse of security.IdentityIDAllowlist)", "if a PEM block reports per line, TestPEMBlockReportedOnceAtBeginLine fails — a 5-line PEM block gives one Hit, at the BEGIN line", "if the marker silences more or less than its own line, TestAllowMarkerSilencesOnlyItsLine fails — 3-line reader with a synthesized github token on lines 1 and 3 and the marker on line 1 only reports line 3; a marker on a line with two shapes silences both; a marker on the line ABOVE a hit changes nothing; a marker on a clean line changes nothing", "if the scanner uses a bufio.Scanner with the default buffer, TestLongLineIsScannedToTheEnd fails — a single 200 KB line with a synthesized github token in its last 60 bytes is reported at :1", "if any report path prints the match or the line, TestReportNeverEchoesTheValue fails on every iteration — property over 50 random values per rule: the concatenation of Hit.String(), Report() and ErrHit.Error() contains no 6-byte window of the value's variable part; the fixed prefix must be present for prefix rules; key-context reports contain `prefix=` followed by nothing", "if the location format drifts, TestHitLocationIsFileLine fails — Scan(\"notes.md\", …) with the token on line 7 yields Location==\"notes.md\", Line==7, and String() contains `notes.md:7`", "if the payload walk stops at the top level, TestScanPayloadWalksNestedLeaves fails — ScanPayload(\"POST /issue\", nested map with the token at fields.description.content[0].text) reports that json path; a struct body with a json-tagged Body field is reported under the tag name; ScanPayload(\"x\", nil) is nil; []string{\"clean\", \"<token>\"} reports `x:[1]`", "if argv locations lose the flag name, TestScanArgvNamesTheFlag fails — ScanArgv(\"gh\", [pr create --title t --body \"l1\\n<token>\"]) reports `gh --body:2`; a token in a positional after `--` reports `gh argv[3]`", "if the auth-header value class admits `\"`, `<`, `+` or `$`, TestBenignCorpusZeroHits fails on its two auth-header rows — `\"Bearer \"+c.token` and `Bearer <token-from-auth_env>` (both ≥8 chars after the scheme, so length alone proves nothing); the hit corpus row `Bearer ` + 24 runtime-built base64 chars still fires"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 2
  title = "Walk .dross artifacts; fail validate on hit"
  files = ["internal/cmd/secretscan.go", "internal/cmd/validate.go", "internal/cmd/secretscan_scope_test.go"]
  description = "Signature pinned: `scanDrossArtifacts(repoDir string) ([]secretscan.Hit, error)` takes the REPO root (the parent of .dross), never the .dross dir — validate.go passes `filepath.Dir(root)`, ship.go passes `repoDir`, cleantree.go already has `repoDir`; t-5's shared-scanner AST test requires the same callee in all three files. `listDrossArtifacts(repoDir) ([]string, error)`: when `git rev-parse --is-inside-work-tree` succeeds (run in repoDir), `git ls-files -z --cached --others --exclude-standard -- .dross` (tracked PLUS stageable-untracked, .gitignore honoured); otherwise `filepath.WalkDir(filepath.Join(repoDir, \".dross\"))` over every regular file. Each returned path is repo-relative and `.dross/`-prefixed. scanDrossArtifacts opens each via `pathfence.Contain(filepath.Join(repoDir, \".dross\"), \"dross-artifact\", relUnderDross)` and streams it through `secretscan.Scan` with the `.dross/`-prefixed repo-relative path as the Hit location; a read or scan error is a refusal, not a skip. validate.go: after the phase loop, every hit's String() is appended to `problems` under a `secret:` prefix so the existing ✗/exit-1 path fires. internal/cmd tests gate on `dross test` (remote), never --local."
  covers = ["c-3"]
  depends_on = ["t-1"]
  test_contract = ["if the non-git fallback walk or the location format breaks, TestValidateRefusesOnArtifactSecret fails — temp dir (no git), Init(), `.dross/phases/p/notes.md` (a path validate hand-lists nowhere) with a synthesized gitlab token on line 4 → runCmd(Validate()) errors, output contains `gitlab-pat at .dross/phases/p/notes.md:4 (len=` and no 6-byte window of the token", "if --others or --exclude-standard is dropped from the git enumeration, TestScopeIsTrackedPlusStageable fails — temp git repo with the seeded gitignore; tracked `.dross/board.json` clean, UNTRACKED `.dross/notes.md` with a token, IGNORED `.dross/security/run1/gitleaks.json` with a token → exactly one hit, at `.dross/notes.md`", "if the marker is not honoured inside toml, TestValidateAllowMarkerHonouredInToml fails — `.dross/phases/p/spec.toml` line `text = \"<synth token>\" # dross:allow-secret` → validate exits 0 with no `secret:` line; the same file without the marker fails", "if an unreadable artifact is skipped instead of refused, TestScanErrorIsARefusalNotASkip fails — a `.dross/x.toml` with mode 000 (skipped on Windows) → validate reports `secret scan: … permission denied` as a problem rather than exiting 0", "if the scan is short-circuited by an earlier problem, TestValidateSecretProblemsAreLast fails — a malformed spec.toml AND a token in another phase → both problems print"]
  status = "pending"

