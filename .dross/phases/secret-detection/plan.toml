  depends_on = ["t-1"]
  test_contract = ["if the screen moves after http.NewRequest/client.Do, TestCreateIssueRefusedBeforeRequest fails — ×4 backends against an httptest server counting requests: CreateIssue(IssueInput{Body: \"line1\\n<synth atlassian token>\"}) returns an error that errors.As a *secretscan.ErrHit naming `atlassian-token` and `:body` (forge/github/youtrack) or `:fields.description` (jira, inside ADF), and the request counter is 0", "if a body patch bypasses the screen, TestUpdateIssueBodyPatchRefused fails — ×4: UpdateIssue(key, IssuePatch{Body: &tok}) → refused, 0 requests; UpdateIssue with clean Labels only → the request goes out", "if a publish path with no Body field escapes, TestEnsureMilestoneDescriptionRefused fails — YouTrack EnsureMilestoneEntity(\"epic\", \"v9\", \"<synth pem header line>\") and Jira EnsureMilestoneEntity(\"version\", …) refused with `pem-private-key`, 0 requests", "if the gate breaks ordinary board sync, TestBoardPublishBenignBodyPosts fails — renderPhaseBody-shaped text carrying a 16-hex identity id, a 40-hex SHA and a UUID posts (counter == 1) on every backend", "if a nil body is rejected or mutated, TestDoRawNilBodyIsUntouched fails — GET paths pass through with counter == 1", "if the screen reads responses, TestGetAndListAreNotScreened fails — GetIssue/ListIssues against a server whose RESPONSE body carries a synthesized token succeed and return the issue", "if the refusal echoes the value after redact.Err wrapping, TestPayloadErrorNeverEchoes fails — err.Error() from each backend (the string that would reach telemetry err_detail) contains no 6-byte window of the token's variable part"]
  status = "pending"

