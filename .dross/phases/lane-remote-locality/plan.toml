[phase]
id = "lane-remote-locality"

[[task]]
id            = "t-1"
wave          = 1
title         = "Derive lane toolchain, field and validate rule"
files         = [
  "internal/project/project.go",
  "internal/testlane/toolchain.go",
  "internal/testlane/toolchain_test.go",
  "internal/cmd/validate.go",
  "internal/cmd/validate_lane_test.go",
]
description   = """
Add `Toolchain []string` to project.TestLane carrying BOTH tags with matching omitempty —
`toml:"toolchain,omitempty" json:"toolchain,omitempty"` — because
TestTomlFieldsCarryMatchingJSONTags walks project.Project transitively and fails a
toml-tagged field whose json tag is absent or differs. New pure
`testlane.Toolchain(command, prepare string, override []string) []string` — first
whitespace token of command then prepare, deduped in that order, replaced WHOLESALE by
override when non-empty. Add a `laneToolchainProblems` arm to laneProblems.
"""
covers        = ["c-7"]
test_contract = [
  "if the derivation order breaks, a test asserting prepare `make build` + command `go test ./...` derives exactly [go make] fails — command token first, prepare second; deriving from the command alone fails it",
  "if override is appended rather than replacing, a test asserting override [\"mise\"] over a `go` command returns exactly [mise] fails — an append implementation returns [mise go]",
  "if dedupe breaks, prepare `go build ./...` + command `go test ./...` returns [go] twice and the length assert fails, doubling the `command -v` count the run pays for",
  "if the blank-token guard breaks, Toolchain(\"  \", \"\", nil) returns [\"\"] rather than an empty slice and the test fails — a blank token probes `command -v \"\"` and reports every lane as missing its toolchain",
  "if the first-token rule is quietly widened, a test asserting `FOO=1 go test ./...` derives `FOO=1` verbatim fails — the locked toolchain_source rule is first-token, and t-4/t-5 flag the token rather than stripping it",
  "if laneToolchainProblems is missing or wrong, tests asserting `toolchain = [\"\", \"go\"]` and `toolchain = [\"go test\"]` each produce a problem line naming the lane fail, and a lane with no toolchain key producing no problem line fails",
  "if omitempty is dropped, a test saving a project.toml with no `toolchain` key and comparing bytes fails — every existing repo's file must be unchanged",
]
status        = "pending"

[[task]]
id            = "t-2"
wave          = 2
depends_on    = ["t-1"]
title         = "Decide per-lane locality from one probe"
files         = [
  "internal/cmd/lane_locality.go",
  "internal/cmd/lane_locality_test.go",
  "internal/cmd/test.go",
  "internal/cmd/test_lane_consent_test.go",
]
description   = """
Add exitToolchainMissing with its exitRank arm and a toolchainFailure constructor that
carries the remote host AND the local-absence fact, so it can render locked local_absence's
"neither host has <tool>" wording rather than naming one side. Give resolveTestTarget a `tools []string` parameter returning the resulting
remote.Readiness alongside the target, so the lane union rides the EXISTING preflight
probe — one pass, no second ssh. New pure laneLocality(lanes, missing, lookPath) returning
per lane remote / local-with-reason / refused, plus the announcement lines. runTest passes nil.
"""
covers        = ["c-2", "c-4", "c-5", "c-9"]
test_contract = [
  "if the new code is ranked wrongly, a test asserting exitRank(exitToolchainMissing) > exitRank(exitSuiteFailed) AND < exitRank(exitPrepareFailed) fails — either inequality flipped fails it",
  "if the renumber disturbs the existing taxonomy, a table-driven test over all six pairs of transport > partial > prepare > red > refused > nothing-measured fails",
  "if worseOutcome mis-folds, a test asserting worseOutcome(red-lane err, toolchain-missing err) returns the toolchain-missing one fails — a lane that never ran must not be hidden by a neighbour's red",
  "if toolchainFailure's wording regresses, a test asserting its message names the tool AND both hosts, contains no \"test suite failed\", and ExitCode is 8 rather than 1 fails",
  "if the probe is issued per lane, a test asserting the recording probe seam is called exactly ONCE for the whole run with the union as its tools argument fails — a per-lane implementation calls it twice",
  "if two lanes needing `go` are not deduped into the union, a test asserting a single `command -v go` on the recording probe seam fails",
  "if the probe moves after the sync, a test asserting the probe call is recorded strictly BEFORE the first rsync argv by INDEX fails — asserting presence alone would still pass",
  "if the transport and toolchain paths are conflated, a test where the probe returns remote.ErrTransport asserting the existing preflight fallback (Fallback set, Why naming the host) AND zero per-lane toolchain lines fails — the c-5 split, asserted on both fields",
  "if local absence is not consulted, a test where a tool is missing on the remote and the injected lookPath also rejects it, asserting the lane's refused verdict carries exitToolchainMissing rather than a local spawn, fails",
  "if prepare and command tools are split, a test where a lane's PREPARE tool is missing but its command tool is present, asserting the lane comes back local in full, fails (locked prepare_toolchain)",
  "if the announcement drops a field, a test asserting the fallen-back lane's line names the lane, the binary and the host in one line fails — a line missing any of the three fails it",
  "if the c-9 local path is missing, a test with target nil asserting lookPath is still consulted per lane and a lane whose tool is absent comes back refused carrying exit 8 fails",
  "if --local starts probing the remote, a test asserting the remote probe seam records zero calls when target is nil fails",
  "if the lane-less path regresses, a test asserting `dross test` with no lanes still calls resolveTestTarget with an empty tool list fails — the lane-less repo's transcript must be unchanged",
]
status        = "pending"

[[task]]
id            = "t-3"
wave          = 3
depends_on    = ["t-2"]
title         = "Wire per-lane locality into runTestLanes"
files         = [
  "internal/cmd/test.go",
  "internal/cmd/lane_locality_wiring_test.go",
]
description   = """
Compute the tools union from `runnable` after the consent loop, pass it to
resolveTestTarget, apply laneLocality's plan: sync only when at least one lane stays
remote, per-lane target through runLanePrepare/runOneLane, fold refusals through
worseOutcome.
"""
covers        = ["c-1", "c-2", "c-3", "c-4", "c-6", "c-9"]
test_contract = [
  "if the sync is not skipped, a test where every matched lane falls back asserting the recording sync seam records ZERO calls fails — one rsync fails it (c-4's \"never pays for the transfer\")",
  "if the skip is over-eager, a test where only ONE lane's tool is missing asserting the rsync argv IS recorded exactly once fails — a partial fallback must not suppress the sync the remote-going lane still needs",
  "if the announcement lands late, a test asserting lane A's fallback line appears BEFORE its `lane A prepare:` line and before its `lane A: <cmd>` header, by INDEX rather than presence, fails (c-2)",
  "if a fallen-back lane's own result is not reported, a test where lane A falls back and its LOCAL suite goes red asserting the run exits 1 naming lane A — not 3 — and the transcript contains no remote \"command not found\" for A, fails (c-1)",
  "if locality is decided per run rather than per lane, a test in one invocation where the remote has go and not pnpm asserting spawnRemote records the go lane's line and spawnLocal the pnpm lane's, each exactly once, and both suite results reach worseOutcome, fails (c-3)",
  "if a fallback is made sticky, a test asserting .dross/local.toml and .dross/project.toml are byte-identical before and after a fallen-back run, and that a second run with the tool now present spawns that lane remotely with no intervening command, fails (c-6)",
  "if a neither-host lane is allowed to spawn, a test asserting it reaches NEITHER spawn seam, its message contains \"neither\", the run exits 8 rather than 1, and it is not counted as a selector miss, fails — a miss would sink it to nothing-measured",
  "if the sync-skip rule is keyed on the wrong condition, a test where the probe returns remote.ErrTransport with lanes declared fails: it asserts the existing preflight fallback line is BYTE-IDENTICAL to today's, every lane spawns locally, and NOT ONE per-lane toolchain line prints for a host that was never reached (c-5's whole-run-local half, which t-2 can only assert on a return value)",
  "if the c-9 local refusal is not wired, a test with no remote granted asserting a lane whose derived tool is absent from the injected lookPath reaches neither spawn seam and exits 8 fails, while a lane whose tool is present still runs exactly as today",
]
status        = "pending"

[[task]]
id            = "t-4"
wave          = 2
depends_on    = ["t-1"]
title         = "Add --toolchain to lane add, edit and list"
files         = [
  "internal/cmd/test_lane.go",
  "internal/cmd/test_lane_toolchain_test.go",
]
description   = """
Repeatable --toolchain (StringArrayVar) on `lane add` and `lane edit` — edit's "nothing to
change" gate now accepts either flag, keyed on Flags().Changed. `lane list` prints
`toolchain:` for EVERY lane, marked derived or overridden. Validated through t-1's
laneToolchainProblems before the write, quoted the way laneSelectorRefusal quotes
laneSelectorProblems, so the CLI can never write what validate rejects.
"""
covers        = ["c-7"]
test_contract = [
  "if flag order or round-tripping breaks, a test asserting `lane add x --command \"go test\" --toolchain go --toolchain make` writes toolchain = [\"go\",\"make\"] in flag order and project.Load round-trips both fails",
  "if the validate quote is missing, a test asserting `lane add x --toolchain \"\"` is refused and project.toml is byte-identical afterwards — compared as bytes, not a reparse — fails",
  "if non-binary tokens are accepted, a test asserting `--toolchain \"FOO=1\"` and `--toolchain \"./x\"` are refused fails — either would pin a lane to local on every future run with no message pointing at the cause",
  "if list only prints declared overrides, a test asserting `lane list` prints `toolchain: go (derived)` for an unoverridden lane AND `toolchain: mise (overridden)` for an overridden one — both lines present — fails, because c-7 is about inspecting the effective set",
  "if Toolchain is folded into laneConsentLine, a test asserting `lane edit x --toolchain go` leaves match, command, prepare and index identical AND leaves the grant GRANTED — LaneConsented returns the same state before and after — fails as stale",
  "if the Changed guard is replaced by an emptiness check, a test asserting `lane edit go --prepare \"make build\"` with no --toolchain leaves an existing toolchain list byte-identical fails",
  "if clearing is not supported, a test asserting `lane edit x --toolchain \"\"` clears the override back to derived fails",
  "if the no-op gate is not widened, a test asserting `lane edit x` with neither --prepare nor --toolchain refuses and names BOTH flags fails",
  "if the help text goes stale, a test asserting `lane edit`'s Long names --toolchain and no longer claims \"Only prepare is editable\" fails — the docs test only checks docs→registered-flags, so a stale Long would otherwise survive every test in this plan",
]
status        = "pending"

[[task]]
id            = "t-5"
wave          = 3
depends_on    = ["t-1", "t-3"]
title         = "Report lane toolchains in doctor Remote section"
files         = [
  "internal/cmd/doctor.go",
  "internal/cmd/doctor_lane_toolchain_test.go",
]
description   = """
checkRemoteMutation probes the mutation tools UNION every declared lane's toolchain
(testlane.Toolchain, the same function the run uses) through the same remoteProbeFn call,
and prints one row per lane naming its tools and which the host lacks. Each missing tool is
attributed to the lane(s) or adapter(s) that wanted it before printing, so a lane tool never
falls into the adapter loop and prints an empty needBy name.
"""
covers        = ["c-8"]
test_contract = [
  "if the lane rows are missing or unattributed, a test with lanes go and web and a fake probe reporting pnpm missing, asserting doctor prints a row for web naming the lane, `pnpm` and the host, and a row for go reporting its toolchain present, fails",
  "if a lane's gap is counted as an issue, a test asserting the issue count is UNCHANGED by lane rows while an adapter's missing tool still increments fails — a lane that falls back still runs and still reports its own result",
  "if doctor asks its own question, a test asserting remoteProbeFn is called ONCE and its tools argument contains the adapter tool and both lanes' tools fails — a second probe is the drift c-8's \"never disagree\" clause forbids",
  "if doctor re-derives rather than reusing testlane.Toolchain, a test calling both in one test and asserting doctor's derived set for a lane EQUALS testlane.Toolchain for that lane fails",
  "if doctor and the run diverge, a test driving one fake probe fixture through both doctor and a `dross test --files` run, asserting the binary doctor names missing is the binary the run's fallback line names, fails",
  "if the lane-less output regresses, a test asserting a repo declaring NO lane prints no lane row and the existing \"✓ <host> reachable — workdir <w>, N cores\" line is byte-identical as a golden string fails, and with no grant the \"no remote granted\" advisory is unchanged and still not an issue",
  "if a non-binary derived token is not surfaced, a test asserting a lane whose DERIVED token is `FOO=1` is named with the `--toolchain` fix fails — the locked first-token rule must not strand a lane silently",
]
status        = "pending"

[[task]]
id            = "t-6"
wave          = 4
depends_on    = ["t-3", "t-4", "t-5"]
title         = "Document toolchain flag, fallback and exit 8"
files         = [
  "README.md",
  "assets/prompts/options.md",
  "assets/prompts/execute.md",
  "internal/cmd/lane_toolchain_docs_test.go",
]
description   = """
Extend README's `dross test lane` and `dross test` rows with --toolchain, the per-lane
fallback and exit 8; extend options.md's test-lane section the same way; add 8 to
execute.md's exit-code list and its summary sentence. Run `make install` before relying on
the prompt change (rules.toml r-01).
"""
covers        = []
test_contract = [
  "if README drifts, a readme_doc_test-style test fails when README's `dross test lane` row does not mention `--toolchain`, or when the `dross test` row's exit-code list does not carry `8` and the string \"neither\" — mirroring options_docs_test.go's existing \"does not name exit 7\" assertion",
  "if options.md drifts, an options_docs_test-style test fails when options.md's test-lane section does not name `--toolchain` AND the phrase distinguishing a toolchain fallback from an unreachable host",
  "if execute.md's remedy oversteps, a test asserting execute.md lists 8 with a remedy containing no install verb fails — installing the binary is the deferred remote-toolchain-install phase, not this one",
  "if a future exit code ships undocumented, a table-driven test over {1,2,3,4,5,6,7,8} asserting every exit const in test.go appears in execute.md's list fails",
  "if execute.md's summary line goes stale, a test asserting the sentence at assets/prompts/execute.md:214 — \"2, 3, 4, 5, 6 and 7 all mean the run did not happen\" — names 8 too fails; the table-driven test above passes on a list entry alone and would leave that line stale",
]
status        = "pending"
