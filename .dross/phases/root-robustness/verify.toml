[[finding]]
  severity = "FLAG"
  text = "pause.go:100-101 — the phase-status suffix in autoSnapshot (the `if st.CurrentPhaseStatus != \"\"` guard and the phase-concat below it) is re-indented by t-4 but never executed by any test: every pause fixture is a fresh `dross init` repo with an empty current_phase, so the `if st.CurrentPhase != \"\"` guard above it is always false. This is a genuine NOT-COVERED hole in changed lines, not the gremlins switch-case artifact. Not part of any criterion's surface (c-2 is about silence/loudness on a non-root), hence FLAG rather than a criterion downgrade. Fix: give one pause fixture a current_phase + current_phase_status and assert the rendered suffix."

[[finding]]
  severity = "FLAG"
  text = "internal/telemetry/telemetry_test.go:509 TestClassifyIncompleteRoot pins the `incomplete_root` bucket against a hand-copied message literal, not a real IncompleteRootError. Plan t-8's test_contract asked for \"the real IncompleteRootError message\". The literal matches root.go:40's format today, so classification is correct now — but if that prefix is ever reworded away from the `not a dross repo` token, the test still passes while real incomplete-root failures silently fall back into the opaque `other` bucket, which is the exact regression this task existed to prevent. internal/telemetry cannot import internal/cmd (cmd imports telemetry), so the fix belongs in package cmd: assert telemetry.ClassifyError on an actual IncompleteRootError value."

