task_seq = 0

[phase]
  id = "remote-run-detach"

[[task]]
  id = "t-1"
  wave = 1
  title = "Record a detached run in local.toml"
  files = ["internal/cmd/local.go", "internal/cmd/local_detached_test.go"]
  description = "Add a detached-run record to localStore, keyed by phase: run id, host,\nworkdir, dispatched-at, scheduled-for, state. Read/write/clear helpers.\nExcluded from localKeys exactly as the remote grants are.\n"
  covers = ["c-3", "c-5"]
  test_contract = ["if a field is dropped from the round trip, a record written and re-read from a fresh localStore fails the field-for-field comparison", "if the one-run-per-phase guard breaks, writing a second record for a phase that already has one stops returning an error naming the in-flight run", "if the record leaks into the generic key-writer, a test asserting detached_run is absent from localKeys fails — an agent could otherwise name a host through dross local set", "if the record is written when local.toml is tracked, the refuseTrackedLocal guard test fails"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Build the host-side detach script"
  files = ["internal/remote/remote.go", "internal/remote/remote_test.go"]
  description = "Add DetachScript(t, runDir, argv, notBefore): a setsid+nohup script that\nwrites a pidfile, a status file and the tool's exit code into runDir, and\nsleeps host-side until notBefore when one is given. Plus the status-read\nand run-dir helpers, built on the existing Script/ScriptAll/FetchArgs.\n"
  covers = ["c-1", "c-4", "c-6"]
  test_contract = ["if runDir or argv interpolation stops being quoted, a run directory spelled with a space or a semicolon stops arriving as one token — the same assertion shape shellQuote already carries", "if the sleep is emitted unconditionally, a notBefore already in the past produces a script containing a sleep", "if the exit code stops being recorded, a completed run becomes indistinguishable from a died one — the test asserting an absent exit-code file differs from a recorded 0 fails", "if setsid/nohup is dropped, the generated script no longer detaches the tool from the ssh session and the argv-shape assertion fails"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Extract the post-run verify pipeline"
  files = ["internal/cmd/verify.go", "internal/cmd/verify_finish_test.go"]
  description = "Lift everything after RunScoped — MeasuredOn stamping, gone-file skips,\nsurvivor lifecycle, tests.json + verify.toml writes, summary printing — into\none finishVerify seam both the attached and the detached path call.\nPure refactor: no behaviour change on the attached path.\n"
  covers = ["c-2"]
  test_contract = ["if the extraction changes attached-path behaviour, tests.json and verify.toml for a fixed Tests input stop being byte-identical to what the pre-extraction path wrote", "if a pipeline step is left behind in RunE, a finishVerify call with a fixed Tests produces a verify.toml missing that step's output — the staleness notes and the survivor lifecycle are each asserted present"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Dispatch a detached run behind --detach"
  files = ["internal/cmd/verify.go", "internal/mutation/gremlins.go", "internal/remote/remote.go", "internal/cmd/verify_detach_test.go", "internal/cmd/verify_scoping_test.go"]
  description = "Add --detach and --at: resolve the host, push the tree, build the per-package\nhost-side command sequence, spawn it detached with DetachScript, record it,\nprint phase and host, return. Needs an exported accessor for the gremlins\nper-package argv, which is why gremlins.go joined this task's files."
  covers = ["c-1", "c-4", "c-5"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if --detach starts waiting on the run, the test asserting exactly one ssh spawn and a return without the tool's completion fails", "if the dispatched host stops being the recorded one, the record's host no longer equals the target selectRemoteTarget returned", "if the in-flight guard breaks, a second --detach on a phase with a live run stops being refused by name", "if the no-grant path regresses, --detach without a remote grant stops being refused before any spawn — asserted with the spawn recorder at zero"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Fetch a detached run with verify results"
  files = ["internal/cmd/verify.go", "internal/mutation/gremlins.go", "internal/mutation/gremlins_test.go", "internal/cmd/verify_results_test.go"]
  description = "`dross verify results <phase>`: read the record, fetch status and report from\nthe RECORDED host, parse into Tests, hand to finishVerify. One distinct exit\ncode per state — scheduled, running, finished, failed, unreachable.\n"
  covers = ["c-2", "c-5", "c-6"]
  depends_on = ["t-1", "t-2", "t-3"]
  test_contract = ["if the detached path diverges from the attached one, tests.json and verify.toml built from the same report stop matching the attached path's output field-for-field", "if the fetch re-resolves the pool, a record naming host A stops being read from A once the pool prefers B — asserted with a two-host pool and a recorded non-preferred host", "if an unreachable host is treated as a result, the run exits with the finished code and writes verify.toml instead of exiting unreachable and writing neither file", "if a still-running run is treated as finished, results stops exiting with the running code and writes artefacts early"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "List and cancel in-flight runs"
  files = ["internal/cmd/verify.go", "internal/cmd/verify_status_test.go"]
  description = "`dross verify status` names each recorded run (phase, host, dispatched-at,\nstate) and says so plainly when there are none. `--cancel <phase>` kills a\nscheduled or running run host-side and clears its record.\n"
  covers = ["c-3", "c-4"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if status stops reading the record, a dispatched run no longer appears with its phase, host and state", "if cancel leaves the record behind, a cancelled phase still reports in-flight and a re-dispatch is still refused", "if cancel stops reaching the host, the run directory survives the cancel — asserted on the spawned argv", "if cancelling an unknown phase becomes a silent success, the test asserting an error fails"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 3
  title = "Document the detached run surface"
  files = ["README.md", "assets/prompts/verify.md", "internal/cmd/options_docs_test.go"]
  description = "Document --detach, --at, verify results and verify status in the README, and\nteach the /dross-verify prompt to dispatch detached and fetch later rather\nthan holding a session for the length of the leg.\n"
  covers = ["c-1", "c-2", "c-3", "c-4"]
  depends_on = ["t-4", "t-5", "t-6"]
  test_contract = ["if a verb or flag ships undocumented, the options/README doc test fails naming the missing one — the same check that already covers the lane surface", "if the prompt keeps telling the reader to wait out an attached run, the assertion that verify.md names the detached path fails"]
  status = "done"
