[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/cmd/verify_detach_test.go:62:TestDispatchReturnsWithoutWaiting", "internal/cmd/verify_detach_test.go:86:TestDispatchPushesBeforeItStarts", "internal/cmd/verify_detach_test.go:435:TestVerifyDetachDispatchesThroughTheCommand", "internal/remote/remote_test.go:737:TestDetachScriptDetachesFromTheSession", "internal/remote/remote_test.go:963:TestDetachScriptBackgroundsOnlyTheJob"]
  notes = "The two halves of the claim are proven on separate surfaces. \"Returns within seconds\" is asserted at the dispatch site: TestDispatchReturnsWithoutWaiting requires exactly one remote start carrying every package, so a dispatch that held the session per package would fail it, and TestDispatchPushesBeforeItStarts pins sync-then-spawn — a run started against an unsynced tree would measure the host's leftovers under this phase's name. \"Owned by the host\" is asserted at the script surface, which is where it is decidable without a real ssh: TestDetachScriptBackgroundsOnlyTheJob rejects a script whose `&` binds to the whole `&&` list — the live-helicon bug recorded in t-2's landmark, where ssh held the channel for the full leg — and requires the pid to be captured after the job. TestDetachScriptDetachesFromTheSession pins the setsid/nohup detachment itself."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/cmd/verify_results_test.go:388:TestCollectWritesTheSameArtefactsAnAttachedRunWould", "internal/cmd/verify_finish_test.go:224:TestFinishVerifyIsTheOnlyArtefactWriter", "internal/cmd/verify_finish_test.go:159:TestFinishVerifyClassifiesSurvivorLifecycle", "internal/cmd/verify_finish_test.go:193:TestFinishVerifySeedsEveryCriterion", "internal/mutation/gremlins_test.go:859:TestCollectMatchesRunForTheSameReports"]
  notes = "The strongest-evidenced criterion in the phase. TestCollectWritesTheSameArtefactsAnAttachedRunWould drives collectDetached end to end and restates each parity property independently rather than reading it back off the code: measured_on is the recorded host, the scope is rebuilt from changes.json and names the phase's own file, the go leg carries the fetched report's kills, an untouched sibling's survivor is filtered out of scope and lands in out_of_scope, and verify.toml is a pending skeleton carrying the spec's criteria. TestFinishVerifyIsTheOnlyArtefactWriter is the structural half — one writer means the two paths cannot diverge — and TestCollectMatchesRunForTheSameReports pins the adapter-level equality directly."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/local_detached_test.go:38:TestDetachedRunRoundTripsEveryField", "internal/cmd/local_detached_test.go:263:TestDetachedRunIsAbsentFromLocalKeys", "internal/cmd/local_detached_test.go:281:TestDetachedRunReadsRefuseATrackedStore", "internal/cmd/verify_status_test.go:34:TestStatusNamesEveryDispatchedRun", "internal/cmd/verify_detach_test.go:138:TestSecondDispatchIsRefusedByName", "internal/cmd/verify_results_test.go:460:TestASuccessfulCollectClearsTheRecord"]
  notes = "Survival across /clear and reboot is a property of the store, and the store is local.toml on disk — TestDetachedRunRoundTripsEveryField reads every field back through a fresh load, which is the same operation a new session performs. The two guards the run_state_location decision bought are asserted rather than assumed: the record is absent from localKeys, so no generic key-writer can aim a later fetch at an unseen host, and a tracked store is refused. The \"never stranded, never re-dispatched\" pair is closed from both ends: status names the run, a second dispatch is refused by name, and a successful collect clears the record."

[[criterion]]
  id = "c-4"
  status = "weak"
  tests = ["internal/remote/remote_test.go:777:TestScheduledRunSleepsAgainstTheHostClock", "internal/cmd/verify_detach_test.go:188:TestScheduledDispatchRecordsItsStartTime", "internal/cmd/verify_detach_test.go:295:TestParseDetachAtResolvesToTheNextOccurrence", "internal/cmd/verify_results_test.go:128:TestResultsOnAScheduledRunSaysScheduled", "internal/cmd/verify_status_test.go:129:TestCancelClearsTheRecord", "internal/cmd/verify_status_test.go:157:TestCancelReachesTheHostThatHoldsTheRun", "internal/cmd/verify_status_test.go:208:TestCancelAgainstAnUnreachableHostStillClearsButSaysSo"]
  notes = "Weak on the cancellation half only; the scheduling half is fully covered. TestScheduledRunSleepsAgainstTheHostClock pins every part of the schedule_mechanism decision — the target as an epoch second, `date +%s` so it is the HOST clock that is consulted, the sleep, and the run entering the scheduled state rather than reporting itself running for the hours it waits — and TestResultsOnAScheduledRunSaysScheduled is the read side.\n\nThe gap is \"can be cancelled\". stubCancel replaces detachCancel wholesale, so every cancel test asserts what was passed to the seam (host, runDir, pidFile) and what the caller does with its result, and NOTHING asserts the text of the teardown command itself. The code's own comment names the failure that text prevents: the kill targets the process GROUP (`kill -- -PID`) because setsid made the job a group leader, and signalling the pid alone would leave gremlins and its `go test` children holding the host's cores for an hour after the user was told the run was cancelled. That is precisely the breakage this criterion claims to prevent, and no test would fail if the `-- -` were dropped. See the FLAG finding below."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/cmd/verify_detach_test.go:104:TestDispatchRecordsTheHostItDispatchedTo", "internal/cmd/verify_results_test.go:177:TestResultsReadsTheRecordedHostNotTodaysGrant", "internal/cmd/verify_status_test.go:157:TestCancelReachesTheHostThatHoldsTheRun"]
  notes = "Both ends of the pin are asserted, and the fetch end is asserted against an adversarial grant rather than an absent one: TestResultsReadsTheRecordedHostNotTodaysGrant is named for exactly the failure mode the criterion forbids — a grant edited between dispatch and fetch must not redirect the read. TestCollectWritesTheSameArtefactsAnAttachedRunWould independently corroborates it by requiring measured_on to be the recorded host (\"anachryon\") and not the grant on disk. Cancel reads the same recorded host, so a teardown cannot be aimed at a machine that holds nothing."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/cmd/verify_results_test.go:80:TestResultsOnAnUnreachableHostIsNotAVerdict", "internal/cmd/verify_results_test.go:100:TestResultsOnAStillRunningRunWritesNothing", "internal/cmd/verify_results_test.go:155:TestResultsOnAVanishedRunSaysSo", "internal/cmd/verify_results_test.go:485:TestCollectRefusesARunThatProducedNothing", "internal/cmd/verify_detach_test.go:167:TestAFailedStartRecordsNothing", "internal/remote/remote_test.go:802:TestDetachScriptRecordsTheExitCode"]
  notes = "The criterion's two clauses are asserted separately and both bite. \"Never a mutation score, never a verdict\" is enforced by assertNoArtefacts, which every non-finished case calls — an unreachable host, a still-running run, a vanished run — so a regression that wrote a partial verify.toml fails the test rather than merely changing a message. \"Reported distinctly\" is enforced by exit code per state (13 unreachable, 11 running, 14 gone, 12 produced-nothing), which is the results_never_blocks decision made checkable, plus a message assertion that the unreachable case says \"not failed\" — the distinction between unknown and failed that the criterion turns on. The dispatch-time mirror is TestAFailedStartRecordsNothing, and TestDetachScriptRecordsTheExitCode is the host-side signal that makes \"finished\" separable from \"died\"."

[[finding]]
  severity = "FLAG"
  text = "c-4: the teardown command detachCancel builds is never asserted. stubCancel replaces the whole seam, so the tests prove the right host, runDir and pidFile reach it but nothing checks that the command kills the process GROUP. Dropping the `-- -` from `kill -- -$(cat pid)` — the exact regression the code comments against, which would leave gremlins holding the host's cores for an hour after a reported cancellation — passes the suite today. Closing it wants the line extracted as a pure `cancelLine(runDir, pidFile) string` helper and asserted directly, which needs no ssh and so does not disturb the locked tests_spawn_no_ssh decision. Recorded as debt against c-4; not routed, because the fix belongs to whoever next touches the cancel path."

