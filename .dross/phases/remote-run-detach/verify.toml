  tests = ["internal/cmd/verify_detach_test.go:104:TestDispatchRecordsTheHostItDispatchedTo", "internal/cmd/verify_results_test.go:177:TestResultsReadsTheRecordedHostNotTodaysGrant", "internal/cmd/verify_status_test.go:157:TestCancelReachesTheHostThatHoldsTheRun"]
  notes = "Both ends of the pin are asserted, and the fetch end is asserted against an adversarial grant rather than an absent one: TestResultsReadsTheRecordedHostNotTodaysGrant is named for exactly the failure mode the criterion forbids — a grant edited between dispatch and fetch must not redirect the read. TestCollectWritesTheSameArtefactsAnAttachedRunWould independently corroborates it by requiring measured_on to be the recorded host (\"anachryon\") and not the grant on disk. collectDetached builds its target from rec.Host/rec.Workdir with no call to the pool resolver anywhere in the function, so there is no second path to drift. Cancel reads the same recorded host, so a teardown cannot be aimed at a machine that holds nothing. This run's tests.json carries measured_on = \"helicon\", the host named in the record written 97 minutes earlier."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/cmd/verify_results_test.go:80:TestResultsOnAnUnreachableHostIsNotAVerdict", "internal/cmd/verify_results_test.go:100:TestResultsOnAStillRunningRunWritesNothing", "internal/cmd/verify_results_test.go:155:TestResultsOnAVanishedRunSaysSo", "internal/cmd/verify_results_test.go:485:TestCollectRefusesARunThatProducedNothing", "internal/cmd/verify_detach_test.go:167:TestAFailedStartRecordsNothing", "internal/remote/remote_test.go:802:TestDetachScriptRecordsTheExitCode"]
  notes = "Held at covered: the criterion names two transport-shaped failures — a host it cannot reach, and a run directory that is gone — and both are asserted, distinctly, from both ends. \"Never a mutation score, never a verdict\" is enforced by assertNoArtefacts, which every non-finished case calls, so a regression that wrote a partial verify.toml fails the test rather than merely changing a message. \"Reported distinctly\" is enforced by exit code per state (13 unreachable, 11 running, 14 gone, 12 produced-nothing), which is the results_never_blocks decision made checkable, plus a message assertion that the unreachable case says \"not failed\". TestAFailedStartRecordsNothing is the dispatch-time mirror, and TestDetachScriptRecordsTheExitCode is the host-side signal separating \"finished\" from \"died\" — the exit-file-written-after-the-tool ordering. Observed live this run: two intermediate `dross verify status` reads reported running and wrote nothing, and the collect ran only after state flipped to finished (exit 0).\n\nNote for the reader: the per-package silent-skip gap in the FLAG below is adjacent to this criterion but is not a failure of it. c-6 is scoped to a run that did not report — unreachable, vanished, produced-nothing — and each is covered. The gap is a run that DID report, incompletely, which is c-2's parity claim rather than c-6's transport claim, and it is recorded there."

[[finding]]
  severity = "FLAG"
  text = "The detached collect has no per-package failure guard, so one package's failed mutation run is scored as an absent one. This is a live correctness bug in the phase's own code, not only a test gap. internal/mutation/gremlins.go:273 gives the attached loop reportlessExitFatal — no report PLUS a non-zero tool exit fails the run — and internal/mutation/launcher.go:745 records the real incident it was written for: `go test ./internal/cmd` failed on a host, gremlins gathered no coverage, exited 1 and wrote nothing, and the run reported a clean 0.95 with the package holding most of the phase's code silently unmeasured. collectDetached calls neither reportlessExitFatal nor remoteExitFatal. detachFetchReports (internal/cmd/verify.go:410) prints a warning and continues, Collect records UnmeasuredMissing, and the only fatal check (verify.go:530) requires Killed+Survived+Timeout == 0 across ALL packages, so it cannot fire while any other package measured anything. The gap is structural: detachSequence (verify.go:219) joins packages with `;` by design, and DetachScript records a single exit code for the sequence — the last package's — so a package failing anywhere but last is invisible in the recorded exit no matter what the collect does with it. Fixing it needs a per-package exit code the script does not currently write (e.g. an exit file per step alongside each report), after which the collect can apply the same rule the attached loop does. Demonstrated live by this run: `./assets/prompts` produced no report and warned, ran early because packagesFromFiles sorts, and the recorded run exit was still 0. That instance is benign — assets/prompts is not a Go package — but it is the identical code path."

[[finding]]
  severity = "NOTE"
  text = "packagesFromFiles derives a gremlins package from EVERY changed file's directory, including directories that hold no Go (assets/prompts, from assets/prompts/verify.md in this phase's change set). Each such directory costs a doomed remote gremlins invocation and produces the \"no report fetched\" warning that would otherwise be a signal worth reading. Filtering the derivation to directories containing at least one .go file would remove the noise and sharpen the FLAG above from a warning users learn to ignore into one that means something. Pre-existing and shared with the attached path, not introduced by this phase."

