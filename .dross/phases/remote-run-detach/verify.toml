[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/cmd/verify_detach_test.go:62:TestDispatchReturnsWithoutWaiting", "internal/cmd/verify_detach_test.go:86:TestDispatchPushesBeforeItStarts", "internal/cmd/verify_detach_test.go:435:TestVerifyDetachDispatchesThroughTheCommand", "internal/remote/remote_test.go:737:TestDetachScriptDetachesFromTheSession", "internal/remote/remote_test.go:963:TestDetachScriptBackgroundsOnlyTheJob"]
  notes = "The two halves of the claim are proven on separate surfaces. \"Returns within seconds\" is asserted at the dispatch site: TestDispatchReturnsWithoutWaiting requires exactly one remote start carrying every package, so a dispatch that held the session per package would fail it, and TestDispatchPushesBeforeItStarts pins sync-then-spawn. \"Owned by the host\" is asserted at the script surface, which is where it is decidable without a real ssh: TestDetachScriptBackgroundsOnlyTheJob rejects a script whose `&` binds to the whole `&&` list, and TestDetachScriptDetachesFromTheSession pins the setsid/nohup detachment. Corroborated live this run: the local watcher polling the run was reaped twice by the harness (at ~50min and ~82min into the leg) and r-20260831-143901 kept running on helicon both times, finishing at exit 0 after ~97 minutes. That is the criterion's claim observed rather than only asserted."

[[criterion]]
  id = "c-2"
  status = "weak"
  tests = ["internal/cmd/verify_results_test.go:388:TestCollectWritesTheSameArtefactsAnAttachedRunWould", "internal/cmd/verify_finish_test.go:224:TestFinishVerifyIsTheOnlyArtefactWriter", "internal/cmd/verify_finish_test.go:159:TestFinishVerifyClassifiesSurvivorLifecycle", "internal/cmd/verify_finish_test.go:193:TestFinishVerifySeedsEveryCriterion", "internal/mutation/gremlins_test.go:859:TestCollectMatchesRunForTheSameReports", "internal/cmd/verify_results_test.go:485:TestCollectRefusesARunThatProducedNothing"]
  notes = "Downgraded from covered on evidence produced by this run. The parity that IS asserted is strong and holds: given the same per-package reports on disk, collectDetached and Run share ParseGremlinsJSON, RePrefixGremlinsFiles, DropInapplicable, hasCoverage and mergeInto outright, TestCollectMatchesRunForTheSameReports pins their agreement, and TestCollectWritesTheSameArtefactsAnAttachedRunWould restates scope, measured_on, leg counts, out-of-scope filtering and the pending skeleton independently.\n\nThe gap is the guard that decides whether a report set is trustworthy AT ALL, and it is not artefact-shaped, so no artefact-parity test reaches it. The attached loop calls reportlessExitFatal per package (internal/mutation/gremlins.go:273): a package that left no report AND exited non-zero fails the whole run. Its doc comment (internal/mutation/launcher.go:745) records why it exists — on a real host `go test ./internal/cmd` failed, gremlins gathered no coverage, exited 1 and wrote nothing, and the run reported a clean 0.95 with the package holding most of the phase's code silently unmeasured. The detached path calls neither reportlessExitFatal nor remoteExitFatal. detachFetchReports (internal/cmd/verify.go:410) prints \"collect: no report fetched\" and continues; Collect records UnmeasuredMissing; and the only fatal check is the whole-run one at verify.go:530, which needs Killed+Survived+Timeout == 0 across every package. It cannot fire while any other package measured anything.\n\nThe mechanism is structural, not hypothetical: detachSequence joins packages with `;` (verify.go:219, deliberately, so one failure does not truncate the rest), and DetachScript records ONE exit code for the sequence — the LAST package's. A package that fails anywhere but last is invisible in the recorded exit by construction. This run demonstrated the live path: `./assets/prompts` produced no report and warned, and because packagesFromFiles sorts, it ran early, so the recorded exit was 0. That instance is benign — assets/prompts is not a Go package — but it is the same code path, and nothing distinguishes it from ./internal/cmd failing the same way.\n\nSo a detached verdict CAN be second-class in exactly one way c-2 forbids: a clean pooled score over a silently-unmeasured package, where the attached path would have refused to report. TestCollectRefusesARunThatProducedNothing covers only the all-packages-empty case and passes today either way. See the FLAG finding."

