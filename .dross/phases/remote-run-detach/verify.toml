[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/remote/remote_test.go:777:TestScheduledRunSleepsAgainstTheHostClock", "internal/cmd/verify_detach_test.go:188:TestScheduledDispatchRecordsItsStartTime", "internal/cmd/verify_detach_test.go:295:TestParseDetachAtResolvesToTheNextOccurrence", "internal/cmd/verify_results_test.go:128:TestResultsOnAScheduledRunSaysScheduled", "internal/cmd/verify_status_test.go:129:TestCancelClearsTheRecord", "internal/cmd/verify_status_test.go:157:TestCancelReachesTheHostThatHoldsTheRun", "internal/cmd/verify_status_test.go:208:TestCancelAgainstAnUnreachableHostStillClearsButSaysSo", "internal/cmd/verify_status_test.go:247:TestCancelLineKillsTheProcessGroup", "internal/cmd/verify_status_test.go:268:TestCancelLineRemovesTheRunDirectory", "internal/cmd/verify_status_test.go:290:TestCancelLineQuotesItsPaths", "internal/cmd/verify_status_test.go:312:TestCancelSendsTheCancelLineToTheHost"]
  notes = "Upgraded from weak; the FLAG raised by the previous verify is closed by t-11 (41cc4e7) and the closure is real, not nominal. The scheduling half was already fully covered: TestScheduledRunSleepsAgainstTheHostClock pins every part of the schedule_mechanism decision — target as an epoch second, `date +%s` so it is the HOST clock consulted, the sleep, and the run entering the scheduled state rather than reporting itself running for the hours it waits — with TestResultsOnAScheduledRunSaysScheduled as the read side.\n\nThe cancellation half is now asserted at the text, not just at the seam. detachCancel's command was extracted as a pure cancelLine(runDir, pidFile), so the `-- -` that makes the kill target the process GROUP is checkable without a host. TestCancelLineKillsTheProcessGroup carries the load-bearing negation as well as the positive: `kill -- -$(cat` contains `kill -$(cat` as a substring, so it strips the group form before asserting the bare-pid form is absent — a positive-only check would have passed with the marker dropped, which is how the original gap survived review. TestCancelLineRemovesTheRunDirectory pins the `; rm -rf` chaining specifically (not `&&`, because the kill's failure is expected when the job already exited and the rm must still run) and the kill-before-rm order. TestCancelLineQuotesItsPaths covers an embedded quote, which matters most in an `rm -rf`. TestCancelSendsTheCancelLineToTheHost is the join: detachCancel now routes through remoteExecFn, so the extracted string is asserted to be exactly the argv reaching the transport, which is what stops cancelLine decaying into dead code the suite is content with. No test spawns ssh; the locked tests_spawn_no_ssh decision is intact. The mutation evidence agrees — the two survivors the previous run carried at verify.go:569 and :570 are gone, and killed rose 772 -> 780 over an unchanged denominator of 808."

