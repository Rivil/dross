[[criterion]]
  id = "c-1"
  status = "weak"
  tests = ["internal/cmd/verify_detach_test.go:62 TestDispatchReturnsWithoutWaiting", "internal/cmd/verify_detach_test.go:83 TestDispatchPushesBeforeItStarts", "internal/remote/remote_test.go:735 TestDetachScriptDetachesFromTheSession", "internal/remote/remote_test.go TestDetachScriptBackgroundsOnlyTheJob"]
  notes = "The MECHANISM is covered and was proven live: the run survived the ssh connection ending and the laptop sleeping ~10h, finishing exit 0, and dispatch returns in 1s. Downgraded to weak because 12 in-hunk survivors sit in Verify's own --detach branch: every test drives dispatchDetached directly, so the flag wiring — detachRequiresAHost, parseDetachAt, gremlinsAdapter and the len(steps)==0 guard at their call sites — has no test at the command level. A refactor of that branch would not be caught."

[[criterion]]
  id = "c-2"
  status = "weak"
  tests = ["internal/mutation/gremlins_test.go TestCollectMatchesRunForTheSameReports", "internal/cmd/verify_finish_test.go:70 TestFinishVerifyWritesBothArtefacts", "internal/cmd/verify_results_test.go:77 TestResultsOnAnUnreachableHostIsNotAVerdict", "internal/cmd/verify_results_test.go TestFetchClearsEachLocalReportBeforePullingIt"]
  notes = "Both HALVES are tested — Collect agrees with Run for identical reports, and finishVerify writes both artefacts — but the criterion's actual claim, that a detached collect reconstructs them IDENTICALLY to an attached run, has no test asserting it. 36 in-hunk survivors sit in collectDetached, all in the success path: scope rebuild, DetachSteps, fetch, Collect, FilterReport, Tests assembly, measuredOn. Only the refusal branches are exercised. This gap was flagged when t-5 was written and is now measured rather than suspected."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/local_detached_test.go:38 TestDetachedRunRoundTripsEveryField", "internal/cmd/local_detached_test.go:122 TestSecondRunForOnePhaseIsRefused", "internal/cmd/local_detached_test.go TestDetachedRunReadsRefuseATrackedStore", "internal/cmd/verify_status_test.go:35 TestStatusNamesEveryDispatchedRun", "internal/cmd/verify_status_test.go TestStatusLabelsARecordedStateAsRecorded"]
  notes = "The record layer is covered field-for-field, including the tracked-store refusal at every entry point, and status is asserted to label an unconfirmed state as recorded rather than observed. Proven live beyond the tests: the record survived the laptop sleeping, two watcher processes being killed, and three branch switches, and a later session read it correctly. The 4 in-hunk survivors are in verifyStatus/printDetachedStatus RunE glue, not in the record itself — FLAGged, not a downgrade."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/remote/remote_test.go TestScheduledRunSleepsAgainstTheHostClock", "internal/cmd/verify_detach_test.go TestScheduledDispatchRecordsItsStartTime", "internal/cmd/verify_results_test.go TestResultsOnAScheduledRunSaysScheduled", "internal/cmd/verify_status_test.go TestCancelClearsTheRecord", "internal/cmd/verify_status_test.go TestCancelReachesTheHostThatHoldsTheRun"]
  notes = "Every clause has a test: the schedule crosses as an epoch second the HOST compares (so no duration is baked in at dispatch), the record carries it, results reports scheduled distinctly from running, and cancel both clears the record and tears down on the dispatching host. NOTE rather than downgrade: --at has never been exercised against a real host, so the host-side sleep is proven by script assertion only."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/cmd/verify_detach_test.go:104 TestDispatchRecordsTheHostItDispatchedTo", "internal/cmd/verify_results_test.go:174 TestResultsReadsTheRecordedHostNotTodaysGrant", "internal/cmd/verify_finish_test.go:88 TestFinishVerifyStampsTheHostThatMeasured"]
  notes = "The fetch-side test is the load-bearing one: it records a run on anachryon while the grant on disk names helicon, and asserts the fetch asks anachryon. Confirmed live — this run's tests.json carries measured_on = helicon read from the record, not re-resolved."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/remote/remote_test.go TestParseStatusSeparatesAbsentFromZero", "internal/remote/remote_test.go TestParseStatusDistinguishesAMissingRunDirectory", "internal/cmd/verify_results_test.go:77 TestResultsOnAnUnreachableHostIsNotAVerdict", "internal/cmd/verify_results_test.go:152 TestResultsOnAVanishedRunSaysSo"]
  notes = "The distinction the criterion rests on is asserted at both layers: exit 0 and no-exit-recorded parse differently (HasExit separate from ExitCode, so no in-band sentinel), a removed run directory parses differently from an empty one, and each non-finished state exits its own code writing NEITHER artefact. The 4 in-hunk survivors are ExecScript's error branches, which no test reaches because every test stubs the transport — FLAGged."

