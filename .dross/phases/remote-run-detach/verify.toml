  text = "All 15 in-scope survivors carry Lifecycle=accepted with recorded reasons, so unclassified_in_scope is 0 and nothing was left for a later run to inherit. All 15 are NOT-COVERED-attributed (mutants_not_covered == mutants_survived): none is a mutant that ran and escaped an assertion. Two families, both previously proven rather than assumed — the `var detach* = func(...)` process-construction seam bodies at internal/cmd/verify.go:168, 380, 384 and internal/remote/remote.go:797, which every test replaces wholesale and which could only execute by spawning real ssh; and the gremlins switch-case attribution ceiling at internal/cmd/verify.go:708 and internal/remote/remote.go:763/765/769, where a coverprofile run shows the arm executing while gremlins marks it NOT COVERED. internal/mutation/launcher.go:230 is an ARITHMETIC_BASE on a string concatenation inside an error message — the mutant does not compile and is not viable. Note that detachFetchReports no longer appears in this list: its body was the source of the two in-diff survivors this session and t-14 covered it by stubbing runDetachArgv rather than the whole function, so acceptance was not needed."

[[finding]]
  severity = "NOTE"
  text = "The in-scope denominator was previously inflated, and this phase's earlier numbers should be read with that in mind. packagesFromFiles derived a gremlins package from every changed file's DIRECTORY, and gremlins appends `/...` to every package argument — so a changed README.md derived `.`, which mutated the whole module. Its report was then merged alongside the per-package reports covering the same files, double-counting them. This phase's 808 in-scope mutants were really 512; the same run's out-of-scope survivors included internal/statusline, internal/phase, internal/architecture and internal/forge, packages nowhere near this phase. The SCORE was roughly preserved (numerator and denominator inflated together), which is why 0.955 and 0.965 looked plausible, but the counts were not real. The signature is visible in the survivor lists: max repeat-per-key fell from 10 to 5 as the duplication cleared, while distinct survivors rose. Any past verify.toml for a phase whose change set touched a root-level file carries the same inflation."

[[finding]]
  severity = "NOTE"
  text = "Deferred and filed rather than fixed here (deferred[4], board DRO-291): t-12 removed the whole-module run for dross by filtering the derivation to directories holding .go files, but not the mechanism behind it. Gremlins appends `/...` to any package argument, so a repo whose module root holds .go files still derives `.` as a whole-module run and still double-counts against its per-package reports. It is not reproducible in this repo — there is no root package — so it cannot be tested here without a fixture module, and fixing it properly means deriving the package list from `go list` rather than from directories, which is a different design than packagesFromFiles pins."

[[finding]]
  severity = "NOTE"
  text = "Operational, not a property of this phase, but it cost a dispatch: on macOS `make install` overwrites ~/.local/bin/dross in place, and the replacement is then SIGKILLed on every invocation — exit 137, no output, `dross --version` included. `codesign -v` passes on the file, so signature checks do not diagnose it. The first --detach of this session was killed by it and dispatched nothing; `dross verify status` correctly reported no run, which is the dispatch ordering working. `rm -f ~/.local/bin/dross && make install` fixes it. Worth knowing because project rule r-01 makes `make install` a routine step before relying on any prompt or Go change, and exit 137 reads as a silent mystery rather than a build problem."
