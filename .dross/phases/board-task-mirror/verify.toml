[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/cmd/issue_task_test.go:TestTaskSyncIsIdempotent", "internal/cmd/issue_task_test.go:TestTaskSyncScopesToOneTask", "internal/cmd/issue_task_test.go:TestTaskIssueIsRelatedToItsPhase", "internal/cmd/issue_task_test.go:TestTaskResolvedByLabelIsSilentAndReused", "internal/cmd/issue_task_test.go:TestDuplicateTaskIssuesWarnAndUpdateTheFirst", "internal/cmd/issue_task_test.go:TestTaskSyncRequiresAPhaseIssue", "internal/cmd/issue_task_state_test.go:TestTaskSyncLinksAndMovesTheStateOnACapableTracker", "internal/board/board_test.go:TestTaskLookupsAreScopedToTheirPhase"]
  notes = "Both halves are pinned: a second sync updates rather than duplicates (idempotence via the board.json cache), and a cold cache re-resolves by label rather than creating a second issue (the re-clone path). The relation itself is asserted on a tracker that can express it — the relates-to link runs from the phase issue to the recorded task key — and on one that cannot, where the body names the parent instead."

[[criterion]]
  id = "c-2"
  status = "weak"
  tests = ["internal/cmd/issue_task_state_test.go:TestTaskSyncLinksAndMovesTheStateOnACapableTracker", "internal/cmd/issue_task_state_test.go:TestStateFailureFailsTheTaskSync", "internal/cmd/issue_task_state_test.go:TestJiraStateFailureFailsTheTaskSync", "internal/cmd/board_lifecycle_divergence_test.go:TestEmittedStatusesAreTheLifecycleSet", "internal/cmd/board_lifecycle_divergence_test.go:TestStateMapsKeyExactlyTheEmittedStatuses"]
  notes = "The mechanism is covered — `--status task-in-progress` writes YouTrack's State custom field rather than a dross label, and a rejected write fails the sync on both provider branches. What is NOT covered is the criterion's edge placement: that PICKING a task emits task-in-progress and COMMITTING it emits task-in-review. The lifecycle guard derives the emit-set from a `--status <literal>` regex over assets/prompts/*.md, so it only proves both literals appear somewhere; transposing execute.md:76 and execute.md:226 would invert the criterion with no test failing."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/board_lifecycle_divergence_test.go:TestEmittedStatusesAreTheLifecycleSet", "internal/cmd/board_lifecycle_divergence_test.go:TestStateMapsKeyExactlyTheEmittedStatuses", "internal/forge/youtrack_bundle_test.go:TestMissingStateIsCreatedInThePrivateBundle", "internal/cmd/issue_close_truth_test.go:TestPhaseSyncCloseWritesStateAndVerifies", "internal/cmd/issue_close_truth_test.go:TestPhaseSyncWithoutCloseKeepsTheLenientPath"]
  notes = "Three independent breakages are caught. Dropping verify.md's `--status uat` fails the emit-set guard (a Set member nothing emits). Collapsing uat into in-progress's value fails the bundle test, which asserts the created value is UAT while In Progress is already stock in the fixture bundle. Removing the phase-level state write fails the close-truth tests over issue.go:893/902. Jira's side of the distinctness claim is unasserted — see the FLAG."

