  status = "weak"
  tests = ["internal/forge/youtrack_bundle_test.go:TestMissingStateIsCreatedInThePrivateBundle", "internal/forge/youtrack_bundle_test.go:TestSharedBundleIsNeverWritten", "internal/forge/youtrack_bundle_test.go:TestPresentStateSkipsTheCreate", "internal/forge/youtrack_bundle_test.go:TestBundleCreateFailureWarnsAndContinues", "internal/forge/youtrack_bundle_test.go:TestUnmappedStateStillSkipsWithoutTouchingTheBundle", "internal/forge/jira_test.go:TestJiraSetStateTransitions"]
  notes = "The create clause is thoroughly covered — created in a project-private bundle and retried so the state actually lands, refused on a shared bundle, skipped when already present, and a refusal warns rather than failing the sync. The second clause is not: for forge REST the criterion asks for a once-per-run warning naming the provider and the missing value, and setBoardState's default arm (internal/cmd/issue_task.go:237) returns nil silently on the argument that the status label is the honest floor. Unimplemented as stated, and untested either way."

[[criterion]]
