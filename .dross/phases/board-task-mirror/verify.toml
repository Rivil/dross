  status = "covered"
  tests = ["internal/cmd/issue_task_test.go:TestNoLinkerWarnsOnceAndContinues", "internal/cmd/issue_task_state_test.go:TestLinkFailureWarnsOnceAndKeepsTheIssues", "internal/cmd/issue_task_state_test.go:TestTaskSyncLinksAndMovesTheStateOnACapableTracker", "internal/cmd/deferred_link_test.go:TestGitHubBoardRecordsNoLinkAttempts"]
  notes = "Both capability gaps are driven and both are bounded to one line per run: the backend with no IssueLinker at all, and the backend that advertises the capability then rejects the call at runtime. In each case every task issue still exists and its mapping is still recorded, so the phase-level sync survives the gap. The capability check is pinned as an interface assertion rather than a provider-string switch, which is what stops a no-op stub silencing the whole arm."

