[phase]
  id = "board-task-mirror"
  title = "Board task mirror"
  milestone = "v1.3"

[[criteria]]
  id = "c-1"
  text = "Every plan task gets its own board issue, related to its phase's issue. `dross issue task-sync <phase> [task-id]` creates or updates them and records the mapping in board.json, so re-running is idempotent rather than duplicating. Today the board sees a phase and a rendered checklist; nothing on the tracker moves when one task of eight is picked up."

[[criteria]]
  id = "c-2"
  text = "Execute drives the child issue's state: picking a task moves it to in-progress, committing it moves it to a review state. The transition goes through the tracker's own workflow field — YouTrack's State, Jira's transitions — not a dross label, so the tracker's board columns reflect it."

[[criteria]]
  id = "c-3"
  text = "Verify moves the PHASE issue to a UAT state, distinct from in-progress and from shipped. A phase awaiting a verdict is neither being worked nor delivered, and collapsing it into either is what makes a board stop reflecting where work actually is."

[[criteria]]
  id = "c-4"
  text = "A mapped state value the tracker does not have is CREATED where the tracker allows it — a YouTrack state added to a project-private bundle — rather than silently skipped. Where the tracker cannot (Jira states come from a workflow, forge REST has no state field), the run warns once naming the provider and the missing value, and continues."

[[criteria]]
  id = "c-5"
  text = "Every provider gets a stated outcome rather than a silent one: a backend that can express child issues does, one that cannot warns once and continues with the phase-level sync intact. A task mirror that half-worked without saying so would be worse than none, because the board would look authoritative while being partial."

[[decisions]]
  key = "child_issues_not_subtasks"
  choice = "A task's board issue is an ordinary issue carrying a task label and related to the phase issue through the existing IssueLinker capability — not a tracker-native subtask type."
  why = "Subtask types are per-tracker and per-project configuration: YouTrack models them as a link type, Jira as an issue type that a project may not have enabled, GitHub has none. Building on IssueLinker means one code path everywhere and a capability gap that is already modelled — GitHub fails the interface assertion and falls back to the label, which is the behaviour the linker was written for. A native subtask would be four implementations and a new failure mode per tracker."
  locked = true

[[decisions]]
  key = "task_states_extend_the_same_map"
  choice = "Task and UAT states are new keys in the existing lifecycle vocabulary and its state maps (`task-in-progress`, `task-in-review`, `uat`), not a second mapping mechanism."
  why = "There is already one vocabulary with one override point (`[board].state_map`) and a build-failing guard that keeps producers and maps in step. A second mechanism would double that surface and let the two drift — which is precisely the bug the LifecycleStatuses set was introduced to close, when issue.go emitted `planning` while both maps keyed `planned`."
  locked = true

[[decisions]]
  key = "create_only_where_the_tracker_allows"
  choice = "A missing state is created only on YouTrack, in a PROJECT-PRIVATE bundle. Jira and forge REST warn once and continue."
  why = "Only YouTrack exposes state values as an editable bundle; Jira's states come from a workflow scheme that a project shares with others, so creating one would edit configuration well outside this repo's blast radius, and forge REST has no state field at all. Project-private rather than shared for the same reason: a shared bundle is other projects' configuration, and silently adding to it is a change nobody in those projects asked for."
  locked = true

[[decisions]]
  key = "warn_once_per_run"
  choice = "A capability gap warns ONCE per run, naming the provider and what was skipped — not once per task."
  why = "An eight-task phase on a backend with no linker would print eight identical lines, which is how a warning becomes scrollback. Once, named, is readable; the count of affected tasks is in the same line if it matters."

[[deferred]]
  id = "d7f9593f2665816b"
  text = "Mirror task state back INTO dross — read the tracker's board and move a plan task when someone drags its card."
  why = "The opposite direction, and a much larger contract: it makes the tracker a writer of plan.toml, which needs conflict rules dross has never needed. This phase is one-way on purpose."
  target = "board-task-inbound"

[[deferred]]
  id = "e7207129f4d8a7fc"
  text = "Preflight the remote before every run that needs it: call remote.Probe() as a gate before a mutation or dross test run, and on transport failure fall back to the local path instead of failing the run outright — but record the fallback (which machine measured it) in verify.toml and announce it in the run output, so a local run is never indistinguishable from a remote one."
  why = "helicon was unreachable for hours during board-task-mirror; the run failed transport-first and the only workaround was 'dross remote revoke' to force the local path. Probe() already exists at internal/remote/remote.go:475 but only doctor calls it."
  target = "remote-toolchain-bootstrap"

[[deferred]]
  id = "2d0d009238884a83"
  text = "Bound every stack's build/test cache instead of letting it grow unbounded: add a [cache] section to each profile in internal/stack/profiles/*.toml declaring the cache dir(s) and a prune command (go clean -cache, cargo target/, npm cache, etc), and prune after each mutation or test run only when the cache exceeds a configurable size ceiling — keeping incremental builds warm while capping the disk. Must apply to the remote host as well as local."
  why = "The Go build cache reached 399 GB during v1.3 and filled the laptop to 100 percent, failing a verify run outright; go clean -cache recovered it. Go's own 5-day age trim did not keep up, so the bound must be size-based rather than age-based. Now more urgent remotely: helicon's root is 75 G with 57 G free and all mutation runs land there."
  dismissed = true

[[deferred]]
  id = "5802ad3fe8f08d87"
  text = "Give mutation runs a scratch build cache instead of letting them poison the shared one: point each run's toolchain cache env var at a dedicated dir (GOCACHE for go, CARGO_TARGET_DIR for rust, npm_config_cache for node, etc, declared per profile in internal/stack/profiles/*.toml) and wipe it when the run ends. Applies to the remote host as well as local. Stretch: pin gremlins' working directory so cross-run reuse becomes possible at all — needs an upstream flag or a patched build, and would cut run TIME as well as disk."
  why = "Measured 2026-08-16: the Go cache held 64 GB, of which 61 GB was 2093 compiled archives averaging 30 MB and only 348 MB was the genuinely-shared stdlib/deps. Cause is that gremlins copies the module into a fresh temp dir (gremlins-PID/wd-RANDOM) every run, and Go keys the build cache on source file paths — so every run recompiles and re-stores EVERY dross package under new keys, including packages it never mutates, and nothing is ever reused across runs. gremlins unleash has no workdir flag (v0.6.0). Since cross-run reuse is already zero, a scratch-and-wipe cache costs no rebuild time while bounding the disk absolutely, and leaves the dev cache warm; a size ceiling on the SHARED cache was the wrong mechanism. Earlier symptom: the cache reached 399 GB and filled the laptop to 100 percent, failing a verify run outright."
  target = "cache-budget-prune"

[[deferred]]
  id = "c14768500d441497"
  text = "Pass TMPDIR to remote runs so the mutation harness's own scratch leaves RAM: gremlins copies the module per run via os.MkdirTemp, which honours TMPDIR rather than GOTMPDIR, so on helicon it still lands in a 32 G RAM-backed tmpfs while an LLM shares the box. The remote runner must export it in the ssh script alongside the per-profile cache vars."
  why = "helicon's GOCACHE/GOMODCACHE/GOTMPDIR were pointed at the 300 G /var/lib/buildcache volume on 2026-08-16 via go env -w, which covers the go toolchain but not the harness wrapping it. Deliberately not done inline: unlike go env -w it needs a code change in the runner."
  target = "cache-budget-prune"

[[deferred]]
  id = "84db6f7af8f57cef"
  text = "Provision the remote test host's non-Go toolchain, or make the suite honest about its absence: helicon has no `gh` on PATH, so internal/ship's TestPostGitHubCommentSurfacesFailures fails there and passes locally. Either install the CLIs the suite shells out to as part of the host's bootstrap, or have those tests skip on a host that lacks them — a remote red that says nothing about the code teaches the loop to ignore reds."
  why = "Measured 2026-08-16 while re-running the suite for board-task-mirror's survivor pass: `dross test` exited 1 on helicon solely on that one case; go test of the same package locally is green. A remote runner whose reds are environment-shaped is worse than no remote runner, because the failure looks exactly like a real one."
  target = "remote-toolchain-bootstrap"

[[deferred]]
  id = "6f43c4001c862759"
  text = "Let `dross task add`/`task edit` set test_contract: neither command exposes the field, so a task added mid-phase is written with an empty contract and the only way to fill it is hand-editing plan.toml — which `dross task add` exists precisely to stop."
  why = "Hit three times while amending board-task-mirror's verify FLAGs: every amendment task was added with no test_contract, so the plan records what the task touches but not what would fail if the task's claim broke — which is the field /dross-verify reads to map criteria to tests. dross task add/edit/move/remove was shipped to make hand-editing plan.toml unnecessary; this is the one field that still forces it."
  target = "cli-surface-completeness"
