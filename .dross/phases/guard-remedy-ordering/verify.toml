  status = "covered"
  tests = ["internal/cmd/phase_reconcile_test.go:TestReconcileSkipsUnmergedPhases", "internal/cmd/phase_reconcile_test.go:TestReconcileContinuesPastASkip", "internal/cmd/phase_reconcile_test.go:TestReconcileReportsPerPhaseOutcome", "internal/cmd/phase_reconcile_test.go:TestReconcileWithNothingToDoExitsZero", "internal/cmd/status_reconcile_test.go:TestStatusNamesReconcileNotAChoreList", "internal/cmd/status_reconcile_test.go:TestSinglePhaseStillNamesCompleteDirectly", "internal/cmd/status_reconcile_test.go:TestReadOnlySurfacesMutateNothing", "internal/cmd/watch_test.go:TestSuggestPrecedence"]
  notes = "The sweep's own behaviour is tested with the per-phase completion stubbed, so what is asserted is which phases it picks, that a refusal is reported-and-survived rather than fatal, and that the tally matches what happened — the merge gate itself stays tested where it lives, and duplicating it here would be a second implementation of the check that must never disagree. The chore-list complaint is asserted directly: with three candidates, status must print the batch verb AND ZERO per-phase complete lines, while a single candidate must keep the direct command, since naming a batch verb for one item is worse guidance. Read-only is proven by snapshotting the phase dirs, the branch list and state.json around a status call and requiring them byte-identical — a suggestion that acted on what it found would show up in one of the three. TestSuggestPrecedence pins where the pile ranks: below advancing an in-flight phase, above new intake, and NOT triggered by a single phase."

