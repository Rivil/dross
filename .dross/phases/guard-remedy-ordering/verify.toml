[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/cmd/switchbranch_ff_remedy_test.go:TestRefusalLeadsWithFastForward", "internal/cmd/switchbranch_ff_remedy_test.go:TestBothRemediesSurvive"]
  notes = "LEADING is the criterion, not mentioning, so the test compares the two remedies' positions in the message rather than merely finding the ff line — an offer buried under the expensive remedy it replaces has not led. The fixture is a real git repo with a real bare origin: the branch genuinely tracks .dross/state.json, origin genuinely has the untracking commit, and local is genuinely rewound behind it, so the guard answers the question the way it will in a user's repo rather than against faked refs. The message must also say WHY the fast-forward is enough (\"only BEHIND\"), since a bare command with no reason is the kind of advice people skip."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/cmd/switchbranch_ff_remedy_test.go:TestNoFastForwardWhenRemoteStillCarriesIt", "internal/cmd/switchbranch_ff_remedy_test.go:TestNoFastForwardWithoutARemote", "internal/cmd/switchbranch_ff_remedy_test.go:TestNoFastForwardWhenDiverged", "internal/cmd/switchbranch_ff_remedy_test.go:TestGuardStillPassesACleanRef"]
  notes = "All three not-applicable shapes are built as distinct real repos, because they fail differently: a remote that still tracks the file would MOVE the refusal (the user works, re-runs, is refused again by the same guard), a branch with no remote has nothing to fast-forward from, and a diverged branch cannot fast-forward at all — that last one would be an instruction that errors while looking authoritative. TestGuardStillPassesACleanRef is the control: without it, every assertion above would be satisfied by a guard that refused everything and offered nothing."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/milestone_prune_ux_test.go:TestPruneDryRunDeletesNothing", "internal/cmd/milestone_prune_ux_test.go:TestPruneRefusesWithoutConsent", "internal/cmd/milestone_prune_ux_test.go:TestPruneYesSkipsThePrompt", "internal/cmd/milestone_prune_ux_test.go:TestPruneListsWhatItDeletes", "internal/cmd/milestone_prune_ux_test.go:TestOnlyAnExplicitYesProceeds"]
  notes = "Every assertion is against real branches on a real origin, checked with `git ls-remote` — a preview that silently deleted the remote branch would pass any output-only test. TestPruneListsWhatItDeletes compares the previewed set against the deleted set rather than checking that SOMETHING was printed, which is what catches a partial preview, the failure mode a confirmation gate is most likely to develop. TestOnlyAnExplicitYesProceeds was added during verify to kill a real in-diff survivor: a coverage profile showed the whole tail of confirmPrune running zero times, because the read needs a terminal — so which answers mean yes was unexecuted by the entire suite while standing in front of an irreversible delete. A bare Enter is now asserted to mean NO."

