[[task]]
  id = "t-1"
  wave = 1
  title = "Share skipDirs; add testdata + fixtures"
  files = ["internal/stack/detect.go", "internal/stack/detect_test.go"]
  description = "Add \"testdata\" and \"fixtures\" to the existing skipDirs map (detect.go:27). Export\nSkipDir(name string) bool (segment predicate) and SkipDirs() []string (sorted copy)\nas the one shared definition. No walker changes: extsInTree, detectLanguagesFrom and\nMarkerProfiles already consult the map; the `path != root` guard stays.\n"
  covers = ["c-1", "c-3"]
  test_contract = ["TestDetectLanguagesDrossRootIsGoOnly: DetectLanguages(repoRoot) == exactly []string{\"go\"} — red today (`dross security detect .` prints go, javascript, svelte, typescript from fixtures/ and internal/mutation/testdata); if either name leaks back into any of the three walks the exact-equality fails", "TestSkipDirIsSegmentNotSubstring: tempdir with mytestdata/a.py, a FILE named testdata.py, and testdata/b.rb; DetectLanguages returns python and NOT ruby — a substring/prefix comparison fails the first assertion, a missing IsDir guard fails the second", "TestDetectFixtureOnlyExtIsUnsupported: a root holding only fixtures/a.kt → Detect returns Unsupported (today: kotlin)", "TestMarkerProfilesSkipsFixtures: root holding only fixtures/iac/Dockerfile → MarkerProfiles == []; move the Dockerfile to root → [\"docker\"]; fails if MarkerProfiles is not on the shared set", "TestSkipDirsSingleDefinition: SkipDirs() contains .dross, testdata, fixtures, node_modules, vendor and is sort.StringsAreSorted; a go/ast walk over non-_test .go files under internal/ (the internal/cmd/hermetic_dross_read_test.go technique) finds the string literal \"testdata\" or \"fixtures\" inside a CompositeLit only in internal/stack/detect.go — a second map/slice copy per scanner fails. Not a grep: internal/verify/verify.go:359 compares seg == \"testdata\" in IsTestdataPath (mutation-scope rule, Go testdata semantics only) and is the known out-of-scope sibling"]
  status = "done"

