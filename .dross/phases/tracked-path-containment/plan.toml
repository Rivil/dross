[phase]
  id = "tracked-path-containment"

[[task]]
  id    = "t-1"
  wave  = 1
  title = "Add internal/pathfence shared containment check"
  files = [
    "internal/pathfence/pathfence.go",
    "internal/pathfence/pathfence_test.go",
  ]
  description = """
New leaf package (imports nothing from internal/ — the argfence / hostallow /
configenum shape) with three predicates over one lexical rule, plus typed
sentinels:
  Contain(root, artifact, p) (string, error)  — refuse, for join-onto-a-root
  InTree(p string) (clean string, ok bool)    — classify, root-less
  Segment(label, id string) error             — single-segment
  ErrEscapes, ErrAbsolute
InTree takes no root: its two consumers differ on root handling (verify strips
one, testlane has none), so pathfence owns only the lexical ..-and-absolute
test and each caller keeps its own root and empty/dot policy. Lexical only —
absolute rejected outright, no EvalSymlinks. The doc comment records the
symlink limit and why (symlink_resolution lock).

Slash form throughout: both InTree consumers already work in slash form
(verify.NormalizePath replaces backslashes then uses path.Clean;
testlane.normalize does filepath.ToSlash then path.Clean), so pathfence
normalises with filepath.ToSlash + path.Clean and returns slash-form strings on
every platform. Contain returns an OS-form joined path, since its callers hand
it straight to os.*.
"""
  covers = ["c-1", "c-3", "c-5"]
  test_contract = [
    "Contain(root, \"changes.json\", \"../x.go\") errors and the message contains \"../x.go\", \"changes.json\" and the root, asserted as three separate strings.Contains rather than one golden string",
    "Contain(root, a, \"/etc/passwd\") matches errors.Is(err, ErrAbsolute) and NOT ErrEscapes, so deleting the IsAbs branch cannot pass by falling through to the escape branch",
    "Contain(root, a, \"a/../b.md\") returns Join(root, \"b.md\") — an interior \"..\" landing inside is not an escape — while \"..\" and \"../\" both error",
    "The near-miss non-escapes \"..foo\", \"a/..b\" and \"a/b..\" are ACCEPTED by both Contain and InTree, so a HasPrefix check missing the separator test fails here",
    "InTree returns the CLEANED path on the false branch, not the empty string: InTree(\"../x\") returns (\"../x\", false) and InTree(\"/abs/x\") returns (\"/abs/x\", false) — testlane buckets that string, so a delegation returning \"\" would silently change what lands in the escaped bucket",
    "InTree(\"a/../b\") returns (\"b\", true); InTree(\".\") returns (\".\", true) and InTree(\"\") returns (\"\", true) — pathfence takes no position on dot or empty, so each caller's own policy stays visible at the call site rather than being buried here",
    "Segment(\"run id\", \"a/b\") and Segment(\"run id\", \"..\") both error; Segment(\"run id\", \"run-123\") returns nil",
    "Contain never touches the filesystem: with root naming a directory that does not exist, \"report.md\" is still accepted",
    "A symlink under root pointing outside is ACCEPTED, in a test named for the symlink_resolution lock, so the documented lexical limit is pinned rather than assumed",
    "InTree returns slash form on every platform: InTree(`a\\b/../c`) returns (\"a/c\", true), so the choice between path.Clean and filepath.Clean is pinned rather than left to whichever separator the test machine happens to use",
  ]
  status = "pending"

[[task]]
  id    = "t-2"
  wave  = 1
  title = "Declare the path-shaped field registry"
  files = [
    "internal/pathfence/fields.go",
    "internal/pathfence/fields_test.go",
  ]
  description = """
Fields declares one entry per path-shaped .dross schema field: Struct, Field,
toml key, Artifact, and a Disposition of exactly Consumed (naming the routing
function) or NotConsumed (with Why and the reader sites allowed to touch it).
Disposition classifies READERS — a field nothing opens is NotConsumed even if a
validator gates it at write time, because t-10 defines a join site by its file
I/O. This is the artifact t-9 and t-10 both judge against.
"""
  covers = ["c-6"]
  test_contract = [
    "Every entry carries Struct, Field, Artifact and exactly one Disposition; an entry with neither or both fails",
    "A NotConsumed entry with an empty Why fails, and one naming no allowed reader fails",
    "A duplicate Struct+Field pair fails as a double declaration",
    "Fields covers by name at minimum changes.TaskRecord.Files, changes.RedProof.Doc, verify.Scope.Files, phase.Task.Files, project.Env.Files, project.Paths.{Source,Tests,E2E,Migrations,Schemas,I18n,Public} and project.TestLane.Match — asserted by name, so deleting a declaration to make a later guard pass fails here first",
    "The three path-shaped-by-tag-but-not-by-meaning fields t-9's walker will reach — verify.Scope.Source (an enum label), verify.LanguageRun.Files (tool output paths) and verify.CriterionResult.Tests (test names) — each carry a NotConsumed entry whose Why names why the tag is misleading, so the walker's false positives are declared rather than special-cased in the walker",
    "phase.Task.Files is declared NotConsumed with a Why naming ValidatePlan as a write-time gate that opens nothing, and the two print-only readers (internal/cmd/task.go, internal/cmd/issue_task.go) as its allowed readers",
    "changes.TaskRecord.Files and verify.Scope.Files are both declared Consumed naming verify.ValidateRecorded as their routing function — the entry t-10's guarded-set rule resolves through, so a Consumed entry naming a function that does not exist fails here before t-10 reports it as an unguarded site",
  ]
  status = "pending"

