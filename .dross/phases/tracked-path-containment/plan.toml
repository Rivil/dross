    "The refusal message names the path, plan.toml as the artifact, and the repo root, so a hand-edited plan.toml is fixable from the message alone",
    "A containment defect is reported ALONGSIDE a duplicate-task-id defect in one error rather than short-circuiting it, preserving ValidatePlan's report-everything-at-once contract",
    "`dross task add --files ../x` refuses and leaves plan.toml byte-unchanged, asserted by hash — saveIfValid's write must stay behind the gate",
