    "internal/remote/remote_test.go",
  ]
  description = """
testlane.normalize's ".." arm becomes pathfence.InTree, keeping its own
empty-path-is-in-tree arm and its absolute handling; remote.RunDir's segment
test becomes pathfence.Segment, still wrapped in ErrUnsafeTarget.

The testlane half is what keeps t-10's literal scan exemption-free: match.go:141
sits two lines under a path.Clean and is squarely inside the scan's marker set,
so leaving it would force a carve-out. The remote half is worth doing on merit —
one containment rule, not two — but remote.go:329's shape (path.Base plus a ".."
equality) is only caught once t-10's marker set is widened to include path.Base,
so it is not load-bearing for the exemption-free claim.
"""
  covers = ["c-1"]
  test_contract = [
    "testlane still classifies \"../x.go\" and \"/abs/x.go\" into the escaped bucket rather than Unmatched — the distinction a naive delegation loses — and still resolves \"docs/../a.go\" to in-tree \"a.go\"",
    "The escaped bucket still receives the CLEANED path: \"internal/../../x\" buckets as \"../x\", so a delegation that discards InTree's false-branch string fails",
    "An empty testlane path is still in-tree so it surfaces as Unmatched rather than as an escape, and \".\" is still in-tree — testlane's own policy, asserted here because pathfence takes no position on either",
    "remote.RunDir(\"..\") and remote.RunDir(\"a/b\") still return errors matching errors.Is(err, ErrUnsafeTarget), so a delegation returning a bare pathfence error — which would break every caller that distinguishes a refusal from a transport failure — fails",
    "remote.RunDir(\"run-123\") still returns \".dross-runs/run-123\"",
  ]
  status = "pending"

