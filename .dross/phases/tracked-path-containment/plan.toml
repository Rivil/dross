  description = "ValidatePlan (plan_edit.go:82) gains a repo-root parameter and runs each task's\n`files` entries through pathfence.Contain, folding any escape into the existing\none-error-lists-every-defect report. Its single non-test caller, saveIfValid\n(task.go:438), threads the root through. This is the write-side gate for\nplan.toml task files that the artifact_scope lock calls for — it validates and\nnever opens, which is why t-2 declares phase.Task.Files NotConsumed.\n"
