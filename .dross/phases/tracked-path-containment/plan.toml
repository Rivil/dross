[[task]]
  id         = "t-5"
  wave       = 2
  depends_on = ["t-1"]
  title      = "Hard-fail escaping changes.json paths in verify"
  files = [
    "internal/verify/scope.go",
    "internal/verify/scope_test.go",
    "internal/cmd/verifyscope.go",
    "internal/cmd/verifyscope_test.go",
    "internal/cmd/verify.go",
    "internal/cmd/verify_scoping_test.go",
  ]
  description = """
ValidateRecorded(root, paths) runs every changes.json task file through
pathfence.Contain and returns a hard error on the first escape. phaseScope
(verifyscope.go:24) changes from returning *verify.Scope to (*verify.Scope,
error) — its 8 test call sites in verifyscope_test.go move with it — and both
verify entry paths propagate: the attached one (phaseScope at verify.go:82,
feeding mutationCandidates at :90) and the detached finish/collect one
(phaseScope at verify.go:587, feeding mutationCandidates at :588). The refusal
therefore precedes phaseScope, mutationCandidates and DetachSteps.
NormalizePath's own ".." literal is replaced by pathfence.InTree, keeping its
local root-stripping and its dot-is-out arm. mutationCandidates also calls
pathfence.Stat rather than os.Stat, taking the []pathfence.Contained that
ValidateRecorded returns instead of a []string — so the path that reaches the
filesystem is one the check constructed, and a caller that hands it raw strings
fails to build. NewScope's signature is unchanged; internal/verify stays
I/O-free, since Contain does no I/O and the seam is only called from
internal/cmd.
"""
  covers = ["c-2", "c-5"]
  test_contract = [
    "ValidateRecorded(root, [\"../x.go\"]) errors naming \"../x.go\", \"changes.json\" and the root; the returned scope is nil and Degraded is untouched — a regression to the soft lane is a failure, not a passing variation (escape_failure_mode lock)",
    "`dross verify` over such a changes.json exits non-zero, writes NO tests.json and NO verify.toml, and errors BEFORE mutationCandidates — proved by seeding a REAL file at ../x.go outside the repo, so a run that reached os.Stat would have succeeded and dispatched it",
    "The escaping path does NOT appear in the `gone` skip list: a fixture with one valid file and one \"../x.go\" errors out rather than verifying one and recording one skip",
    "The git lane is unchanged: a git-supplied out-of-repo path still lands in Degraded as an ignored out-of-repo path rather than aborting, so the hard rule is not over-applied",
    "The detached finish/collect path refuses on the same fixture, so guarding only the attached call site leaves a red test",
    "NormalizePath(\"../x\"), (\"/other/tree\") and (\".\") still return ok=false with Contains false for each — the dot case is asserted explicitly, since pathfence.InTree calls dot in-tree and this caller must keep its own answer",
    "mutationCandidates takes []pathfence.Contained: a fixture passing it raw strings is asserted to fail to compile, so the escaping-path refusal cannot be bypassed by a future caller that skips ValidateRecorded",
  ]
  status = "pending"

