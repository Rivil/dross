[[task]]
  id = "t-7"
  wave = 2
  title = "Route testlane and remote checks through pathfence"
  files = ["internal/testlane/match.go", "internal/testlane/match_test.go", "internal/remote/remote.go", "internal/remote/remote_test.go"]
  description = "testlane.normalize's \"..\" arm becomes pathfence.InTree, keeping its own\nempty-path-is-in-tree arm and its absolute handling; remote.RunDir's segment\ntest becomes pathfence.Segment, still wrapped in ErrUnsafeTarget.\n\nThe testlane half is what keeps t-10's literal scan exemption-free: match.go:141\nsits two lines under a path.Clean and is squarely inside the scan's marker set,\nso leaving it would force a carve-out. The remote half is worth doing on merit —\none containment rule, not two — but remote.go:329's shape (path.Base plus a \"..\"\nequality) is only caught once t-10's marker set is widened to include path.Base,\nso it is not load-bearing for the exemption-free claim.\n\nTWO ARMS THE DELEGATION MUST NOT SWALLOW:\n\n  - remote.RunDir(\"\") errors with \"empty run id\" BEFORE the segment test.\n    pathfence.Segment rejects empty too (t-1), but the message is the caller's,\n    so the arm stays at the call site and is asserted here rather than assumed\n    to survive.\n  - testlane's absolute arm is `filepath.IsAbs(p) || strings.HasPrefix(s, \"/\")`\n    (match.go:137, with the reason at :134). The first disjunct exists for\n    WINDOWS DRIVE-LETTER paths, and pathfence's unconditional backslash-to-slash\n    fold makes path.IsAbs(\"C:/x\") false — so InTree alone does NOT classify\n    \"C:\\x\" as out-of-tree. testlane keeps its own filepath.IsAbs disjunct.\n    This is NOT asserted: filepath.IsAbs(\"C:\\x\") is false on darwin too, so\n    testlane buckets it in-tree here with or without the disjunct, and CI is\n    ubuntu-only. A test would pass identically against a delegation that dropped\n    the arm, which is worse than no test. The disjunct stays, documented at\n    match.go:134, and the risk is recorded rather than falsely covered.\n"
  covers = ["c-1"]
  depends_on = ["t-1"]
  test_contract = ["testlane still classifies \"../x.go\" and \"/abs/x.go\" into the escaped bucket rather than Unmatched — the distinction a naive delegation loses — and still resolves \"docs/../a.go\" to in-tree \"a.go\"", "The escaped bucket still receives the CLEANED path: \"internal/../../x\" buckets as \"../x\", so a delegation that discards InTree's false-branch string fails", "An empty testlane path is still in-tree so it surfaces as Unmatched rather than as an escape, and \".\" is still in-tree — testlane's own policy, asserted here because pathfence takes no position on either", "remote.RunDir(\"..\") and remote.RunDir(\"a/b\") still return errors matching errors.Is(err, ErrUnsafeTarget), so a delegation returning a bare pathfence error — which would break every caller that distinguishes a refusal from a transport failure — fails", "remote.RunDir(\"run-123\") still returns \".dross-runs/run-123\"", "remote.RunDir(\"\") still errors naming \"empty run id\" and matching errors.Is(err, ErrUnsafeTarget), so routing the segment test through pathfence cannot replace a specific empty-id message with a generic segment refusal"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 3
  title = "Contain the red-proof doc on read and repoint paths"
  files = ["internal/cmd/redproof_repoint.go", "internal/cmd/redproof_repoint_test.go", "internal/cmd/redproof.go", "internal/cmd/redproof_test.go", "internal/cmd/doctor.go", "internal/cmd/doctor_test.go", "internal/cmd/hostile_config_test.go", "internal/cmd/redproof_lifecycle_test.go", "internal/cmd/redproof_repoint_cmd_test.go", "internal/cmd/redproof_set_test.go"]
  description = "redproof_repoint.go:143 joins p.Doc — loaded from changes.json — onto\np.repoDir and then rewrites that file; redproof.go:146 (redProofDocSHA) reads\nit the same way. checkRedProofDoc guards only `red-proof set`, so a hand-edited\nred_proof.doc reaches a write outside the repo today. Both joins go through\npathfence.Contain with \"changes.json red_proof.doc\" as the artifact, refusing\nbefore the plan is returned. redProofPin.Doc and redProofRepointPlan.Doc change\nfrom string to pathfence.Contained, so the containment is carried by the value\nrather than re-derived at each reader — this is the field whose readers copy it\ninto a cmd-local struct, which is exactly the shape an AST scan cannot follow\nand the type system can. discoverRedProofPins constructs each pin by calling\nContain. redProofDocSHA takes a Contained and reads through the seam.\n\nNeither struct is serialized — redproof.go:103-107 and redproof_repoint.go:41-53\ncarry no struct tags and nothing marshals them — so typing their Doc field is\nsafe in a way typing changes.RedProof.Doc would not be.\n\nTHE REAL I/O SITE. applyRedProofRepoint is where the file is actually opened,\nand it is the site that moves to the seam: redproof_repoint.go:142 builds\n`docPath := filepath.Join(p.repoDir, filepath.FromSlash(p.Doc))` and then makes\nFIVE os calls on it — os.Stat (:143), os.ReadFile (:147), os.WriteFile (:155)\nand the rollback os.WriteFile (:164). The join disappears (p.Doc is already a\nContained) and all five go through pathfence.Stat / ReadFile / WriteFile. This\nis the task's centre of gravity, not redProofRewriteDoc.\n\nFOUR EXISTING CONSUMERS need the repo-relative string and are accounted for\nhere rather than discovered during execution. All four want the RELATIVE form, so all four use Contained.Rel() (t-1) —\nnot String(), which is the joined absolute path:\n\n  - hostile_config_test.go:435 `if p.Doc == want` — Contained is not comparable\n    to a string; becomes p.Doc.Rel() == want. This is why that file joins\n    this task's file list.\n  - redproof_repoint.go:121 `filepath.ToSlash(pin.Doc)` populates\n    redProofRepointPlan.Files, documented at :47-49 as repo-relative — becomes\n    pin.Doc.Rel(), which already IS repo-relative slash form, so the\n    ToSlash call goes away rather than being adapted.\n  - redProofRewriteDoc (redproof_doc.go:34) takes `doc, body, oldSHA, newSHA\n    string` and does NO file I/O — it receives the already-read body and uses\n    `doc` only in its error messages. Its signature is left alone; the call at\n    redproof_repoint.go:151 passes p.Doc.Rel().\n  - redproof_repoint.go:146/:150/:156 format p.Doc with %s — these format p.Doc.Rel() rather than the\n    Contained itself — String() is now the absolute form, so a bare %s of the\n    value WOULD leak one machine's layout into operator-facing errors.\n\nWHERE AN ESCAPING PIN SURFACES — decided 2026-09-07, not left to the executor.\ndiscoverRedProofPins calls Contain on every pin it reads and returns an ERROR on\nthe first escape, so the refusal happens at discovery and the whole red-proof\ncheck aborts. This is escape_failure_mode applied to doctor: a changes.json\ncarrying an escaping doc is a corrupt artifact, and a corrupt artifact stops the\nrun rather than being reported per-pin beside sound ones.\n\nContain needs a repo root that discoverRedProofPins does not take as a\nparameter, and it does NOT gain one: `root` is the .dross dir, so repoDir is\nfilepath.Dir(root) — the convention already documented at doctor.go:48 (\"root is\n.dross; parent is repo cwd\") and used at architecture.go:36 and issue.go:156.\nAdding a parameter instead would touch all 11 discoverRedProofPins call sites\nfor nothing.\n\nTHE ACCEPTED REGRESSION, declared rather than discovered: redProofChecks\n(doctor.go:566-570) returns a SINGLE doctorLine on a discovery error and drops\nevery pin, so one escaping doc suppresses every other pin's verdict in doctor\noutput. That is the cost of aborting at discovery and it is accepted, not\noverlooked — the alternative (a per-pin refusal that lets doctor keep reporting)\nwas considered and rejected as the softer lane. The message arm at :568 gets the\ncontainment wording so the operator can tell a corrupt path from an unreadable\nfile; doctor.go:604-608's \"which cannot be read\" arm is NOT touched, because a\npin that fails at discovery never reaches it.\n"
  covers = ["c-2", "c-3", "c-5"]
  depends_on = ["t-1", "t-4"]
  test_contract = ["A changes.json with red_proof.doc = \"../../victim.md\" makes `dross phase red-proof repoint --apply` refuse with a message naming the doc, changes.json and the repo root, and leaves the outside file byte-identical — asserted by hash, so an unguarded build that rewrites it in place fails, and so does a guard placed after os.WriteFile", "The dry-run path refuses too: a plan that prints an escaping doc as \"would write\" is a refusal the operator never gets", "discoverRedProofPins returns an error on the escaping pin, so redProofDocSHA is NEVER REACHED for it — asserted by a counter or a stub proving the doc read did not happen, since once redProofDocSHA takes a Contained no test can hand it an escaping doc and an assertion phrased as \"redProofDocSHA returns a containment error\" could not be written at all", "doctor over a record with one escaping pin prints the containment refusal at the discovery arm (doctor.go:568) naming the doc, changes.json and the repo root — NOT the \"which cannot be read\" wording at :604-608, which that pin never reaches", "A contained doc still repoints, still hashes and still passes doctor, so the guard did not break the working path", "discoverRedProofPins constructs its pins by calling Contain, so redProofPin.Doc cannot be populated from an unchecked string — assertDoesNotCompile (t-1's helper) over a fixture assigning a raw string to that field requires the build to fail naming the type mismatch, which is the guarantee the previous AST-scan design could not deliver for this field", "redProofRepointPlan.Files stays REPO-RELATIVE after the retype: the plan built for an in-tree doc lists \"docs/x.md\" and not an absolute path, asserted on the exact string, so a conversion that reached for the joined form fails here rather than shipping absolute paths into a list documented as repo-relative", "The repoint error messages at redproof_repoint.go:146/:150/:156 print the repo-relative doc: asserted with strings.Contains for the relative form and a NotContains for the repo root, so a Contained formatted without Rel() cannot start leaking one machine's layout into operator output", "applyRedProofRepoint makes no direct os.* call on the doc: asserted by t-10's scan over the post-fix file plus a must-trip testdata fixture reproducing the filepath.Join + os.WriteFile shape, so the rollback write at :164 cannot be left behind as the one unguarded path — it is the call a partial adoption is most likely to miss", "The accepted regression is pinned as a test, not left as prose: a fixture with one escaping pin and one SOUND pin produces exactly one doctor line and no verdict for the sound pin, so a later change that quietly softens discovery into a per-pin skip — restoring the other verdicts — goes red and has to be argued for rather than slipped in"]
  status = "done"

[[task]]
  id = "t-9"
  wave = 2
  title = "Guard: every path-shaped schema field is declared"
  files = ["internal/cmd/pathfence_fields_test.go"]
  description = "AST walk over internal/project, internal/phase, internal/changes and\ninternal/verify collecting every struct field whose toml or json tag is\npath-shaped (files, doc, path, source, tests, e2e, migrations, schemas, i18n,\npublic, match) AND whose type is string or []string — the type test drops\nproject.Remote.Public (a bool) without a carve-out. Compared against\npathfence.Fields in both directions.\n\nThe walker must SPLIT the tag on \",\" and match the first component: every field\nit has to find in internal/project is tagged with an option —\nproject.go:274-280 carry `toml:\"source,omitempty\"` and siblings, project.go:284\ncarries `toml:\"files,omitempty\"`. A naive exact-match on the whole tag value\nfinds none of them, and the vacuity guard is the only thing that would catch it.\n"
  covers = ["c-6"]
  depends_on = ["t-2"]
  test_contract = ["A path-shaped struct field with no Fields entry fails, named by struct.field and toml key", "The reverse fails: a Fields entry naming a struct or field that no longer exists reports \"stale declaration\", so a field renamed out from under a NotConsumed entry cannot leave a stale promise", "The string/[]string type test is asserted directly: a bool field tagged `toml:\"public\"` is NOT reported, so the rule that drops project.Remote.Public is falsifiable rather than incidental", "Tag options are stripped: a fixture field tagged `toml:\"files,omitempty\"` is found by the walker exactly as one tagged `toml:\"files\"` is, so the option-carrying form that EVERY real internal/project field uses cannot silently fall out of the walk and leave the vacuity guard as the only witness", "Walker self-test over an in-test source fixture: a struct with `toml:\"doc\"` is found and one with `toml:\"replay\"` is not, so a walker that silently stops finding fields fails on its own fixture instead of passing vacuously", "Vacuity guard: the walk finds at least 10 path-shaped fields, mirroring TestGuardsSeeNonEmptySets"]
  status = "done"

[[task]]
  id = "t-10"
  wave = 4
  title = "Residual guard: no raw os.* on a declared path field"
  files = ["internal/cmd/pathfence_enum_test.go", "internal/cmd/pathfence_carrier_test.go", "internal/cmd/testdata/pathfence_scan/unwrap_os.go.txt", "internal/cmd/testdata/pathfence_scan/seam_ok.go.txt", "internal/cmd/testdata/pathfence_scan/rundir_revert.go.txt", "internal/cmd/testdata/pathfence_scan/dotdot_path.go.txt", "internal/cmd/testdata/pathfence_scan/dotdot_revrange.go.txt"]
  description = "Two halves, both of them things the type system cannot assert from inside\ninternal/pathfence.\n\nHALF ONE — the carrier assertion (the load-bearing half of c-4). t-2 declares\neach Consumed field's Carrier by name; this asserts the named carrier is really\ntyped pathfence.Contained. It lives here, in a `package cmd` test, because that\nis the only place the symbols are visible: internal/cmd imports pathfence, so a\npathfence test importing internal/cmd back is a cycle, and discoverRedProofPins\nis unexported besides. A small binding table maps each Carrier name to a\nreflect value the test can hold — containScope to reflect.TypeOf(containScope),\nredProofPin.Doc to reflect.TypeOf(redProofPin{}) — and reflection over a\nfunction VALUE needs no go/types. The table carries its own vacuity guard: a\nConsumed entry with no binding fails, so a new entry cannot claim the check\nwithout being asserted.\n\nHALF TWO — two ast scans (go/parser + go/ast, no type checking):\n\n  (a) Unwrap ban: within internal/cmd, internal/verify, internal/phase,\n      internal/changes, internal/testlane, internal/remote, internal/security\n      and internal/quality — EIGHT packages. The last two are there because t-3\n      moves the run-dir os.Create/read/write calls into them; a scan set that\n      stopped at six would miss the exact sites this phase newly contains,\n      which is where c-4's residual clause has to bite hardest. An os.Stat /\n      os.Open / os.ReadFile / os.WriteFile / os.Remove call with a `.String()`\n      OR `.Rel()` call anywhere in an argument is reported. BOTH accessors are\n      banned, for different reasons: .String() is the openable absolute form,\n      so the call would WORK and the ban is policy — the seam is the audited\n      way in; .Rel() is root-relative, so the call would resolve against the\n      process working directory and is an outright bug. Banning only one would\n      leave the more dangerous of the two legal. This is TYPE-BLIND and stated\n      as such: ast alone cannot tell a Contained from a strings.Builder, so the\n      rule is a flat ban on `.String()` and `.Rel()` inside an os.* argument in\n      those eight packages, and it is fail-closed by design. A legitimate buffer write in\n      a scanned package routes through the seam or assigns to a variable\n      first. Non-test files ONLY — mutation_remote_wiring_test.go:47 is a live\n      strings.Builder instance of the banned shape, and walking tests would\n      make the scan red on arrival.\n\n  (b) Literal scan: the \"..\" path-context comparisons this phase removes.\n\nEvery must-trip and must-not-trip case is a testdata/*.go.txt fixture, not an\nassertion about the live tree. A scan calibrated on its own post-fix output\nproves only that it was written after the fix; fixtures make it falsifiable\nnow and keep it falsifiable when the tree moves.\n\nWHAT THIS DOES NOT CATCH, so c-4 is not read as wider than it is: a brand-new\nconsumer that loads a path field and calls os.ReadFile on the raw string,\nnever touching Contained at all. That needs dataflow over resolved types\n(go/types), and it is filed as a deferred item against secret-detection. c-4's\nresidual clause was reworded to the unwrap case this scan does cover.\n"
  covers = ["c-1", "c-4", "c-6"]
  depends_on = ["t-4", "t-5", "t-6", "t-7", "t-8", "t-9", "t-11"]
  test_contract = ["Carrier vacuity: every Consumed entry in pathfence.Fields has a binding in this test's table, asserted by iterating Fields rather than the table — so adding a Consumed entry without an assertion fails here instead of passing unmeasured", "containScope's first return type is []pathfence.Contained, by reflection over the function value — a revert to []string fails, which is what makes verify.Scope.Files' and changes.TaskRecord.Files' Consumed disposition a fact about the code rather than a promise about it", "redProofPin's Doc field is typed pathfence.Contained, by reflection over the struct type — a revert to string fails, closing the field an AST dataflow scan could not follow", "A testdata fixture calling os.ReadFile(c.String()) is reported, naming file:line — the call would succeed at runtime, so nothing but the scan catches a site quietly bypassing the seam", "A testdata fixture calling os.ReadFile(c.Rel()) is ALSO reported: that form resolves against the process working directory rather than the containment root, so it is a wrong-file bug and not merely an unaudited path. A scan that banned only .String() would let the worse of the two through", "A testdata fixture calling pathfence.ReadFile(c) is NOT reported, so the scan distinguishes the seam from the escape rather than banning all I/O", "A testdata fixture reproducing the security.go / quality.go run-dir writer as os.WriteFile with an unwrapped path IS reported — a must-trip fixture, not an assertion about the post-fix tree, so a regression reintroducing that shape goes red even after the live sites are clean", "The scan is asserted to be TYPE-BLIND and fail-closed, not merely documented as such: a testdata fixture writing os.WriteFile(p, []byte(b.String()), 0o644) with b a strings.Builder IS reported, and the test names the remedy (route through the seam, or assign before the call). A scan that tried to exempt this shape would need go/types and would silently exempt the real one too", "The scan walks non-test files only: an identical unwrapping call in a fixture named *_test.go.txt is NOT reported, so the live strings.Builder at internal/cmd/mutation_remote_wiring_test.go:47 cannot make the guard red on arrival", "Literal scan: any \"..\" comparison in a path context (adjacent to filepath.Separator, os.PathSeparator, \"../\", path.Clean, path.Base, filepath.Rel or filepath.IsAbs) outside internal/pathfence fails, naming file:line", "The two shapes this phase removes are testdata fixtures the scan MUST trip — security.go's os.PathSeparator form and remote.go's path.Base form — since neither matches a marker set calibrated only on the post-fix tree, and a regression reintroducing either must go red", "The two legal non-path \"..\" shapes are recognised BY SHAPE, not by an exemption list — git rev-list ranges are string concatenation (a+\"..\"+b, at topology.go, basebranch.go, doctor.go and milestone.go), refguard's is strings.Contains over a ref name with no path call nearby — and both are testdata fixtures that must NOT trip the scan, so the shape rule is itself tested", "Walker self-tests: a fixture with one unwrapping call and one seam call yields exactly the unwrapping one, and a fixture whose call was refactored out reports an error rather than an empty set", "Vacuity guard: the literal walk finds at least one \"..\" literal (inside internal/pathfence) and the raw-string walk visits at least one file in each of the eight named packages, so a walk that silently stops visiting fails rather than passing green"]
  status = "done"
