    "internal/cmd/doctor_test.go",
  ]
  description = """
redproof_repoint.go:143 joins p.Doc — loaded from changes.json — onto p.repoDir
and then rewrites that file; redproof.go:146 (redProofDocSHA) reads it the same
way. checkRedProofDoc guards only `red-proof set`, so a hand-edited
red_proof.doc reaches a write outside the repo today. Both joins go through
pathfence.Contain with "changes.json red_proof.doc" as the artifact, refusing
