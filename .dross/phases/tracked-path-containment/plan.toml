[[task]]
  id         = "t-10"
  wave       = 3
  depends_on = ["t-3", "t-4", "t-5", "t-6", "t-7", "t-8", "t-9"]
  title      = "Guard: every join site routes through pathfence"
  files = ["internal/cmd/pathfence_enum_test.go"]
  description = """
Two derived scans, no hand-maintained site list. Modelled on
enum_divergence_test.go: go/parser + go/ast, no x/tools.

A join site is GUARDED when its body calls pathfence.* OR calls a routing
function named by a Consumed entry in pathfence.Fields. The second arm is
required, not a convenience: after t-5 the two live readers — the `dross verify`
RunE closure (verify.go:57-146, reads rec.Files at :74 and scope.Files at :90)
and collectDetached (verify.go:518, reads r.Files at :585 and scope.Files at
:587) — route through verify.ValidateRecorded, which is where the pathfence call
lives. A literal pathfence.*-only rule would report both as unguarded on correct
code. The accepted set is derived from the registry, which t-9 already guards,
so it is not the hand-maintained list c-4 forbids.

Selector disambiguation: `.Files` is not unique to the declared structs — it
also sits on redProofRepointPlan, mutation.Result and verify.LanguageRun. The
scan matches a selector only when the receiver resolves to the declaring
package's type, so a same-named field on an undeclared struct is not reported.

Known limit, stated here so c-4 is not read as wider than the mechanism: the
scan is ONE HOP — it matches a function that both reads a declared field's
selector and performs file I/O. A chain that passes the value through an
intermediate function or struct is not followed. mutationCandidates is an
example rather than a counter-example: it takes files []string and reads no
selector, so it is never in the scanned set at all, and what covers the
motivating chain is the ValidateRecorded call in the two reader functions above.
A future consumer that launders a path through two hops still escapes the scan.
"""
  covers = ["c-1", "c-4"]
  test_contract = [
    "Join-site scan: for every pathfence.Fields entry, any non-test function that reads that field's selector AND calls filepath.Join / os.Stat / os.Open / os.ReadFile / os.WriteFile / os.Remove fails unless its body calls pathfence.* OR a routing function named by a Consumed entry, naming the function",
    "The routing-function arm is asserted on the real code: the `dross verify` RunE closure and collectDetached both pass by calling verify.ValidateRecorded and neither calls pathfence directly, so a pathfence.*-only rule leaves two red sites on correct code",
    "A fixture reading a same-named `.Files` selector on a struct with no Fields entry is NOT reported, so the receiver-type disambiguation is falsifiable rather than incidental",
    "A NotConsumed entry that acquires such a consumer fails with \"declared not-consumed but <fn> opens it\" — c-6's stated failure mode (an env.files or testlane consumer added without routing) made falsifiable",
    "A Consumed entry whose named routing function does not appear among the guarded join sites fails, so \"consumed through the shared check\" is checked rather than asserted",
    "The one-hop limit is pinned by its own fixture: a two-hop launder (function A reads the selector, function B does the os.Stat) is asserted as NOT caught, so the limit is a documented, tested boundary rather than an unnoticed gap",
    "Literal scan: any \"..\" comparison in a path context (adjacent to filepath.Separator, os.PathSeparator, \"../\", path.Clean, path.Base, filepath.Rel or filepath.IsAbs) outside internal/pathfence fails, naming file:line",
    "The two shapes this phase removes are asserted as fixtures the scan MUST trip — security.go's os.PathSeparator form and remote.go's path.Base form — since neither matches the narrower marker set a scan calibrated only on the post-fix tree would carry, and a regression reintroducing either must go red",
    "The two legal non-path \"..\" shapes are recognised BY SHAPE, not by an exemption list — git rev-list ranges are string concatenation (a+\"..\"+b, at topology.go, basebranch.go, doctor.go and milestone.go), refguard's is strings.Contains over a ref name with no path call nearby — and both shapes are asserted as fixtures that must NOT trip the scan, so the shape rule is itself tested",
    "Walker self-tests: an in-test fixture with one guarded and one unguarded consumer yields exactly the unguarded one, and a fixture whose consumer was refactored out reports an error rather than an empty set",
    "Vacuity guard: the walk finds at least one join site per Consumed entry and at least one \"..\" literal (inside internal/pathfence)",
  ]
  status = "pending"
