Delete containedPath (security.go:188) and repoint all eight call sites —
security.go:45,152,160,204 and quality.go:39,122,130,150 — at pathfence.Contain
with the run dir as root and "run directory" as the artifact. Each site keeps
the returned Contained and writes through pathfence.WriteFile rather than
unwrapping it to a string, so the type is load-bearing at these sites rather
than decorative. The two duplicated test blocks (security_test.go:281,
quality_test.go:160) collapse onto the shared behaviour.
"""
