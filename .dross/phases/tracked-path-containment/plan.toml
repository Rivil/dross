[[task]]
  id         = "t-10"
  wave       = 3
  depends_on = ["t-3", "t-4", "t-5", "t-6", "t-7", "t-8", "t-9"]
  title      = "Residual guard: no raw os.* on a declared path field"
  files = ["internal/cmd/pathfence_enum_test.go"]
  description = """
The type system carries the enumeration now: every Consumed field is typed
pathfence.Contained, so a consumer that skips the check has no value to pass and
fails to build. t-2 asserts that typing. This task covers only what types cannot.

Two scans, both go/parser + go/ast, no type checking — the earlier design needed
receiver-type resolution that ast alone cannot do, and dropping the dataflow
ambition is what makes these buildable from the stated toolset:

  (a) Raw-string escape: within internal/cmd, internal/verify, internal/phase,
      internal/changes, internal/testlane and internal/remote, a call to
      os.Stat / os.Open / os.ReadFile / os.WriteFile / os.Remove whose argument
      is or contains a Contained unwrapped by .String() fails. This is a
      syntactic pattern on the call argument — no dataflow — and it is what stops
      the Contained type being reduced to decoration at an adopted site.

  (b) Literal scan: the ".." path-context comparisons this phase removes.

What this does NOT catch, stated so c-4 is not read as wider: a brand-new
consumer that loads a path field and calls os.ReadFile on the raw string,
never touching Contained at all. The type stops that only where the field is
typed Contained — which is why t-2's type assertion, not this scan, is the
load-bearing half of c-4.
"""
  covers = ["c-1", "c-4"]
  test_contract = [
    "A fixture calling os.ReadFile(c.String()) on a Contained is reported, naming file:line, so unwrapping the type to reach raw os.* is caught at every adopted site",
    "A fixture calling pathfence.ReadFile(c) is NOT reported, so the scan distinguishes the seam from the escape rather than banning all I/O",
    "The scan reports the security.go and quality.go run-dir writers if they are reverted to os.WriteFile with an unwrapped path, asserted as a must-trip fixture rather than only against the post-fix tree",
    "Literal scan: any \"..\" comparison in a path context (adjacent to filepath.Separator, os.PathSeparator, \"../\", path.Clean, path.Base, filepath.Rel or filepath.IsAbs) outside internal/pathfence fails, naming file:line",
    "The two shapes this phase removes are asserted as fixtures the scan MUST trip — security.go's os.PathSeparator form and remote.go's path.Base form — since neither matches a marker set calibrated only on the post-fix tree, and a regression reintroducing either must go red",
    "The two legal non-path \"..\" shapes are recognised BY SHAPE, not by an exemption list — git rev-list ranges are string concatenation (a+\"..\"+b, at topology.go, basebranch.go, doctor.go and milestone.go), refguard's is strings.Contains over a ref name with no path call nearby — and both are asserted as fixtures that must NOT trip the scan, so the shape rule is itself tested",
    "Walker self-tests: a fixture with one unwrapping call and one seam call yields exactly the unwrapping one, and a fixture whose call was refactored out reports an error rather than an empty set",
    "Vacuity guard: the literal walk finds at least one \"..\" literal (inside internal/pathfence) and the raw-string walk visits at least one file in each of the six named packages, so a walk that silently stops visiting fails rather than passing green",
  ]
  status = "pending"
