[[task]]
  id         = "t-8"
  wave       = 2
  depends_on = ["t-1"]
  title      = "Contain the red-proof doc on read and repoint paths"
  files = [
    "internal/cmd/redproof_repoint.go",
    "internal/cmd/redproof_repoint_test.go",
    "internal/cmd/redproof.go",
    "internal/cmd/redproof_test.go",
    "internal/cmd/doctor.go",
    "internal/cmd/doctor_test.go",
  ]
  description = """
redproof_repoint.go:143 joins p.Doc — loaded from changes.json — onto p.repoDir
and then rewrites that file; redproof.go:146 (redProofDocSHA) reads it the same
way. checkRedProofDoc guards only `red-proof set`, so a hand-edited
red_proof.doc reaches a write outside the repo today. Both joins go through
pathfence.Contain with "changes.json red_proof.doc" as the artifact, refusing
before the plan is returned. redProofRepointPlan.Doc and redProofPin.Doc change
from string to pathfence.Contained, so the containment is carried by the value
rather than re-derived at each reader — this is the field whose readers copy it
into a cmd-local struct, which is exactly the shape an AST scan cannot follow
and the type system can. redProofDocSHA takes a Contained and reads through the
seam.

doctor.go:604-608 already emits a doctorIssue on any redProofDocSHA error, so
the refusal surfaces with no change — but it frames it as "which cannot be
read: <err>", which mis-describes a containment refusal as an unreadable file.
That message arm splits: a containment error reports the escape, anything else
keeps the cannot-be-read wording.
"""
  covers = ["c-2", "c-3", "c-5"]
  test_contract = [
    "A changes.json with red_proof.doc = \"../../victim.md\" makes `dross phase red-proof repoint --apply` refuse with a message naming the doc, changes.json and the repo root, and leaves the outside file byte-identical — asserted by hash, so an unguarded build that rewrites it in place fails, and so does a guard placed after os.WriteFile",
    "The dry-run path refuses too: a plan that prints an escaping doc as \"would write\" is a refusal the operator never gets",
    "redProofDocSHA on the same doc returns a containment error, not an os.ReadFile error — asserted on the message, so a fix that merely relies on the file not existing fails",
    "doctor over that record reports the containment refusal as an escape rather than under the \"cannot be read\" wording, so the two failure kinds stay distinguishable to the operator reading doctor output",
    "A contained doc still repoints, still hashes and still passes doctor, so the guard did not break the working path",
    "discoverRedProofPins constructs its pins by calling Contain, so redProofPin.Doc cannot be populated from an unchecked string — a fixture assigning a raw string to that field is asserted to fail to compile, which is the guarantee the previous AST-scan design could not deliver for this field",
  ]
  status = "pending"

