[[task]]
  id = "t-10"
  wave = 3
  title = "Residual guard: no raw os.* on a declared path field"
  files = ["internal/cmd/pathfence_enum_test.go", "internal/cmd/pathfence_carrier_test.go", "internal/cmd/testdata/pathfence_scan/unwrap_os.go.txt", "internal/cmd/testdata/pathfence_scan/seam_ok.go.txt", "internal/cmd/testdata/pathfence_scan/rundir_revert.go.txt", "internal/cmd/testdata/pathfence_scan/dotdot_path.go.txt", "internal/cmd/testdata/pathfence_scan/dotdot_revrange.go.txt"]
  description = "Two halves, both of them things the type system cannot assert from inside\ninternal/pathfence.\n\nHALF ONE — the carrier assertion (the load-bearing half of c-4). t-2 declares\neach Consumed field's Carrier by name; this asserts the named carrier is really\ntyped pathfence.Contained. It lives here, in a `package cmd` test, because that\nis the only place the symbols are visible: internal/cmd imports pathfence, so a\npathfence test importing internal/cmd back is a cycle, and discoverRedProofPins\nis unexported besides. A small binding table maps each Carrier name to a\nreflect value the test can hold — containScope to reflect.TypeOf(containScope),\nredProofPin.Doc to reflect.TypeOf(redProofPin{}) — and reflection over a\nfunction VALUE needs no go/types. The table carries its own vacuity guard: a\nConsumed entry with no binding fails, so a new entry cannot claim the check\nwithout being asserted.\n\nHALF TWO — two ast scans (go/parser + go/ast, no type checking):\n\n  (a) Unwrap ban: within internal/cmd, internal/verify, internal/phase,\n      internal/changes, internal/testlane and internal/remote, an os.Stat /\n      os.Open / os.ReadFile / os.WriteFile / os.Remove call with a `.String()`\n      call anywhere in an argument is reported. This is TYPE-BLIND and stated\n      as such: ast alone cannot tell a Contained from a strings.Builder, so the\n      rule is a flat ban on `.String()` inside an os.* argument in those six\n      packages, and it is fail-closed by design. A legitimate buffer write in\n      a scanned package routes through the seam or assigns to a variable\n      first. Non-test files ONLY — mutation_remote_wiring_test.go:47 is a live\n      strings.Builder instance of the banned shape, and walking tests would\n      make the scan red on arrival.\n\n  (b) Literal scan: the \"..\" path-context comparisons this phase removes.\n\nEvery must-trip and must-not-trip case is a testdata/*.go.txt fixture, not an\nassertion about the live tree. A scan calibrated on its own post-fix output\nproves only that it was written after the fix; fixtures make it falsifiable\nnow and keep it falsifiable when the tree moves.\n\nWHAT THIS DOES NOT CATCH, so c-4 is not read as wider than it is: a brand-new\nconsumer that loads a path field and calls os.ReadFile on the raw string,\nnever touching Contained at all. That needs dataflow over resolved types\n(go/types), and it is filed as a deferred item against secret-detection. c-4's\nresidual clause was reworded to the unwrap case this scan does cover.\n"
  covers = ["c-1", "c-4", "c-6"]
  depends_on = ["t-3", "t-4", "t-5", "t-6", "t-7", "t-8", "t-9"]
  test_contract = ["Carrier vacuity: every Consumed entry in pathfence.Fields has a binding in this test's table, asserted by iterating Fields rather than the table — so adding a Consumed entry without an assertion fails here instead of passing unmeasured", "containScope's first return type is []pathfence.Contained, by reflection over the function value — a revert to []string fails, which is what makes verify.Scope.Files' and changes.TaskRecord.Files' Consumed disposition a fact about the code rather than a promise about it", "redProofPin's Doc field is typed pathfence.Contained, by reflection over the struct type — a revert to string fails, closing the field an AST dataflow scan could not follow", "A testdata fixture calling os.ReadFile(c.String()) is reported, naming file:line, so unwrapping the type to reach raw os.* is caught at every adopted site", "A testdata fixture calling pathfence.ReadFile(c) is NOT reported, so the scan distinguishes the seam from the escape rather than banning all I/O", "A testdata fixture reproducing the security.go / quality.go run-dir writer as os.WriteFile with an unwrapped path IS reported — a must-trip fixture, not an assertion about the post-fix tree, so a regression reintroducing that shape goes red even after the live sites are clean", "The scan is asserted to be TYPE-BLIND and fail-closed, not merely documented as such: a testdata fixture writing os.WriteFile(p, []byte(b.String()), 0o644) with b a strings.Builder IS reported, and the test names the remedy (route through the seam, or assign before the call). A scan that tried to exempt this shape would need go/types and would silently exempt the real one too", "The scan walks non-test files only: an identical unwrapping call in a fixture named *_test.go.txt is NOT reported, so the live strings.Builder at internal/cmd/mutation_remote_wiring_test.go:47 cannot make the guard red on arrival", "Literal scan: any \"..\" comparison in a path context (adjacent to filepath.Separator, os.PathSeparator, \"../\", path.Clean, path.Base, filepath.Rel or filepath.IsAbs) outside internal/pathfence fails, naming file:line", "The two shapes this phase removes are testdata fixtures the scan MUST trip — security.go's os.PathSeparator form and remote.go's path.Base form — since neither matches a marker set calibrated only on the post-fix tree, and a regression reintroducing either must go red", "The two legal non-path \"..\" shapes are recognised BY SHAPE, not by an exemption list — git rev-list ranges are string concatenation (a+\"..\"+b, at topology.go, basebranch.go, doctor.go and milestone.go), refguard's is strings.Contains over a ref name with no path call nearby — and both are testdata fixtures that must NOT trip the scan, so the shape rule is itself tested", "Walker self-tests: a fixture with one unwrapping call and one seam call yields exactly the unwrapping one, and a fixture whose call was refactored out reports an error rather than an empty set", "Vacuity guard: the literal walk finds at least one \"..\" literal (inside internal/pathfence) and the raw-string walk visits at least one file in each of the six named packages, so a walk that silently stops visiting fails rather than passing green"]
  status = "pending"
