  test_contract = [
    "grep for \"func containedPath\" across internal/ finds nothing — the second implementation is gone, not merely unused",
    "Every case containedPath refused still refuses, and the message now names the run dir and the artifact, so a delegation that drops the c-5 context fails the tightened assertions",
    "A scan-run ledger name of \"../main.go\" refuses and leaves no file at Join(runDir, \"..\", \"main.go\"), asserted by stat-ing the parent directory before and after the run",
    "An absolute ledger name \"/tmp/x/spec.toml\" returns ErrAbsolute instead of being silently re-rooted under the run dir (absolute_paths lock)",
    "Both the security and quality run-dir paths are asserted, so repointing one command and leaving the other fails",
    "The write goes through pathfence.WriteFile: a site that unwraps Contained with .String() and calls os.WriteFile is reported by t-10's residual scan, so the type cannot be reduced to a decorative wrapper here",
