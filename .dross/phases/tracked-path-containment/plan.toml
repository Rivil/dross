  depends_on = ["t-1"]
  test_contract = ["ValidatePlan rejects a task with files = [\"../x\"] and a task with files = [\"/etc/passwd\"], each error naming the offending task id alongside the path", "The refusal message names the path, plan.toml as the artifact, and the repo root, so a hand-edited plan.toml is fixable from the message alone", "A containment defect is reported ALONGSIDE a duplicate-task-id defect in one error rather than short-circuiting it, preserving ValidatePlan's report-everything-at-once contract", "`dross task add --files ../x` refuses and leaves plan.toml byte-unchanged, asserted by hash — saveIfValid's write must stay behind the gate", "A plan whose task files are all repo-relative and contained still validates, and an interior \"a/../b.go\" is accepted rather than refused"]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 2
  title = "Route testlane and remote checks through pathfence"
  files = ["internal/testlane/match.go", "internal/testlane/match_test.go", "internal/remote/remote.go", "internal/remote/remote_test.go"]
  description = "testlane.normalize's \"..\" arm becomes pathfence.InTree, keeping its own\nempty-path-is-in-tree arm and its absolute handling; remote.RunDir's segment\ntest becomes pathfence.Segment, still wrapped in ErrUnsafeTarget.\n\nThe testlane half is what keeps t-10's literal scan exemption-free: match.go:141\nsits two lines under a path.Clean and is squarely inside the scan's marker set,\nso leaving it would force a carve-out. The remote half is worth doing on merit —\none containment rule, not two — but remote.go:329's shape (path.Base plus a \"..\"\nequality) is only caught once t-10's marker set is widened to include path.Base,\nso it is not load-bearing for the exemption-free claim.\n\nTWO ARMS THE DELEGATION MUST NOT SWALLOW:\n\n  - remote.RunDir(\"\") errors with \"empty run id\" BEFORE the segment test.\n    pathfence.Segment rejects empty too (t-1), but the message is the caller's,\n    so the arm stays at the call site and is asserted here rather than assumed\n    to survive.\n  - testlane's absolute arm is `filepath.IsAbs(p) || strings.HasPrefix(s, \"/\")`\n    (match.go:137, with the reason at :134). The first disjunct exists for\n    WINDOWS DRIVE-LETTER paths, and pathfence's unconditional backslash-to-slash\n    fold makes path.IsAbs(\"C:/x\") false — so InTree alone does NOT classify\n    \"C:\\x\" as out-of-tree. testlane keeps its own filepath.IsAbs disjunct; a\n    delegation that drops it loses drive-letter paths silently, on a platform\n    the suite does not run on.\n"
  covers = ["c-1"]
  depends_on = ["t-1"]
  test_contract = ["testlane still classifies \"../x.go\" and \"/abs/x.go\" into the escaped bucket rather than Unmatched — the distinction a naive delegation loses — and still resolves \"docs/../a.go\" to in-tree \"a.go\"", "The escaped bucket still receives the CLEANED path: \"internal/../../x\" buckets as \"../x\", so a delegation that discards InTree's false-branch string fails", "An empty testlane path is still in-tree so it surfaces as Unmatched rather than as an escape, and \".\" is still in-tree — testlane's own policy, asserted here because pathfence takes no position on either", "remote.RunDir(\"..\") and remote.RunDir(\"a/b\") still return errors matching errors.Is(err, ErrUnsafeTarget), so a delegation returning a bare pathfence error — which would break every caller that distinguishes a refusal from a transport failure — fails", "remote.RunDir(\"run-123\") still returns \".dross-runs/run-123\"", "remote.RunDir(\"\") still errors naming \"empty run id\" and matching errors.Is(err, ErrUnsafeTarget), so routing the segment test through pathfence cannot replace a specific empty-id message with a generic segment refusal", "testlane keeps its own filepath.IsAbs disjunct: \"C:\\\\x\" and \"C:/x\" both land in the escaped bucket, asserted directly rather than via a runtime.GOOS guard, so a delegation that leans on pathfence.InTree alone — where the backslash fold makes path.IsAbs(\"C:/x\") false — goes red here instead of losing drive-letter paths on a platform the suite never runs"]
