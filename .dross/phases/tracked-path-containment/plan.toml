[[task]]
  id = "t-8"
  wave = 2
  title = "Contain the red-proof doc on read and repoint paths"
  files = ["internal/cmd/redproof_repoint.go", "internal/cmd/redproof_repoint_test.go", "internal/cmd/redproof.go", "internal/cmd/redproof_test.go", "internal/cmd/doctor.go", "internal/cmd/doctor_test.go", "internal/cmd/hostile_config_test.go"]
  description = "redproof_repoint.go:143 joins p.Doc — loaded from changes.json — onto\np.repoDir and then rewrites that file; redproof.go:146 (redProofDocSHA) reads\nit the same way. checkRedProofDoc guards only `red-proof set`, so a hand-edited\nred_proof.doc reaches a write outside the repo today. Both joins go through\npathfence.Contain with \"changes.json red_proof.doc\" as the artifact, refusing\nbefore the plan is returned. redProofPin.Doc and redProofRepointPlan.Doc change\nfrom string to pathfence.Contained, so the containment is carried by the value\nrather than re-derived at each reader — this is the field whose readers copy it\ninto a cmd-local struct, which is exactly the shape an AST scan cannot follow\nand the type system can. discoverRedProofPins constructs each pin by calling\nContain. redProofDocSHA takes a Contained and reads through the seam.\n\nNeither struct is serialized — redproof.go:103-107 and redproof_repoint.go:41-53\ncarry no struct tags and nothing marshals them — so typing their Doc field is\nsafe in a way typing changes.RedProof.Doc would not be.\n\nTHE REAL I/O SITE. applyRedProofRepoint is where the file is actually opened,\nand it is the site that moves to the seam: redproof_repoint.go:142 builds\n`docPath := filepath.Join(p.repoDir, filepath.FromSlash(p.Doc))` and then makes\nFIVE os calls on it — os.Stat (:143), os.ReadFile (:147), os.WriteFile (:155)\nand the rollback os.WriteFile (:164). The join disappears (p.Doc is already a\nContained) and all five go through pathfence.Stat / ReadFile / WriteFile. This\nis the task's centre of gravity, not redProofRewriteDoc.\n\nFOUR EXISTING CONSUMERS need the repo-relative string and are accounted for\nhere rather than discovered during execution. All four are served by\nContained.String() being the repo-relative slash form (t-1), so none of them\nneeds a second field or a root passed back in:\n\n  - hostile_config_test.go:435 `if p.Doc == want` — Contained is not comparable\n    to a string; becomes p.Doc.String() == want. This is why that file joins\n    this task's file list.\n  - redproof_repoint.go:117 `filepath.ToSlash(pin.Doc)` populates\n    redProofRepointPlan.Files, documented at :47-49 as repo-relative — becomes\n    pin.Doc.String(), which already IS repo-relative slash form, so the\n    ToSlash call goes away rather than being adapted.\n  - redProofRewriteDoc (redproof_doc.go:34) takes `doc, body, oldSHA, newSHA\n    string` and does NO file I/O — it receives the already-read body and uses\n    `doc` only in its error messages. Its signature is left alone; the call at\n    redproof_repoint.go:151 passes p.Doc.String().\n  - redproof_repoint.go:146/:150/:156 format p.Doc with %s — Contained\n    satisfies fmt.Stringer, so these keep printing repo-relative paths and do\n    not start leaking absolute machine paths into operator-facing errors.\n\ndoctor.go:604-608 already emits a doctorIssue on any redProofDocSHA error, so\nthe refusal surfaces with no change — but it frames it as \"which cannot be\nread: <err>\", which mis-describes a containment refusal as an unreadable file.\nThat message arm splits: a containment error reports the escape, anything else\nkeeps the cannot-be-read wording.\n"
  covers = ["c-2", "c-3", "c-5"]
  depends_on = ["t-1"]
  test_contract = ["A changes.json with red_proof.doc = \"../../victim.md\" makes `dross phase red-proof repoint --apply` refuse with a message naming the doc, changes.json and the repo root, and leaves the outside file byte-identical — asserted by hash, so an unguarded build that rewrites it in place fails, and so does a guard placed after os.WriteFile", "The dry-run path refuses too: a plan that prints an escaping doc as \"would write\" is a refusal the operator never gets", "redProofDocSHA on the same doc returns a containment error, not an os.ReadFile error — asserted on the message, so a fix that merely relies on the file not existing fails", "doctor over that record reports the containment refusal as an escape rather than under the \"cannot be read\" wording, so the two failure kinds stay distinguishable to the operator reading doctor output", "A contained doc still repoints, still hashes and still passes doctor, so the guard did not break the working path", "discoverRedProofPins constructs its pins by calling Contain, so redProofPin.Doc cannot be populated from an unchecked string — assertDoesNotCompile (t-1's helper) over a fixture assigning a raw string to that field requires the build to fail naming the type mismatch, which is the guarantee the previous AST-scan design could not deliver for this field", "redProofRepointPlan.Files stays REPO-RELATIVE after the retype: the plan built for an in-tree doc lists \"docs/x.md\" and not an absolute path, asserted on the exact string, so a conversion that reached for the joined form fails here rather than shipping absolute paths into a list documented as repo-relative", "The repoint error messages at redproof_repoint.go:146/:150/:156 print the repo-relative doc: asserted with strings.Contains for the relative form and a NotContains for the repo root, so a Contained formatted with %s cannot start leaking one machine's layout into operator output", "applyRedProofRepoint makes no direct os.* call on the doc: asserted by t-10's scan over the post-fix file plus a must-trip testdata fixture reproducing the filepath.Join + os.WriteFile shape, so the rollback write at :164 cannot be left behind as the one unguarded path — it is the call a partial adoption is most likely to miss"]
  status = "pending"

