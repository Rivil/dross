[phase]
  id = "tracked-path-containment"

[[task]]
  id = "t-1"
  wave = 1
  title = "Add internal/pathfence shared containment check"
  files = ["internal/pathfence/pathfence.go", "internal/pathfence/pathfence_test.go", "internal/compilefence/compilefence.go", "internal/compilefence/compilefence_test.go"]
  description = "New leaf package (imports nothing from internal/ — the argfence / hostallow /\nconfigenum shape) built around a type only the check can construct:\n\n  type Contained struct{ rel, abs string }  // both unexported — see below\n  func (Contained) String() string          // returns rel\n  Contain(root, artifact, p) (Contained, error)  — refuse, join-onto-a-root\n  InTree(p string) (clean string, ok bool)       — classify, root-less\n  Segment(label, id string) error                — single-segment\n  ErrEscapes, ErrAbsolute\n\nContained carries an unexported field, so no package outside pathfence can\nconstruct one except through Contain — a caller that skips the check has no\nvalue to pass and fails to build. The I/O seam takes it rather than a string:\n\n  ReadFile(Contained) ([]byte, error)\n  WriteFile(Contained, []byte, fs.FileMode) error\n  Stat(Contained) (fs.FileInfo, error)\n\nThe seam is what makes the type load-bearing: os.ReadFile takes a string and\nalways will, so the guarantee is \"a site that opens a tracked path through the\nseam cannot have skipped the check\", with t-10's residual test covering the\nsites that reach for os.* directly.\nInTree takes no root: its two consumers differ on root handling (verify strips\none, testlane has none), so pathfence owns only the lexical ..-and-absolute\ntest and each caller keeps its own root and empty/dot policy. Lexical only —\nabsolute rejected outright, no EvalSymlinks. The doc comment records the\nsymlink limit and why (symlink_resolution lock).\n\nSlash form throughout: both InTree consumers already work in slash form\n(verify.NormalizePath replaces backslashes then uses path.Clean;\ntestlane.normalize does filepath.ToSlash then path.Clean), so pathfence\nnormalises with an UNCONDITIONAL strings.ReplaceAll of backslash to slash, then\npath.Clean — the form verify.NormalizePath already uses (scope.go:328, with the\ncomment at :323-325 explaining why it is unconditional rather than\nplatform-gated). filepath.ToSlash is the identity on darwin and would leave the\nrule untested on the machine the suite runs on. InTree returns slash form on\nevery platform.\n\nContained carries BOTH forms and exposes each under its own name:\n\n  type Contained struct{ rel, abs string }   // both unexported\n  func (c Contained) String() string { return c.abs }  // OS-form, openable\n  func (c Contained) Rel() string    { return c.rel }  // slash, root-relative\n\nString() is the JOINED OS-FORM ABSOLUTE path — the form that can be handed to\nany `func(path string)` that actually opens the file. Rel() is the path relative\nto the root it was contained against, in slash form, for display, error messages\nand serialized path lists.\n\nThis split is deliberate and was arrived at the hard way: an earlier revision of\nthis plan made String() the relative form to serve t-8's display consumers, and\nthat broke every boundary where a Contained has to reach code which is not being\nretyped — security.Load, and phase.saveTOML underneath WriteScaffoldSpec, both\nof which open the path they are given. A type whose only accessor yields an\nunopenable string forces either an absolute-accessor escape hatch or an\nunbounded retyping cascade. Two named accessors cost one method and end the\nproblem: the openable form for callees, the relative form for humans.\n\nThe guarantee is unchanged by the split. Neither accessor can be reached without\na Contained, and a Contained cannot be constructed outside pathfence, so a\ncaller that skipped the check still has nothing to pass. What String() being\nopenable changes is only t-10's framing: `os.ReadFile(c.String())` now WORKS,\nso the scan bans it as policy — the seam is the audited way in — rather than\nbecause it would misbehave. t-10 bans Rel() inside an os.* argument too, since\nthat one is an outright bug.\n\nCompile fence: this task also adds the shared helper the containment guarantee\nis asserted with — compilefence.AssertDoesNotCompile(t, src, wantMsg) writes a\ntemp module, runs `go build ./...` in it, and requires BOTH a non-nil error and\nwantMsg in the output, so a fixture that fails for an unrelated reason cannot\npass as proof.\n\nIT LIVES IN ITS OWN NON-TEST PACKAGE, internal/compilefence, and that is not a\nstyle choice. Five contract lines call it — here, t-3 (internal/security,\ninternal/quality), t-5, t-8 and t-11 (internal/cmd) — and an identifier defined\nin a _test.go file is visible only inside that package's own test binary. Put\nin pathfence_test.go it would be unreachable from all four other packages and\nevery one of those lines would fail to compile. A plain .go file in its own\npackage is importable by all of them; it takes testing.TB rather than *testing.T\nso it needs no test-only build context, and internal/compilefence imports\nnothing from internal/, so it cannot create a cycle with any caller.\n\nTWO MECHANICS THAT ARE NOT OPTIONAL, both reproduced against this repo on\n2026-09-07 before this plan was written:\n\n  - The temp module path MUST be under `github.com/Rivil/dross/` (e.g.\n    `module github.com/Rivil/dross/tmpfence`). ceiling_test.go:287 declares\n    `module mutantproof`, and that shape CANNOT be copied here: a module outside\n    the dross prefix may not import an internal package at all —\n    `use of internal package github.com/Rivil/dross/internal/pathfence not\n    allowed`. Every fixture would then fail for that reason, the wantMsg check\n    would never match, and the helper's positive self-test would be\n    unsatisfiable. This is the one way the whole fence silently becomes theatre.\n  - The build runs with `-mod=mod` (or a copied go.sum) alongside the\n    `require` + `replace` pair, so module resolution cannot fail before\n    compiling and be mistaken for the refusal.\n\nThe helper is therefore NOT a copy of ceiling_test.go:287 — it is the same idea\nwith the module path and mod flag corrected for importing internal packages.\nCite it as the precedent for the shape, not for the go.mod.\n\nGated behind !testing.Short() — a go build against the dross module is not a\ncost the per-task gate in /dross-execute should carry. project.toml's\ntest_command (`go test -count=1 ./...`) passes no -short, so full runs and\nverify do exercise it.\n"
  covers = ["c-1", "c-3", "c-5"]
  test_contract = ["Contained cannot be constructed with a value outside pathfence: assertDoesNotCompile over a fixture attempting `pathfence.Contained{rel: \"x\"}` requires the build to fail with \"cannot refer to unexported field\". The fixture must name a REAL field — an invented one like `{p: \"x\"}` fails with \"unknown field p\", which it would also do if rel and abs were exported, so the assertion would pass for the wrong reason. It must also SET a field: `pathfence.Contained{}` is legal outside the package, since Go forbids setting unexported fields and not empty composite literals", "The helper's POSITIVE fixture builds clean: a temp module importing pathfence and calling an exported function compiles with exit 0, asserted before any negative fixture runs. This is the line that catches the two mechanics that would otherwise make every refusal a false positive — a module path outside the dross prefix (internal-package visibility) or an unresolvable go.mod — since both produce a failing build that a negative-only fence reads as success", "The I/O seam refuses a zero Contained: ReadFile(Contained{}), WriteFile and Stat each error rather than operating on the empty path — this is what closes the empty-literal hole line 1 cannot, so a caller writing `[]Contained{{}, {}}` fails loudly instead of touching the working directory", "Contain(root, \"changes.json\", \"../x.go\") errors and the message contains \"../x.go\", \"changes.json\" and the root, asserted as three separate strings.Contains rather than one golden string", "Contain(root, a, \"/etc/passwd\") matches errors.Is(err, ErrAbsolute) and NOT ErrEscapes, so deleting the IsAbs branch cannot pass by falling through to the escape branch", "Contain(root, a, \"a/../b.md\") returns Join(root, \"b.md\") — an interior \"..\" landing inside is not an escape — while \"..\" and \"../\" both error", "The near-miss non-escapes \"..foo\", \"a/..b\" and \"a/b..\" are ACCEPTED by both Contain and InTree, so a HasPrefix check missing the separator test fails here", "InTree returns the CLEANED path on the false branch, not the empty string: InTree(\"../x\") returns (\"../x\", false) and InTree(\"/abs/x\") returns (\"/abs/x\", false) — testlane buckets that string, so a delegation returning \"\" would silently change what lands in the escaped bucket", "InTree(\"a/../b\") returns (\"b\", true); InTree(\".\") returns (\".\", true) and InTree(\"\") returns (\"\", true) — pathfence takes no position on dot or empty, so each caller's own policy stays visible at the call site rather than being buried here", "Segment(\"run id\", \"a/b\") and Segment(\"run id\", \"..\") both error; Segment(\"run id\", \"run-123\") returns nil", "String() returns the joined OS-form ABSOLUTE path and Rel() the root-relative slash form: for Contain(root, a, \"docs/x.md\"), String() contains root and opens correctly, Rel() == \"docs/x.md\" on every platform and does NOT contain root. Asserting both directions pins the split, so swapping the two accessors fails here rather than silently writing files to the wrong place", "String() is openable from any working directory: with the process chdir-ed somewhere OTHER than the root, os.ReadFile(c.String()) reads the right file — this is what lets a Contained cross into a func(path string) callee like phase.saveTOML. Rel() under the same chdir does NOT resolve, asserted explicitly, so the two forms cannot be confused by a caller reaching for the wrong one", "Contain never touches the filesystem: with root naming a directory that does not exist, \"report.md\" is still accepted", "A symlink under root pointing outside is ACCEPTED, in a test named for the symlink_resolution lock, so the documented lexical limit is pinned rather than assumed", "InTree returns slash form on darwin as well as Windows: InTree(`a\\b/../c`) returns (\"a/c\", true) — the backslash is a separator, so the \"..\" pops \"b\" and \"c\" still appends. A filepath.ToSlash implementation returns \"c\" here on darwin (path.Clean sees `a\\b` as one segment, which \"..\" then pops), so this line fails the platform-gated version rather than passing on both", "assertDoesNotCompile itself is self-tested: a fixture that DOES compile makes it fail, and a fixture failing for an unrelated reason (an undefined identifier) fails the reason check rather than counting as proof", "Segment(\"run id\", \"\") errors, so t-7's RunDir(\"\") delegation has something to keep: the existing \"empty run id\" refusal must survive being routed through pathfence rather than being lost to a check that only rejects separators", "internal/compilefence is imported by test files only: an ast walk asserts no non-test .go file in the repo imports it, so a helper that exists to be shared between test packages cannot drift into production code"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Declare the path-shaped field registry"
  files = ["internal/pathfence/fields.go", "internal/pathfence/fields_test.go"]
  description = "Fields declares one entry per path-shaped .dross schema field: Struct, Field,\ntoml key, Artifact, and a Disposition of exactly Consumed (naming the Carrier)\nor NotConsumed (with Why and the reader sites allowed to touch it). Disposition\nclassifies READERS — a field nothing opens is NotConsumed even if a validator\ngates it at write time, since a validator constructs no Contained.\n\nSchema fields stay string / []string: they are serialized to changes.json,\nplan.toml and tests.json, and a Contained's unexported field cannot marshal.\nThe type therefore lives on the DERIVED value, and a Consumed entry names that\nderived value as its Carrier — the Go type+field or function that HOLDS the\nchecked value (redProofPin.Doc; containScope). It is deliberately not \"the\nrouting function's signature\": internal/cmd imports pathfence, so a pathfence\ntest cannot import internal/cmd back to look, and discoverRedProofPins is\nunexported there in any case.\n\nConsequently this task asserts only that a Carrier is DECLARED and\nwell-formed. That the carrier is actually typed pathfence.Contained is a claim\nabout internal/cmd symbols, and it is asserted in t-10 from a package cmd test\nwhere those symbols are visible. Splitting it this way is what lets t-2 sit in\nwave 1 honestly: no line here forward-references a function wave 2 creates.\n\nfields_test.go MUST be the EXTERNAL test package `package pathfence_test`, not\n`package pathfence`. The stored-field assertion reflects over internal/changes,\ninternal/verify, internal/phase and internal/project — so this file is not\n\"checkable against pathfence alone\", it imports four other packages — and once\nt-5 makes internal/verify import pathfence and t-6 makes internal/phase do the\nsame, an internal test file importing them back is an import cycle. Go permits\nan external test package to import packages that import the package under test;\nan internal one does not. Written as `package pathfence` this compiles green in\nwave 1 and breaks in wave 2, which is the worst possible discovery order.\n\nThis is the artifact t-9 and t-10 both judge against.\n\nt-2 carries NO depends_on and stays in wave 1. It shares the internal/pathfence\ndirectory with t-1, so the two must not be dispatched CONCURRENTLY — a parallel\nrun risks a transiently unbuildable package and a conflict on the package doc\ncomment. Declaring depends_on = [\"t-1\"] is not the fix: this repo derives a\ndependent's wave as deepest+1 (internal/phase/plan_edit.go:54-70) and refuses a\ndependent that is not strictly after its dependency (:287), so the dependency\nwould force t-2 to wave 2 and push t-9 to 3 and t-10 to 4 for a sequencing\nconstraint that costs nothing. /dross-execute takes one task at a time from\n`dross task next`, so ordering within the wave is already serial; this note is\nfor any future parallel dispatcher.\n"
  covers = ["c-6"]
  test_contract = ["Every entry carries Struct, Field, Artifact and exactly one Disposition; an entry with neither or both fails", "A NotConsumed entry with an empty Why fails, and one naming no allowed reader fails", "A duplicate Struct+Field pair fails as a double declaration", "Fields covers by name at minimum changes.TaskRecord.Files, changes.RedProof.Doc, verify.Scope.Files, phase.Task.Files, project.Env.Files, project.Paths.{Source,Tests,E2E,Migrations,Schemas,I18n,Public} and project.TestLane.Match — asserted by name, so deleting a declaration to make a later guard pass fails here first", "The three path-shaped-by-tag-but-not-by-meaning fields t-9's walker will reach — verify.Scope.Source (an enum label), verify.LanguageRun.Files (tool output paths) and verify.CriterionResult.Tests (test names) — each carry a NotConsumed entry whose Why names why the tag is misleading, so the walker's false positives are declared rather than special-cased in the walker", "phase.Task.Files is declared NotConsumed with a Why naming ValidatePlan as a write-time gate that opens nothing, and the two print-only readers (internal/cmd/task.go, internal/cmd/issue_task.go) as its allowed readers", "Every Consumed entry carries a non-empty Carrier: changes.TaskRecord.Files and verify.Scope.Files name containScope, changes.RedProof.Doc names redProofPin.Doc. A Consumed entry with an empty Carrier fails here, so an entry cannot claim the check without saying what holds the checked value. This asserts DECLARATION only — that the named carrier is really typed pathfence.Contained is asserted in t-10 from package cmd, since pathfence cannot import internal/cmd without a cycle", "The stored fields themselves are asserted to remain string or []string, so a well-meaning change typing changes.RedProof.Doc as Contained — which would silently break changes.json round-tripping, since the unexported field cannot marshal — fails here rather than at a user's next verify"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 2
  title = "Take Contained in security and quality I/O"
  files = ["internal/security/findings.go", "internal/security/scaffold.go", "internal/security/findings_test.go", "internal/security/scaffold_test.go", "internal/quality/findings.go", "internal/quality/scaffold.go", "internal/quality/findings_test.go", "internal/quality/scaffold_test.go", "internal/security/lifecycle.go", "internal/quality/lifecycle.go"]
  description = "Move the run-dir I/O boundary into the two scan packages, so containment is\ncarried by the type all the way to the os call rather than stopping at the cmd\nlayer.\n\ninternal/security and internal/quality own the real I/O — Save does os.Create\n(findings.go:105 / :109), Load reads, WriteScaffoldSpec writes — and all three\ntake `path string` today. Each becomes a pathfence.Contained parameter and does\nits I/O through the pathfence seam:\n\n  Load(c pathfence.Contained) (Ledger, error)\n  Save(c pathfence.Contained, l Ledger) error\n  WriteScaffoldSpec(c pathfence.Contained, phaseID, title string, l Ledger) error\n\nBoth packages gain an import of internal/pathfence, which is a leaf and imports\nnothing from internal/, so no cycle is possible.\n\nWHY THE BOUNDARY MOVES rather than the cmd layer unwrapping: since t-1's\ninversion the cmd layer COULD hand these functions c.String() and they would\nopen the right file — so this is not a mechanical necessity, it is the point of\nthe phase. The guarantee c-4 asserts is that the path reaching the FILESYSTEM\nwas constructed by the check, and that holds only while the Contained travels\nall the way to the os call. Unwrap at the cmd layer and internal/security's\nos.Create takes a string again, with nothing but convention tying it to a\ncheck that ran two frames up — the exact shape this phase exists to remove.\nPassing the value through is what makes the type load-bearing rather than\ndecorative.\n\nThe one boundary where unwrapping IS correct is phase.saveTOML, below\nWriteScaffoldSpec: internal/phase is not retyped by this phase and its atomic\nwrite is not something pathfence.WriteFile replicates. That crossing is named\nand justified below rather than left to the executor's judgement.\n\nrun.go's own os.Stat / os.MkdirAll on the run directory are NOT in scope: the\nrun dir is the containment ROOT, not a path contained within one, and Contain\ntakes the root as a plain string by design (t-1).\n\nlifecycle.go joins the file list in BOTH packages: ResolveItem (security\nlifecycle.go:60, quality lifecycle.go:60) calls Load(filepath.Join(runDir,\n\"findings.toml\")) — an in-package caller of a function this task retypes, so\nomitting it breaks the package's own build. It contains the join itself, which\nbecomes a Contain against runDir.\n\nWriteScaffoldSpec ends in `return spec.Save(path)` (scaffold.go), which reaches\nphase.saveTOML (internal/phase/phase.go:459 -> :476) — a `func(path string)` that\ndoes os.MkdirAll + an atomic os.Create/rename. internal/phase is NOT retyped by\nthis phase and saveTOML's crash-safety (write .tmp, rename) is not something\npathfence.WriteFile replicates, so the Contained crosses that boundary as\nc.String() — the joined absolute form (t-1). That is the boundary the accessor\nsplit exists for. Rel() would write relative to the process working directory,\nwhich is the silent wrong-location bug this line prevents.\n"
  covers = ["c-3"]
  depends_on = ["t-1"]
  test_contract = ["security.Load, security.Save, security.WriteScaffoldSpec and their three quality counterparts each take a pathfence.Contained: assertDoesNotCompile (t-1's helper) over a fixture calling security.Load(\"findings.toml\") requires the build to fail naming the type mismatch, so a caller that skips the check has no value to pass", "The os.Create at findings.go:105 (security) and :109 (quality) is gone: t-10's scan over both packages reports no direct os.* call on a contained path, asserted by a must-trip testdata fixture reproducing the os.Create shape rather than only against the post-fix tree", "A Ledger still round-trips through Save then Load unchanged in both packages, so moving the boundary did not change what is written or how it parses — asserted on a ledger carrying at least one finding with a non-empty path field", "WriteScaffoldSpec still writes a spec a subsequent phase scaffold can read in both packages, so the scaffold path was not broken by the retype", "The two packages import internal/pathfence and nothing else new: asserted by a go/ast import walk over both, so the retype cannot smuggle in a dependency that would make pathfence non-leaf", "run.go's os.Stat and os.MkdirAll on the run DIRECTORY are untouched and still pass, so the rule that a containment root is a plain string is pinned rather than eroded by the retype", "WriteScaffoldSpec writes into the RUN DIR, not the working directory: asserted by chdir-ing elsewhere before the call and then statting the expected absolute path, so a build that reached for Rel() when crossing into phase.saveTOML fails here instead of scattering spec.toml files wherever the command happened to run"]
  status = "done"

[[task]]
  id = "t-11"
  wave = 3
  title = "Repoint cmd run-dir sites at pathfence"
  files = ["internal/cmd/security.go", "internal/cmd/quality.go", "internal/cmd/security_test.go", "internal/cmd/quality_test.go", "internal/cmd/quality_findings_test.go"]
  description = "Delete containedPath (security.go:188) and repoint all eight call sites —\nsecurity.go:45,152,160,204 and quality.go:39,122,130,150 — at pathfence.Contain\nwith the run dir as root and \"run directory\" as the artifact. Each site keeps\nthe returned Contained and passes it on; nothing unwraps it to a string.\n\nWHAT EACH SITE ACTUALLY DOES, since \"they all write\" was wrong and cost this\nplan a review round. Only two of the eight reach an os call in package cmd:\n\n  security.go:45  -> security.Load           (READ)\n  security.go:152 -> security.Load           (READ)\n  security.go:160 -> security.WriteScaffoldSpec (WRITE, in internal/security)\n  security.go:204 -> os.WriteFile            (WRITE, here in package cmd)\n  quality.go:39   -> quality.Load            (READ)\n  quality.go:122  -> quality.Load            (READ)\n  quality.go:130  -> quality.WriteScaffoldSpec (WRITE, in internal/quality)\n  quality.go:150  -> os.WriteFile            (WRITE, here in package cmd)\n\nSix hand the value to a function t-3 has already retyped to accept a Contained,\nso those sites just pass it through. The two report.md writers are the only\nsites this task routes through pathfence.WriteFile itself.\n\nThe two duplicated test blocks (security_test.go:281, quality_test.go:160)\ncollapse onto the shared behaviour. containedPath's doc comment at\nsecurity.go:185-186 claims a finding-derived name; that has never been true —\nevery site passes a string literal — and the claim dies with the function.\n\nquality_findings_test.go joins the list: it calls quality.Save at :71, which\nt-3 retypes. security_test.go and quality_test.go call Save too (security_test\n:140,:163,:341; quality_test :125,:148) and are already here. This task depends\non t-3, so all of these adapt after the retype lands, never alongside it.\n"
  covers = ["c-1", "c-3"]
  depends_on = ["t-3"]
  test_contract = ["grep for \"func containedPath\" across internal/ finds nothing — the second implementation is gone, not merely unused", "Every case containedPath refused still refuses, and the message now names the run dir and the artifact, so a delegation that drops the c-5 context fails the tightened assertions", "All eight call sites pass a Contained built from the run dir, asserted structurally: no site reconstructs its path with filepath.Join on the run dir, and no site calls .String() on the value it passes on", "The two report.md writers (security.go:204, quality.go:150) go through pathfence.WriteFile: a site reverted to os.WriteFile with an unwrapped path is reported by t-10's scan, asserted there as a must-trip testdata fixture", "The six non-writing sites pass their Contained straight into the retyped security/quality functions with no conversion — asserted by assertDoesNotCompile over a fixture inserting a .String() at one of them, so the boundary t-3 moved cannot be quietly un-moved here", "Both the security and quality run-dir paths are asserted, so repointing one command and leaving the other fails", "The escaping-name cases are NOT asserted here: every site passes a string literal (\"findings.toml\", \"spec.toml\", \"report.md\"), so no code path drives a caller-supplied name and the refusal itself belongs to t-1's contract. This is stated so a later reader does not mistake the absence for a gap"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Route checkRedProofDoc through pathfence"
  files = ["internal/cmd/redproof_set.go", "internal/cmd/redproof_set_test.go"]
  description = "checkRedProofDoc (redproof_set.go:149) drops its IsAbs and \"..\" arms and calls\npathfence.Contain, keeping its is-a-directory refusal, its does-not-exist\nrefusal and its ToSlash return. Split from the run-dir repointing: that is\nmechanical delegation of one helper, this drops two refusal arms while three\nothers must survive. Its is-a-directory and does-not-exist probes go through\npathfence.Stat on the Contained value, so the check itself never re-joins a raw\nstring. It still returns the ToSlash form for storage — the stored field is\nrepo-relative text, not a Contained.\n"
  covers = ["c-1", "c-3"]
  depends_on = ["t-1"]
  test_contract = ["checkRedProofDoc(\"/abs/x.md\") matches errors.Is(err, ErrAbsolute) and checkRedProofDoc(\"../x.md\") matches errors.Is(err, ErrEscapes)", "The directory refusal and the does-not-exist refusal still fire for a contained path, so the swap swallowed neither — a contained-but-absent doc and a contained directory each keep their own distinct message", "A valid nested doc still returns its ToSlash form, so the delegation did not start returning an absolute joined path to a field that is stored repo-relative", "The empty-doc refusal (\"--doc is required\") still fires before any containment check, so an empty value reports the missing flag rather than a containment error"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Hard-fail escaping changes.json paths in verify"
  files = ["internal/verify/scope.go", "internal/verify/scope_test.go", "internal/cmd/verifyscope.go", "internal/cmd/verifyscope_test.go", "internal/cmd/verify.go", "internal/cmd/verify_scoping_test.go"]
  description = "Two separate jobs, deliberately not fused into one function.\n\nTHE GATE. ValidateRecorded(root string, recorded []string) error runs every\nchanges.json task file through pathfence.Contain and returns a hard error on\nthe first escape. It returns ONLY an error — it produces no value — and it is\ncalled BEFORE verify.NewScope, in phaseScope. That ordering is the whole point:\nNormalizePath (scope.go:349) already returns ok=false for \"../x\", so today an\nescaping recorded path never reaches Scope.Files at all — it lands in\n`rejected` and is reported as `ignored out-of-repo path \"../x\"` on Degraded\n(scope.go:167) while the run goes on to pass. That soft downgrade IS the live\nbug: it is exactly the lane escape_failure_mode forbids for a recorded path.\nGating before NewScope is what turns it into an abort.\n\nTHE CONVERSION. containScope(repoDir string, s *verify.Scope)\n([]pathfence.Contained, error) lives in internal/cmd/verifyscope.go and\nconverts scope.Files — the recorded-UNION-git set NewScope built — into the\n[]pathfence.Contained mutationCandidates now takes. It converts the UNION, not\nthe recorded set: verify.go:84-89 spells out why a git-only file must be\nmutated, and feeding mutationCandidates ValidateRecorded's output instead would\nsilently narrow mutation scope, which is the false-green shape this phase\nexists to close. Every scope.Files entry is already normalized, repo-relative\nand in-tree, so the conversion is total in practice — it still returns an error\nrather than dropping or panicking, so a future NewScope that admits something\nelse surfaces here instead of being skipped.\n\nWIRING. phaseScope (verifyscope.go:24) changes from returning *verify.Scope to\n(*verify.Scope, error) — its 8 test call sites in verifyscope_test.go move with\nit — and both verify entry paths propagate: the attached one (phaseScope at\nverify.go:82, mutationCandidates at :90) and the detached finish/collect one\n(phaseScope at verify.go:587, mutationCandidates at :588). mutationCandidates\ncalls pathfence.Stat rather than os.Stat, so the path reaching the filesystem\nis one the check constructed and a caller handing it raw strings fails to\nbuild. NormalizePath's own \"..\" literal is replaced by pathfence.InTree,\nkeeping its local root-stripping and its dot-is-out arm.\n\nNewScope's signature is unchanged and Scope.Files stays []string — it is\nserialized (`json:\"files\"`, scope.go:33) and a Contained cannot marshal. The\nScope TYPE stays pure (no git, no filesystem, per scope.go:23-24): Contain is\nlexical, and the pathfence I/O seam is only ever called from internal/cmd. The\npackage internal/verify is not itself I/O-free and never was — verify.go\nalready calls os.WriteFile/os.ReadFile/os.Create — so the property being\npreserved is the type's, not the package's.\n\nmutationCandidates' RETURN types are pinned here so the executor does not decide\nthem mid-task: it keeps returning (dispatch, gone []string). Only the PARAMETER\nbecomes []pathfence.Contained. The dispatch list feeds the mutation adapters and\nthe gone list feeds the skip report, and both are consumed as plain paths — the\ncontainment guarantee is about what reached the filesystem, which is the\npathfence.Stat call inside, not about what the adapters are handed afterwards.\nThe internal `.dross/` prefix filter therefore unwraps with .String(); that is\nlegal under t-10's scan, which fires only on a .String() inside an os.* argument\nand not on a comparison or a prefix test.\n"
  covers = ["c-2", "c-5"]
  depends_on = ["t-1"]
  test_contract = ["ValidateRecorded(root, [\"../x.go\"]) errors naming \"../x.go\", \"changes.json\" and the root as three separate strings.Contains; phaseScope returns a nil scope alongside it and Degraded is untouched — a regression to the soft lane is a failure, not a passing variation (escape_failure_mode lock)", "The escaping recorded path does NOT appear on Degraded as `ignored out-of-repo path`: that is where NormalizePath sends it TODAY while the run still passes, so a fix that leaves the gate out and relies on the existing rejection lands green here and must not", "`dross verify` over such a changes.json exits non-zero, writes NO tests.json and NO verify.toml, and errors BEFORE mutationCandidates — proved by seeding a REAL file at ../x.go outside the repo, so a run that reached os.Stat would have succeeded and dispatched it", "The escaping path does NOT appear in the `gone` skip list: a fixture with one valid file and one \"../x.go\" errors out rather than verifying one and recording one skip", "The git lane is unchanged: a git-supplied out-of-repo path still lands in Degraded as an ignored out-of-repo path rather than aborting, so the hard rule is not over-applied", "THE UNION SURVIVES: a fixture whose git diff names a file no task recorded still reaches mutationCandidates, asserted on the candidate list itself. A containScope fed ValidateRecorded's recorded set instead of scope.Files passes every other line here and fails this one — which is the silent mutation-scope narrowing that motivates splitting the gate from the conversion", "The detached finish/collect path refuses on the same fixture, so guarding only the attached call site leaves a red test", "NormalizePath(\"../x\"), (\"/other/tree\") and (\".\") still return ok=false with Contains false for each — the dot case is asserted explicitly, since pathfence.InTree calls dot in-tree and this caller must keep its own answer", "mutationCandidates takes []pathfence.Contained: assertDoesNotCompile (t-1's helper) over a fixture passing it a []string requires the build to fail naming the type mismatch, so the escaping-path refusal cannot be bypassed by a future caller that skips the check", "containScope returns an error rather than silently dropping when a scope.Files entry does not contain — asserted by handing it a hand-built Scope carrying \"../x\", so a conversion that skips the odd entry cannot quietly shrink the mutation set", "mutationCandidates still returns (dispatch, gone []string): asserted at the call site by passing the dispatch list straight to the adapter boundary with no conversion, so a task that also retyped the returns breaks a caller this phase never intended to touch"]
  status = "done"

