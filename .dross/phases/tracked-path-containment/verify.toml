  text = "containScope double-prefixes its error: internal/cmd/verifyscope.go:125 passes artifact \"verify scope\" into pathfence.Contain, then :127 wraps it again with fmt.Errorf(\"verify scope: %w\", err), producing `verify scope: verify scope: \"...\" resolves outside ...`. User-facing and invisible to the strings.Contains-based assertions."

