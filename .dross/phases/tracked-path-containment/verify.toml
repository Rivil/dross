[[finding]]
  severity = "FLAG"
  text = "c-5: the absolute-path refusal has no message-content test. TestContainAbsoluteIsItsOwnSentinel (internal/pathfence/pathfence_test.go:85) and TestValidateRecordedRefusesAbsolute (internal/verify/scope_test.go:478) assert only the ErrAbsolute sentinel; the message at internal/pathfence/pathfence.go:107 carries path, artifact and root, but a reword dropping the root ships undetected. Open since 2026-09-09 (deferred to secret-detection, which re-deferred it to someday)."

[[finding]]
  severity = "FLAG"
  text = "c-5: containScope double-prefixes its error: internal/cmd/verifyscope.go:196 passes artifact \"verify scope\" into pathfence.Contain, then :198 wraps it again with fmt.Errorf(\"verify scope: %w\", err), so the user reads `verify scope: verify scope: \"...\" resolves outside ...`. Invisible to the strings.Contains assertions. Open since 2026-09-09 (deferred, someday)."

[[finding]]
  severity = "FLAG"
  text = "c-2: the 'not dispatched to a mutation adapter' clause is inferred, not asserted. TestVerifyRefusesEscapingRecordedPathEndToEnd (internal/cmd/verify_scoping_test.go:544) asserts the refusal and that no artefact was written, but never that the stub adapter's recorded files (stubMutationAdapter.got) are empty, and nothing instruments the absence of a stat — a refactor that stat-ed or dispatched before refusing would pass. Open since 2026-09-09 (deferred, someday)."

[[finding]]
  severity = "NOTE"
  text = "Re-verify 2026-10-07 with --skip-mutation, to re-map criteria after the weaknesses were closed; the verdict rests on criterion coverage alone. The phase's measured run (r-20260907-132210, helicon) scored 0.94 over 956 in-scope mutants (896 killed, 60 survived, all NOT COVERED by construction; efficacy 1.00 over the reachable 896) with 0 unclassified — that measurement predates later phases' edits to these files and is not re-run here."

[[finding]]
  severity = "NOTE"
  text = "All three weak criteria from 2026-09-09 are now covered: c-1 hole 1 and c-6 by exec-taint-enumeration (#134, whole-module load and full tagged-field enumeration), c-1 holes 2-3 and c-3 by quick 1.7.26.1 (7010590, #163). Each was re-checked by experiment on 2026-10-07: the old scanner fails the new fixture test (3 of 6 reported), an escaping write in security scaffold fails the c-3 test, and an undeclared `workdir` field on phase.Task fails the c-6 enumeration."
