[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/cmd/security_test.go:568:TestContainedPathIsGone", "internal/cmd/redproof_set_test.go:418:TestCheckRedProofDocDelegatesContainment", "internal/cmd/redproof_set_test.go:452:TestCheckRedProofDocKeepsItsOwnRefusals", "internal/cmd/redproof_set_test.go:494:TestCheckRedProofDocReturnsRepoRelativeSlashForm", "internal/cmd/security_test.go:604:TestRunDirSitesPassContainedThrough", "internal/cmd/pathfence_enum_test.go:325:TestNoSecondDotDotImplementation", "internal/cmd/pathfence_enum_test.go:338:TestDotDotScanTripsOnItsFixtures", "internal/cmd/pathfence_enum_test.go:374:TestDotDotScanSeesTheRealLiterals"]
  notes = "Was weak (2026-09-09) on three holes in the no-second-..-test ban; all three are closed. (1) Package scope: exec-taint-enumeration (#134) replaced scannedPackages (8 of 36) with the shared whole-module load, and assertWalkCovers fails on any visited package with zero files and names argfence/hostallow explicitly. (2) Join/Dir/Split were not markers, so a Join-built path with a .. prefix test skipped its whole function: added to pathMarkers in quick 1.7.26.1 (7010590), must-trip fixture joinEscape. (3) Only the exact \"..\" literal was reported, so a HasPrefix(clean, \"../\")-only check escaped: \"../\" is reported too, must-trip fixture slashOnly, and two Join-carrying must-not-trip cases exercise the + rule itself. TestDotDotScanTripsOnItsFixtures now counts per function; with the old marker/literal sets it reports 3 of 6 and fails (observed 2026-10-07). TestContainedPathIsGone is still name-only, but a renamed reimplementation is now caught by the literal ban, which no longer has the gaps that made the name check carry the clause."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/verify/scope_test.go:458:TestValidateRecordedRefusesEscape", "internal/cmd/verifyscope_test.go:350:TestPhaseScopeRefusesEscapingRecordedPath", "internal/cmd/verify_scoping_test.go:544:TestVerifyRefusesEscapingRecordedPathEndToEnd", "internal/cmd/verify_scoping_test.go:572:TestVerifyResultsRefusesEscapingRecordedPath", "internal/verify/scope_test.go:504:TestGitLaneStillDegradesOnEscape"]
  notes = "Unchanged since 2026-09-09: ValidateRecorded is the first statement of phaseScope, ahead of any git subprocess or NewScope, and pure (only pathfence.Contain). The end-to-end test installs a stub adapter so an ungated run would succeed and write both artefacts; it asserts the refusal and that neither artefact exists, for both the attached run and the detached collect. Residual (FLAG below): the 'not dispatched' clause rests on no-artefacts-written, not on the stub's recorded files."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/security_test.go:392:TestHostileFindingNamesStayInsideRunDir", "internal/cmd/security_test.go:604:TestRunDirSitesPassContainedThrough", "internal/cmd/security_test.go:720:TestRunDirSitesCannotUnwrap", "internal/security/scaffold_test.go:88:TestWriteScaffoldSpecWritesIntoRunDirNotCwd", "internal/quality/scaffold_test.go:88:TestWriteScaffoldSpecWritesIntoRunDirNotCwd", "internal/cmd/redproof_repoint_test.go:479:TestRepointRefusesAnEscapingDocAndWritesNothing"]
  notes = "Was weak (2026-09-09) as unfalsifiable: every run-dir site passes a literal filename, and no test drove a finding-derived name anywhere. TestHostileFindingNamesStayInsideRunDir (quick 1.7.26.1, 7010590) now does, for security and quality: a finding whose id, title and file read ../main.go goes through the real scaffold and findings-reconcile write paths, with the run dir and repo sharing a parent that holds a sentinel main.go, so the name hits the sentinel whether resolved against the run dir or the cwd. It asserts the sentinel is byte-identical, nothing outside the run dir and the tool's .dross dir is written or removed, and — against vacuity — spec.toml carries the hostile text and reconcile reports it new. Red-proven 2026-10-07: an os.WriteFile(filepath.Join(runDir, finding.File)) inserted into security scaffold fails it on the sentinel."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/pathfence/pathfence_test.go:23:TestContainedCannotBeConstructedOutsidePackage", "internal/cmd/security_test.go:720:TestRunDirSitesCannotUnwrap", "internal/security/findings_test.go:94:TestLoadAndSaveRequireContainedPath", "internal/quality/findings_test.go:136:TestLoadAndSaveRequireContainedPath", "internal/pathfence/pathfence_test.go:48:TestSeamRefusesZeroContained", "internal/cmd/pathfence_enum_test.go:167:TestNoUnwrappedPathReachesAnOSCall", "internal/cmd/pathfence_enum_test.go:227:TestUnwrapScanTripsOnItsFixtures", "internal/cmd/pathfence_enum_test.go:275:TestUnwrapScanSkipsTestFiles", "internal/compilefence/compilefence_test.go:52:TestPositiveControl"]
  notes = "Unchanged since 2026-09-09 and still the best-covered criterion: Contain is the only constructor of a Contained, TestContainedCannotBeConstructedOutsidePackage runs a real go build and requires the unexported-field failure, and the unwrap ban (now over the whole-module load with per-package floors, #134) catches a .String() reaching os.*. The containedVar name list the 2026-09-09 FLAG named in TestRunDirSitesPassContainedThrough is gone."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/pathfence/pathfence_test.go:68:TestContainEscapeNamesPathArtifactAndRoot", "internal/verify/scope_test.go:458:TestValidateRecordedRefusesEscape", "internal/cmd/verifyscope_test.go:350:TestPhaseScopeRefusesEscapingRecordedPath", "internal/cmd/verify_scoping_test.go:503:assertEscapeRefusal"]
  notes = "Unchanged since 2026-09-09: the escape refusal is asserted as three independent Contains checks (offending path, artifact, root) at the pathfence, verify, cmd and end-to-end layers, so a reworded message stays green and a message that drops a fact fails. Residuals (FLAGs below): the absolute-path refusal's message content is still unasserted, and containScope still prints its artifact twice."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/cmd/pathfence_fields_test.go:224:TestEveryPathShapedFieldIsDeclared", "internal/cmd/pathfence_fields_test.go:238:TestWalkerFindsANonEmptySet", "internal/cmd/pathfence_fields_test.go:274:TestWalkerSelfTest", "internal/cmd/pathfence_carrier_test.go:75:TestDeclaredCarriersAreContained", "internal/cmd/pathfence_carrier_test.go:94:TestEveryConsumedCarrierIsBound", "internal/pathfence/fields_test.go:*:Validate suite"]
  notes = "Was weak (2026-09-09): the walker decided what was path-shaped from an 11-word tag vocabulary and four schema dirs, and three new fields under unlisted tags passed silently. exec-taint-enumeration (#134) replaced both lists: EVERY toml/json-tagged field bottoming out in a string, in every package of the shared load, must be declared in pathfence.Fields() or the not_paths.txt ledger, checked both ways (undeclared fails with the row to paste; stale fails), with a field-count floor. The disproving experiment re-run 2026-10-07: a `workdir`-tagged string field added to phase.Task fails TestEveryPathShapedFieldIsDeclared naming phase.Task.Workdir. The live example the old note cited, the detached run's RunDir, is now declared (pathfence/fields.go:291)."

