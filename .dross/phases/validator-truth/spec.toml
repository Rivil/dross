[phase]
  id = "validator-truth"
  title = "validator-truth"
  milestone = "v1.1"

[[criteria]]
  id = "c-1"
  text = "dross doctor exits 0 for any [board].provider the CLI can actually dispatch — including jira and github — instead of reporting it invalid"

[[criteria]]
  id = "c-2"
  text = "Each config enum (board provider, milestone_mode, auth_scheme, ship provider) has a single definition; doctor, dross issue enable, and the forge/ship dispatch resolve values through it rather than each carrying its own literal list"

[[criteria]]
  id = "c-3"
  text = "A test fails when a validator's accept-set and its consumer's dispatch-set diverge — adding or removing a backend without updating the validator breaks the build"

[[criteria]]
  id = "c-4"
  text = "doctor applies the same normalisation as the consumer before validating a value — milestone_mode = \"Version\" or \" version\" passes doctor, because board sync lowercases and trims before matching"

[[criteria]]
  id = "c-5"
  text = "A provider/mode combination that will fail at runtime is reported by doctor — provider = \"jira\" with milestone_mode = \"epic\" is caught at doctor time, not discovered when issue milestone-sync errors"

[[criteria]]
  id = "c-6"
  text = "dross ship accepts every [remote].provider the tooling writes — a bitbucket.org repo can open a PR, post a review comment, and report merge status — and doctor warns on any provider ship cannot dispatch"

[[decisions]]
  key = "enum_validator_home"
  choice = "doctor stays the only validator that enforces enumerated value sets; dross validate remains structural (TOML decode, required non-empty fields, phase-id/dir match, criterion and deferred-target refs) and gains no enum checks"
  why = "Matches each command's stated purpose, and keeps validate — which runs in every slash command's wrap step — from newly failing existing repos"
  locked = true

[[decisions]]
  key = "new_check_severity"
  choice = "The new cross-field checks (c-5 provider/mode combinations, c-6 ship-unsupported remote provider) report as warnings and keep exit 0; only a value no consumer can dispatch at all stays a hard failure with non-zero exit"
  why = "doctor's exit code gates CI and pre-push hooks — this milestone's job is to stop doctor lying, not to start breaking repos that work today"
  locked = true

[[decisions]]
  key = "bitbucket_convergence"
  choice = "Converge the [remote].provider sets upward: implement a real bitbucket ship provider (PR open, review comment, merge status) in this phase, rather than dropping bitbucket from KnownHostProviders and the init/onboard prompts"
  why = "The tooling already autodetects bitbucket.org and derives its API base; shrinking the written set would discard a truthful record of the remote. Size acknowledged (peer to gitlab-ship-provider) and accepted"
  locked = true

[[decisions]]
  key = "bitbucket_auth"
  choice = "Add basic as a third [remote].auth_scheme value, paired with [remote].auth_user; doctor, forge and ship all learn it"
  why = "Bitbucket Cloud's app-password / API-token credential is HTTP Basic user:token — neither private-token nor bearer. Naming the real wire format keeps the enum honest and is reusable by any future Basic-auth forge"
  locked = true

[[decisions]]
  key = "github_board_base_url"
  choice = "[board].base_url is optional when provider is github (the backend defaults to https://api.github.com) and stays required for the other providers"
  why = "doctor demands a valid board base_url unconditionally, so c-1 is unsatisfiable for github boards without relaxing it"
  locked = true

[[decisions]]
  key = "prompt_provider_lists"
  choice = "The [remote].provider lists in the init and onboard prompts are corrected to match the set ship dispatches — gitlab added, bitbucket retained now that it is implemented"
  why = "Those prompts are the writer side of c-6: they currently instruct the agent to write bitbucket while omitting gitlab, the inverse of what ship supported"
  locked = true

[[deferred]]
  text = "issue.go emits lifecycle status \"planning\" while the YouTrack and Jira state maps key on \"planned\", so every freshly-planned phase silently fails to set tracker state (SetState warns and skips)"
  why = "A producer/consumer key mismatch with its own fix, not part of the config-enum work"
  target = "board-state-map-truth"

[[deferred]]
  text = "Task status accepts any string; a typo drops the task out of NextRunnable silently, removing it from the execution queue with no validator to catch it"
  why = "Task-lifecycle surface rather than a config enum"
  target = "cli-surface-sweep"

[[deferred]]
  text = "[board].github_project and [board].state_map have no dross project set path — they can only be hand-edited"
  why = "Belongs to the milestone's CLI-writable-config criterion"
  target = "cli-surface-sweep"

[[deferred]]
  text = "runtime.mode = \"hybrid\" is documented in the schema and settable, but nothing in the codebase branches on it"
  why = "Needs a decide-to-implement-or-remove call; no home yet"

[[deferred]]
  text = "A typo in [mutation].adapters silently filters out every adapter, so all files land in Skipped with no warning"
  why = "Verify-side validation; no home yet"
