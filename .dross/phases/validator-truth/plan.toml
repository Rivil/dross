task_seq = 0

[phase]
  id = "validator-truth"

[[task]]
  id = "t-1"
  wave = 1
  title = "Add internal/configenum normalising enum sets"
  files = ["internal/configenum/configenum.go", "internal/configenum/configenum_test.go"]
  description = "New leaf package, zero internal imports. Exports Set (Values, Normalize, Has, List)\nplus BoardProviders, MilestoneModes, AuthSchemes (incl. basic), ShipProviders (incl.\nbitbucket), ForgeRESTProviders {forgejo, gitea, gitlab} for forge.New's message, and\nthe derived helpers MilestoneModesFor(provider) and BoardRequiresBaseURL(provider).\nMilestoneModesFor returns nil for forge/github. The three empty-value policies differ\nand must stay distinct: empty auth_scheme defaults to private-token (accept), empty\nmilestone_mode defaults to version (accept), empty [board].provider stays invalid\n(reject) — Set.Has(\"\") must NOT be uniformly true.\nNormalize (trim + lowercase) is the single normalisation for this repo — validators\nAND dispatch call it, so no site can be more or less forgiving than another.\nShipProviders is the five dispatchable backends; \"none\" is a sentinel meaning \"no\nremote\", handled at the call sites and deliberately NOT a member of the set.\n"
  covers = ["c-2", "c-4"]
  test_contract = ["if Normalize stops trimming or lowercasing, TestSetNormalizeTrimsAndLowercases fails", "if Set.Has(\"\") becomes uniformly true, empty [board].provider silently stops being rejected — TestEmptyValuePoliciesDiffer fails (empty auth_scheme -> private-token, empty milestone_mode -> version, empty board provider -> still invalid)", "if ForgeRESTProviders isn't exported, t-7 has to re-derive {forgejo, gitea, gitlab} as a second hand-maintained list — TestForgeRESTProvidersIsSubsetOfBoardProviders fails", "if basic is missing from AuthSchemes or bitbucket from ShipProviders, TestAuthSchemesIncludeBasic / TestShipProvidersIncludeBitbucket fail", "if MilestoneModesFor returns a non-nil set for gitlab, or anything but [version] for jira, TestMilestoneModesForProvider fails", "if BoardRequiresBaseURL returns false for any provider other than github, TestBoardRequiresBaseURL fails", "if List() stops rendering the pipe-joined literal that doctor/issue/forge messages interpolate, TestSetListRendersPipeJoined fails"]
  status = "done"

