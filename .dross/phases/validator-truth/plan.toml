[[task]]
  id = "t-3"
  wave = 2
  title = "Add Bitbucket PR-open backend over Basic auth"
  files = ["internal/ship/bitbucket.go", "internal/ship/open.go", "internal/ship/bitbucket_test.go"]
  description = "New bitbucket.go transport: bbBasicAuth, bbRepoRef(url) -> workspace/slug, bbRequest,\nopenBitbucketPR. open.go gains AuthUser on OpenOpts, a case \"bitbucket\" arm, and\nbitbucket in its default-branch message. Endpoints are relative to api_base, which\nremote.go already autodetects as https://api.bitbucket.org/2.0. open.go's provider\nswitch (:43) and auth-scheme check (:229) drop bare strings.ToLower for\nconfigenum.Normalize, so dispatch is exactly as forgiving as doctor. Its hand-typed\n\"expected github | forgejo | gitea | gitlab\" error (:51) is derived from\nShipProviders.List(), since adding the bitbucket arm makes that literal false.\n"
  covers = ["c-6"]
  depends_on = ["t-1"]
  test_contract = ["if the payload uses GitHub-style flat head/base instead of nested source.branch.name / destination.branch.name, TestOpenBitbucketPRHappyPath fails", "if the result URL is read from html_url rather than links.html.href, TestOpenBitbucketPRHappyPath fails", "if the Authorization header isn't Basic base64(user:token) — or a PRIVATE-TOKEN / Authorization: token header is sent alongside — TestOpenBitbucketPRHappyPath fails", "if a missing auth_user doesn't error before any HTTP request is made, TestOpenBitbucketPRMissingAuthUser fails (it asserts zero requests)", "if a reviewer-assignment 4xx returns a nil *OpenResult instead of both a result and an error, the reviewer case fails — an already-open PR must not be lost", "if bbRepoRef mis-splits a bitbucket.org URL into workspace/slug, TestBBRepoRef fails", "if OpenPR still uses bare ToLower, provider = \" bitbucket\" dispatches nowhere while doctor passes it — TestOpenPRNormalisesProvider fails", "if OpenPR's unsupported-provider message stays hand-typed, it omits bitbucket the moment the arm lands — TestOpenPRMessageListsShipProviders fails"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 3
  title = "Add Bitbucket comment and merge-status backends"
  files = ["internal/ship/comment.go", "internal/ship/merged.go", "internal/ship/bitbucket_comment_test.go"]
  description = "postBitbucketComment and bitbucketPRMerged reuse t-3's bbRequest/bbBasicAuth.\nCommentOpts gains AuthUser, mirroring t-3's addition to OpenOpts. merged.go answers\nauthoritatively for bitbucket — it does not join the ErrMergeStatusUnsupported arm.\ncomment.go's (:36) and merged.go's (:24) provider switches adopt configenum.Normalize,\nmatching t-3's change to open.go, and their hand-typed \"expected github | forgejo |\ngitea | gitlab\" errors (:44, :30) are derived from ShipProviders.List() for the same\nreason as t-3's.\n"
  covers = ["c-6"]
  depends_on = ["t-3"]
  test_contract = ["if the comment payload is flat {body:...} rather than {content:{raw:...}}, or posts to a Forgejo-shaped /issues/{n}/comments path, TestPostBitbucketCommentHappyPath fails", "if merged-state is implemented as != OPEN, TestPRMergedBitbucket fails — true only for MERGED, false for OPEN, DECLINED and SUPERSEDED", "if bitbucket is left in the unsupported-provider table, TestPRMergedUnsupportedProvider fails", "if a missing auth_user isn't caught before the request, TestPostBitbucketCommentMissingAuthUser fails", "if PostComment or PRMerged still uses bare ToLower, a leading-space provider that doctor accepts dispatches nowhere — TestCommentAndMergedNormaliseProvider fails", "if either unsupported-provider message stays hand-typed, it omits bitbucket once the arms land — TestShipMessagesListShipProviders fails"]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 4
  title = "Thread auth_user through ship opt builders"
