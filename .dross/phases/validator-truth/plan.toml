[[task]]
  id = "t-6"
  wave = 2
  title = "Route doctor's enum checks through configenum"
  files = ["internal/cmd/doctor.go", "internal/cmd/doctor_test.go"]
  description = "Replace the three inline literal switches (auth_scheme, board provider,\nmilestone_mode) with configenum Set.Has after Normalize, and the hand-typed\n\"(expected a | b)\" strings with Set.List(). base_url is required only when\nBoardRequiresBaseURL(provider).\n"
  covers = ["c-1", "c-2", "c-4"]
  depends_on = ["t-1"]
  test_contract = ["if doctor rejects any provider in BoardProviders, TestDoctorAcceptsEveryDispatchableBoardProvider fails — it fails today for jira and github, and would fail for a seventh backend added without teaching doctor", "if the base_url relaxation leaks beyond github, TestDoctorBoardBaseURLOptionalForGitHub fails (github empty -> exit 0; youtrack empty -> still non-zero)", "if an empty [board].provider starts passing because Set.Has(\"\") is true, TestDoctorRejectsEmptyBoardProvider fails", "if the relaxation is implemented by skipping the whole looksLikeBoardURL branch, github + base_url = \"not-a-url\" is silently accepted — TestDoctorGitHubMalformedBaseURLStillFails fails (optional, not unvalidated)", "if milestone_mode = \"Version\" or \" version\" is rejected, TestDoctorNormalisesMilestoneMode fails", "if auth_scheme = basic is rejected, or the message stops listing private-token | bearer | basic, TestDoctorNormalisesAuthScheme fails", "if a partial migration leaves one literal switch behind while the message is already derived, TestDoctorCarriesNoProviderLiterals fails"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 2
  title = "Route issue + forge through configenum; forge Basic"
  files = ["internal/cmd/issue.go", "internal/forge/forge.go", "internal/forge/jira.go", "internal/forge/youtrack.go", "internal/cmd/issue_test.go", "internal/forge/forge_test.go"]
  description = "issue.go's recognition list and its two hard-coded note strings become\nBoardProviders.Has / .List(). issue.go's milestone_mode read (currently ToLower only,\nno TrimSpace) also routes through configenum.Normalize, so doctor's relaxed check in\nt-6 cannot bless a value this branch then silently skips. Same for the provider\nreads at issue.go:114 and :145 and the two forge dispatch switches (forge.go:70 in\nNew, :140 in NewBoard) plus its auth-scheme check (:612) — all drop bare ToLower for\nconfigenum.Normalize. forge.New's expected-provider message is generated from\nForgeRESTProviders (exported by t-1, not re-derived here). The two\nmilestone_mode consumers — jira.go:227 and youtrack.go:185 — are one-line\nsubstitutions of ToLower(TrimSpace(mode)) for configenum.Normalize, so every\nmilestone_mode site shares the single normalisation. The unconditional base_url note at issue.go:155 becomes\nconditional on BoardRequiresBaseURL, so a correctly-configured github board stops\nbeing told to set one. forge Client.do learns the basic scheme per the locked\nbitbucket_auth decision.\n"
  covers = ["c-2", "c-6"]
  depends_on = ["t-1"]
  test_contract = ["if issue enable rejects any provider in BoardProviders, TestIssueEnableAcceptsEveryBoardProvider fails", "if the enable note is hand-typed rather than derived, TestIssueEnableNoteListsConfigenumSet fails", "if issue.go's milestone_mode read isn't trimmed, milestone_mode = \" version\" skips the fixVersion branch while doctor now passes it — TestMilestoneSyncTrimsMilestoneMode fails", "if bitbucket is mistakenly added to BoardProviders, TestIssueEnableRejectsBitbucket fails — forge_test.go cannot catch this, since NewBoard has no default arm and falls through to New, erroring identically either way", "if Client.do doesn't send Authorization: Basic base64(AuthUser:token) when the scheme normalises to basic — or still sends PRIVATE-TOKEN — the forge basic-auth test fails", "if basic with an empty AuthUser silently sends Basic base64(:token) instead of a construction error naming auth_user, that test fails", "if NewBoard or New still uses bare ToLower, board.provider = \" jira\" passes doctor and then fails every board op — TestNewBoardNormalisesProvider fails", "if issue enable still nags about base_url on a github board, TestIssueEnableSkipsBaseURLNoteForGitHub fails; a youtrack board with no base_url must still be nagged", "if jira.go or youtrack.go keeps its own ToLower(TrimSpace(mode)) instead of configenum.Normalize, TestMilestoneModeConsumersUseConfigenum fails — leaving milestone_mode the one enum free to drift"]
  status = "done"

