[[task]]
  id = "t-9"
  wave = 3
  title = "Add doctor cross-field combination warnings"
  files = ["internal/cmd/doctor.go", "internal/cmd/doctor_test.go"]
  description = "A warnings counter reported but never added to issues, so exit stays 0 per locked\nnew_check_severity. Four checks: milestone_mode outside MilestoneModesFor(provider);\nprovider=jira with board.auth_user empty; [remote].provider set but outside\nShipProviders; and remote provider bitbucket (or auth_scheme basic) with remote.auth_user\nempty, which t-3/t-4/t-7 make a guaranteed ship failure; and auth_scheme = basic on a\nremote provider with no Basic dispatch (only bitbucket implements it — gitlab falls\nthrough to PRIVATE-TOKEN, github ignores the scheme entirely). Empty and \"none\" remote\nproviders stay silent.\n"
  covers = ["c-5", "c-6"]
  depends_on = ["t-1", "t-2", "t-6"]
  test_contract = ["if jira + epic doesn't emit a warning, or emits an error instead, TestDoctorWarnsJiraEpicCombination fails; youtrack + epic must emit nothing", "if the implementation does issues++ instead of warnings++, TestDoctorCombinationWarningKeepsExitZero fails — the regression guard for the locked severity", "if provider=jira with an empty board.auth_user isn't warned, TestDoctorWarnsJiraMissingAuthUser fails", "if an unshippable remote provider (sourcehut) isn't warned, or bitbucket/none/empty is warned, TestDoctorWarnsUnshippableRemoteProvider fails", "if remote.provider = bitbucket or auth_scheme = basic with an empty remote.auth_user isn't warned, TestDoctorWarnsBasicAuthMissingAuthUser fails — that pairing 401s on every ship", "if auth_scheme = basic on a gitlab remote isn't warned, TestDoctorWarnsBasicOnNonBitbucketRemote fails — it passes doctor clean today and 401s on every ship", "if a genuinely invalid value stops exiting non-zero, TestDoctorHardFailureStillNonZero fails"]
  status = "pending"

[[task]]
  id = "t-10"
  wave = 4
  title = "Add validator/dispatch divergence guard"
  files = ["internal/cmd/enum_divergence_test.go"]
  description = "A go/ast walker providerCasesIn(file, funcName) collects the string literals of a\nnamed function's provider switch; the test compares those sets against configenum.\nScans the dispatch side — internal/ship/{open,comment,merged}.go,\ninternal/forge/forge.go, and the milestone_mode switches in internal/forge/jira.go and\nyoutrack.go — and the writer side, internal/project/remote.go. The writer\nside needs a SECOND extraction shape: KnownHostProviders is a package-level map var,\nnot a function, so it takes a composite-literal walk, while DetectRemote's api-base\nswitch uses providerCasesIn. Their semantics differ too — the host map has 4 provider\nvalues (no gitea host exists) so it is asserted as a SUBSET of ShipProviders, while the\napi-base switch is set-equality. Walker lives in the _test.go file (repo precedent:\nrepoRootFromTest in commands_parity_test.go), not a production file.\n"
  covers = ["c-3"]
  depends_on = ["t-1", "t-3", "t-4", "t-7"]
  test_contract = ["if bitbucket is implemented in OpenPR but forgotten in PostComment, TestShipDispatchMatchesShipProviders fails naming the function", "if the board guard compares only NewBoard's cases, TestBoardDispatchMatchesBoardProviders fails — NewBoard has no default arm and falls through to New, so the union is what must match", "if the ast walker silently extracts nothing, TestProviderCasesInParsesFixture fails on an in-test source string — without it both guards could pass vacuously", "if a host mapping is added to remote.go without teaching ship, TestRemoteWriterSubsetOfShipProviders fails — the writer side is where the original bitbucket divergence came from", "if the api-base switch and ShipProviders diverge, TestRemoteAPIBaseMatchesShipProviders fails; asserting equality against the 4-value host map instead would fail on day one", "if a mode is added to MilestoneModes without teaching jira.go/youtrack.go, TestMilestoneModeDispatchMatchesConfigenum fails — jira's set is [version] only, so it is a subset assertion, youtrack's is equality", "if a scanned function yields fewer than 3 literals (e.g. dispatch refactored to a map), TestGuardsSeeNonEmptySets fails loudly instead of passing empty", "if any scanned dispatch site normalises with bare strings.ToLower instead of configenum.Normalize, TestDispatchUsesConfigenumNormalize fails — this is what keeps validator and consumer leniency identical by construction"]
  status = "pending"
