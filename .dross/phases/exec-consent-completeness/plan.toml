  wave = 2
  depends_on = ["t-1", "t-2"]
  title = "Describe the enumerated surface, not six names"
  files = ["internal/cmd/trust.go", "internal/cmd/doctor.go", "assets/prompts/verify.md", "assets/prompts/execute.md", "assets/prompts/quick.md", "internal/cmd/execconsent_docs_test.go"]
  description = "Rewrite execGatedCommands' comment (trust.go:698 opens `the CLOSED set`, :716 says `The\nother four`), doctor's Exec consent section (doctor.go:1212), and the three prompts that\ndescribe the gated surface — quick.md:83 `the loop commands below refuse`, verify.md:22 `the\none consent-gated execution site`, which stops being true the moment drain joins. A docs\ntest pins the wording by reading the source file the way redproof_doc_test.go already does.\noptions.md carries consent prose but describes grant mechanics, not the gated set — confirm\nrather than edit blind.\n"
  covers = ["c-5"]
  test_contract = [
    "if the closed-set framing survives, the docs test must fail on trust.go's comment containing `CLOSED set`, `the other four`, or a spelled-out command count",
    "if a future author restates a count, a repo-wide grep for `six commands` / `6 commands` must fail on a hit anywhere in .go or assets/*.md — as word or numeral",
    "if a prompt still names a fixed list, the docs test must fail when any of verify.md, execute.md or quick.md describes the gate as a closed set of command names",
    "if drain's membership is undocumented, `dross doctor` under `Exec consent:` must name `survivor drain` among what the grant authorizes",
    "if the escape hatch is undiscoverable, `dross doctor` under `Exec consent:` must contain the token `//dross:exec-exempt`, so the reader learns it where they learn the state",
    "if the comment's pointer rots, it must name TestEverySpawnSiteGatedOrExempt by function name and the docs test must fail when that function no longer exists",
  ]
  status = "pending"

