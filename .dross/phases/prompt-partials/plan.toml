[[task]]
  id = "t-1"
  wave = 1
  title = "Capture before-leg flow cost on base prompts"
  files = [".dross/phases/prompt-partials/flow-cost-before.toml"]
  description = "Build the base binary from a scratch worktree at 3ee0fe71 (`git worktree add <scratchpad>/base 3ee0fe71`, `go build` there; never run `dross test` from it) so binary_version names 3ee0fe71. Build two scratch fixtures with test-output-summaries flow-cost.toml inline setup_sh pattern (fixed GIT_*_DATE so the tree is reproducible): a pair execute task, and a verify run whose gremlins legs kill every mutant. Human-driven: one pair /dross-execute task and one attached /dross-verify on that base binary, prompts still unedited. Record [before]/[verify_before]: prompt_bytes, partial_fetches, agent_turns, turn_tools, wall_clock_s (human waits excluded), human_wait_s, dross_calls, verdict, binary_version, session_id, fixture_tree. The filename is outside the flow-cost.toml glob, so it is ungated until t-16 merges it."
  covers = ["c-6"]
  test_contract = [
    "if a leg ran on already-edited (symlinked) prompts, t-16's TestFlowCostRecords/prompt-partials fails: [before].prompt_bytes != 25853 or [verify_before].prompt_bytes != 25864",
    "if the verify fixture cannot reach pass (e.g. an equivalent mutant like Clamp's `x < lo` -> `x <= lo`), the check fails: [verify_before].verdict must be pass with unclassified_in_scope = 0",
    "if the fixture is non-deterministic, the check fails: running fixture setup twice gives the same `git rev-parse HEAD^{tree}`, recorded as fixture_tree",
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add partial registry, fetch grammar, in-place Expand"
  files = ["assets/partials.go", "assets/partials_test.go"]
  description = """
Registry is the filename rule prompts/_<prompt>.<name>.md (name [a-z][a-z0-9-]*), no Go map. Partial, PartialNames, FetchPoints, Expand (inlines each
partial right after its fetch line), all over fs.FS. Fetch-line grammar: **When** `<key>=<value>` — <prose>: `dross prompt partial <p> <n>`. Closed
vocabulary: mode{pair,solo}, preflight{ok,recovery}, board_pull{none,reported}, test_exit{0,1,not-run}, leg{attached,detached}, mutation{ran,failed},
scope{ranged,degraded}, unclassified{zero,nonzero}, reviews{none,present}, verdict{pass,partial,fail}; common path = every first value plus verdict=pass.
Registry, grammar, common-path and common-path-inline tests run over the real assets.FS and land green (no partials yet)."""
  covers = ["c-3", "c-4", "c-5"]
  test_contract = ["if partial lookup escapes, TestPartialRejectsBadNames fails: Partial(execute, ../verify), Partial(execute, Solo) and Partial(interaction, x) each error and never read outside prompts/", "if _interaction.md is mistaken for a partial, the registry test fails: it is never listed as a partial and never reported as an orphan", "if a fetch line names a missing partial, the registry check fails on a MapFS naming execute.md:<line>; a _execute.ghost.md no fetch line names fails as an orphan", "if a fetch line lacks **When** `k=v` or uses an unknown key (colour=red), the grammar check fails", "if a common-path trigger fetches, TestCommonPathFetchesNothing fails: a synthetic trigger mode=pair or test_exit=0 is rejected", "if a trigger fires on gremlins' always-whole-file path, the trigger check fails: prose naming whole_file, adapter-lacks-range-runner or gremlins is rejected", "if a prompt tells the agent to Read a partial instead of fetching it, the check fails: naming _execute.solo.md or a ~/.claude/dross/prompts/_ path is rejected", "if Expand alters fetch-free prompts, TestExpandIdentity fails: Expand(quick) is byte-identical to quick.md; on a MapFS index(fetch) < index(body) < index(next base line)", "if common-path text leaves the base prompt, TestCommonPathInline fails: raw execute.md must keep `git add <task.files>`, `dross changes record`, `dross test --files`, `approve <task-id>`, `### 1g`; raw verify.md must keep `dross verify <phase>`, `dross verify finalize`, covered/weak/uncovered and \"If verdict is `pass`:\"", "if a compaction re-fetch line is mis-handled, TestRefetchLineIsAReference fails: a `**Re-fetch** if context was compacted: `dross prompt partial execute solo`` line counts as a registry reference, is not inlined by Expand, and must name a partial that also has a When fetch point", "if a twice-referenced partial is double-inlined, TestExpandInlinesOnce fails: on a MapFS with two fetch lines naming one partial, Expand contains its body exactly once, after the first fetch line", "if walkers break on partial files, TestExpandPartialPassThrough fails: Expand(_execute.solo) and Expand(_interaction) return the file bytes unchanged", "if .md-suffixed names diverge, TestExpandStripsMdSuffix fails: Expand(verify.md) == Expand(verify)", "if the pass-path next-phase block leaves base verify.md, TestCommonPathInline fails: raw verify.md must keep the section 5 milestone-array next-phase resolution and the no-milestone fallback", "if always-on gremlins guidance leaves base verify.md, TestCommonPathInline fails: raw verify.md must keep that gremlins is always whole-file and the instruction to judge the score against what was actually instrumented"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Absorb version, board sync, pull into execute begin"
  files = ["internal/cmd/execute.go", "internal/cmd/execute_test.go", "internal/boardsync/board_lifecycle_divergence_test.go"]
  description = """
After the mode record, begin sets the version patch from phase.DisplayNumber (same source as `dross phase number`), writing only when major.minor or
patch differ (internal survives a resume); runs board phase sync in-progress; runs a report-only task pull (never --apply). Each prints one labelled line:
version:, board:, pull:. A board HTTP failure is recorded first, then exits non-zero with `board: FAILED`. `// absorbs: <command>` marker at each call.
emittedStatuses gains a 4th source: literal statuses passed to boardsync.SyncPhase in internal/cmd."""
  covers = ["c-1", "c-4"]
  test_contract = [
    "if the patch isn't derived from the ordinal, TestBeginBumpsVersion fails: milestone v1.8, phases [a,p], version 1.8.1.3 -> `begin p` writes 1.8.2.0 to state.json and project.toml",
    "if a resume resets internal, TestBeginResumeKeepsInternal fails: with 1.8.2.1 set, begin prints `version: ... unchanged` and project.toml is byte-identical",
    "if begin guesses without a milestone, the test fails: no current milestone, phase missing from the array, or non-vX.Y version -> `version: skipped (<reason>)` and nothing written",
    "if a refused begin has side effects, the test fails: no plan, `../p`, or --solo with no reviewer leave project.toml and state.json byte-identical and the httptest board sees 0 requests",
    "if begin applies board moves, the test fails: on a youtrack httptest board begin sends in-progress for p; a moved card lists \"t-2 pending -> done\" with plan.toml byte-identical (also for a both-sides conflict)",
    "if a board failure is swallowed, the test fails: board 500 on phase sync -> execute.json still records the mode, exit is non-zero, output has `board: FAILED`; board off -> `board: off` and 0 HTTP requests",
    "if a provider refusal is treated as failure, the test fails: on a Forgejo/Gitea/GitLab board the pull prints `pull: n/a ...` and exits 0",
    "if the state guard is deleted instead of narrowed, TestExecuteBeginLeavesStateAlone fails: current_phase, current_phase_status, current_milestone unchanged; only version may differ",
    "if the stale-binary signal disappears, the test fails: every non-refused begin prints exactly one `version:` line",
    "if the SyncPhase call is removed from begin, TestEmittedStatusesAreTheLifecycleSet reports in-progress missing once execute.md stops emitting it",
  ]
  status = "done"

