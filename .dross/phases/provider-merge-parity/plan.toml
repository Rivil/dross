[phase]
id = "provider-merge-parity"

[[task]]
id            = "t-1"
wave          = 1
title         = "Swap PRMerged seam for PRStatus (adds BaseRef)"
files         = [
  "internal/ship/merged.go",
  "internal/ship/merged_test.go",
  "internal/ship/bitbucket.go",
  "internal/ship/bitbucket_test.go",
  "internal/cmd/phase.go",
  "internal/cmd/phase_test.go",
]
description   = """
Replace PRMerged/PRMergedFunc with PRStatus(opts) (PRStatus, error) / PRStatusFunc,
PRStatus = {Merged bool; BaseRef string}. GitHub adds baseRefName to its
`gh pr view --json` list. Bitbucket populates BaseRef from destination.branch.name
(bitbucket is a first-class provider under the widened retarget_scope, not carried
along with an empty ref). mergeGate moves onto the new seam in the same commit, and
— this is the mechanism that makes the stub's BaseRef default possible — mergeGate
sets opts.BaseBranch = reconcileBranch before calling PRStatusFunc, so the fixture's
own recorded base flows into the call the stub receives.

stubPRMerged(t *testing.T, merged bool) — internal/cmd/phase_test.go:20-29 — keeps
its name and exact signature; its body moves onto PRStatusFunc and its default
BaseRef echoes back opts.BaseBranch (the mechanism above), so it needs no new
parameter to stay in sync with each fixture's recorded base. This keeps all 46
existing call sites (38 in phase_test.go, 8 across completion_state_truth_test.go,
state_history_test.go, switchbranch_test.go, phase_base_truth_test.go,
state_clobber_regression_test.go) compiling and green, since each already runs
against its own recorded base via opts.BaseBranch rather than a hardcoded value.
"""
covers        = ["c-5"]
test_contract = [
  "TestPRStatusGitHubReturnsBaseRef: canned ghCommand output {\"state\":\"MERGED\",\"mergedAt\":\"…\",\"baseRefName\":\"main\"} yields {Merged:true, BaseRef:\"main\"}, and the recorded ghCommand args contain \"state,mergedAt,baseRefName\"; dropping the field fails it.",
  "TestPRStatusGitHubClosedIsNotMerged: \"CLOSED\" yields Merged false; a `state != \"OPEN\"` impl passes today's tests and fails this one.",
  "TestPRStatusBitbucketPopulatesBaseRef: a MERGED payload with destination.branch.name \"main\" yields {Merged:true, BaseRef:\"main\"} — not an empty BaseRef.",
  "TestPRStatusFuncDefaultsToPRStatus: the exported var is non-nil and delegates to PRStatus; this test re-keys off an unknown provider (or OpenOpts{}) rather than \"gitlab\" — today's TestPRMergedFuncDefaultsToPRMerged uses gitlab as its unsupported exemplar, but t-4 makes gitlab a supported PRStatus provider, so keying on it here would break silently two tasks later.",
  "TestPRStatusUnsupportedProvider: gitlab/forgejo/gitea still return ErrMergeStatusUnsupported at this point; the table only shrinks in t-4/t-5.",
  "TestPhaseCompleteRefusesUnmergedUpstream and TestPhaseCompleteMergeGateRefusalLeavesHEADOnPhase keep passing through stubPRMerged (name unchanged, body retargeted onto PRStatusFunc); a missed call site fails `go build ./internal/cmd`.",
  "stubPRMerged retains its existing name and signature; all 46 existing call sites across all six cmd-test files keep compiling and passing unchanged, each exercising its own recorded base via opts.BaseBranch rather than a hardcoded value.",
  "The stale sentinel doc comments in internal/ship/merged.go (lines ~13-24: \"for providers whose ... lookup isn't wired yet (forgejo/gitea/gitlab)\", \"GitHub is the only authoritative provider today\") are rewritten to describe ErrMergeStatusUnsupported's forward-seam role rather than naming providers this phase wires up.",
]
depends_on    = []
status        = "pending"

[[task]]
id            = "t-2"
wave          = 1
title         = "GitLab open-MRs by target branch, paginated"
files         = [
  "internal/ship/gitlab.go",
  "internal/ship/gitlab_test.go",
  "internal/ship/basepr.go",
  "internal/ship/basepr_test.go",
  "internal/ship/open.go",
]
description   = """
New gitlab.go holding gitlabTarget(opts) — the APIBase/AuthEnv/token/
splitOwnerRepo/gitlabProjectRef preamble currently inlined in openGitLabPR — and
gitlabOpenMRsTargeting via GET /projects/{ref}/merge_requests?state=opened&target_branch={base},
with explicit per_page/page looping. OpenPRsTargeting dispatches gitlab. The
preamble (openGitLabPR at open.go:155, gitlabReq at :243, splitOwnerRepo at :302,
gitlabProjectRef at :220) is extracted out of open.go into gitlab.go, so open.go
itself changes too — its call sites keep working unchanged against the extracted
helpers.

Collides with t-3 on internal/ship/basepr.go and basepr_test.go (same dispatch
switch, same unsupported-provider table) — both wave-1; serialize the two edits
rather than running them fully in parallel.
"""
covers        = ["c-4"]
test_contract = [
  "TestGitLabOpenPRsTargetingUsesIID: [{\"iid\":7,\"id\":901}] yields BasePR.Number == 7; an impl reading \"id\" returns 901 and fails.",
  "TestGitLabOpenPRsTargetingFieldMapping: web_url→URL, source_branch→HeadRefName.",
  "TestGitLabOpenPRsTargetingQueryAndAuth: handler asserts state=opened and target_branch=<base> on the query, plus PRIVATE-TOKEN; a bearer sub-case asserts Authorization: Bearer and no PRIVATE-TOKEN.",
  "TestGitLabOpenMRsPaginates: server returns a full page then a short page; both pages' MRs must appear and every request must carry target_branch=<base>. GitLab defaults to 20/page, so a first-page-only impl lets `milestone prune` delete a branch with live dependents.",
  "TestGitLabOpenPRsTargetingHTTP500IsError: a 500 (including on page 2) yields a non-nil error and a nil slice, never an empty or partial slice; an empty slice reads as \"no dependents\" and authorizes an irreversible branch delete.",
  "TestGitLabOpenPRsTargetingMissingToken: with $AuthEnv unset the error mentions `dross env set` and the httptest server records zero requests.",
  "basepr_test's unsupported-provider table no longer lists \"gitlab\"; bitbucket still yields ErrBasePRLookupUnsupported.",
  "TestOpenPRsTargetingFuncDefaultsToOpenPRsTargeting re-keys its delegation assertion off an unknown provider rather than \"gitlab\", since this task makes gitlab a supported OpenPRsTargeting provider in the same commit that would otherwise break it.",
  "existing open_test.go GitLab OpenPR tests keep passing after the preamble extraction; a missed call site fails `go build ./internal/ship`.",
  "The stale sentinel doc comments in internal/ship/basepr.go naming gitlab as an unwired provider are rewritten to reflect gitlab now being supported.",
]
depends_on    = []
status        = "pending"

