[[task]]
id            = "t-6a"
wave          = 2
title         = "mergeGate announces provider-fallback (unsupported/error)"
files         = [
  "internal/cmd/phase.go",
  "internal/cmd/phase_test.go",
  "ARCHITECTURE.md",
]
description   = """
mergeGate prints a reason line on both fall-through paths (ErrMergeStatusUnsupported
at phase.go:741, generic error at :743) in printOpenPRSkip's shape — "print, then
continue", not "swallow and continue".

ErrMergeStatusUnsupported becomes unreachable for any of the five
configenum.ShipProviders once t-4/t-5 land (all five answer PRStatus
authoritatively). It is kept intentionally as a forward seam for a future
provider added without a PRStatus implementation yet — not deleted — so the
announce branch stays wired and its test exercises the seam directly via a stub
rather than a reachable real-provider path.

ARCHITECTURE.md's stale provider index lines (306 OpenPRsTargeting, 361
ship.PRMergedFunc, 502 "`bitbucketPRMerged` reports the authoritative merged
status" — now true of all five providers, not just bitbucket, and 508
"bitbucketPRMerged (authoritative state == MERGED) — internal/ship/merged.go:71" —
invalidated by t-1's PRMerged→PRStatus rename) are corrected in the same commit.
"""
covers        = ["c-3"]
test_contract = [
  "TestMergeGateAnnouncesUnsupportedProvider: stub PRStatusFunc to return ErrMergeStatusUnsupported; captureStdout contains a line naming the provider and the git-ancestry fallback. This exercises the forward-seam path directly, since no real provider reaches it after t-4/t-5.",
  "TestMergeGateAnnouncesProviderError: stub a network error; the printed line contains that error's text, so a generic \"check skipped\" that swallows the cause fails the substring assert.",
  "TestMergeGateHappyPathIsSilent: {Merged:true, BaseRef:\"main\"} returns nil and prints nothing, so the announce doesn't become noise on every successful completion.",
  "TestMergeGateNoRecordedPRStillFallsBack: recordedPR == 0 takes the ancestry path with no provider call and no announce (not a provider-caused fallback), preserving TestPhaseCompleteRefusesUnmergedNoLocalBranch.",
]
depends_on    = ["t-1"]
status        = "pending"

[[task]]
id            = "t-6b"
wave          = 3
title         = "mergeGate refuses on retargeted base"
files         = [
  "internal/cmd/phase.go",
  "internal/cmd/phase_test.go",
]
description   = """
Before the merged short-circuit (phase.go:735-736), mergeGate compares
PRStatus.BaseRef against reconcileBranch — mergeGate's own parameter, already the
fully-resolved recorded base per resolveCompleteBase's order (--base flag →
changes.Base → phaseRefRecordedBase, phase.go:645-666) — refusing completion when
they differ. No separate re-read of changes.Base: reconcileBranch already carries
that resolution, and re-reading changes.Base would bypass --base and drop the
phaseRefRecordedBase stale-tree tier.

Normalization (strip refs/heads/, exact case-sensitive compare) lives here, in one
place. An empty BaseRef — a 2xx PRStatus response whose payload omits the base
field (baseRefName/target_branch/base.ref/destination.branch.name) — announces a
skipped retarget check and proceeds; this is distinct from a provider error, which
takes t-6a's announced ancestry fallback and never reaches this compare at all.
"""
covers        = ["c-5"]
test_contract = [
  "TestPhaseCompleteRefusesRetargetedBase: stub {Merged:false, BaseRef:\"other\"} against a reconcileBranch of \"main\"; complete exits non-zero, the error names both branches and a concrete remedy (re-point the PR on the forge, or re-run `dross ship` so the record is rewritten — --recover does not bypass mergeGate today), and HEAD is still on phase/<id>.",
  "TestPhaseCompleteRefusesRetargetedBaseEvenWhenMerged: {Merged:true, BaseRef:\"other\"} still refuses. An impl that puts the comparison after the `merged → return nil` short-circuit passes the previous test and fails this one.",
  "TestMergeGateEmptyBaseRefAnnouncesSkip: a 2xx PRStatus response whose payload omits the base field yields BaseRef:\"\" with err == nil; mergeGate proceeds and prints a \"base-retarget check skipped\" line. A false retarget alarm would block every completion on that provider — worse than the gap c-5 targets.",
  "TestRetargetNormalizesRefsHeads: refs/heads/main vs main is not a retarget.",
  "TestMergeGateRetargetSkipsOnProviderError: a provider error (err != nil) never reaches the base compare — it takes t-6a's announced ancestry fallback instead, never a retarget refusal.",
]
depends_on    = ["t-6a"]
status        = "pending"

