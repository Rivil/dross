  wave = 2
  depends_on = ["t-1", "t-2"]
  title = "Set and clear preconditions via task add/edit/show"
  files = ["internal/phase/plan_edit.go", "internal/cmd/task.go", "internal/cmd/task_precondition_edit_test.go", "cmd/dross/testdata/cli_tree.txt", "README.md"]
  description = "NewTask and TaskEdit gain Preconditions. `--precondition '<TOML inline table>'` (StringArray, repeatable) on add and edit — on edit it replaces the list. `--add-precondition` appends; `--clear-preconditions` empties; conflicting combinations refused. An edit that changes PreconditionSetLine prints that the phase grant is revoked; one that leaves it unchanged prints nothing. `show` prints preconditions in text and --json. README `dross task` row names the flags."
