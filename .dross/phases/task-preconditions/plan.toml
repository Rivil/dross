  test_contract = ["if add drops or spills, `task add --precondition '{run = \"go test ./x\", max = 5}'` does not reload with that run and max, or another task's bytes change", "if the inline table is split naively, `{ run = \"a, b && c\", max = 3 }` does not decode run to exactly \"a, b && c\"", "if malformed input is written, `{run = \"\"}`, `{run = \"x\", bogus = 1}`, `{run = \"x\", timeout = \"soon\"}` or malformed TOML is accepted or changes plan.toml bytes, or validate and task edit disagree on the same fixtures", "if edit semantics slip, `--precondition` does not replace, `--add-precondition` does not append, `--clear-preconditions` leaves any block (including a stray unknown key), or `--clear-preconditions` combined with either other flag is accepted", "if revocation is misreported, an edit that changes PreconditionSetLine leaves the grant Granted or omits `dross trust --preconditions <phase>`, or an edit that leaves it unchanged (timeout \"\" → \"60s\", re-writing identical values, `--title` only) prints a revocation line", "if show hides them, `task show` omits run, bounds, timeout or why, or `--json` lacks a `preconditions` array", "if a bypass appears, task edit gains any flag that marks a precondition as skipped", "if the CLI surface drifts, cli_tree.txt lacks the new add/edit flags"]
  status = "done"

