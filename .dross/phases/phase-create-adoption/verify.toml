[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/phase/adopt_test.go:TestResolveAdoptsAnUnstartedPhase", "internal/phase/adopt_test.go:TestResolveNeverCoinsASuffix", "internal/cmd/phase_create_adopt_test.go:TestCreateAdoptsRatherThanCoining", "internal/cmd/phase_test.go:TestPhaseCreateSlugIdentity"]
  notes = "Covered at both levels, and the CLI one reconstructs the reported incident rather than a paraphrase of it: a placeholder directory of the kind `deferred route --target` leaves behind, plus a create of the same title, asserting no `<slug>-2` directory exists, no branch was cut for one, and the milestone array holds the slug exactly once. Counting array entries by prefix rather than by exact match is deliberate — a coined `survivor-drain-2` is precisely what a `== \"survivor-drain\"` check would miss. TestResolveNeverCoinsASuffix closes the same door at the resolver across all three directory shapes, so the behaviour cannot come back through a path the CLI test does not drive."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/phase/adopt_test.go:TestResolveRefusesAStartedPhase", "internal/phase/adopt_test.go:TestStrayFileDoesNotBlockAdoption", "internal/cmd/phase_create_adopt_test.go:TestCreateRefusesAStartedPhase"]
  notes = "The refusal is asserted to act on NOTHING — no branch cut, no array entry, no coined directory — because a refusal that half-acted leaves the repo in a state neither outcome asked for, and the user has to clean up after a command that declined to act. The started test runs per marker file (spec.toml, plan.toml, changes.json), so losing any one of the three from the rule fails by name instead of being masked by the other two. TestStrayFileDoesNotBlockAdoption guards the opposite error: keying on the directory being empty would let an editor swap file or a stray README make a placeholder look occupied, re-opening the coining path through a file nobody meant as a signal."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/phase_create_adopt_test.go:TestAdoptionKeepsItsMilestoneSlot"]
  notes = "The placeholder is planted MID-array with two phases either side, and the whole array is compared afterwards — not just the adopted phase's index. That is the assertion that catches the real failure: re-appending to the tail does not merely move one entry, it renumbers every phase after the vacated slot, and the array is what ordinals, the version patch digit and verify's next-phase narration all read. A test checking only that the slug is still present would pass while the roadmap silently re-ordered."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/cmd/phase_create_adopt_test.go:TestAdoptionIsReported", "internal/cmd/phase_create_adopt_test.go:TestFreshCreateIsUnchanged"]
  notes = "Both directions, because either alone is satisfiable by the wrong output: adoption must say so, and a FRESH create must NOT say it — a command that reported adoption every time would pass a one-sided check while telling every user their new phase was someone else's. TestFreshCreateIsUnchanged also pins the rest of the untouched path (branch cut, array append at the tail), since adoption is additive and a phase whose slug is free must behave exactly as before."

