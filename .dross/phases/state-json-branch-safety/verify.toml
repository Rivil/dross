  tests = ["internal/cmd/switchbranch_test.go:TestCheckoutRefusalNamesStateJSON", "internal/cmd/switchbranch_test.go:TestCheckoutRefusalIsNonDestructive", "internal/cmd/switchbranch_test.go:TestPhaseCreateSurfacesCheckoutRefusal", "internal/cmd/switchbranch_test.go:TestPhaseCompleteSurfacesCheckoutRefusal", "internal/cmd/switchbranch_test.go:TestGuardedFFAndResetRefuseTrackedState", "internal/cmd/switchbranch_test.go:TestGuardedOpsRunWhenTargetHasNoCopy", "internal/cmd/gitignore_test.go:TestStateJSONNotTracked", "internal/cmd/gitignore_test.go:TestInitScaffoldsStateIgnore", "internal/cmd/gitignore_test.go:TestOnboardScaffoldsStateIgnore"]
  notes = "DOWNGRADED from covered this pass. The guard itself is thoroughly pinned: the switch is refused naming .dross/state.json and the literal `cp` recovery command, the live 12-entry file and HEAD are unchanged after the refusal, TestGitDoesNotRefuseIgnoredClobber pins the precondition the guard exists for, and TestCheckoutRefusalPassesThroughOtherErrors stops it swallowing unrelated git failures. Zero mutants survive in switchbranch.go. What is NOT pinned is the criterion's word `every`: checkoutBranch has two call sites and only phase.go:429's is exercised. milestone.go:227 -- rewritten by this phase's t-8 to route milestoneFinalize through the guard -- is never executed by any test (go-cover: blocks 226.23,227.61 and 227.61,229.4 both count 0, because milestoneFinalizeFixture always leaves HEAD on main). Revert that line to a raw `git checkout` and `dross milestone complete --finalize` run from the milestone branch silently clobbers live state again, with the whole suite still green."

