  notes = "The table covers all four named commands (phase complete, phase complete --recover, ship recover, milestone complete --finalize) with 12 distinct seeded entries checked for presence AND relative order, so a reorder fails as loudly as a drop. The own-entry assertion is applied only to the two commands that actually record one, justified in-file rather than skipped silently. Zero mutants survive in ship_recover.go. The previous pass's FLAG on status.go:539 is CLOSED: t-7 added TestStatusStaleFromPRRecordAlone, which strips the history half so only changes.json's PR record can answer, plus a paired no-signal control -- go-cover now shows phaseRecordsPR's blocks (537.48,540.2 and 544.66-548.4) at count 1. Note the milestone-complete row is proven on the fast-forward path only; the checkout path is the c-1 FLAG below."

