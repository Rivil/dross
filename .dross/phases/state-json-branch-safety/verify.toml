  status = "covered"
  tests = ["internal/cmd/release_version_test.go:TestReleaseVersionScriptResolvesTag", "internal/cmd/release_version_test.go:TestReleaseVersionScriptRejectsMissingVersion", "internal/cmd/release_version_test.go:TestReleaseVersionScriptIgnoresOtherTables", "internal/cmd/release_version_test.go:TestReleaseVersionScriptRejectsMissingFile", "internal/cmd/release_version_test.go:TestReleaseWorkflowHasNoStateJSONRead", "internal/cmd/project_test.go:TestRepoProjectVersionIsLive"]
  notes = "Unchanged from the previous pass and re-confirmed. The script runs under PATH=/usr/bin:/bin so no locally-installed jq or dross can satisfy a dependency CI lacks -- that is the `clean CI checkout with no dross binary` half. The `value it reads is the one dross bumped` half is TestRepoProjectVersionIsLive (this repo's [project].version parses as a 4-part version and is no longer the dead 0.2.0.0 scaffold) plus release.yml's ban on state.json/jq. release-version.sh is a .sh file with no mutation adapter, so it is covered by assertion only, not by mutation."

