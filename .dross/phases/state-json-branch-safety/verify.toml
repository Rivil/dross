[[finding]]
  severity = "FLAG"
  text = "milestone.go:227 -- milestoneFinalize's `checkoutBranch(repoDir, mainBranch)` is never executed by any test (1 not-covered mutant). This phase's t-8 rewrote that line specifically to route milestone complete's checkout through the new live-state guard, but milestoneFinalizeFixture ends on main in both its merged and unmerged forms, so `if cur != mainBranch` is always false and the call site never runs (go-cover blocks 226.23,227.61 and 227.61,229.4 both count 0). Running `dross milestone complete --finalize` from the milestone branch -- the natural place to be -- is therefore the one guarded switch with no test behind it, and reverting the line to a raw `git checkout` leaves the suite fully green. NOTE: the previous pass mis-filed this mutant in the switch-case-ceiling bucket; it is an ordinary `if err != nil`, not a case condition. Fix: a milestoneFinalizeFixture variant that leaves HEAD on milestone/<version>, asserting both that the finalize succeeds from there and that it refuses when the target branch carries a tracked state.json."

