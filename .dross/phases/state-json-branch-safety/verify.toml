  status = "covered"
  tests = ["internal/cmd/state_test.go:TestBumpInternalWritesBothFiles", "internal/cmd/state_test.go:TestWriteVersionRejectsBeforeWriting", "internal/cmd/state_test.go:TestWriteVersionFailureNamesBothPaths", "internal/cmd/project_test.go:TestProjectSetVersionMirrorsToState", "internal/cmd/doctor_test.go:TestDoctorReportsVersionDrift"]
