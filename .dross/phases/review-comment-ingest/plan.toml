[[task]]
  id = "t-18"
  wave = 1
  title = "Record reply approvals from AskUserQuestion"
  files = ["internal/gate/reply_confirm.go", "internal/gate/reply_confirm_test.go", "internal/gatestate/store.go", "internal/secretscan/writers.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "ReplyApproveLabel(pr, digest) = \"post reply #<pr> <digest>\". A Recorder on AskUserQuestion (the pair-approval pattern in internal/gate/pair.go) reads only the tool_response chosen labels; an exact match records gatestate.ReplyApproval{PR, Digest, At} in gate/reply.json, which the override gate already write-protects from the agent. gatestate gains Load/Save/ClearReplyApproval; gate/reply.json joins the store.go row in writers.go. Recording needs no prtriage: the label carries the digest."
  covers = ["c-5"]
  test_contract = ["if a non-exact answer records, TestReplyApprovalRecordsExactLabelOnly fails: a tool_response choosing \"post reply #12 <64-hex>\" records {PR 12, Digest}; a label with trailing text, a different case, a freeform answer, a reject or steer label, and the label present only in tool_input record nothing", "if a malformed label records, TestReplyApprovalRejectsMalformed fails: \"post reply #0 <d>\", \"post reply #x <d>\" and \"post reply #12 xyz\" (non-hex or short digest) record nothing", "if the record can be forged, TestReplyApprovalIsGateProtected fails: a Write or Edit to .dross/gate/reply.json and a Bash redirect into it are refused by the override gate", "if the store loses or keeps a stale approval, TestReplyApprovalStore fails: Save then Load round-trips; a second Save replaces the first; Clear removes it; a missing file loads nil", "if the new record is undeclared, TestMachineLocalWritersAreReallyIgnored, TestEveryDrossWriterIsDeclared or TestEveryFileConstIsDeclared fails (gate/reply.json in the store.go row)", "if the new gatestate field is unfiled, TestEveryPathShapedFieldIsDeclared fails: gatestate.ReplyApproval.Digest (and any other tagged string field it adds) has a row in not_paths.txt beside the gatestate.Approval rows"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 2
  title = "Persist the triage record and bind PR heads"
  files = ["internal/prtriage/record.go", "internal/prtriage/record_test.go", "internal/secretscan/writers.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "File = \"pr-triage.toml\": Record{[]Resolution{ID, Kind, PR, URL, Author, Verdict accept|reject|route, Reason, Evidence, Task, Deferred, Target, Digest, Posted}} with no body field, plus ReplyMarker. Load (absent -> empty; undecoded key -> error); Upsert by id; Validate(rec, Refs{Tasks, Deferred}). Save(path, readBytes, rec, refs) Redacts every string field first, then Validates the redacted record against refs (what is checked is what is written), refuses a stale read, and writes via project.SaveTOML keyed by id. ParsePhaseHead(head, crossRepo) is the single head->phase-id mapping (`phase/` prefix, one valid phase-id segment, same-repo); PhaseFromHead(root, head, crossRepo) adds the existing-plan.toml check the dross pr verbs need. Declared in writers.go on the row holding the write verb."
  covers = ["c-2", "c-3", "c-4", "c-7"]
  depends_on = ["t-2", "t-5"]
  test_contract = ["if a body can be persisted, TestResolutionHasNoBodyField fails: reflection over Resolution and Evidence finds no body/text/content/comment tag; Load of a file holding `body = \"...\"` errors naming the key", "if a malformed resolution validates, TestRecordValidate fails for each of: verdict \"maybe\"; unknown kind; reject with blank reason; zero evidence; evidence with both or neither of at and cmd; accept with no task or a task absent from Refs; route with no target or a deferred id absent from Refs; duplicate id; id not matching ^[cir][0-9]+(#[1-9][0-9]*)?$ (\"c12#0\", \"z12\"); an http:// url; an `at` escaping the repo — each problem names entry and field, and Save refuses leaving the file byte-identical", "if a string field skips redaction, TestSaveRedactsEveryString fails: a ghp_ token planted in every string field (enumerated by reflection) saves as `[redacted github-token]` and ScanString over the file is empty", "if concurrent saves clobber, TestRecordSaveRefusesStaleRead fails: two Saves from the same read -> the second is refused and the file holds the first", "if writes are lossy, TestRecordRoundTripLossless fails: Load(Save(r)) == r; missing file loads empty; a hand comment above an untouched entry survives an Upsert of another", "if a non-phase head binds, TestPhaseFromHead fails: \"milestone/v1.7\", \"feature/x\", \"phase/\", \"phase/a/b\", \"phase/../x\", cross-repo \"phase/x\" and \"phase/x\" with no plan.toml are refused; \"phase/x\" with a plan -> \"x\"", "if the artifact is undeclared, TestEveryDrossWriterIsDeclared, TestEveryFileConstIsDeclared, TestEveryScannedArtifactIsReached (phases/<id>/pr-triage.toml) or TestCmdDeclaresNoTomlStore fails", "if an empty url validates, TestRecordValidate fails: url \"\" is refused naming the entry and the url field, so a reply can never carry a dead link", "if the head mapping is loose, TestParsePhaseHead fails: \"milestone/v1.7\", \"feature/x\", \"phase/\", \"phase/a/b\", \"phase/../x\" and cross-repo \"phase/x\" are refused and \"phase/x\" -> \"x\", with no file read"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 2
  title = "Fetch comments, head and caller on Forgejo/Gitea"
  files = ["internal/ship/prcomments_forgejo.go", "internal/ship/prcomments_forgejo_test.go", "internal/ship/prcomments.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt", "internal/pathfence/fields.go", "internal/pathfence/fields_test.go"]
  description = "forgejo/gitea: issue comments paged by page=&limit=50 (url = html_url), reviews that have a body as kind review, and the inline comments of each review as inline (path + line). Every author reads unknown (the forge exposes no bot flag). Head/CrossRepo/Open from the pulls endpoint, caller from /user. Requests only via jsonGet after resolveToken (host allowlist). Wires the forgejo and gitea arms into the t-1 dispatch."
