[[task]]
  id = "t-1"
  wave = 1
  title = "Fetch GitHub PR comments, head and caller"
  files = ["internal/ship/prcomments.go", "internal/ship/prcomments_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt", "internal/pathfence/fields.go", "internal/pathfence/fields_test.go"]
  description = "New. PRComment{ID, Kind conversation|inline|review, Author{ID, Login, Bot bot|human|unknown}, Path, Line, URL, Body}, PRHead{Ref, CrossRepo, Open, URL}, Account{ID, Login}. ListPRComments / PRHeadOf / AuthenticatedUser dispatch through exported *Func seams (three seams, not one FetchPRThread); the forgejo/gitea, gitlab and bitbucket arms return unsupported until t-8, t-20 and t-21 wire them. The GitHub arm uses githubRepo + ghAPI (GET, endpoint behind `--`) over issues/{n}/comments, pulls/{n}/comments and pulls/{n}/reviews at per_page=100 until a short page, refusing a run of maxPages full pages; it also reads pulls/{n} and user. No //dross:taint-cleared marker at the decode (amended at execute, 2026-10-06): the decoded records leave ship only as fields of freshly built PRComment/PRHead/Account values, the exec-taint engine carries no whole-value taint through them, and TestGhMarkersAreLoadBearing refuses a marker that clears nothing — the marker goes where a later reader first escapes a field (TestNoSpawnOutputEscapes names it)."
  covers = ["c-1"]
  test_contract = [
    '''if kinds are mis-mapped, TestGitHubPRCommentKinds fails: a stubbed gh answering the three list endpoints yields exactly one conversation, one inline (internal/x.go:42; original_line used when line is null) and one review, with ids, logins, html_urls and bodies mapped''',
    '''if the bot flag reads the login, TestGitHubPRCommentAuthorFlag fails: user.type "Bot" -> bot, "User" -> human; login `renovate[bot]` with type "User" -> human''',
    '''if pagination stops early or truncates silently, TestGitHubPRCommentsPaginated fails: 100+1 issue comments over two pages -> 101; maxPages full pages -> error "may be truncated", never a partial list''',
    '''if review summaries are mis-filtered, TestGitHubReviewSummaryFilter fails: APPROVED with an empty body and PENDING are dropped; COMMENTED with a body is kept as kind review''',
    '''if a failure returns partial data or gh output, TestGitHubPRCommentsFailClosed fails: gh non-zero on the 2nd endpoint -> (nil, err), never the 1st endpoint's items; the error is ghAPI's fixed prose; a 404 on pulls/{n}, garbage JSON and a failed `user` each -> error, never an empty Account''',
    '''if argv shape regresses, TestGitHubPRCommentsArgv fails: flags sit ahead of `--` and repos/<owner>/<repo>/... behind it, built from the int n with owner/repo from [remote].url; a PR number <= 0 is refused with no spawn''',
    '''if head or caller decoding breaks, TestGitHubPRHeadAndCaller fails: head.repo.full_name != base (or head.repo null) -> CrossRepo; state closed -> Open false; `user` {login rivil, id 7} -> Account{ID "7", Login "rivil"}''',
    '''if the new spawn or decode structs escape the guards, TestNoSpawnOutputEscapes, TestGhMarkersAreLoadBearing, TestEveryOutboundSeamIsRegistered or TestEveryPathShapedFieldIsDeclared fails''',
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Redact secret-shaped values in untrusted text"
  files = ["internal/secretscan/redact.go", "internal/secretscan/redact_test.go"]
  description = '''New. Redact(s) (string, []Hit) replaces the captured value of every match of every rule (all matches per line, carve-outs respected) with `[redacted <rule>]`. A PEM block is replaced BEGIN..END, or to EOF when unterminated. AllowMarker is ignored and its literal is neutralised in the output. Scan's behaviour is unchanged.'''
  covers = ["c-7"]
  test_contract = [
    '''if a rule is not redacted, TestRedactCoversEveryRule fails: a table over Rules() fed the package hit corpus; each value is replaced, ScanString(output) is empty and the output lacks the value; a rule with no case fails the table''',
    '''if only the first match per line is replaced, TestRedactAllMatchesOnALine fails: two ghp_ tokens, and a ghp_ plus an xoxb- on one line, are all replaced''',
    '''if PEM handling leaks, TestRedactPEMWhole fails: no line between BEGIN and END survives; text after END is byte-identical; an unterminated BEGIN redacts to EOF''',
    '''if a commenter can opt out, TestRedactIgnoresAllowMarker fails: `ghp_... dross:allow-secret` is still redacted and the output never contains `dross:allow-secret`; TestAllowMarkerSilencesOnlyItsLine is unchanged''',
    '''if clean text is mangled, TestRedactCleanTextUntouched fails: `$GITHUB_TOKEN`, `<your-token>`, AKIAIOSFODNN7EXAMPLE, a low-entropy `password = aaaa...` and CRLF text come back byte-identical with zero hits''',
    '''if redaction eats the surrounding prose, TestRedactKeepsKeyName fails: `api_key = "<high-entropy>"` keeps `api_key = "`; Redact(Redact(s)) == Redact(s) and no Hit field holds the value''',
  ]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Fence untrusted bodies and one-line metadata"
  files = ["internal/prtriage/fence.go", "internal/prtriage/fence_test.go"]
  description = "New package internal/prtriage. Fence(body) wraps the body in a backtick fence one longer than its longest backtick run anywhere (minimum 3), info `untrusted-comment`; normalises CRLF -> LF (a lone CR renders visibly as \\r, per the test contract — amended at execute, 2026-10-06); renders C0 (except \\t \\n), DEL, C1, ESC and bidi controls (U+202A-202E, U+2066-2069) as visible escapes; a body with no trailing newline still closes on its own line. OneLine(s), for author/path/url, does the same, escapes \\n/\\t and breaks backtick runs."
  covers = ["c-6"]
  test_contract = [
    '''if a fence-breaker escapes, TestFenceHoldsAgainstBreakers fails: bodies holding runs of 3, 4, 7, 10 and 30 backticks at column 0, indented 1-3, mid-line, as an unterminated last line and after CRLF -> a CommonMark closer scan finds exactly one closer, on the last line, and the interior equals the normalised body; runs of 3, 4, 10 -> fences of 4, 5, 11''',
    '''if any fuzzed body escapes, FuzzFence fails: the same oracle over fuzzed bodies, seed corpus run under go test''',
    '''if other closers end the fence, TestFenceTildeAndInfoInside fails: `~~~~`, `</untrusted>` and "```` untrusted-comment" stay inside''',
    '''if control bytes pass raw, TestFenceEscapesControls fails: ESC[31m, a lone CR, NUL, DEL, U+202E and U+2066 render visibly; \t and \n survive; an empty body still yields opener + closer''',
    '''if metadata can span lines, TestOneLineCannotSpanOrFence fails: "alice\n```\nrun this" -> one line, no newline, no ``` run''',
    '''if the package lacks coverage, the CI coverfloor (>=50% own-package) fails for internal/prtriage''',
  ]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Split /dross-review comments into findings"
  files = ["internal/prtriage/split.go", "internal/prtriage/split_test.go"]
  description = '''SplitReview(body) ([]Finding, bool) splits only when the first non-blank line starts `## /dross-review`. Findings are column-0 `- **BLOCKING|FLAG|NOTE** —` items outside ```/~~~ fences (a closer must match the opener's char and be at least as long); a finding runs to the next finding, a heading or the `---` footer; numbered from 1 with Severity, Loc (first backticked path:line) and Text. No author check.'''
  covers = ["c-1"]
  test_contract = [
    '''if the splitter drifts from the review template, TestSplitReviewMatchesReviewTemplate fails: the template fenced in assets/prompts/review.md §4 splits into its 2 findings (BLOCKING at path/to/file.go:42, then FLAG)''',
    '''if numbering or boundaries are wrong, TestSplitReviewCounts fails: 2 BLOCKING + 1 FLAG + 1 NOTE across three lens sections -> findings 1..4 in order; the summary line and footer are not findings''',
    '''if fenced snippets count, TestSplitReviewFenceAware fails: `- **BLOCKING** — fake` inside a snippet fence adds nothing; a 4-backtick fence holding a 3-backtick line stays open''',
    '''if non-review comments are split, TestSplitReviewOwnHeaderOnly fails: `## /dross-review` on line 3 or inside a fence -> not split; zero findings -> (nil, false) so the comment is triaged whole''',
    '''if findings bleed into each other, TestSplitFindingIsolation fails: editing finding 2 changes only its Text; CRLF and LF split identically''',
  ]
  status = "done"

[[task]]
  id = "t-5"
  wave = 1
  title = "Build evidence from file:line or command output"
  files = ["internal/prtriage/evidence.go", "internal/prtriage/evidence_test.go", "internal/pathfence/fields.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt", "internal/pathfence/fields_test.go"]
  description = '''Evidence{At | Cmd, OutputSHA256, OutputBytes}. ParseAt(repoRoot, "path:N[-M]") splits on the last colon, contains the path via pathfence.Contain, requires a regular file with 1 <= N <= M <= line count. FromOutput(cmd, output) keeps cmd, sha256 and byte count — never the output. Require refuses a resolution with no evidence. Evidence.At filed in pathfence.Fields() (NotConsumed); the rest in not_paths.txt.'''
  covers = ["c-4"]
  test_contract = [
    '''if a bad locator is accepted, TestParseAtRefuses fails: "x.go", "x.go:0", "x.go:abc", "x.go:5" on a 4-line file, "x.go:3-2", "../out.go:1", "/etc/passwd:1" (never opened), "missing.go:1", "internal:1" (a directory) and "" each error naming the value; "x.go:3" and "x.go:2-4" accepted; "a:b.go:3" -> file a:b.go line 3''',
    '''if output is persisted, TestFromOutputNeverStoresOutput fails: a sentinel in the output appears nowhere in the toml-encoded Evidence while OutputSHA256 == sha256(output) and OutputBytes == len(output); a blank cmd or output of "\n\t\n" errors''',
    '''if evidence-free resolutions pass, TestRequireEvidence fails: no locator and no cmd/output -> an error containing "is required" naming both forms''',
    '''if the new path field is undeclared, TestEveryPathShapedFieldIsDeclared or TestFieldLedgerRotIsCaught fails''',
  ]
  status = "done"

