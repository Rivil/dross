task_seq = 20

[phase]
  id = "tool-gate-hooks"

[[task]]
  id = "t-1"
  wave = 1
  title = "Add lenient shell command scanner"
  files = ["internal/shellscan/scan.go", "internal/shellscan/scan_test.go"]
  description = """
Quote/escape-aware lexer splitting a Bash line into simple commands on && || ; | |& & and newline. Per command: argv with VAR=val and
env/command/sudo/nohup/time prefixes stripped, argv0 as basename, redirections with fd attribution, `cd` dir tracking, `git -C`. Recurses
into $(…) and backticks, skips heredoc bodies, propagates group/subshell redirects inward; an unbalanced quote sets Partial=true and never panics."""
  covers = ["c-4", "c-6", "c-7"]
  test_contract = [
    "if heredoc bodies become commands, TestHeredocCommitIsOneCommand fails: `git commit -m \"$(cat <<'EOF' … stop cat .env 2>&1; a && b … EOF)\"` must yield one git-commit command plus a nested `cat` with NO file operand",
    "if chaining splits wrong, the split table fails: `a && b; c | d || e` → 5 commands in order, while `echo \"a && b\"` and `echo 'x; y'` stay one command",
    "if final stream destinations drift, the StreamDestinations table fails — per command, fd1 and fd2 resolve in redirection order to transcript (incl. a pipe), file or /dev/null: `x` → both transcript; `x | y` → x's fd1 pipe, fd2 transcript; `x >f` → fd1 file, fd2 transcript; `x >f 2>/dev/null` and `x >f 2>&1` and `x &>f` and `x &>>f` → neither on transcript; `x 2>&1 >f` → fd2 transcript (duplicated before fd1 moved); `x |& y` → both transcript; `( pass-cli view ) 2>&1` propagates inward; `echo \"2>&1\"` has no redirect; `pass-cli x |& head` attributes to pass-cli, not head",
    "if prefix stripping breaks, `FOO=1 env BAR=2 /usr/bin/pass-cli item view x` no longer yields argv0 `pass-cli` with args [item view x] and the prefix test fails",
    "if dir tracking breaks, `cd sub && git -C ../other commit` no longer resolves the commit dir to <cwd>/other, and `cat < .env` no longer exposes `.env` as an input operand — the dir/input test fails",
    "if the scanner descends into `sh -c \"pass-cli x 2>&1\"` (out of scope per shell_detection_depth), the opaque-sh test fails: argv0 must be `sh` with the body not descended",
    "if an unbalanced quote errors or panics instead of setting Partial=true, the partial test fails; a fuzz seed corpus must never panic",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Fingerprint trees on a temporary git index"
  files = ["internal/gitrun/gitrun.go", "internal/gitrun/gitrun_test.go", "internal/treefp/treefp.go", "internal/treefp/treefp_test.go"]
  description = """
Add gitrun.Options.IndexFile (GIT_INDEX_FILE). treefp computes WorkingTree() (tracked + untracked-unignored, excluding .dross/),
Candidate(adds, all) (a copy of the real index with earlier `git add` arg-lists and -a replayed) and ChangedPaths (staged vs HEAD).
Handles an unborn HEAD and linked worktrees (`rev-parse --git-path index`); every git call carries a timeout."""
  covers = ["c-4"]
  test_contract = [
    "if the real index is touched, TestRealIndexUntouched fails: in a partially staged repo the index file's sha256 and `git diff --cached --name-only` must match before and after WorkingTree() and Candidate(); an empty IndexFile must not fall through to the real index",
    "if WorkingTree() and Candidate() diverge after `git add -A`, or agree when one modified file is left unstaged, the equality test fails; editing .dross/state.json must change neither, an untracked unignored file must change WorkingTree() while an ignored one must not, and chmod +x must change it",
    "if the replay diverges from git, TestCandidateMatchesRealAdd fails: Candidate([\"--\",\"a.go\"]) must equal the plain candidate after really running `git add a.go`",
    "if ChangedPaths with only .dross/x staged returns anything but exactly [\".dross/x\"] (including on an unborn HEAD), or a linked worktree reads the main worktree's index, the changed-paths test fails",
    "if a git failure returns \"\" instead of an error (an empty fingerprint could equal an empty record), the failure test fails; RawWith(Options{IndexFile: tmp}, \"ls-files\") must list the temp index and TestNoUnseparatedGitPositional must stay green",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Build gate engine, payload, registry, lists"
  files = ["internal/gate/engine.go", "internal/gate/payload.go", "internal/gate/lists.go", "internal/gate/engine_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = """
Decode the hook payload (tool_name, tool_input, tool_response, cwd, session_id). Gates {Name, Scope always-on|workflow, Liftable, Claims, Judge}
and Recorders register at init; Check runs every non-lifted gate with per-gate panic recovery and joins refusals. A Refusal needs Rule + Remedy; the
human-escape hint appears only for Liftable gates. Read-only root locator (requires .dross/project.toml, never writes); payload paths are only ever
opened via pathfence.Contain against the located root. Default lists unioned with an additive ~/.claude/dross/gates.toml; a malformed gates.toml makes
the list-extensible gates refuse in-domain calls naming the file. New tagged fields are filed in the not_paths.txt ledger (ledger, not counted)."""
  covers = ["c-2"]
  test_contract = [
    "if a new json/toml-tagged string field in internal/gate is filed in neither pathfence.Fields() nor not_paths.txt, TestEveryPathShapedFieldIsDeclared fails",
    "if an unparseable payload (`{`, empty stdin, missing tool_name) blocks or reaches a Judge, the posture test fails: it must Allow with one warning and zero Judge calls",
    "if a Judge error passes, or a claiming gate whose Judge panics escapes recovery, the closed-posture test fails: both must refuse naming the gate (and \"internal error\" for the panic) — an uncaught panic would exit 2 and block every call",
    "if NewRefusal accepts an empty Rule or Remedy, or a refusal omits the gate name or \"Use: <remedy>\", the refusal-shape test fails",
    "if a Liftable gate's refusal omits \"a human can run `dross gate off <name>` in their own terminal\", or a Liftable=false gate's refusal includes it (pointing at a command that refuses), the escape-hint test fails",
    "if guard_scope breaks, the scope test fails: a workflow fake gate must NOT run when the target has no root (a .dross/ without project.toml counts as no root), an always-on fake gate MUST; the locator must leave no state.json in a fixture root that lacked one",
    "if an unclaimed tool (Glob) produces output, a Judge call or any git argv (gitrun.ArgvRecorder), the unclaimed test fails",
    "if a lifted gate still runs, a Liftable=false gate honours an override, or two refusing gates yield only one rule, the dispatch test fails",
    "if `secret_tools = []` in gates.toml removes pass-cli, the additive test fails; if a malformed gates.toml lets a list-extensible gate allow its in-domain call (instead of refusing naming the file path) or disturbs other gates, the malformed-extension test fails",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Add machine-local gate state store"
  files = ["internal/gatestate/store.go", "internal/gatestate/store_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = """
`.dross/gate/` with a self-ignoring `.gitignore` (`*`) and three single-writer JSON records: green.json {tree, at, runner},
execute.json {phase, mode, at}, approval.json {phase, task, head, at}. Writes are atomic (unique temp + rename). Missing file = no record;
corrupt = error naming the path. A git-tracked record is refused unread (mirrors consent.RefuseTrackedLocal)."""
  covers = ["c-4", "c-5"]
  test_contract = [
    "if the directory isn't self-ignoring, TestGateDirUntracked fails: after the first write `git status --porcelain` shows nothing under .dross/gate/ and `git add .dross/` stages nothing from it, with NO root .gitignore entry",
    "if writes stop being atomic, the concurrency test fails: N concurrent writers and readers must only ever see not-exist or a decodable record — an in-place truncating writer (localstore.Save / state.Save style) fails it",
    "if a truncated green.json decodes as a zero record instead of an error naming .dross/gate/green.json, or a missing one returns anything but (nil, nil), or a green with an empty tree is accepted, the record test fails",
    "if a force-added (git-tracked) .dross/gate/*.json is read rather than refused, TestTrackedRecordRefused fails — a cloned repo must not ship its own green or approval",
    "if a record's tagged fields are filed in neither pathfence.Fields() nor not_paths.txt, TestEveryPathShapedFieldIsDeclared fails",
  ]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 1
  title = "Run dross test before prompt code commits"
  files = ["assets/prompts/ship.md", "assets/prompts/init.md", "internal/cmd/ship_prompt_test.go", "internal/cmd/prompt_test_command_test.go"]
  description = """
ship.md §3 runs a bare `dross test` before the ARCHITECTURE.md docs commit; init.md §9 runs `dross test` (after the human's `dross trust`)
between the .gitignore step and `git add . && git commit` when runtime.test_command is set. No prompt tells the agent to run `dross gate off`."""
  covers = ["c-4"]
  test_contract = [
    "if ship.md's `dross test` line is deleted or moved after `git commit -m \"docs(`, TestShipPromptTestsBeforeDocsCommit fails",
    "if init.md's `dross test` leaves its slot between the .gitignore step and `git add . && git commit`, the init ordering test fails",
    "if ship.md or init.md carries a raw `<runtime.test_command>` line, TestPromptsRunDrossTest fails (both join suiteRunningPrompts)",
    "if any assets/prompts/*.md tells the agent to run `dross gate off`, TestNoPromptTellsAgentToLiftGate fails; asking the user to run it in their own terminal passes",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 1
  title = "Prune and re-pause handoff.md with Edit"
  files = ["assets/prompts/resume.md", "assets/prompts/pause.md", "internal/cmd/resume_prompt_test.go", "internal/cmd/pause_prompt_test.go"]
