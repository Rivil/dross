[[task]]
  id = "t-12"
  wave = 2
  depends_on = ["t-3"]
  title = "Add dross gate check/record hook verbs"
  files = ["internal/cmd/gate.go", "internal/cmd/gate_test.go", "internal/cmd/telemetry.go", "cmd/dross/main.go", "cmd/dross/main_test.go", "cmd/dross/testdata/cli_tree.txt"]
  description = """
`dross gate check` (PreToolUse) reads InOrStdin and runs gate.Check; a refusal returns ExitCodeError{Code:2} with the text on stderr exactly once
(SilenceErrors on the verb); an allowed call exits 0 silently. A panic anywhere outside a Judge (decode, locator, list/override loading, dispatch) is
recovered in the verb and exits 0 with one warning — never 2, which would block every tool call. `dross gate record` (PostToolUse) runs the recorders
and never blocks. Exports the hook-command constants wiring consumes; RecordCLIEvent skips both verbs. (cli_tree.txt is a regenerated golden.)"""
  covers = ["c-2"]
  test_contract = [
    "if a refusal exits 1 instead of 2, TestGateCheckRefusalExitsTwo fails — Claude Code treats exit 1 as non-blocking (fail-open); rule + remedy must appear on stderr exactly once with stdout empty",
    "if an allowed payload writes any byte to stdout or stderr or returns an error, the silent-allow test fails",
    "if garbage stdin blocks or errors instead of exit 0 with one stderr warning line, the unparseable-payload test fails",
    "if a panic injected outside any Judge (payload-decode or locator seam) exits 2 instead of 0 with one warning, the subprocess case in main_test.go (TestMainEntryPoint style, real exit code) fails — a Go panic's default exit 2 is PreToolUse's block code",
    "if `gate record` returns non-nil for any payload in its table, including a recorder error (must be exit 0 + stderr warning), the never-blocks test fails",
    "if three `gate check` runs with telemetry enabled append any line to telemetry.jsonl (while `dross status` still appends), the telemetry-skip test fails — refusal text can carry a secret path into err_detail",
    "if the hook constants stop equalling \"dross \" + the verb paths, the constant test fails; if cmd.Gate() is dropped from main.go, TestCLITreeGolden fails (cli_tree.txt lists `gate check` and `gate record`)",
  ]
  status = "pending"

