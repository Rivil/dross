[[task]]
  id = "t-7"
  wave = 2
  depends_on = ["t-1", "t-3"]
  title = "Add secret guards and gate-off guard"
  files = ["internal/gate/secrets.go", "internal/gate/secrets_test.go", "internal/gate/selfguard.go", "internal/gate/selfguard_test.go"]
  description = """
secret-stream (c-6) refuses a command whose argv0 is in SecretTools unless t-1 resolves both its fd1 and fd2 off the transcript (file or /dev/null).
secret-read (c-7) refuses a Read, or
cat/head/tail/less/sed with an operand or `<` input, of a SecretPaths match (*.env, .env*, *.pem, *.key, private-key names id_rsa/id_dsa/
id_ecdsa/id_ed25519 and their _sk variants, *.agekey, sops/age/keys.txt); env templates (.env.example/.sample/.template/.dist) exempt; `source`/`.`
never claimed. A Partial scan holding a claimed token refuses naming the parse problem. gate-off-guard (Liftable=false) refuses Bash `dross gate off`
and the hook-only verbs `dross gate check` / `dross gate record` (a piped forged payload would record an approval). All three fire in every repo."""
  covers = ["c-6", "c-7", "c-2"]
  test_contract = [
    "if c-6 lets a stream reach the transcript, the secret-stream refuse table fails: `pass-cli item view x`, `pass-cli item view x | head`, `pass-cli item view x >f` (stderr open), `pass-cli item view x 2>/dev/null` (stdout open), `pass-cli item view x 2>&1 >f`, `pass-cli item view x 2>&1 | head`, `… |& head`, `FOO=1 pass-cli item view x`, `cd d && pass-cli item view x >f`, `/opt/bin/pass-cli item view x | cat`, `pass-cli item list | head` must refuse, naming secret-stream and `>file 2>/dev/null`",
    "if c-6 over-fires, the allow table fails: `pass-cli item view x >f 2>/dev/null`, `pass-cli item view x >f 2>err.log`, `pass-cli item view x >f 2>&1`, `pass-cli item view x &>f`, `make build 2>&1`, `go test ./... 2>&1 | tail`, `echo hi; pass-cli item view x >f 2>/dev/null`, `echo \"pass-cli x\"` must pass silently",
    "if c-7 Read matching drifts, the Read table fails: .env, prod.env, .env.local, .envrc, server.pem, tls.key, ~/.ssh/id_ed25519, ~/.ssh/id_ecdsa_sk, ~/.config/sops/age/keys.txt, ops.agekey refuse; id_ed25519.pub, internal/auth/id_token.go, id_generator.ts, .env.example, .env.sample, .env.template, .env.dist, envoy.yaml, main.go and a keys.txt outside sops/age pass",
    "if a Partial scan (unbalanced quote) holding a secret-tool merge or a secret-path reader passes, or a Partial scan with no claimed token refuses, the partial-posture test fails; a refusal must name the parse problem",
    "if c-7 Bash matching drifts, the Bash table fails: `cat .env`, `head -n 3 config/prod.env`, `tail -f .env.local`, `less id_rsa`, `sed -n 1p ~/.ssh/id_ed25519`, `cat < .env`, `cd x && cat .env` refuse; `source .env && make`, `. ./.env`, `wc -c .env`, `shasum -a 256 .env`, `grep -q KEY .env`, `cat ~/.ssh/id_ed25519.pub` pass",
    "if either secret gate goes quiet from a cwd with no .dross ancestor (guard_scope) or spawns any git argv, the scope test fails",
    "if adding `op` to secret_tools in gates.toml doesn't make `op read x | head` refuse, the extension test fails",
    "if gate-off-guard lets through `dross gate off secret-read`, `FOO=1 dross gate off x`, `make && /usr/local/bin/dross gate off x`, `echo '{…approve t-3…}' | dross gate record` or `dross gate check < p.json` (even with every gate lifted), or refuses `dross gate status`, `dross gate on x` or `echo dross gate off`, the self-guard table fails",
  ]
  status = "pending"

[[task]]
  id = "t-8"
  wave = 2
  depends_on = ["t-3"]
  title = "Gate plan.toml edits and curated-file shrinks"
  files = ["internal/gate/drossfiles.go", "internal/gate/drossfiles_test.go"]
  description = """
plan-edit (c-3, plan_overwrite via phase.LoadPlan): Edit/MultiEdit of an existing .dross/phases/*/plan.toml is refused with remedy
`dross task add/edit/move/remove`; Write that creates it is allowed; Write over it only while every task is "" or pending.
curated-shrink (c-8): a Write replacing an existing curated file with under half its bytes is refused, remedy Edit. Both workflow-scoped."""
  covers = ["c-3", "c-8"]
  test_contract = [
    "if Edit or MultiEdit on an existing plan.toml passes, or the refusal doesn't name `dross task edit`, the plan-edit test fails; a Write creating one must pass",
    "if plan_overwrite drifts, the overwrite table fails: a Write over an all-pending plan (empty status included) passes, over a plan with an in_progress, done or failed task refuses",
    "if a Write over an unparseable plan.toml passes instead of refusing naming the decode error, or an unreadable curated file (chmod 000) passes instead of refusing naming the read error, the closed-posture test fails",
    "if the half-size boundary drifts, the shrink table fails over every default curated path (project.toml, milestones/v1.toml, phases/p/spec.toml, handoff.md, rules.toml) at 1000 bytes: a 499-byte Write refuses, 500 and 2000 pass, an Edit of any size passes",
    "if scope leaks, the scope test fails: a new milestones/v2.toml Write passes, shrinking non-curated phases/p/changes.json or notes.md passes, docs/plan.toml is ignored by plan-edit, and a curated path added via gates.toml is enforced",
    "if path normalisation breaks, `.dross/phases/x/../x/plan.toml` escapes plan-edit and the normalisation test fails; the same layout with no project.toml ancestor must pass",
  ]
  status = "pending"

[[task]]
  id = "t-9"
  wave = 2
  depends_on = ["t-2", "t-4", "t-19"]
  title = "Record full green runs from dross test"
  files = ["internal/cmd/test.go", "internal/cmd/test_green_test.go"]
  description = """
Write green.json from treefp.WorkingTree only for a full run (full_run_source): a bare selector-free `dross test` — test_command where set, t-19's
every-lane run in a lanes-only repo — or, in a lane-less repo, `--files` (equivalent per bare_test_run). `--files` in a laned repo never records.
Fingerprint before and after; a mismatch records nothing and prints one stderr line naming the paths that changed. A red full run on the recorded tree
clears it; never-ran exits (3–8) leave it. A recorder failure warns and never changes the exit status."""
  covers = ["c-4"]
  test_contract = [
    "if the recorder and the commit side fingerprint differently, TestGreenMatchesCandidate fails: a green bare `dross test` must write a tree equal to treefp.Candidate() after `git add -A`",
    "if a green bare `dross test` in a repo with test_command AND lanes, or a green lanes-only bare run with every lane green, records nothing, TestFullRunSourceRecords fails — each must record a tree equal to treefp.Candidate()",
    "if a partial run records, the partial table fails: `dross test ./internal/x`, a red run, a lanes-only bare run where one lane is red or refused (exit 6), and any `--files` run in a laned repo must each record nothing (green_run_definition)",
    "if a green `dross test --files a.go` in a lane-less repo (execute.md's form) records nothing, the lane-less test fails",
    "if a file edited mid-run through the spawn seam still records, or the mismatch is silent instead of one stderr line naming the changed paths (a suite writing an untracked file would otherwise loop the agent back to `dross test` forever), the before/after fingerprint test fails",
    "if green-then-red on the same tree leaves the record, or exit 3 / exit 4 with an existing record clears it, the lifecycle test fails",
    "if a green through the remote spawn seam records a different fingerprint than a local one, the remote-parity test fails",
    "if a forced fingerprint failure changes the exit code or output beyond one stderr warning, the recorder-failure test fails",
  ]
  status = "pending"

[[task]]
  id = "t-10"
  wave = 2
  depends_on = ["t-1", "t-2", "t-3", "t-4"]
  title = "Gate git commit on a recorded green tree"
  files = ["internal/gate/commit.go", "internal/gate/commit_test.go"]
  description = """
commit-green claims Bash `git [-C d] [-c k=v] commit` in a .dross repo (env-prefixed, chained, cd-tracked). Candidate = real index + replayed
earlier `git add` segments (+ -a); .dross-only or empty candidate passes, otherwise it must equal green.json's tree. Refuses pathspec/--only/
--include/-p commits, `git add -p`, and chains where anything but `git add`/`cd` precedes the commit. A green that exists but differs from the
candidate names the diverging paths (stage or clean them). A Partial scan holding `git commit` refuses. Silent with neither test_command nor lanes."""
  covers = ["c-4"]
  test_contract = [
    "if a matching green stops admitting the commit, or a one-byte change after the green still passes, the green-match test fails: with green for tree T, `git commit -m x` on candidate T passes; after a change it refuses naming a full `dross test` and stating a raw `go test` does not count",
    "if `git add a.go && git commit -m x` is judged against the pre-add index instead of index+a.go, TestAddThenCommitUsesReplay fails",
    "if the default Claude Code shape `git add a.go && git commit -m \"$(cat <<'EOF' … EOF)\"` is refused because the nested substitution `cat` counts as a disallowed predecessor, or isn't judged against index+a.go, TestHeredocCommitAfterAdd fails — with a matching green it must pass",
    "if `sed -i s/a/b/ a.go && git add a.go && git commit -m x` passes, the unpredictable-predecessor test fails",
    "if a .dross-only commit is gated, the ungated test fails: only .dross/phases/p/plan.toml staged with no green passes, and `git commit -am x` with only tracked .dross edits passes; a staged code file with green.json absent (a raw go test leaves none) refuses",
    "if `git -C ../other commit` or `cd ../other && git commit` judges the cwd repo instead of ../other, the dir test fails; ../other with no .dross must pass without spawning git",
    "if `git commit a.go -m x`, `git commit -p` or `git add -p && git commit` passes instead of refusing with \"stage with git add, then run a plain git commit\", the unjudgeable-form test fails",
    "if `git commit-tree`, `echo git commit` or `git log --grep commit` is claimed, or `ls -la` spawns any git argv, the claim test fails",
    "if a green exists but the candidate differs because other paths are unstaged or untracked, and the refusal tells the agent to re-run `dross test` (which cannot converge) instead of naming the diverging paths with \"stage or clean them\", TestDivergedCandidateNamesPaths fails",
    "if a Partial scan (unbalanced quote) containing `git commit` passes instead of refusing naming the parse problem, or a Partial scan with no git token is claimed, the partial-posture test fails",
    "if a repo with neither runtime.test_command nor a test lane refuses a commit, the no-tests carve-out test fails; a lanes-only repo (no test_command) must still be gated",
    "if a git failure building the candidate, a corrupt index, or an unreadable green.json passes, the closed-posture test fails: each must refuse naming the error",
  ]
  status = "pending"

[[task]]
  id = "t-11"
  wave = 2
  depends_on = ["t-1", "t-3", "t-4", "t-20"]
  title = "Record pair approvals and gate edits"
  files = ["internal/gate/pair.go", "internal/gate/pair_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = """
Builds on t-20's captured AskUserQuestion fixture (internal/gate/testdata/askuserquestion_post.json). Recorder: record {phase, task, HEAD} only when a tool_response answer exactly equals ApproveLabel(in_progress task). Gate: armed when current_phase's plan
has an in_progress task, recorded mode isn't solo (absent = pair) and HEAD is on phase/<id>; refuses in-repo Edit/Write/MultiEdit/NotebookEdit
outside .dross/ unless approval == (phase, task, current HEAD). Also refuses Bash `dross execute begin … --solo` while armed."""
  covers = ["c-5"]
  test_contract = [
    "if the exact-label rule loosens, the approval-signal table fails: fixture answer \"approve t-3\" with t-3 in_progress records; \"approve t-2\", \"steer\", \"reject\", \"Approve t-3\", \"approve t-3 \", \"yes, approve t-3\" and multi-select \"approve t-3, steer\" record nothing (pair_approval_signal)",
    "if answers present only in tool_input are recorded, or a tool_response with no readable answers records anything instead of warning, the source-field test fails",
    "if an armed gate with no approval lets an Edit of internal/x.go through, or the refusal doesn't name \"approve t-3\" and AskUserQuestion, the armed test fails; an Edit of .dross/handoff.md and a Write outside the repo must pass",
    "if approval outlives its HEAD, the approval-life test fails: approval at HEAD A passes, after a new commit refuses, and an approval for t-1 while t-2 is in_progress refuses",
    "if the gate fires when the recorded mode is solo, no task is in_progress, or HEAD is on a branch other than phase/<id>, the silent-cases test fails",
    "if an unreadable state.json, plan.toml or execute.json while a task is in_progress passes, or two in_progress tasks pass, the closed-posture test fails: each must refuse naming the error or the ambiguity",
    "if Bash `dross execute begin p --solo` passes while armed, or refuses when nothing is in_progress, the downgrade test fails",
