  status = "pending"

[[task]]
  id = "t-19"
  wave = 1
  title = "Run every lane on bare lanes-only dross test"
  files = ["internal/cmd/test.go", "internal/cmd/lane_plan.go", "internal/cmd/test_full_lanes_test.go", "README.md"]
  description = """
full_run_source: in a lanes-only repo (lanes declared, no runtime.test_command) a bare selector-free `dross test` runs every declared lane's command
unscoped (no derived selector), each through its own grant, prepare, toolchain and locality path, worst-wins — instead of refusing at
requireExecConsent on the empty command. Where test_command is set, the bare run is untouched (bare_test_run). README row updated."""
  covers = ["c-4"]
  test_contract = [
    "if a bare `dross test` in a lanes-only repo with 2 lanes (one with a go-package selector) doesn't spawn both lane commands with NO derived selector (spawn-seam argv recorder), or refuses at requireExecConsent, TestBareLanesOnlyRunsEveryLane fails",
    "if a bare `dross test` in a repo with test_command AND lanes spawns any lane, or its test_command line changes by a byte, TestBareRunHonoursBareTestRun fails (locked bare_test_run; feastahead's test_command already runs both lanes)",
    "if an untrusted lane in a lanes-only bare run is spawned instead of exiting 6 with that lane skipped, the consent test fails",
    "if worst-wins breaks across a lanes-only bare run, the outcome table fails: one green lane + one red → exit 1; a failed lane prepare → exit 7",
    "if a lane-less repo's bare spawn line or `--files` resolution changes, the existing lane_plan_test / test_lane_selector_test tables fail",
  ]
  status = "pending"

[[task]]
  id = "t-20"
  wave = 1
  title = "Capture a real AskUserQuestion PostToolUse payload"
  files = ["internal/gate/testdata/askuserquestion_post.json", "internal/gate/fixture_test.go"]
  description = """
Go/no-go for pair_approval_signal. With the human's go-ahead, wire a temporary stdin-dump PostToolUse hook in a scratch repo's
