  id = "t-9"
  wave = 5
  title = "Add dross phase mark-new spec writer"
  files = ["internal/cmd/phase_mark_new.go", "internal/cmd/phase_mark_new_test.go", "internal/cmd/phase.go", "cmd/dross/testdata/cli_tree.txt", "internal/cmd/phase_facts.go"]
  description = """
`dross phase mark-new <id> <citation>...` normalises each citation via facts.Extract, refuses any not currently unresolved, appends deduped entries to spec.New via spec.Save. phase_facts.go text output gains the "confirm new with `dross phase mark-new`" hint.
"""
  depends_on = ["t-8"]
  covers = ["c-4"]
  test_contract = [
    "if normalisation or persistence breaks, the test fails: mark-new `foo.go:12.` stores \"foo.go:12\" and the next `dross phase facts` exits 0",
    "if a resolved citation is accepted, the test fails: mark-new `fooo.go` (not unresolved) exits non-zero naming it with the spec unchanged on disk",
    "if dedupe breaks, marking the same citation twice leaves more than one entry and the test fails",
    "if Save loses content, the test fails: the written spec keeps `new` above `[phase]` and LoadSpec before == after except New (every criterion, decision, edge and deferred entry preserved)",
    "if a malformed spec is written, the test fails: a spec that fails to decode is refused without writing",
    "if cli_tree.txt lacks the `phase mark-new` row, the CLI tree golden fails",
  ]
  status = "pending"

[[task]]
  id = "t-10"
  wave = 5
  title = "Gate plan-lock on unresolved citations"
  files = ["internal/cmd/state.go", "internal/cmd/state_facts_gate_test.go"]
  description = """
planLockFactsGate runs after planLockEdgeGate on `current_phase_status planned`: facts.Check via the same spec/plan loader as `phase facts`; refusal lists every Finding.String() line plus `dross phase facts <id>` and spec `new` (no `mark-new` mention — t-9 runs in parallel). Absence allows (no current phase / no spec), mirroring the edge gate; a malformed spec or plan refuses naming its path. Before writing, check existing internal/cmd fixtures that plan-lock a spec for citations that now refuse; fold fixture edits into this task via `dross task edit`.
"""
  depends_on = ["t-7", "t-8"]
  covers = ["c-5"]
  test_contract = [
    "if the gate under-lists or mutates state, the test fails: 3 unresolved citations across spec and plan refuse, the error lists all 3 and names `dross phase facts <id>`, and state.json's current_phase_status is unchanged on disk",
    "if new/planned don't clear the gate, the test fails: the same fixture with each citation in spec `new` (or the path in a task's files) locks",
    "if gate and command disagree, the parity table fails: clean / missing path / moved line / why-only citation / new-marked / planned file each run through the gate and `dross phase facts --json`; the gate refuses iff unresolved is non-empty and its lines equal the command's",
    "if a malformed plan passes, the test fails: a malformed plan.toml refuses naming the plan path",
    "if the gate over-reaches, the test fails: `in_progress` / `executing` never run it; no current phase or no spec.toml allows (TestPlanLockAbsenceAllows and execute_test's spec-less fixture stay green); on a spec with both problems the edge gate fires first",
  ]
  status = "pending"

