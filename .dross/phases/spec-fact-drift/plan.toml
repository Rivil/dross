[[task]]
  id = "t-7"
  wave = 3
  title = "Assemble facts check over scanned fields"
  files = ["internal/facts/facts.go", "internal/facts/facts_test.go"]
  description = """
Check(repoDir, spec, plan *phase.Plan) → Report{Unresolved []Finding{Field, Kind, Citation, Status, NewLine}, Degraded}. Scans only the locked scanned_fields. Planned set = every task's files (path.Clean); new set = spec.New, normalised. Deterministic order: spec order then plan order. Finding.String() renders "<field>: <kind> <citation>[ now at line N]".
"""
  depends_on = ["t-4", "t-5", "t-6"]
  covers = ["c-1", "c-2", "c-3"]
  test_contract = [
    "if a skipped field is scanned, the test fails: the same missing path cited only in a decision `why`, a [[deferred]] text/why or an [[edges]] reason is NOT reported",
    "if field labels drift, the test fails: labels are exactly \"criteria c-2\", \"decisions symbol_shape choice\", \"task t-3 description\", \"task t-3 test_contract[1]\"",
    "if planned files don't suppress, the test fails: a path in task t-2's files suppresses the same path cited in a criterion and in another task's description, and a nonexistent `files` entry itself yields no finding",
    "if new-list matching is loose or strict in the wrong place, the test fails: spec.New [\"foo.go\"] suppresses `foo.go:12.` and `foo.go` but not `fooo.go`; spec.New [\"pkg.Name\"] suppresses `` `pkg.Name()` ``",
    "if a missing plan errors or output is nondeterministic, the test fails: a nil plan checks the spec alone with no error, and two runs return byte-identical reports",
  ]
  status = "pending"

[[task]]
  id = "t-8"
  wave = 4
  title = "Add dross phase facts read-only command"
  files = ["internal/cmd/phase_facts.go", "internal/cmd/phase_facts_test.go", "internal/cmd/phase.go", "cmd/dross/testdata/cli_tree.txt"]
  description = """
`dross phase facts <id> [--json]`. Spec required, plan optional. Prints one Finding.String() line per finding, or "nothing unresolved" naming what was checked (spec only / spec + plan); exits non-zero on any finding. Never writes. Does not narrate `mark-new` (lands in t-9).
"""
  depends_on = ["t-7"]
  covers = ["c-6", "c-9", "c-1", "c-2", "c-3"]
  test_contract = [
    "if the clean path misreports, the test fails: a clean spec with no plan.toml exits 0 and prints \"nothing unresolved\" plus \"spec only\"",
    "if findings don't fail the exit, the test fails: one missing path exits non-zero and the line names \"criteria c-1\" and the path",
    "if --json drifts, the test fails: it emits {phase, checked, unresolved:[{field,kind,citation,line,new_line}]}, stdout parses alone with errors on stderr, `unresolved` is [] (never null) when clean, and it still exits non-zero when non-empty",
    "if a kind renders wrong, the synthetic renderer test fails: moved / gone / unresolved-symbol Findings render with their kind and new line",
    "if the command writes, the test fails: a hash of every file under the fixture root is identical before and after, clean or not, and no *.tmp remains",
    "if absence reads as clean, the c-9 test fails: no spec.toml exits non-zero naming .../spec.toml, unknown id exits non-zero naming the phases/<id> dir, `../x` is refused, a spec or plan.toml that fails to decode exits non-zero naming it, and none prints \"nothing unresolved\"",
    "if cli_tree.txt lacks the `phase facts` row and its --json flag row, the CLI tree golden fails",
  ]
  status = "pending"

