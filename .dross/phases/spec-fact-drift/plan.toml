[[task]]
  id = "t-1"
  wave = 1
  title = "Pin architecture link-check output before refactor"
  files = ["internal/cmd/architecture_link_parity_test.go"]
  description = """
Characterisation test, written and observed green on TODAY's code before t-5 touches links.go. Temp repo: one Go file plus ARCHITECTURE.md bullets for ok / moved (cited :3, lives :5) / unresolved / ambiguous (two `Fetch` methods) / skipped (.py, no line), and a `pkg.Bar` bullet that resolves ONLY via the lastComponent fallback. Pins doctor's architectureLinkWarnings lines and `dross architecture check` stdout.
"""
  covers = ["c-8"]
  test_contract = [
    "if the moved/gone wording or set changes, the warnings pin fails: exactly \"Foo — x.go:3 moved to line 5\" and \"Gone — x.go:9 no longer resolves\", nothing for the ambiguous, skipped and fallback bullets",
    "if the lastComponent fallback is removed from the architecture path, the `pkg.Bar` bullet becomes an unresolved line and the `dross architecture check` stdout pin (including the \"N moved, N unresolved, N ambiguous\" summary) fails",
    "if an ambiguous bullet is reclassified as unresolved, an extra warning appears and the warnings pin fails",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add codex Symbols, CanIndex and Symbol.Package"
  files = ["internal/codex/codex.go", "internal/codex/go_indexer.go", "internal/codex/ast_grep.go", "internal/codex/codex_test.go"]
  description = """
Export Symbols(file): indexer dispatch only — no findCallers, siblings or git log. Export CanIndex(file) = SupportsFile && (Go || ast-grep available). SupportsFile stays byte-identical. GoIndexer sets Symbol.Package from the package clause; Name unchanged ("T.M").
"""
  covers = ["c-3", "c-8"]
  test_contract = [
    "if CanIndex ignores ast-grep absence, the test with astGrepAvailableFn stubbed false fails: CanIndex(\"a.ts\") must be false while SupportsFile(\"a.ts\") stays true, and CanIndex(\"a.go\") stays true",
    "if Symbols diverges from Index or shells out to git, the test fails: Symbols(f) must equal Index([f]).Symbols for a Go file in a non-git dir with no error",
    "if Package comes from the dir name or is missing on methods, the test fails: a `package foo` file sets Package \"foo\" on every symbol including `T.M`, and cmd/dross's main file yields \"main\"",
    "if adding Package changes `dross codex` output, the byte-identical stdout test on the same fixture fails",
    "if Symbols panics on a syntactically broken .go file, the broken-file test fails: it must return an error",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Extract and classify citations from prose"
  files = ["internal/facts/extract.go", "internal/facts/extract_test.go"]
  description = """
Extract(text) → []Citation{Kind: path|line|symbol, Raw, Path, Line, Symbol}. Path = closed extension allowlist (codex-indexed exts + toml/md/json/yml/yaml/txt/sh/mod/sum); slashed = repo-relative, else bare basename. A file:line pairs with an adjacent backticked symbol (`Sym` — f:N / `Sym` (f:N) / `Sym` at f:N). Symbol = locked symbol_shape; a dotted token whose final component is lowercase and not call-shaped is a TOML key and skipped. Excluded shapes: absolute paths, `~/…`, `origin/main`, `milestone/v1.9`, tokens holding `<` `*` `{`, URLs, versions; directory citations ending `/` are not extracted. `../` escapes ARE extracted (reported missing later).
"""
  covers = ["c-7", "c-1", "c-2", "c-3"]
  test_contract = [
    "if wrapping punctuation leaks into a citation, the c-7 table fails: `see foo.go:12.`, `(foo.go:12)`, `` `foo.go:12`, ``, `foo.go:12;` and `foo.go:12:` each yield Path \"foo.go\" Line 12, and a leading `.` survives (`.dross/x.toml`)",
    "if non-path shapes are extracted, the exclusion table fails: `e.g.`, `i.e.`, `v1.9`, `go1.27.3`, `1.9.4.0`, URLs, `milestone/v1.9`, `origin/main`, `~/…`, absolute paths, `internal/codex/` and `.dross/phases/<id>/spec.toml` yield no path",
    "if commands, flags or keys become symbols, the test fails: `` `dross phase facts` ``, `` `--json` ``, `` `paths.source` ``, `` `current_phase_status` `` and `` `facts` `` yield no symbol",
    "if real symbol citations are missed, the test fails: `` `quoted.String()` ``, `` `phase.Spec` `` and `` `cmd.planLockEdgeGate()` `` yield symbols with `()` stripped, and `` `spec.toml` `` is a path never a symbol",
    "if file:line pairing breaks, the test fails: `` `architecture.Resolve` — internal/architecture/links.go:192 `` yields one line citation with Symbol \"architecture.Resolve\", and a bare `x.go:5` carries no symbol",
  ]
  status = "pending"

