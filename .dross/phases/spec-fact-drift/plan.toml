  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Extract citations and add the shared tree walker"
  files = ["internal/facts/extract.go", "internal/facts/extract_test.go", "internal/facts/tree.go", "internal/facts/tree_test.go"]
  description = "Extract(text) → []Citation{Kind: path|line|symbol, Raw, Path, Line, Symbol}. Path = extension set covering common source and config types (codex-indexed exts + js/jsx/mjs/cjs/py/rs/kt/dart/java/sql/tf/ps1/css/html/golden/jsonl + toml/md/json/yml/yaml/txt/sh/mod/sum) plus extensionless Makefile/Dockerfile; slashed = repo-relative, else bare basename. A file:line pairs with an adjacent backticked symbol (`Sym` — f:N / `Sym` (f:N) / `Sym` at f:N); pairing also accepts a bare capitalised ident (c-2 surface; locked symbol_shape governs standalone symbols). Standalone symbol = locked symbol_shape; a dotted token whose final component is lowercase and not call-shaped is a TOML key and skipped. Excluded shapes: absolute paths, `~/…`, `origin/main`, `milestone/v1.9`, tokens holding `<` `*` `{`, URLs, versions; directory citations ending `/` are not extracted. `../` escapes ARE extracted (reported missing later). tree.go: the one tree walker t-5 and t-6 share — `git ls-files --cached --others --exclude-standard` (respects .gitignore, never descends into nested worktrees), falling back to WalkDir skipping .git/node_modules outside a git repo."
  covers = ["c-7", "c-1", "c-2", "c-3"]
  test_contract = ["if wrapping punctuation leaks into a citation, the c-7 table fails: `see foo.go:12.`, `(foo.go:12)`, `` `foo.go:12`, ``, `foo.go:12;` and `foo.go:12:` each yield Path \"foo.go\" Line 12, and a leading `.` survives (`.dross/x.toml`)", "if non-path shapes are extracted, the exclusion table fails: `e.g.`, `i.e.`, `v1.9`, `go1.27.3`, `1.9.4.0`, URLs, `milestone/v1.9`, `origin/main`, `~/…`, absolute paths, `internal/codex/` and `.dross/phases/<id>/spec.toml` yield no path", "if commands, flags or keys become symbols, the test fails: `` `dross phase facts` ``, `` `--json` ``, `` `paths.source` ``, `` `current_phase_status` `` and `` `facts` `` yield no symbol", "if real symbol citations are missed, the test fails: `` `quoted.String()` ``, `` `phase.Spec` `` and `` `cmd.planLockEdgeGate()` `` yield symbols with `()` stripped, and `` `spec.toml` `` is a path never a symbol", "if file:line pairing breaks, the test fails: `` `architecture.Resolve` — internal/architecture/links.go:192 `` yields one line citation with Symbol \"architecture.Resolve\", and a bare `x.go:5` carries no symbol", "if the extension set is too narrow, the test fails: `install.ps1`, `fixtures/terraform-c3/main.tf`, `web/app.js`, `scripts/gen.py` and `Makefile` each yield a path citation", "if bare-ident pairing breaks, the test fails: `` `Init` — x.go:12 `` yields one line citation with Symbol \"Init\", and `` `Init` `` alone yields no standalone symbol", "if the walker includes ignored or nested-worktree files, the tree test fails: in a temp git repo, a gitignored dist/a.go and a nested repo copy under .claude/worktrees/w/ are absent from the walk while an untracked-but-not-ignored new.go is present; outside git the WalkDir fallback skips .git and node_modules"]
  status = "pending"

