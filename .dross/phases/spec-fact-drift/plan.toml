[[task]]
  id = "t-5"
  wave = 2
  title = "Strict symbol resolver sharing link-check classification"
  files = ["internal/architecture/links.go", "internal/architecture/links_test.go", "internal/facts/resolve.go", "internal/facts/resolve_test.go"]
  description = """
Export architecture.Classify(link, syms, match): the resolveAgainst switch with a pluggable matcher; ResolveAllIn/Resolve pass the existing matchSymbols. facts.StrictMatch requires every qualifier (Symbol.Package, then Type.Method), no last-component fallback. Lazy tree index (WalkDir skipping .git/node_modules; parse errors non-fatal; codex.Symbols) built only when a symbol or paired file:line citation exists. Index is Degraded when the tree holds SupportsFile && !CanIndex files OUTSIDE testdata/ and fixtures/ dirs; Degraded skips unmatched symbols instead of reporting them. External-package qualifiers (`os.Stat`) are not exempt.
"""
  depends_on = ["t-1", "t-2", "t-3"]
  covers = ["c-2", "c-3", "c-8"]
  test_contract = [
    "if the classifier owns the fallback, the test fails: Classify(`pkg.Bar`, [{Name:\"Bar\", Package:\"other\"}], StrictMatch) is Unresolved while the same link with matchSymbols is OK",
    "if strict matching leaks into the architecture path, the test fails: a bullet `wrongpkg.Index` — codex/codex.go:N resolves OK through ResolveAllIn while facts reports `wrongpkg.Index` unresolved",
    "if a last-component fallback is re-added, the test fails: `quoted.String()` with a String method on an unrelated type is Gone; `phase.Spec` resolves; `cmd.Spec` is Gone when Spec lives only in package phase",
    "if ambiguity or moves are misclassified, the test fails: `Changes.Record` defined in two files is ambiguous and never unresolved; `Resolve` — links.go:N with the func at N+3 is Moved with NewLine N+3, and Gone after deletion; a line citation into a .py file is Skipped",
    "if the ast-grep census is wrong, the test fails: with astGrepAvailableFn stubbed false, a .ts file under src/ marks the index Degraded and an unmatched symbol is Skipped, while the same .ts file only under testdata/ or fixtures/ leaves it non-Degraded and the symbol is Gone",
    "if the index is built eagerly, the test fails: input with no symbol or paired-line citation records builder call count 0; an unparsable testdata .go file does not stop other files indexing",
    "if strict matching regresses on the real tree, the regression test fails: against this repo StrictMatch resolves `codex.Index` and `architecture.Classify` and does not resolve `quoted.String()`; t-1's pins stay green",
  ]
  status = "pending"

