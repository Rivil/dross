[[task]]
  id = "t-9"
  wave = 3
  title = "Pin lifecycle/state-map bidirectional divergence"
  files = ["internal/cmd/board_lifecycle_divergence_test.go"]
  description = "Test-only. Parses defaultJiraStateMap and defaultYouTrackStateMap out of\ninternal/forge source with go/parser — the pattern\ninternal/cmd/enum_divergence_test.go already uses — rather than exporting them,\nand scans assets/prompts/*.md for `--status <literal>`. \"Emits\" means call sites\nonly: the `--status <literal>` occurrences in assets/prompts/*.md plus the values\nderivePhaseStatus can return. Declared Go constants are deliberately NOT counted\n— counting them would make the emit-set equal LifecycleStatuses by construction\nand turn c-2's central assertion into a tautology. Gates both directions against\nconfigenum.LifecycleStatuses.\n"
  covers = ["c-2"]
  depends_on = ["t-1", "t-5"]
  test_contract = ["the test collects the statuses dross emits — every `--status <literal>` in assets/prompts/*.md plus the values derivePhaseStatus can return, and no other source — and asserts the set equals LifecycleStatuses; adding `--status blocked` to execute.md fails it, naming the prompt file and the literal", "deleting the \"shipped\" key from the Jira map fails with \"a status dross emits has no state-map entry\", and adding a \"paused\" key fails with \"a state map keys on a status nothing emits\"", "the two provider maps are checked independently, so a key present in one and missing from the other is caught rather than averaged away", "reverting t-5's ship.md edit fails this test, because shipped and complete stop being emitted while both maps still key them"]
  status = "done"

