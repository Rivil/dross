  description = "Walk the built command tree for every `show` subcommand and require a registered\n`json` bool flag, with a documented exempt list. Twelve `show` commands exist\nagainst c-5's nine: state show already carries the flag; rule show and\ninteraction show are the exemptions. README's command-table rows for the nine\nmention --json.\n"
