[[task]]
  id = "t-12"
  wave = 5
  title = "Make internal/cmd tests hermetic against global defaults"
  files = ["internal/cmd/hermetic_env_test.go", "internal/cmd/doctor_test.go"]
  description = "Verify BLOCKING: five internal/cmd tests fail on any host where $BITBUCKET_TOKEN is\nunset, because `dross init` inside every test temp repo overlays the developer's real\n~/.claude/dross/defaults.toml (seedRemote at internal/cmd/init.go:154) while\nscaffoldDoctorRepo exports an unrelated FORGEJO_TOKEN. The suite's verdict therefore\ndepends on the developer's home dir, and the red suite made verify's mutation pass skip\ninternal/cmd entirely while still reporting measured. A package TestMain pins HOME to an\nempty throwaway dir — the same concern chdir already handles for DROSS_NO_TELEMETRY and\nCLAUDE_CONFIG_DIR — and scaffoldDoctorRepo sets remote.auth_env explicitly instead of\ninheriting it."
  test_contract = ["`env -u BITBUCKET_TOKEN go test -count=1 ./...` is green: the five tests the verify BLOCKING names — TestDoctorFlagsUnrecognisedTaskStatus, TestDoctorAcceptsEveryRunnableTaskStatus, TestDoctorSkipsPhaseDirWithNoPlan, TestDoctorReportsUnparseablePlan, TestValidateIgnoresTaskStatus — no longer depend on an ambient token", "with a hostile ~/.claude/dross/defaults.toml under a temp HOME setting remote_defaults.auth_env to an env var that is not exported, scaffoldDoctorRepo still returns a doctor-clean repo — this is the blocker reproduced deterministically, and it fails if scaffoldDoctorRepo goes back to inheriting auth_env", "the package's HOME differs from the ambient HOME TestMain captured, and GlobalDir() under it holds no defaults.toml — deleting the TestMain isolation fails this by name rather than by a downstream doctor complaint", "scaffoldDoctorRepo's repo has remote.auth_env set to the same env var the helper exports, asserted from the written project.toml, so the helper cannot export one token and configure another"]
  status = "done"
