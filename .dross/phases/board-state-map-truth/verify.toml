[[finding]]
  severity = "BLOCKING"
  text = "`go test ./internal/cmd` is red on a host where $BITBUCKET_TOKEN is unset: TestDoctorFlagsUnrecognisedTaskStatus, TestDoctorAcceptsEveryRunnableTaskStatus, TestDoctorSkipsPhaseDirWithNoPlan, TestDoctorReportsUnparseablePlan and TestValidateIgnoresTaskStatus all fail on `baseline repo is not doctor-clean`. Cause: scaffoldDoctorRepo (internal/cmd/doctor_test.go:1288) exports FORGEJO_TOKEN, but `dross init` inside the temp repo inherits the user's global ~/.claude/dross/defaults.toml, which sets remote.auth_env = BITBUCKET_TOKEN — so doctor reports an unset token the helper never exported. The suite is green with BITBUCKET_TOKEN=x. Reproduced at 533b099 (cli-surface-sweep), so it is inherited, not a regression of this phase; the fix is to isolate the helper from the ambient global defaults (set HOME, or set remote.auth_env explicitly the way TestFrictionWindow_DoctorAcceptsWorkingProviders does)."

[[finding]]
  severity = "BLOCKING"
  text = "Consequence of the red suite for verify's own signal: the first `dross verify` run skipped both ./internal/cmd (\"no report — gremlins gathered no covered mutants\") and ./cmd/dross, which is where the bulk of this phase's implementation lives, and still reported mutation_status = measured with score 0.94 from the other packages. The recorded numbers above come from a re-run with BITBUCKET_TOKEN=x (killed 1987, survived 100, score 0.95). Until the helper is fixed, this repo's own mutation gate silently under-measures its largest package."

[[finding]]
  severity = "FLAG"
  text = "c-5 same-data narrowness: `phase show --json` has a full every-on-disk-key round-trip test, and stats/task/changes are compared against their text renderings field by field, but project, milestone, defaults, profile and stack rest on the json-tag parity walk plus one or two representative fields. A toml key present on disk but unmodelled in the struct would vanish from --json while the default rendering (which prints the raw file) still shows it, with no test failing."

