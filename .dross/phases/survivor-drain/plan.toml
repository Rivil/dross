[[task]]
id         = "t-1"
wave       = 2
depends_on = ["t-3"]
title      = "Add `dross survivor drain` unclassified gate"
files = [
  "internal/cmd/survivor_drain.go",
  "internal/cmd/survivor_drain_test.go",
  "internal/cmd/survivor.go",
  "README.md",
]
description = """
New `survivor drain` subcommand. Reads one or more gremlins JSON reports (--report) or runs the
configured adapter over --packages, classifies every survivor through verify.Classify using
acceptedReasons() + routedSurvivors(), prints the ones with no disposition, and errors when any
remain. No diff scoping. A survivor routed to the phase being drained is reported outstanding,
never silenced. Depends on t-3 for the Unmeasured field and its missing-vs-uncovered distinction.

The drain classifies from the per-package RAW reports, never from Run()'s merged report. The merged
report deliberately drops zero-coverage packages (gremlins.go:160-168) so a blind spot cannot
inflate the score — that exclusion is scoring-only. Classifying from the merged report would make
cmd/dross, the one package hasCoverage() rejects, exit 0 with nothing outstanding: a vacuous green
on c-1 produced by the drain's own plumbing.

Run `make install` so wave 4 shells out to the real binary (r-01).
"""
covers = ["c-1", "c-2"]
test_contract = [
  "a report survivor absent from survivors.toml and from every [[deferred]] makes the command error naming `internal/x/y.go:12 (CONDITIONALS_NEGATION)`; the same survivor with an [[accepted]] entry exits 0 printing \"0 unclassified\"",
  "a survivor whose deferred entry targets the phase being drained (state.CurrentPhase, or --phase) counts outstanding; retargeted to another phase it reports `routed` and exits 0 — the drain cannot be closed by re-routing to itself",
  "a dismissed deferred entry counts outstanding — dismissal is triage, not a disposition",
  "TestDrainFailsOnUnmeasuredPackage: a package for which the adapter wrote NO report fails the run and is named, so an unmeasured package never looks like a package with zero survivors",
  "TestZeroCoveredPackageIsMeasured: a package whose report exists but holds only NOT-COVERED mutants does NOT fail as unmeasured — its survivors flow into the normal classify path and must each be killed or accepted (this is cmd/dross today: 2 NOT-COVERED mutants, 0 killed)",
  "TestDrainClassifiesFromRawReports: a fixture whose only package is zero-coverage yields those survivors as outstanding — asserted against the same input that makes Run()'s merged report empty, so wiring the drain to the merged report fails the test rather than exiting 0",
  "TestDrainCoversEveryGoPackage: with --packages omitted the dispatched set equals `go list ./...` for the fixture repo — 33 packages in this repo",
  "an empty report set exits 0 rather than erroring on \"nothing to do\"",
]
status = "pending"

