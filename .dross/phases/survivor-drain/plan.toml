# load → append → save. Wave 4 is executed serially on that file; tasks are independent
# in their test files but must not have their acceptances written concurrently.
#
# Survivor budget. internal/cmd holds 91 recorded mutants — the routed backlog — and they
# decompose exactly across wave 4: t-8 23, t-9 12, t-10 13, t-11 13, t-12 10, t-13 14, t-14 5
# (= 90), plus deferred.go:143, which already carries a ceiling acceptance and is verified by
# t-10 rather than re-drained. Task descriptions list survivor LINES; the counts above are
# MUTANTS, and several lines carry two or more (doctor.go 93/95/98/362, hints.go 86×4,
# repair.go 133, statusline.go 189, ship.go 550/552, phase_lifecycle.go 23/25, survivor.go 242).

