nothing to clear. ARCHITECTURE.md: a "Host lock" subsection under the remote section naming
/tmp/dross-host.lock, flock on fd 9, the protected_regular open rule, the conv=nocreat
write, and the hold session's read -t lease. verify.md prompt: a `scheduled` result naming
a holder is a wait, not a stall; use --no-wait only for an unattended probe.
"""
  covers = ["c-3", "c-4", "c-5", "c-6"]
  test_contract = [
    "if README lacks any of \"/tmp/dross-host.lock\", \"--no-wait\" on the dross verify row with exit code 15, \"--wait\" with \"10m\" and \"--wait 0\" on the dross test row, \"waiting on\", \"running alongside\", or one of \"no stale lock\"/\"nothing to clear\", TestReadmeDocumentsTheHostLock fails naming the missing string",
    "if the `dross verify results` row's backticked exit codes are not exactly 10–14 (the waiting state is documented as 10 with a holder reason, not a new code), TestResultsRowStillEnumeratesTenToFourteen fails",
    "if ARCHITECTURE.md lacks \"/tmp/dross-host.lock\", \"protected_regular\", \"conv=nocreat\" or \"read -t\", TestArchitectureDocumentsTheHostLock fails — the facts a future editor would simplify away and break c-7 or c-4",
    "if verify.md lacks \"waiting on\", \"not a failure\" or \"--no-wait\" beside the existing --detach strings, the extended TestVerifyPromptTeachesTheDetachedPath fails",
    "if a new detached state word is introduced, TestReadmeDocumentsDetachedRuns fails (locked detached_waiting_state)",
  ]
  status = "pending"
