[[task]]
  id = "t-10"
  wave = 4
  title = "Weekly pin-currency workflow and bump PR"
  files = [".github/workflows/pin-currency.yml", ".github/workflows/ci.yml", "scripts/pin-bump-pr.sh", "internal/cmd/pin_currency_workflow_test.go"]
  description = "New workflow: weekly schedule + workflow_dispatch, top-level `permissions: contents: read`, SHA-pinned actions,\nGOFLAGS/GOPROXY/GOSUMDB env, no `${{` in run blocks. Its header records the repo setting it depends on (\"Allow GitHub\nActions to create and approve pull requests\", enabled 2026-09-29; check: gh api repos/Rivil/dross/actions/permissions/workflow)\nthe way dependabot.yml records its settings. Check job (read-only) runs `go run ./cmd/pincheck`, exposing its `stale`\noutput. Bump job alone gets contents/pull-requests/actions write, runs when the check reported stale even though it\nfailed, runs `pincheck bump`, then scripts/pin-bump-pr.sh: clean tree → no push, no PR; branch head carrying a commit the\nbot did not write → no force-push, a PR comment instead; otherwise push the fixed branch and open a PR or update the open\none; then dispatch ci.yml on that ref (locked bump_ci). ci.yml gains workflow_dispatch. Hardening audit.\n"
  covers = ["c-4", "c-10"]
  depends_on = ["t-5", "t-7"]
  test_contract = ["if the check job gains write, TestPinCurrencyPermissions fails: top-level permissions are exactly contents: read, the check job has no write scope, and only the bump job carries contents/pull-requests/actions write", "if the schedule or strict gate is lost, TestPinCurrencyRunsWeekly fails: an `on.schedule` cron exists and the check job runs `go run ./cmd/pincheck` without `|| true` or continue-on-error", "if the bump stops running on a red check, TestPinCurrencyBumpWiring fails: the bump job `needs` the check job, its `if:` combines always()/!cancelled() with `needs.<check>.outputs.stale == 'true'`, and that output maps to the pincheck step's id and its `stale` key", "if the bump job stops dispatching CI, TestPinCurrencyDispatchesCI fails: it runs scripts/pin-bump-pr.sh then `gh workflow run ci.yml --ref` on the bump branch, and ci.yml's `on:` carries workflow_dispatch", "if a second run opens a second PR or erases a human commit, TestPinBumpPRUpdatesOpenPR fails: with a fake gh on a narrowed PATH and a local bare repo as origin — open PR, bot-only branch → force-pushed, `gh pr create` never called; none open → `gh pr create` exactly once; clean tree → nothing pushed, no gh call; branch carrying a non-bot commit → remote branch unchanged and `gh pr comment` called", "if the setting dependency goes unrecorded, TestPinCurrencyRecordsRepoSetting fails: the workflow header names the create-and-approve-PRs setting and the gh api command that checks it"]
  status = "done"

