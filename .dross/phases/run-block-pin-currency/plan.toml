[[task]]
  id = "t-10"
  wave = 4
  title = "Weekly pin-currency workflow and bump PR"
  files = [".github/workflows/pin-currency.yml", ".github/workflows/ci.yml", "scripts/pin-bump-pr.sh", "internal/cmd/pin_currency_workflow_test.go"]
  description = """
New workflow: weekly schedule + workflow_dispatch, top-level `permissions: contents: read`, SHA-pinned actions,
GOFLAGS/GOPROXY/GOSUMDB env, no `${{` in run blocks. Check job (read-only) runs `go run ./cmd/pincheck` and exposes whether
anything was stale. Bump job alone gets contents/pull-requests/actions write, runs even though the check job failed when it
reported stale, runs `pincheck bump`, then scripts/pin-bump-pr.sh: no diff → no push, no PR; otherwise push a fixed branch
and open a PR or update the open one; then dispatch ci.yml on that ref (locked bump_ci). ci.yml gains workflow_dispatch.
Audit against the CI supply-chain hardening checklist.
"""
  covers = ["c-4", "c-10"]
  depends_on = ["t-7"]
  test_contract = [
    "if the check job gains write, TestPinCurrencyPermissions fails: top-level permissions are exactly contents: read, the check job has no write scope, and only the bump job carries contents/pull-requests/actions write",
    "if the schedule or strict gate is lost, TestPinCurrencyRunsWeekly fails: an `on.schedule` cron exists and the check job runs `go run ./cmd/pincheck` without `|| true` or continue-on-error",
    "if the bump stops running on a red check, TestPinCurrencyBumpWiring fails: the bump job `needs` the check job and its `if:` combines always()/!cancelled() with the check's stale output",
    "if the bump job stops dispatching CI, TestPinCurrencyDispatchesCI fails: it runs scripts/pin-bump-pr.sh then `gh workflow run ci.yml --ref` on the bump branch, and ci.yml's `on:` carries workflow_dispatch",
    "if a second run opens a second PR, TestPinBumpPRUpdatesOpenPR fails: with a fake gh on a narrowed PATH and a local bare repo as origin — open PR present → branch force-pushed, `gh pr create` never called; none open → `gh pr create` called exactly once; clean tree → nothing pushed and no gh call",
  ]
  status = "pending"

