task_seq = 10

[phase]
  id = "run-block-pin-currency"

[[task]]
  id = "t-1"
  wave = 1
  title = "Scan the pin sites Dependabot cannot reach"
  files = ["internal/pincheck/sites.go", "internal/pincheck/sites_test.go"]
  description = """
New package internal/pincheck. A Site type (file, line, kind, name, version) and a repo scanner over the generic subset:
run-block `go install <pkg>@v…` in .github/workflows/*.yml and .github/actions/*/action.yml, setup-node `node-version:`,
go.mod `toolchain`, and goreleaser-action `version:`. Line-based like action_pins_test.go (no YAML dependency). Plus a
Go-const site reader (go/parser) that returns a named string const's value and line, for the dross-only sites in t-6.
"""
  covers = ["c-1", "c-9"]
  test_contract = [
    "if a site kind stops being recognised, TestScanFindsEverySiteKind fails: an inline fixture repo holding one of each kind (workflow run-block go install, composite-action run-block go install, setup-node node-version, go.mod toolchain, goreleaser-action version) returns exactly those five sites with the right file, line, kind, name and version",
    "if the run-block scope leaks, TestScanIgnoresNonRunInstalls fails: a `go install x@v1.2.3` inside a YAML comment, an `env:` value or a `name:` key is not returned as a site",
    "if a range is taken for a pin, TestScanReportsGoreleaserRangeUnpinned fails: goreleaser `version: '~> v2'` is reported as an unpinned site, never as a site at version v2",
    "if the Go-const reader misreads, TestGoConstSite fails: it returns the value and 1-based line of a named const in a fixture .go file, and an error for a missing const or a non-string one",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Classify a pin as current, stale or info"
  files = ["internal/pincheck/classify.go", "internal/pincheck/classify_test.go"]
  description = """
Pure function: pinned version + its line rule (Go toolchain: patch on the pinned minor; Node: on the pinned major; tools:
within their major) + upstream release list with publish times + now → current / stale / info. Latest = highest stable
version in the list (pre-releases dropped), never an @latest endpoint. Stale only when a newer on-line release is more
than 7 days old (Dependabot's cooldown). A newer major/minor off the line is info, never stale. No network here.
"""
  covers = ["c-2"]
  test_contract = [
    "if the cooldown drifts, TestClassifyCooldownBoundary fails: a newer on-line patch published 8 days before now → stale; 6 days → current; exactly at the 7-day boundary pins the chosen side",
    "if the line rule widens, TestClassifyOffLineIsInfo fails: for each kind (Go minor line, Node major line, tool major line) a newer release only on the next minor/major → info, not stale",
    "if list-max is replaced by an @latest-style pick, TestClassifyUsesListMaximum fails: a gremlins-shaped list whose most recent publication is v0.5.1 while v0.6.0 is pinned → current",
    "if pre-releases leak in, TestClassifyIgnoresPrereleases fails: v1.9.0-rc.1 and 24.20.0-beta above the pin do not make it stale or info",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Declare govulncheck once; pin goreleaser exactly"
  files = [".github/actions/govulncheck/action.yml", ".github/workflows/ci.yml", ".github/workflows/release.yml", "internal/cmd/release_pipeline_test.go", "internal/cmd/action_pins_test.go"]
  description = """
A local composite action holds the one run-block `go install golang.org/x/vuln/cmd/govulncheck@vX` (locked govuln_route);
ci.yml and release.yml `uses: ./.github/actions/govulncheck` and keep their own `run: govulncheck ./...` step.
action_pins_test.go admits local `./` refs only. release.yml goreleaser `version:` moves from `~> v2` to an exact vX.Y.Z.
Audit both workflows against the CI supply-chain hardening checklist while editing them.
"""
  covers = ["c-5", "c-7"]
  test_contract = [
    "if a second declaration appears, TestGovulncheckDeclaredOnce fails: exactly one `govulncheck@` install across .github/** (workflows and actions), and it is an exact vX.Y.Z; a fixture with two declarations fails (replaces TestGovulncheckPinAgrees)",
    "if a workflow stops installing through the action, TestGovulncheckDeclaredOnce fails: ci.yml's test job and release.yml's release job each `uses: ./.github/actions/govulncheck` before their `run: govulncheck ./...` step",
    "if the local-ref exemption widens, TestActionPinScanner fails: `./.github/actions/x` passes the sweep while a remote `actions/x@v4` or short ref still fails",
    "if goreleaser loses its exact pin, TestGoreleaserVersionIsExact fails: `version:` on the goreleaser-action step must match ^v\\d+\\.\\d+\\.\\d+$ — `~> v2`, `latest` and `v2` each fail",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Tie strykerPin to the fixture's core version"
  files = ["internal/mutation/ts_fixture_test.go"]
  description = """
In-package test comparing strykerPin's version with the ts-project fixture's @stryker-mutator/core devDependency. This is
what carries strykerPin along with Dependabot's fixture bump (locked bot_bump_scope: the bump job never touches it).
"""
