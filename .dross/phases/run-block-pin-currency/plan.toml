[[task]]
  id = "t-1"
  wave = 1
  title = "Scan the pin sites Dependabot cannot reach"
  files = ["internal/pincheck/sites.go", "internal/pincheck/sites_test.go"]
  description = "New package internal/pincheck. A Site type (file, line, kind, name, version, pinned, reason) and a repo scanner over the\ngeneric subset: run-block `go install <pkg>@v…` (single-line `run:` and `run: |` block scalars) in\n.github/workflows/*.{yml,yaml} and .github/actions/*/action.{yml,yaml}; setup-node `node-version:` inline, or the file\n`node-version-file:` names (resolved from the repo root: `.nvmrc`/`.node-version` with a leading `v` stripped,\n`.tool-versions` `nodejs X.Y.Z`; `package.json` → unpinned with a reason); go.mod `toolchain`; goreleaser-action\n`version:` (with its `distribution:`). A range, `latest`, `lts/*`, `node` or `${{ … }}` value is an unpinned site, never a\nversion. Line-based like action_pins_test.go (no YAML dependency). Plus a Go-const site reader (go/parser) returning a\nnamed string const's value and line, for the dross-only sites in t-7.\n"
  covers = ["c-1", "c-9"]
  test_contract = ["if a site kind stops being recognised, TestScanFindsEverySiteKind fails: an inline fixture repo holding a .yml workflow run-block go install, a .yaml workflow `run: |` block with a go install on its third line, an action.yaml composite go install, an inline node-version, a node-version-file naming a `.nvmrc` holding `v24.19.0`, a go.mod toolchain and a goreleaser-action version returns exactly those seven sites with the right file, line, kind, name and version (24.19.0, v stripped; the node-version-file site reports the version file's path and line)", "if a version-file format misparses, TestScanNodeVersionFiles fails: `.node-version` `24.19.0` and `.tool-versions` `nodejs 24.19.0` both yield 24.19.0; `package.json`, `lts/iron` and `node` yield unpinned sites carrying a reason", "if the run-block scope leaks, TestScanIgnoresNonRunInstalls fails: a `go install x@v1.2.3` inside a YAML comment, an `env:` value or a `name:` key is not returned as a site", "if a non-pin is taken for a pin, TestScanReportsUnpinned fails: goreleaser `version: '~> v2'`, `node-version: ${{ matrix.node }}`, `node-version: '24.x'` and `go install x@latest` are each returned as unpinned sites carrying no version", "if the Go-const reader misreads, TestGoConstSite fails: it returns the value and 1-based line of a named const in a fixture .go file, and an error for a missing const or a non-string one"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Classify a pin and pick its bump target"
  files = ["internal/pincheck/classify.go", "internal/pincheck/classify_test.go"]
  description = "Pure function: pinned version + its line rule (Go toolchain: patch on the pinned minor; Node: on the pinned major; tools:\nwithin their major) + upstream release list with publish times + now → verdict (current / stale / info) and bump target.\nLatest = highest stable version in the list (pre-releases dropped), never an @latest endpoint. Stale only when an on-line\nrelease newer than the pin is MORE than 7 days old (exactly 7d is current). The bump target is the newest on-line release\nmore than 7 days old — a newer release still inside the cooldown is never the target. A newer major/minor off the line is\ninfo, never stale. No network here.\n"
  covers = ["c-2", "c-10"]
  test_contract = ["if the cooldown drifts, TestClassifyCooldownBoundary fails: a newer on-line patch published 8 days before now → stale; 6 days → current; exactly 7 days → current; a Node release dated by day only (`2026-09-07`) is measured from that day's 00:00 UTC", "if the bump target ignores the cooldown, TestBumpTargetClearsCooldown fails: pin 24.19.0 with 24.20.0 at 30 days and 24.21.0 at 2 days → stale with target 24.20.0, never 24.21.0", "if the line rule widens, TestClassifyOffLineIsInfo fails: for each kind (Go minor line, Node major line, tool major line) a newer release only on the next minor/major → info, not stale, and no target", "if list-max is replaced by an @latest-style pick, TestClassifyUsesListMaximum fails: a gremlins-shaped list whose most recent publication is v0.5.1 while v0.6.0 is pinned → current", "if pre-releases leak in, TestClassifyIgnoresPrereleases fails: v1.9.0-rc.1, v2.19.0-nightly and 24.20.0-beta above the pin do not make it stale or info and are never the target"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Declare govulncheck once; sweep composite actions"
  files = [".github/actions/govulncheck/action.yml", ".github/workflows/ci.yml", ".github/workflows/release.yml", "internal/cmd/release_pipeline_test.go", "internal/cmd/action_pins_test.go", "internal/cmd/workflow_run_expressions_test.go", "internal/cmd/testdata/cli_surface/tests_before.txt"]
  description = "A local composite action holds the one run-block `go install golang.org/x/vuln/cmd/govulncheck@vX.Y.Z` (locked\ngovuln_route); ci.yml and release.yml `uses: ./.github/actions/govulncheck` and keep their own `run: govulncheck ./...`.\nThe pinned-SHA and no-`${{`-in-run sweeps widen to .github/actions/*/action.{yml,yaml}; local `./` refs are admitted; every\ncomposite `run:` step must carry `shell:`. TestGovulncheckPinAgrees is replaced — record the rename in tests_before.txt the\nway d1bb26d did. Audit both workflows and the action against the CI supply-chain hardening checklist.\n"
  covers = ["c-5"]
  test_contract = ["if a second declaration appears, TestGovulncheckDeclaredOnce fails: exactly one `govulncheck@` install across .github/** (workflows and actions), at an exact vX.Y.Z; a fixture with two declarations fails; ci.yml's test job and release.yml's release job each `uses: ./.github/actions/govulncheck` before `run: govulncheck ./...`", "if the sweeps miss composite actions, TestWorkflowActionsArePinned and TestWorkflowsHaveNoExpressionsInRun fail on a fixture action.yml carrying a tag-pinned remote `uses:` or a `${{ inputs.x }}` inside `run:`; `./.github/actions/x` passes while `actions/x@v4` still fails", "if a composite step loses its shell, TestCompositeRunStepsDeclareShell fails: a fixture action.yml `run:` step without `shell:` fails (such a step fails at action load time, which no local test otherwise sees)", "if the rename is not recorded, TestNoTestLost fails on TestGovulncheckPinAgrees — it must pass"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
