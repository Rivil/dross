[[task]]
  id = "t-6"
  wave = 2
  title = "Fetch upstream release lists"
  files = ["internal/pincheck/upstream.go", "internal/pincheck/upstream_test.go"]
  description = """
Per site kind, fetch versions + publish times: Go module proxy `@v/list` + `@v/<v>.info` for go install pins (resolving
the module root by walking the package path up — the proxy 404s on `…/cmd/x`), golang.org/toolchain on the proxy for
go.mod `toolchain` (rc builds dropped, per-platform duplicates collapsed), nodejs.org/dist/index.json, registry.npmjs.org
for @stryker-mutator/core. Base URLs and per-host timeout are injectable. Unauthenticated GETs only. Any unreachable host,
404/410 on every candidate, 5xx, timeout or malformed body → unknown with a reason, never a verdict.
"""
  covers = ["c-2", "c-3"]
  depends_on = ["t-1"]
  test_contract = [
    "if module resolution breaks, TestFetchWalksUpToModuleRoot fails: a stub 404ing `golang.org/x/vuln/cmd/govulncheck/@v/list` and serving `golang.org/x/vuln/@v/list` yields that list; a stub 404ing every prefix yields unknown",
    "if a failure maps to a verdict, TestFetchFailuresAreUnknown fails: httptest 503, 410, a handler sleeping past the timeout, a closed listener and malformed JSON each yield unknown with a reason — never current",
    "if the resolver trusts @latest, TestFetchReadsTheListNotLatest fails: a proxy stub whose @latest returns v0.5.1 while @v/list contains v0.6.0 yields v0.6.0 as the list maximum",
    "if a format parse drifts, TestFetchParsesEachUpstream fails: canned proxy list+info, nodejs index.json and npm packument bodies each yield the expected versions and times; a golang.org/toolchain list interleaving go1.27rc1 and linux-amd64/darwin-arm64 entries yields each stable version exactly once with no rc",
  ]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 3
  title = "Shared Check and the cmd/pincheck cron entrypoint"
  files = ["internal/pincheck/check.go", "internal/pincheck/check_test.go", "cmd/pincheck/main.go", "cmd/pincheck/coverage_test.go"]
  description = """
pincheck.Check(sites, resolver, mode) → per-site verdicts (current / stale / info / unknown / unpinned). Strict mode (cron)
fails on stale, unknown or unpinned; lenient mode (doctor) fails on stale only — unpinned is a warning, unknown and info are
lines. `go run ./cmd/pincheck` scans the generic subset plus the dross-only Go-source sites (gremlinsPin, strykerPin), prints
one line per pin, exits non-zero on a strict failure. The coverage test sweeps independently of the scanner: any
`@v?X.Y.Z` token on a `run:`/block-scalar line or in a composite action, any `node-version`/`node-version-file` key, go.mod
`toolchain`, goreleaser-action `version:`, and non-test Go string consts carrying `@X.Y.Z` — excluding `uses:` lines, go.mod
`require`/`go` lines and testdata/.
"""
  covers = ["c-1", "c-2", "c-3"]
  depends_on = ["t-1", "t-2", "t-6"]
  test_contract = [
    "if the exit gate drifts, TestPincheckExitCodes fails: stub upstream with one stale pin → non-zero naming it; every pin current → 0; info-only (a newer major exists) → 0 with the info line printed; one upstream returning 503 → non-zero with that pin shown unknown",
    "if modes collapse, TestCheckModes fails: stale fails both modes; unknown and unpinned fail strict and pass lenient (unpinned as a warning); info passes both",
    "if a pin site escapes the checker, TestEveryPinSiteIsChecked fails: the live repo's independently-swept sites (incl. gremlinsPin and strykerPin, and nothing from uses: comments or go.mod require/go lines) all appear in cmd/pincheck's site list; a fixture adding an unscanned `go install x@v1.2.3` run-block or a new `const fooPin = \"x@v1.2.3\"` makes it fail",
  ]
  status = "pending"

[[task]]
  id = "t-8"
  wave = 4
  title = "Bump planner rewrites stale pins"
  files = ["internal/pincheck/bump.go", "internal/pincheck/bump_test.go", "cmd/pincheck/main.go"]
  description = """
`go run ./cmd/pincheck bump` rewrites each stale site in place to its t-2 bump target (newest on-line release past the
7-day cooldown) and prints what changed. It never touches strykerPin (locked bot_bump_scope) and refuses any file under
.github/workflows/ (locked bump_reach) — both reported as not bumped. Dry-run proof (locked live_proof): a temp copy of the
real version file / go.mod / composite actions / Go files, stubbed upstream, real file rewrites.
"""
  covers = ["c-10"]
  depends_on = ["t-7"]
  test_contract = [
    "if a rewrite over- or under-reaches, TestBumpRewritesOnlyStaleSites fails: on a temp copy of the real files, each stale site (govulncheck, goreleaser, .node-version, toolchain, gremlinsPin) becomes its bump target and a byte diff shows no other change",
    "if the cooldown is bypassed, TestBumpRewritesOnlyStaleSites fails: with a newest release 2 days old and the next 30 days old, the rewrite lands on the 30-day one",
    "if bump reaches a workflow file, TestBumpRefusesWorkflowFiles fails: a stale inline node-version in a .github/workflows fixture is reported as not bumped and the file stays byte-identical",
    "if strykerPin gets bumped, TestBumpSkipsStrykerPin fails: a stale strykerPin is left byte-identical and reported as skipped",
    "if bump is not idempotent, TestBumpIsIdempotent fails: a second bump over the rewritten tree with the same stub changes nothing and reports nothing",
  ]
  status = "pending"

