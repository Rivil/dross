[[task]]
  id = "t-1"
  wave = 1
  title = "Scan the pin sites Dependabot cannot reach"
  files = ["internal/pincheck/sites.go", "internal/pincheck/sites_test.go"]
  description = """
New package internal/pincheck. A Site type (file, line, kind, name, version, pinned) and a repo scanner over the generic
subset: run-block `go install <pkg>@v…` (single-line `run:` and `run: |` block scalars) in .github/workflows/*.{yml,yaml}
and .github/actions/*/action.{yml,yaml}; setup-node `node-version:` inline, or the file `node-version-file:` names
(resolved relative to the repo root); go.mod `toolchain`; goreleaser-action `version:`. Line-based like
action_pins_test.go (no YAML dependency). A range, `latest` or `${{ … }}` value is an unpinned site, never a version.
Plus a Go-const site reader (go/parser) returning a named string const's value and line, for the dross-only sites in t-7.
"""
  covers = ["c-1", "c-9"]
  test_contract = [
    "if a site kind stops being recognised, TestScanFindsEverySiteKind fails: an inline fixture repo holding a .yml workflow run-block go install, a .yaml workflow `run: |` block with a go install on its third line, an action.yaml composite go install, an inline node-version, a node-version-file pointing at a .node-version file, a go.mod toolchain and a goreleaser-action version returns exactly those seven sites with the right file, line, kind, name and version (the node-version-file site reports the version file's path and line)",
    "if the run-block scope leaks, TestScanIgnoresNonRunInstalls fails: a `go install x@v1.2.3` inside a YAML comment, an `env:` value or a `name:` key is not returned as a site",
    "if a non-pin is taken for a pin, TestScanReportsUnpinned fails: goreleaser `version: '~> v2'`, `node-version: ${{ matrix.node }}`, `node-version: '24.x'` and `go install x@latest` are each returned as unpinned sites carrying no version",
    "if the Go-const reader misreads, TestGoConstSite fails: it returns the value and 1-based line of a named const in a fixture .go file, and an error for a missing const or a non-string one",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Classify a pin and pick its bump target"
  files = ["internal/pincheck/classify.go", "internal/pincheck/classify_test.go"]
  description = """
Pure function: pinned version + its line rule (Go toolchain: patch on the pinned minor; Node: on the pinned major; tools:
within their major) + upstream release list with publish times + now → verdict (current / stale / info) and bump target.
Latest = highest stable version in the list (pre-releases dropped), never an @latest endpoint. Stale only when an on-line
release newer than the pin is MORE than 7 days old (exactly 7d is current). The bump target is the newest on-line release
more than 7 days old — a newer release still inside the cooldown is never the target. A newer major/minor off the line is
info, never stale. No network here.
"""
  covers = ["c-2", "c-10"]
  test_contract = [
    "if the cooldown drifts, TestClassifyCooldownBoundary fails: a newer on-line patch published 8 days before now → stale; 6 days → current; exactly 7 days → current; a Node release dated by day only (`2026-09-07`) is measured from that day's 00:00 UTC",
    "if the bump target ignores the cooldown, TestBumpTargetClearsCooldown fails: pin 24.19.0 with 24.20.0 at 30 days and 24.21.0 at 2 days → stale with target 24.20.0, never 24.21.0",
    "if the line rule widens, TestClassifyOffLineIsInfo fails: for each kind (Go minor line, Node major line, tool major line) a newer release only on the next minor/major → info, not stale, and no target",
    "if list-max is replaced by an @latest-style pick, TestClassifyUsesListMaximum fails: a gremlins-shaped list whose most recent publication is v0.5.1 while v0.6.0 is pinned → current",
    "if pre-releases leak in, TestClassifyIgnoresPrereleases fails: v1.9.0-rc.1, v2.19.0-nightly and 24.20.0-beta above the pin do not make it stale or info and are never the target",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Declare govulncheck and goreleaser outside workflows"
  files = [".github/actions/govulncheck/action.yml", ".github/actions/goreleaser/action.yml", ".github/workflows/ci.yml", ".github/workflows/release.yml", "internal/cmd/release_pipeline_test.go", "internal/cmd/action_pins_test.go", "internal/cmd/workflow_run_expressions_test.go"]
  description = """
Two local composite actions, each one run-block `go install …@vX.Y.Z` (locked govuln_route, bump_reach):
govulncheck (ci.yml and release.yml `uses: ./.github/actions/govulncheck`, keeping their own `run: govulncheck ./...`),
and goreleaser/v2 at an exact version (release.yml drops goreleaser-action and runs `goreleaser release --clean` with the
same env). The pinned-SHA and no-`${{`-in-run sweeps widen to .github/actions/*/action.{yml,yaml}; local `./` refs are
admitted. Audit both workflows and both actions against the CI supply-chain hardening checklist.
"""
  covers = ["c-5", "c-7"]
  test_contract = [
    "if a second govulncheck declaration appears, TestGovulncheckDeclaredOnce fails: exactly one `govulncheck@` install across .github/** (workflows and actions), at an exact vX.Y.Z; a fixture with two declarations fails (replaces TestGovulncheckPinAgrees); ci.yml's test job and release.yml's release job each `uses: ./.github/actions/govulncheck` before `run: govulncheck ./...`",
    "if goreleaser loses its exact pin or moves back into a workflow, TestGoreleaserPinnedOutsideWorkflows fails: the goreleaser action holds one `go install github.com/goreleaser/goreleaser/v2@vX.Y.Z`; release.yml carries no goreleaser-action step and no goreleaser version; `~> v2`, `latest` and `v2` each fail",
    "if the scan stops preceding the build, TestReleaseJobRunsGovulncheck fails: `run: govulncheck ./...` precedes the `goreleaser release` run step",
    "if the sweeps miss composite actions, TestWorkflowActionsArePinned and TestWorkflowsHaveNoExpressionsInRun fail on a fixture action.yml carrying a tag-pinned remote `uses:` or a `${{ inputs.x }}` inside `run:`; `./.github/actions/x` passes while `actions/x@v4` still fails",
    "if the pinned goreleaser rejects the config, `go run github.com/goreleaser/goreleaser/v2@<pin> check` on .goreleaser.yaml exits non-zero — it must exit 0 (evidence in the commit)",
  ]
  status = "pending"

