[[task]]
  id = "t-6"
  wave = 2
  title = "Fetch upstream release lists"
  files = ["internal/pincheck/upstream.go", "internal/pincheck/upstream_test.go"]
  description = "A pincheck-owned Resolver (no net/http leaks into callers' types). Per site kind, fetch versions + publish times: Go module\nproxy `@v/list` + `@v/<v>.info` for go install pins (module root found by walking the package path up — the proxy 404s on\n`…/cmd/x`); goreleaser-action `version:` mapped to github.com/goreleaser/goreleaser (v1) or …/v2 (v2), with\n`distribution: goreleaser-pro` → unknown and a reason; golang.org/toolchain on the proxy for go.mod `toolchain` (rc builds\ndropped, per-platform duplicates collapsed); nodejs.org/dist/index.json; registry.npmjs.org for @stryker-mutator/core.\nBase URLs and per-host timeout are injectable. Unauthenticated GETs only. Any unreachable host, 404/410 on every candidate,\n5xx, timeout or malformed body → unknown with a reason, never a verdict.\n"
  covers = ["c-2", "c-3", "c-9"]
  depends_on = ["t-1"]
  test_contract = ["if module resolution breaks, TestFetchWalksUpToModuleRoot fails: a stub 404ing `golang.org/x/vuln/cmd/govulncheck/@v/list` and serving `golang.org/x/vuln/@v/list` yields that list; a stub 404ing every prefix yields unknown", "if goreleaser-action mapping drifts, TestFetchGoreleaserActionVersion fails: `version: v2.18.2` resolves against the …/goreleaser/v2 list, `v1.26.2` against …/goreleaser, and `distribution: goreleaser-pro` yields unknown with a reason", "if a failure maps to a verdict, TestFetchFailuresAreUnknown fails: httptest 503, 410, a handler sleeping past the timeout, a closed listener and malformed JSON each yield unknown with a reason — never current", "if the resolver trusts @latest, TestFetchReadsTheListNotLatest fails: a proxy stub whose @latest returns v0.5.1 while @v/list contains v0.6.0 yields v0.6.0 as the list maximum", "if a format parse drifts, TestFetchParsesEachUpstream fails: canned proxy list+info, nodejs index.json and npm packument bodies each yield the expected versions and times; a golang.org/toolchain list interleaving go1.27rc1 and linux-amd64/darwin-arm64 entries yields each stable version exactly once with no rc"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 3
  title = "Shared Check and the cmd/pincheck cron entrypoint"
  files = ["internal/pincheck/check.go", "internal/pincheck/check_test.go", "cmd/pincheck/main.go", "cmd/pincheck/coverage_test.go"]
  description = "pincheck.Check(sites, resolver, mode) → per-site verdicts (current / stale / info / unknown / unpinned). Strict mode (cron)\nfails on stale, unknown or unpinned; lenient mode (doctor) fails on nothing — stale and unpinned are warnings, unknown and\ninfo are lines. `go run ./cmd/pincheck` scans the generic subset plus the dross-only Go-source sites (gremlinsPin,\nstrykerPin), prints one line per pin, writes `stale=true|false` to $GITHUB_OUTPUT when that variable is set, and exits\nnon-zero on a strict failure. The coverage test sweeps independently of the scanner: any `@v?X.Y.Z` token on a\n`run:`/block-scalar line or in a composite action, any `node-version`/`node-version-file` key, go.mod `toolchain`,\ngoreleaser-action `version:`, and non-test Go string consts carrying `@X.Y.Z` — excluding `uses:` lines, go.mod\n`require`/`go` lines and testdata/.\n"
  covers = ["c-1", "c-2", "c-3"]
  depends_on = ["t-1", "t-2", "t-6"]
  test_contract = ["if the exit gate drifts, TestPincheckExitCodes fails: stub upstream with one stale pin → non-zero naming it; every pin current → 0; info-only (a newer major exists) → 0 with the info line printed; one upstream returning 503 → non-zero with that pin shown unknown", "if the stale signal drifts, TestPincheckWritesStaleOutput fails: with GITHUB_OUTPUT pointing at a temp file, a stale pin writes `stale=true`; an unknown-only or unpinned-only run writes `stale=false` (and still exits non-zero); with GITHUB_OUTPUT unset nothing is written", "if modes collapse, TestCheckModes fails: stale, unknown and unpinned fail strict; lenient fails on none of them (stale and unpinned as warnings); info passes both", "if a pin site escapes the checker, TestEveryPinSiteIsChecked fails: the live repo's independently-swept sites (incl. gremlinsPin and strykerPin, and nothing from uses: comments or go.mod require/go lines) all appear in cmd/pincheck's site list; a fixture adding an unscanned `go install x@v1.2.3` run-block or a new `const fooPin = \"x@v1.2.3\"` makes it fail"]
  status = "done"

[[task]]
