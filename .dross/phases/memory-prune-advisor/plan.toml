[[task]]
  id = "t-8"
  wave = 4
  title = "Apply one suggestion with snapshot and recheck"
  depends_on = ["t-6"]
  files = ["internal/memadvise/apply.go", "internal/memadvise/snapshot.go", "internal/memadvise/apply_test.go", "internal/secretscan/writers.go"]
  description = """
Apply(memDir, snapDir, s) refuses a ReportOnly suggestion; copies the whole memory dir to snapDir/<UTC ts>/ first (snapshot.go), aborting on failure;
re-checks Guarded on the live file before any delete; touches only direct-child regular non-symlink *.md. MEMORY.md is rewritten atomically
(temp + rename, CRLF/trailing newline kept), aborting if its hash changed since the plan. Re-runs Integrity and returns dead links + orphans.
Register snapshot.go as MachineLocal and apply.go as OutsideDross (one disposition per file)."""
  covers = ["c-9", "c-3"]
  test_contract = ["if after a delete the file or its MEMORY.md line remains, or any other byte changed, TestApplyDeleteRemovesFileAndLine fails", "if after a reword any line other than that hook differs, or it does not equal NewHook, TestApplyRewordTouchesOneLine fails", "if the snapshot does not hash identical to the pre-apply dir, TestApplySnapshotsFirst fails", "if a snapshot failure does not abort with the dir untouched, TestApplyAbortsWhenSnapshotFails fails", "if a body that gained \"DECOY\" after advise is deleted or the dir hash changes, TestApplyRefusesGuardedDelete fails", "if a ReportOnly (orphan) suggestion is applied or the dir hash changes, TestApplyRefusesReportOnly fails", "if a dead-link target that is a symlink outside the dir is followed or deleted (only the index line may go), TestApplyNeverDeletesOutsideDir fails", "if MEMORY.md edited between plan and rename is overwritten, TestApplyAbortsOnConcurrentIndexEdit fails", "if deleting a memory linked via [[name]] does not return that dangling link, or a pre-existing orphan is not reported, TestApplyRechecksIntegrity fails", "if apply.go or snapshot.go is left out of secretscan.Writers(), or one file carries two dispositions, the writer enum test fails", "if a snapshot is written in a repo whose root .gitignore lacks .dross/memory/ and `git check-ignore` does not report every snapshot file ignored (the self-ignoring .dross/memory/.gitignore is created first), TestSnapshotSelfIgnores fails"]
  status = "done"

