  title = "Locate the repo's Claude memory dir"
  files = ["internal/memadvise/locate.go", "internal/memadvise/paths.go", "internal/memadvise/locate_test.go"]
  description = """
New package internal/memadvise. ClaudeDir() = $CLAUDE_CONFIG_DIR else ~/.claude. Slug(repo) = EvalSymlinks'd repo top-level path with every
non-[A-Za-z0-9] byte mapped to '-'. Locate returns (dir, ok); ok=false when the dir is missing, not a dir, or memory/ is a symlink.
paths.go holds the .dross-relative advisor-state constants: .dross/memory/turns.json and .dross/memory/snapshots/."""
  covers = ["c-1"]
  test_contract = [
    "if Slug(\"/Users/a/.claude/x\") is not \"-Users-a--claude-x\", or '_' / ' ' are not mapped to '-', TestSlugReplacesEveryNonAlnum fails",
    "if a repo reached through /tmp → /private/tmp does not slug to \"-private-tmp-…\", TestSlugResolvesSymlinks fails",
    "if with CLAUDE_CONFIG_DIR set the dir is not under it, or ~/.claude is stat'd, TestLocateHonorsClaudeConfigDir fails",
    "if a missing dir, a regular file at that path, or a symlinked memory/ returns ok=true or a non-nil error, TestLocateMissingIsSilent fails",
  ]
  status = "done"

[[task]]
