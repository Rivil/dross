  wave = 1
  title = "Parse memory corpus and index integrity"
  files = ["internal/memadvise/index.go", "internal/memadvise/index_test.go", "internal/memadvise/testdata/corpus/MEMORY.md"]
  description = """
Load(dir) reads MEMORY.md and direct-child *.md (regular files only, O_NONBLOCK, size-capped); parses index lines ([Title](file.md) — hook),
frontmatter name:/description:, bodies, and [[slug]] links with inline code stripped. Integrity() returns DeadLinks (target missing, outside the
dir, a symlink, or not .md), Orphans (unindexed *.md other than MEMORY.md), Inbound[slug] (distinct linkers, self-links excluded) and duplicate
name: slugs. Fixture corpus lives under testdata/corpus/."""
  covers = ["c-5"]
  test_contract = [
    "if an index line naming gone.md is not in DeadLinks, TestDeadIndexLink fails; if \"../../.ssh/id.md\" or \"/etc/x.md\" is opened or not reported dead, TestIndexLinkOutsideDirIsDead fails",
    "if unindexed extra.md is not an orphan, or MEMORY.md is ever an orphan, TestOrphans fails",
    "if [[a-thing]] does not resolve to a_thing_v2.md through its frontmatter `name: a-thing` (i.e. resolves by filename), TestInboundResolvesByFrontmatterName fails",
    "if a [[x]] inside backticks or a self-link adds inbound, TestInboundIgnoresCodeSpansAndSelf fails",
    "if two files declaring one name: slug are not both reported, or either gets inbound credit, TestDuplicateNameSlugReported fails",
    "if a FIFO named foo.md is not skipped within 1s, TestCorpusSkipsFIFO fails; if files with no frontmatter or CRLF frontmatter fail to parse, TestCorpusToleratesMissingAndCRLFFrontmatter fails",
  ]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Guard phrases and doc-duplication shingles"
  files = ["internal/memadvise/guard.go", "internal/memadvise/dup.go", "internal/memadvise/guard_test.go", "internal/memadvise/dup_test.go"]
  description = """
Guarded(file) checks the whole file, frontmatter included: NEVER/ASK/DECOY/REOPENED as case-sensitive whole words; \"don't re-raise\" / \"don't revert\"
case-insensitive with ' or ’. DocCandidates(tracked) keeps CLAUDE.md, ARCHITECTURE.md, README*, docs/**/*.md. Duplicates(body, docs) normalises
(lowercase, alnum-only, collapsed whitespace) and returns the single doc holding ≥50% of the body's 8-word shingle set."""
  covers = ["c-4", "c-7"]
  test_contract = [
    "if any of the six guard phrases fails to guard, its row in TestGuardPhrases fails; if \"TASK\", \"asked\", \"I'll ask later\", \"NEVERTHELESS\" or \"Nevermind\" guard, TestGuardWholeWordOnly fails",
    "if \"don’t revert\" (U+2019) or \"Don't re-raise\" fails to guard, TestGuardApostropheVariants fails",
    "if exactly 50% shingle overlap with one doc is not a duplicate, or 49% is, TestDupThresholdBoundary fails",
    "if 30% in docs/a.md + 30% in docs/b.md counts as a duplicate, TestDupNeedsOneDoc fails",
    "if a paragraph-reordered restatement no longer matches, TestDupSurvivesReorder fails; if the result is not the doc's repo-relative path, TestDupNamesDoc fails",
    "if a body under 8 words divides by zero or matches, TestDupShortBody fails",
    "if docs/x.txt or src/foo.md survive DocCandidates, TestDocCandidates fails",
  ]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Expired hook clause detection and reword"
  files = ["internal/memadvise/hook.go", "internal/memadvise/hook_test.go"]
  description = """
Expired(hook, today, phaseKnown) finds a time-bound clause: a YYYY-MM-DD directly after until/by/before/due/expires/till/deadline, or
next[:] [phase |/dross-<verb> ]<slug>. Expired when the date is strictly before today or phaseKnown(slug). Returns the hook with only that clause
and its separator removed."""
  covers = ["c-8"]
  test_contract = [
    "if \"until 2026-10-29\" is not expired with today 2026-10-30, or \"until 2026-10-30\" is, TestExpiryBoundaryIsStrict fails",
    "if \"RESOLVED 2026-09-19 (03983fe)\", \"shipped 2026-10-04\" or \"released 2026-01-01\" count as time-bound, TestHistoricalDateIsNotTimeBound fails",
    "if \"next: foo\" expires when phaseKnown(\"foo\") is false or stays live when true, TestNextPhaseClause fails; if \"…; next /dross-spec memory-prune-advisor\" does not parse, TestNextSlashCommandForm fails",
    "if \"X — done; next phase foo\" does not reword to exactly \"X — done\" (no dangling \"; \" / \" — \", no other byte changed), TestRewordRemovesOnlyClause fails",
    "if a hook that is nothing but the clause rewords to empty, TestRewordNeverEmpty fails",
  ]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Count repo turns with 24h incremental cache"
  files = ["internal/memadvise/turns.go", "internal/memadvise/turncache.go", "internal/memadvise/turns_test.go", "internal/memadvise/turncache_test.go", "internal/cmd/gitignore.go", "internal/cmd/gitignore_test.go", ".gitignore", "internal/secretscan/writers.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "Turns streams top-level <slug>/*.jsonl via bufio.Reader (no Scanner cap), skipping subagents/ and files with mtime >30d. A turn = distinct message.id\nper file, type=assistant, isSidechain=false, model≠\"<synthetic>\", within 30d; counts per project + all-projects total. Cache .dross/memory/turns.json\nkeeps per-file {size, mtime, offset, day buckets}: reused under 24h, after 24h only appended bytes rescanned, truncation recounts from 0, atomic\nwrites; returns counts + cache age. Before its first write it creates a self-ignoring .dross/memory/.gitignore (\"*\"), so repos onboarded before this\nphase never stage advisor state. Also seed .dross/memory/ in drossIgnoreEntries and .gitignore; register turncache.go as MachineLocal in secretscan."
  covers = ["c-2"]
  test_contract = ["if three lines sharing one message.id count more than 1, TestTurnsDedupeMessageID fails", "if isSidechain:true, \"<synthetic>\", user lines or subagents/ files add turns, TestTurnsMainAgentOnly fails", "if a turn dated 31 days ago is counted, TestTurnsWindow fails", "if a chmod-000 transcript with a 31-day-old mtime is opened, TestTurnsSkipsStaleFilesByMtime fails", "if a 5 MB single-line tool result between two assistant turns yields anything but 2, TestTurnsSurviveMultiMegabyteLine fails", "if a malformed line is fatal, TestTurnsSkipMalformedLine fails", "if RepoShare is not repo/all across two fixture project dirs, TestTurnsShareAcrossProjects fails", "if a 23h-old cache shows appended turns or age ≠ 23h, TestCacheReusedUnder24h fails; if at 25h they don't show or the cache isn't rewritten, TestCacheRecountedAt24h fails", "if a corrupt or future-dated cache is trusted, TestCacheRecountsOnCorruptOrFuture fails", "if a recount after one appended turn reads more than the appended bytes, or a truncated file is not recounted from 0, TestIncrementalRecountAndTruncation fails", "if the cache path is ever under the memory dir instead of <root>/.dross/memory/, TestCacheNeverInMemoryDir fails", "if .dross/memory/ is missing from drossIgnoreEntries or the repo .gitignore, TestEnsureGitignoreCoversMemoryState fails; if the ignore entry and the memadvise path constants drift, TestIgnoreEntriesMatchAdvisorPaths fails", "if turncache.go is left out of secretscan.Writers() or its IgnoreSeed is wrong, the existing writer enum test fails", "if turns.json is written in a repo whose root .gitignore lacks .dross/memory/ and `git check-ignore .dross/memory/turns.json` does not report it ignored, TestMemoryStateSelfIgnores fails"]
  status = "done"
  depends_on = ["t-1"]

[[task]]
  id = "t-6"
  wave = 3
  title = "Build suggestions: cost, ranking, stable ids"
  depends_on = ["t-1", "t-2", "t-3", "t-4", "t-5"]
  files = ["internal/memadvise/advise.go", "internal/memadvise/cost.go", "internal/memadvise/advise_test.go", "internal/memadvise/cost_test.go"]
  description = """
Advise(...) returns []Suggestion{ID, File, Reason, Action (delete|reword hook), ReportOnly, NewHook, Doc, Inbound, BytesSaved, MonthlyUSD}, at most one
per memory. Precedence: expired clause → reword, beating a duplicate delete; a guarded memory never gets a delete. Integrity: a dead link → delete of
its index line only (appliable); an orphan → action delete, ReportOnly=true. ID = action + file stem. cost.go: tokens = ceil(bytes/4); USD = tokens ×
repo turns × CacheReadUSDPerMTok / 1e6 (one constant); share = repo/all, display only. Sort by USD desc, then ID."""
  covers = ["c-1", "c-2", "c-4", "c-5", "c-7", "c-8"]
  test_contract = [
    "if 400 bytes × 1000 turns × rate R is not exactly 100×1000×R/1e6, or 0 turns is not $0 (recall tokens added, all-project turns used, share divided in, 1e3/1e6 slip), TestMonthlyCostFormula fails",
    "if a reword from 120 to 80 bytes is not priced on 40 bytes, TestRewordPricesOnlyDelta fails",
    "if a guarded memory that duplicates README.md gets a delete, TestGuardBlocksEveryDeleteSource fails",
    "if hooks/bodies holding only DEAD/done/RESOLVED 2026-09-19/DECLINED/SHIPPED yield any suggestion, TestStatusWordsAloneSuggestNothing fails",
    "if an expired-hook memory (duplicate or not) gets anything but exactly one reword-hook suggestion, TestExpiredHookNeverDeletes fails",
    "if a memory with two inbound [[links]] does not name both in Inbound and say \"linked from\" in Reason, TestSuggestionNamesInboundLinks fails",
    "if a duplicate delete's Doc is not the duplicated doc's path, TestDeleteNamesDoc fails",
    "if a dead index link is missing from the list, is not an appliable delete of only its index line, or is priced on anything but that line's bytes, TestDeadLinkDeletesIndexLineOnly fails",
    "if an orphan is missing from the list or is not ReportOnly, TestOrphanIsReportOnly fails",
    "if IDs differ across runs or change when an unrelated memory is added to the top of MEMORY.md, TestSuggestionIDsStable fails",
    "if an all-projects total of 0 gives NaN or panics instead of share \"n/a\", TestShareZeroTotal fails",
    "if a missing dir, missing MEMORY.md or empty dir yields anything but an empty slice and nil error, TestAdviseMissingDirOrIndexIsEmpty fails",
  ]
  status = "done"

