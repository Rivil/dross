[[task]]
  id = "t-10"
  wave = 5
  title = "Add dross memory advise/apply commands"
  depends_on = ["t-7", "t-8"]
  files = ["internal/cmd/memory.go", "internal/cmd/memory_test.go", "cmd/dross/main.go", "cmd/dross/testdata/cli_tree.txt"]
  description = """
`dross memory advise` prints Render(report, all) with integrity block, share and cache age; missing dir is silent exit 0, a count/IO error is loud and
non-zero. `dross memory apply <id> --yes` re-gathers, requires the id among current suggestions, refuses report-only ids (index or remove by hand),
applies via t-8 with snapshots under .dross/memory/snapshots/, prints the snapshot path and recheck. Register the group in main.go."""
  covers = ["c-1", "c-2", "c-3", "c-5", "c-9"]
  test_contract = [
    "if `apply <id>` without --yes exits 0, does not name --yes, or changes the dir hash, TestApplyRefusesWithoutConfirm fails",
    "if an id not among current suggestions (stale or typo) exits 0 or touches anything, TestApplyUnknownID fails",
    "if `apply <orphan-id> --yes` exits 0, omits the index-or-remove-by-hand hint, or changes the dir hash, TestApplyOrphanRefused fails",
    "if applying one of 3 suggestions touches the other two files or any other MEMORY.md byte, TestApplyChangesExactlyOne fails",
    "if apply --yes on a delete does not remove exactly that file, print an existing snapshot path under .dross/memory/snapshots/, and print the recheck, TestApplyEndToEnd fails",
    "if advise changes the dir hash or lists only 3 items, TestAdviseListsAllReadOnly fails",
    "if advise with no memory dir prints anything or exits non-zero, TestAdviseMissingDirSilent fails",
    "if advise with an unreadable transcripts dir exits 0 or doesn't name the path, TestAdviseSurfacesCountError fails",
    "if `dross memory` is not registered in main.go, TestMemoryCommandRegistered fails",
  ]
  status = "done"

