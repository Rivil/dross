  description = "One scripted lifecycle over a real temp repo + bare origin asserting the handoff between the status\nflip (t-4) and the status gate (t-5) — the seam neither task can test alone: t-4's tests never load\nthe detector, t-5's never run finalize. No production code.\n"
  covers = ["c-1", "c-2", "c-3", "c-5"]
  depends_on = ["t-4", "t-5"]
