[[task]]
  id = "t-1"
  wave = 1
  title = "Scan pull_request workflow jobs"
  files = ["internal/protect/workflows.go", "internal/protect/workflows_test.go"]
  description = "Pure, stdlib-only line scanner over a {path: content} map, so the verb can feed it origin/<main>'s tree rather than the working tree. Keeps workflows whose\n`on:` carries pull_request (never pull_request_target); each job yields its check context — `name:` when set, else the job id. A job whose\ncheck name can't be known statically (matrix, job-level `uses:`, `name: ${{ … }}`) or a pull_request trigger with paths/branches filters\nis refused with an error naming the workflow and job."
  covers = ["c-2", "c-9"]
  test_contract = [
    "if pull_request_target prefix-matches pull_request, TestPullRequestTargetExcluded fails: `on: [push, pull_request_target]` and the dependabot-automerge.yml shape both yield 0 jobs",
    "if the scalar, flow-list, block-map and quoted-\"on\" trigger forms yield different job sets, the form-parity table fails",
    "if a job with `name: Unit tests` yields its id instead of \"Unit tests\", the context-name test fails",
    "if a matrix job, a job-level `uses:`, `name: ${{ … }}`, or a pull_request trigger with paths/branches filters yields a context instead of an error naming the workflow and job, the refusal table fails",
    "if a `run: |` body line `  fake:` at job-key indent, a `# jobs:` comment, or a step-level `name:` adds a job, the false-job table fails",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Build main and milestone rulesets"
  files = ["internal/protect/ruleset.go", "internal/protect/ruleset_test.go"]
  description = "MainRuleset(branch, contexts) builds \"dross: main\": deletion, non_fast_forward, pull_request (0 approvals, allowed_merge_methods\n[merge, squash]), required_status_checks (strict=false, no integration_id pin). MilestoneRuleset() builds \"dross: milestones\" on\nrefs/heads/milestone/* with pull_request only (no required checks, so branch creation and finalize's delete still work). Both target=branch, enforcement=active, bypass_actors=[]."
  covers = ["c-1", "c-4", "c-6", "c-7", "c-9", "c-10"]
  test_contract = [
    "if bypass_actors marshals as null or is omitted, TestBypassActorsExplicitlyEmpty fails for both rulesets (an omitted key lets a PUT keep a stale admin bypass)",
    "if main gains required_linear_history or merge_queue, or allowed_merge_methods stops being exactly [\"merge\",\"squash\"], TestMainRulesetKeepsMergeCommits fails (c-4)",
    "if deletion or non_fast_forward is dropped from main, TestMainRulesetBlocksForcePushAndDelete fails (c-7)",
    "if either ruleset's required_approving_review_count != 0 (locked approvals), main's strict is true, or any required check carries integration_id, the params test fails — the approvals assertion runs over BOTH rulesets",
    "if the milestone ruleset's allowed_merge_methods doesn't include both \"squash\" (phase PRs) and \"merge\" (chore PRs), TestMilestoneRulesetAllowsPhaseAndChoreMerges fails",
    "if MainRuleset(\"main\", nil) returns a ruleset instead of an error, or branch \"trunk\" doesn't yield include refs/heads/trunk, the builder test fails",
    "if the milestone ruleset gains a deletion rule (finalize must still delete) or a required_status_checks rule, TestMilestoneRulesetAllowsFinalizeDelete fails",
    "if either ruleset includes refs/tags/*, ~ALL, dependabot/** or pin-currency/bump, the include test fails (release.yml pushes tags; bot branches stay pushable)",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Assess live branch rules for gaps"
  files = ["internal/protect/assess.go", "internal/protect/assess_test.go"]
  description = "LiveRule and LiveRuleset types (the GET rules/branches/{b} and rulesets/{id} shapes). Assess(rules, rulesets, wantContexts) returns\n[]Gap: Unprotected, MissingCheck, StaleCheck, AdminBypass, BypassUnknown, ForcePushAllowed, DeletionAllowed. RequiresPR(rules) is the\npredicate the chore router branches on."
  covers = ["c-3", "c-5", "c-7"]
  test_contract = [
    "if zero rules, or a ruleset in \"evaluate\" or \"disabled\" enforcement, returns anything but exactly [Unprotected], the enforcement table fails",
    "if want {test, shellcheck} with required {test} doesn't yield MissingCheck(shellcheck), or a required context with no job doesn't yield StaleCheck (it never reports, so every PR blocks), the check-diff test fails",
    "if non-empty bypass_actors, or current_user_can_bypass of always or pull_requests_only, doesn't yield AdminBypass, the bypass test fails; if an absent bypass_actors key yields no gap instead of BypassUnknown, TestUnreadableBypassIsUnknown fails",
    "if all c-3 gaps present at once come back as fewer gaps, the multi-gap test fails",
    "if RequiresPR is true for [non_fast_forward] or [deletion] alone, or false for pull_request, update or required_status_checks, the predicate table fails",
  ]
  status = "pending"

