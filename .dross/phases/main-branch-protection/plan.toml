[[task]]
  id = "t-5"
  wave = 1
  title = "Add Dependabot minor/patch auto-merge workflow"
  files = [".github/workflows/dependabot-automerge.yml", ".github/dependabot.yml", "internal/cmd/dependabot_automerge_test.go"]
  description = "Trigger pull_request_target only, so the job is never a required check; workflow permissions contents: read, job contents: write + pull-requests: write; guarded on the\nPR author being dependabot[bot]; fetch-metadata pinned by SHA; `gh pr merge --auto --squash` for minor/patch only; no checkout. Rewrite\ndependabot.yml's \"No auto-merge\" paragraph. Audit against ~/.claude/memory/reference_ci_supply_chain_hardening.md first."
  covers = ["c-8", "c-6"]
  test_contract = [
    "if the trigger becomes pull_request, TestAutoMergeIsNotARequiredCheck fails",
    "if any actions/checkout step appears, TestAutoMergeNeverChecksOutCode fails",
    "if the merge step's `if:` admits semver-major or has no update-type condition, TestAutoMergeSkipsMajor fails",
    "if `gh pr merge` lacks --auto, TestAutoMergeWaitsForChecks fails",
    "if the dependabot[bot] guard is missing or keys on github.actor alone, or the workflow-level permissions aren't read-only, the shape test fails",
    "if any dependabot.yml group's update-types gains \"major\", TestDependabotGroupsExcludeMajor fails",
    "if fetch-metadata is unpinned or `${{` reaches a run: block, TestWorkflowActionsArePinned or TestWorkflowsHaveNoExpressionsInRun fails on the new file",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 1
  title = "Add auto-merge and PR-open gh seams"
  files = ["internal/ship/automerge.go", "internal/ship/automerge_test.go", "internal/ship/open.go"]
  description = "AutoMergePR(opts, n, method) runs `gh pr merge --auto --<method> -- <n>` through screenedGH. When gh refuses because the PR is already\nmergeable (clean status), it merges directly with `gh pr merge --<method> -- <n>` — the server still enforces the ruleset. Adds the\nAutoMergePRFunc and OpenPRFunc seams (OpenPRFunc = OpenPR) so internal/cmd tests can open and arm PRs without gh."
  covers = ["c-5", "c-8"]
  test_contract = [
    "if argv isn't `pr merge --auto --merge -- <n>` with every flag ahead of `--` (argfence's gh Separator policy, internal/argfence/policy.go:72), or ever carries --admin, the argv test fails",
    "if gh output doesn't map \"will be automatically merged\" → AutoEnabled, \"Merged\" → Merged=true, and \"auto merge is not allowed\" → ErrAutoMergeUnavailable carrying gh's reason, the outcome table fails",
    "if a clean-status refusal doesn't produce exactly one follow-up `pr merge --merge -- <n>` (no --auto, no --admin) returning Merged=true, TestCleanStatusMergesDirectly fails; a refused direct merge must yield ErrAutoMergeUnavailable, and any other refusal must make no direct-merge call",
    "if OpenPRFunc stops defaulting to OpenPR, the default-seam test fails",
  ]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 2
  title = "Read live rules and write rulesets via gh"
  files = ["internal/ship/rulesets.go", "internal/ship/rulesets_test.go", "internal/cmd/hermetic_env_test.go"]
  description = "Through screenedGH `gh api`: BranchRules returns protect.LiveRule* or Unknown{reason}; UpsertRuleset PUTs when the name matches and\nPOSTs otherwise, body on stdin; RepoMergeSettings reads allow_auto_merge + allow_merge_commit; SetAllowAutoMerge PATCHes. TestMain\nstubs BranchRulesFunc, the write seams, RepoMergeSettings and AutoMergePRFunc with non-dialing stubs; OpenPRFunc keeps its OpenPR default."
  covers = ["c-1", "c-3", "c-5", "c-8", "c-9"]
  depends_on = ["t-2", "t-3", "t-6"]
  test_contract = [
    "if a gh exit of 401/403/404, \"gh missing\", or unparseable JSON returns (nil, nil) or Known with zero rules instead of Unknown with the reason, the unknown table fails",
    "if a gh stub that never exits isn't cut off within the (test-shortened) bound, the timeout test fails",
    "if milestone/v1.7 reaches the API path unescaped, or an owner/repo starting with `-` or containing `..` reaches gh, the argv-fence test fails",
    "if an existing \"dross: main\" gets anything but exactly one PUT and zero POSTs, or a 403 on the list call falls through to a blind POST instead of erroring with the admin permission named, the upsert test fails",
    "if ruleset JSON appears in argv, a body skips secretscan.ScanPayload, or exec.LookPath is called, the transport test fails",
    "if the PATCH body is anything but {\"allow_auto_merge\":true}, TestRepoPatchTouchesOnlyAutoMerge fails (the verb never changes a merge setting the user chose)",
    "if a failed repo-settings read reports allow_merge_commit=true instead of unknown, the settings-read test fails",
    "if TestMain stops installing the stubs, TestHermeticBranchProtection_NeverDials fails",
  ]
  status = "pending"

