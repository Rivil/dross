[[task]]
  id = "t-9"
  wave = 2
  title = "Publish .dross chores as an auto-merge PR"
  files = ["internal/cmd/chorepr.go", "internal/cmd/chorepr_test.go"]
  description = "Pushes the local base tip (exact SHAs) to dross-chores/<base with \"/\"→\"-\"> — fast-forward while that branch's PR is open; a stale\nchore branch with no open PR is recreated via --force-with-lease. Joins the open PR on that branch or opens one, then arms auto-merge with\nthe merge-commit method so local base can fast-forward to it. If auto-merge is unavailable it still succeeds and reports the URL. On main it\nrefuses up front a batch that would change ReleaseTag (amended chore_push), moving no ref and naming the next step. The basis is the batch's\nown change: ReleaseTag at merge-base(local base, origin/<base>) vs ReleaseTag at the local tip — never local tip vs origin/<base>, which a\nphase squash on origin has already bumped."
  covers = ["c-5", "c-10"]
  depends_on = ["t-2", "t-4", "t-6"]
  test_contract = [
    "if, with an open chore PR, a second batch is anything but a plain fast-forward push with 0 OpenPRFunc calls, the join test fails",
    "if a diverged chore branch with an open PR doesn't error naming the URL and push nothing, or with no open PR isn't recreated via --force-with-lease with a new PR, the divergence table fails",
    "if AutoMergePRFunc is called with \"squash\", TestChorePRMergesAsMergeCommit fails",
    "if ErrAutoMergeUnavailable surfaces as an error instead of nil plus the URL plus \"merge it by hand\", the degraded-path test fails",
    "if an ahead-and-behind batch that leaves the version untouched while origin/main moved 1.7.19.0 → 1.7.20.0 (a phase squash) is refused instead of published, TestReleaseGuardIgnoresOriginBump fails",
    "if a 1.7.19.1 → 1.8.0.0 batch on main moves any origin or local ref, or its refusal doesn't name the next step (put the bump on the milestone branch, then reset main to origin/main), the release-guard test fails",
    "if the chore branch name for main or milestone/v1.7 matches either ruleset include (path.Match), the pattern test fails",
    "if origin/<chore> != the local base tip afterwards, or an ahead-and-behind base leaves `rev-list <base> --not origin/<base> origin/<chore>` non-empty, the publish test fails",
  ]
  status = "pending"

[[task]]
  id = "t-10"
  wave = 3
  title = "Add dross protect verb"
  files = ["internal/cmd/protect.go", "internal/cmd/protect_test.go", "cmd/dross/main.go", "cmd/dross/testdata/cli_tree.txt", "README.md"]
  description = "Previews by default; `--apply` upserts both rulesets, sets allow_auto_merge, then reads main back through Assess. Required jobs come\nfrom origin/<main>'s workflows, not the working tree. `--check <branch>` prints exactly one of protected / unprotected / unknown /\nnot checked (<provider>) and exits 0: whether direct pushes to <branch> are refused (RequiresPR), with no required-check comparison.\nWarns (preview and apply) when allow_merge_commit is off, naming chore PRs and milestone PRs. Exports ProtectFixHint."
  covers = ["c-9", "c-1", "c-7", "c-8", "c-10"]
  depends_on = ["t-1", "t-2", "t-3", "t-7"]
  test_contract = [
    "if a run without --apply records any Create, Update or SetAllowAutoMerge call, the preview test fails (locked apply_verb)",
    "if a pull_request_target or release.yml job appears in the preview, or \"trunk\" doesn't target refs/heads/trunk, the build-input test fails",
    "if re-applying with both names listed makes any Create, or applying with neither listed makes anything but exactly Create ×2 and SetAllowAutoMerge(true), the upsert test fails",
    "if a read-back missing a context exits 0, or a matrix job fails to abort before any write, the apply-safety test fails",
    "if the milestone upsert fails after main succeeds and the run exits 0 or doesn't name which ruleset applied, the partial-apply test fails",
    "if a job present in the working tree but not on origin/<main> is required instead of named \"not on main yet\", the source test fails",
    "if allow_merge_commit reads false and preview or --apply prints no warning naming chore PRs and milestone PRs, or the PATCH body gains allow_merge_commit, TestProtectWarnsWhenMergeCommitsDisabled fails",
    "if any non-github provider (gitlab, forgejo, gitea, bitbucket) or no [remote] (\"\") makes a gh call in preview, --apply or --check, the provider table fails; --check prints `not checked (<provider>)` for each, and `not checked (no remote)` for \"\"",
    "if `--check milestone/v1.7` against a pull_request-only ruleset prints anything but `protected` (a required-check comparison would make it MissingCheck), TestCheckIsPushRefusalOnly fails",
    "if `--check` maps zero rules or only [non_fast_forward] to anything but `unprotected`, a BranchRules Unknown to anything but `unknown`, or exits non-zero on any of the four outcomes, the check-output table fails; stdout must be exactly the one word/phrase so prompts can match it",
    "if the flags are renamed, Lookup(\"apply\") or Lookup(\"check\") fails; if the verb is renamed, TestNarratedCommandsResolveAgainstTheTree fails; TestCLITreeGolden pins registration",
    "if README.md has no `dross protect` row, TestReadmeHasProtectRow (protect_test.go) fails — TestReadmeAdvertisesOnlyRealCommands is one-directional and can't catch a missing row",
  ]
  status = "pending"

[[task]]
  id = "t-11"
  wave = 3
  title = "Route base chore push by live protection"
  files = ["internal/cmd/basebranch.go", "internal/cmd/basebranch_chores_test.go"]
  description = "pushBaseIfAheadDrossOnly probes protection only for github and only when .dross-only commits are ahead (ahead-and-behind included).\nRequiresPR routes to t-9 and returns a result the callers narrate; unprotected or non-GitHub keeps today's push; Unknown pushes nothing\nand errors with the probe reason plus the fix (`gh auth login`, or check [remote]) — amended chore_push. pushQuickBaseIfRecorded inherits this.\nTest fixture: a bare origin whose pre-receive hook logs and rejects updates to refs/heads/main and refs/heads/milestone/*."
  covers = ["c-5", "c-10", "c-1"]
  depends_on = ["t-3", "t-7", "t-9"]
  test_contract = [
    "if a protected, purely-ahead base logs any base update, or t-9's publisher didn't run, the protected-route test fails",
    "if an Unknown probe logs any base update in the hook (even against a hook that would ACCEPT it, simulating a bypass holder), reports pushed=true, or errors without naming the probe reason and the fix, TestUnknownProbeNeverPushes fails",
    "if any non-github value in configenum.ShipProviders (gitlab, forgejo, gitea, bitbucket, \"\") makes a BranchRulesFunc call, or any existing TestPushBase* case changes, the legacy table fails",
    "if a protected base with code ahead pushes anything, or its message says \"push … manually\" instead of naming quick/ plus a PR into the base, the code-ahead test fails",
    "if quick_base=main with phase base milestone/v1.7, both protected, doesn't give two chore branches and two PRs, the two-base test fails",
  ]
  status = "pending"

[[task]]
