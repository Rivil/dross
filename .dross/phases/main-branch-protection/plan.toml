    "if quick.md's PR route drops `git push -u origin quick/`, `gh pr create --base`, or `git pull --ff-only`, or gains `gh pr merge` / `--auto` / `--admin`, TestQuickPRRouteCommands fails",
    "if any prompt says `git push origin main` or `git push origin <base>`, the push-ban test fails",
    "if ship.md stops naming the chore PR and the re-run step, or milestone.md stops saying the chore PR merges first and --finalize still deletes, the narration test fails",
