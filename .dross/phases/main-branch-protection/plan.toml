  wave = 4
  title = "Report main's live protection in doctor"
  files = ["internal/cmd/doctor_protection.go", "internal/cmd/doctor.go", "internal/cmd/doctor_protection_test.go"]
  description = "A `Branch protection:` section: BranchRules → Assess against origin/<main>'s jobs, one ⚠ per gap ending in ProtectFixHint. Forgejo or\nGitLab print `not checked (<provider>)`; Unknown prints `unknown (<reason>)`. Gaps are warnings; doctor's exit code doesn't change."
  covers = ["c-3", "c-7", "c-9"]
  depends_on = ["t-1", "t-3", "t-7", "t-10"]
  test_contract = [
    "if each gap doesn't print its own line — zero rules → \"unprotected\" plus the `dross protect` fix; missing shellcheck → a line naming it; bypass \"always\" → \"admin bypass allowed\"; all three at once → three lines — the gap-render table fails",
    "if ForcePushAllowed, DeletionAllowed or StaleCheck renders no line of its own (each naming the gap and ending in the fix hint), the remaining-gaps table fails",
    "if a BranchRules error renders ✓ or \"protected\", TestProtectionUnknownNeverReadsProtected fails; BypassUnknown must render \"unknown\", never \"none\"",
    "if a t-1 scanner refusal (matrix job, job-level `uses:`, dynamic `name:`, filtered pull_request trigger) is swallowed into an empty want-list instead of rendering `unknown (<workflow>/<job>: <reason>)` with no ✓, TestScannerRefusalReadsUnknown fails",
    "if gitlab, forgejo, gitea or bitbucket makes any seam call or prints anything but `not checked (<provider>)`, the provider table fails; its \"\" row (no [remote]) must make no seam call and print no protection section at all",
    "if doctor's exit code differs with and without gaps, the exit test fails (/dross-ship gates on doctor)",
    "if doctor's output changes with no [remote] configured, TestDoctorRunGolden fails (the section is omitted, as other remote-only sections are)",
    "if a github remote with no origin/<main> renders anything but `unknown (no origin/<main> to read workflows from — run git fetch)`, or any ✓, TestNoOriginMainReadsUnknown fails",
  ]
  status = "pending"

