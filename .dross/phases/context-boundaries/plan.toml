  wave = 3
  title = "Add the dross hooks nudge hook verb"
  files = ["internal/cmd/hooks_nudge.go", "internal/cmd/hooks_nudge_test.go", "internal/cmd/hooks.go", "internal/cmd/telemetry.go", "cmd/dross/testdata/cli_tree.txt"]
