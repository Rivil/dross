[[task]]
  id = "t-1"
  wave = 1
  title = "Record checkpoint-flow baseline on pre-phase binary"
  files = [".dross/phases/context-boundaries/flow-cost.toml"]
  description = "Run FIRST in wave 1, before any `make install` in this phase — `dross interaction show` serves the playbook embedded in the installed binary, so that binary is \"today\". Record `dross version`. In a scratch dross repo with one wave of two tasks, the human runs: §1g after t-1 (mid-wave) → checkpoint → /clear → /dross-execute → the §1c approval turn for t-2. Count main-agent turns (distinct message.id), the tool name per main-agent turn, and agent wall-clock (human wait excluded) with jq over the transcript, structurally only — no transcript content copied. Write [scenario] (repo shape, wave position, flow endpoints, jq method) and [before] (agent_turns, turn_tools, wall_clock_s, binary_version, session_id) to flow-cost.toml (new)."
  covers = ["c-8"]
  test_contract = ["if [before].binary_version equals t-11's [after].binary_version, TestFlowCostRecords (t-11) fails — a threshold=0 run on the new binary is not today's flow, because the hook still spawns", "if [scenario] lacks repo shape, wave position or flow endpoints, TestFlowCostRecords' required-keys check fails and t-11 cannot replay the flow identically", "if [before] lacks a per-turn tool sequence, TestFlowCostRecords (t-11) fails: len(before.turn_tools) must equal before.agent_turns, so a turn-count difference can be attributed"]
  status = "done"

