[[task]]
  id = "t-2"
  wave = 1
  title = "Add [context] threshold to defaults.toml"
  files = ["internal/defaults/defaults.go", "internal/defaults/defaults_test.go", "internal/cmd/testdata/cli_surface/output/defaults_show_json.txt"]
  description = """
Defaults gains `Context ContextDefaults` (toml + json \"context,omitempty\") holding exactly one field, `Threshold *int64`
(toml + json \"threshold,omitempty\"). EffectiveThreshold(): nil → 150000, 0 → 0 (off), <0 → error; LoadFile itself does not
reject a negative value (other defaults readers keep working). Re-mint defaults_show_json.txt — it gains `\"context\": {}` the
same way `\"telemetry\": {}` appears today."""
  covers = ["c-1"]
  test_contract = [
    "if the threshold is a non-pointer field, TestContextThresholdUnsetVsZero fails: no [context] → EffectiveThreshold 150000; `threshold = 0` → 0 with no error",
    "if another defaults writer clobbers the key, TestContextThresholdSurvivesOtherWriters fails: load `[context] threshold = 0` + `[telemetry] enabled = false`, mutate Remote (what `defaults save` does) and Telemetry (what `stats opt-out` does), SaveFile, reload → still 0; a file with no [context] re-saves with no [context] table",
    "if an invalid value is swallowed or poisons every reader, the validation test fails: `threshold = -1` → EffectiveThreshold error while LoadFile still succeeds; `threshold = \"150k\"` → LoadFile error naming the path, never a silent 150000",
    "if the step becomes configurable, TestContextDefaultsOneKnob fails: reflect shows ContextDefaults has exactly one field (nudge_cadence)",
    "if the show output drifts, TestOutputGoldens fails: defaults_show.txt stays byte-identical and defaults_show_json.txt differs only by `\"context\": {}`; mismatched toml/json tags fail TestTomlFieldsCarryMatchingJSONTags",
  ]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Read latest main-agent usage from transcript tail"
  files = ["internal/ctxnudge/transcript.go", "internal/ctxnudge/transcript_test.go", "internal/ctxnudge/testdata/main_tail.jsonl", "internal/ctxnudge/testdata/subagent_tail.jsonl"]
  description = """
New package internal/ctxnudge. LatestMainContext(path) (tokens int64, ok bool): open O_RDONLY|O_NONBLOCK, require a regular
file, read backwards in 64 KiB chunks up to an 8 MiB cap. Newest-first, the first entry with type \"assistant\", isSidechain
false, a usage object, model ≠ \"<synthetic>\" and a non-zero sum wins; tokens = input + cache_read_input + cache_creation_input
(saturating). Unparseable lines skipped. Small fixtures are jq projections of {type,isSidechain,message:{model,usage}} with no
content fields; large/edge inputs generated in-test."""
  covers = ["c-2", "c-5", "c-7"]
  test_contract = [
    "if sidechain turns are counted, the main-vs-sidechain test fails: tail [main assistant 120,000 then sidechain assistant 190,000] → 120,000",
    "if the sum is wrong, TestUsageSumsThreeInputFields fails: usage {input 2, cache_read 151,000, cache_creation 407, output 9,999} → 151,409; counting output_tokens or dropping a cache field fails it; a missing cache_creation key counts as 0",
    "if a subagent transcript yields a number, the subagent test fails: subagent_tail.jsonl (every line isSidechain:true, today's subagents/agent-*.jsonl shape) → ok=false",
    "if synthetic entries win, the synthetic test fails: newest main entry model \"<synthetic>\" with zero usage → the previous real entry, not 0",
    "if a torn tail breaks the read, the torn-line test fails: a last line with no closing brace and no trailing newline is skipped and the previous entry returned",
    "if line length is capped, the long-line test fails: a 3 MiB single tool_result line after the latest assistant entry → still found (a bufio.Scanner at its 64 KiB default fails)",
    "if matching is whitespace-sensitive, the spacing test fails: `{\"type\": \"assistant\", …}` (space after the colon) is still recognised",
    "if the whole file is read, TestTailReadIsBounded fails: 50 MB sparse transcript with the latest main entry 200 KiB from EOF → a counting ReaderAt records ≤ 1 MiB read",
    "if the read is slow, TestTailRead50MBUnder50ms fails: same file, min of 5 runs ≥ 50 ms",
    "if the cap reports a false zero, the cap test fails: no qualifying entry within 8 MiB → ok=false, never (0, true)",
    "if a non-regular file blocks or errors loudly, the special-file test fails: a FIFO with no writer → ok=false within a 1 s deadline; a directory, a missing file or mode 000 → ok=false",
    "if the sum overflows, the saturation test fails: three usage fields of 4e18 each → a positive saturated sum, not a wrapped negative",
  ]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Nudge cadence: band, once-only claim, line"
  files = ["internal/ctxnudge/nudge.go", "internal/ctxnudge/nudge_test.go", "internal/gatestate/nudge.go", "internal/gatestate/nudge_test.go"]
  description = "Band(tokens, threshold): 0 below threshold or when threshold is 0, then 1 at threshold and +1 per unexported fixed 50_000 step. Exported Marker = \"context checkpoint:\". Line(tokens, threshold, reentry) renders the locked one-liner.\ngatestate.NudgeClaimed(root, sessionID, band) is a read-only peek: true when that band or any higher band is claimed for the session; it never creates a file or calls ensureDir. gatestate.ClaimNudge(root, sessionID, band): O_CREATE|O_EXCL file under .dross/gate/nudge/ named sha256(sessionID)[:16]-<band>, created through the existing self-ignoring ensureDir; returns false when that band or any higher band is already claimed (high-water). A successful claim prunes claims older than 7 days, inside nudge/ only."
  covers = ["c-2", "c-3"]
  test_contract = ["if band maths drifts, the Band table test fails: (149,999)=0; (150,000)=1 (c-2 \"at or above\"); (199,999)=1; (200,000)=2; (260,000)=3; threshold 0 at 10,000,000 → 0", "if a jump nudges per skipped band, the jump test fails: 140k→260k claims band 3 once — one fire, one nudge", "if a lower band can re-fire, TestLowerBandNeverRenudges fails: ClaimNudge(s,2) after ClaimNudge(s,3) → false", "if the claim races, TestClaimNudgeExactlyOnce fails: 32 goroutines calling ClaimNudge(root,\"s\",1) → exactly one true (a stat-then-write claim fails it)", "if claims leak across sessions, the per-session test fails: (s1,1) true; (s2,1) true; (s1,1) false; (s1,2) true", "if a session id escapes the dir, the path test fails: session \"../../escape\" and \"a/b\" → the claim lands inside .dross/gate/nudge/; empty session id → error and no file", "if claims dirty the tree, the ignore test fails: `git status --porcelain` is empty after a claim in a git temp repo", "if pruning is wrong, the prune test fails: an 8-day-old claim is pruned on the next claim; a 1-day-old claim (including another session's) survives; an 8-day-old .dross/gate/green.json is untouched", "if the line loses a locked part, TestLineCarriesLockedParts fails: Line(151_409, 150_000, \"/dross-execute — run the next task\") starts with Marker and contains \"151k / 150k\", \"checkpoint at your next durable boundary → /clear\", the reentry verbatim and \"mid-thought? /dross-pause first\"; a reentry containing \"\\n\" still yields one line (nudge_content)", "if the peek writes or mis-reads the high-water mark, TestNudgeClaimedIsReadOnly fails: NudgeClaimed on a fresh root returns false and leaves no .dross/gate/nudge/ dir; after ClaimNudge(s,3), NudgeClaimed(s,2) and NudgeClaimed(s,3) → true, NudgeClaimed(s,4) → false"]
  status = "done"

