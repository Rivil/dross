  depends_on = ["t-2", "t-7"]
  test_contract = ["if any failure surfaces as a hook error, the never-fails test fails: exit 0 with empty stdout AND stderr for closed/empty stdin, garbage stdin, an undecodable defaults.toml, a panicking seam, and a cwd with an incomplete .dross", "if the hook writes telemetry per tool call, the telemetry test fails: RecordCLIEvent(`dross hooks nudge`) writes 0 events while `dross status` still writes 1", "if the re-entry segment is hand-rolled, TestNudgeNamesSessionStartReentry fails: fixture repo with a planned phase and runnable task, over-threshold payload → the line's re-entry segment equals the \"next: …\" segment `dross reentry` prints", "if cadence breaks end to end, TestNudgeCadenceEndToEnd fails: one session — 150,000 emits one envelope, 160,000 is silent, 200,000 emits again", "if threshold 0 doesn't switch it off, the off test fails: threshold = 0 at 900k → empty stdout and nothing created under .dross/gate", "if the wired string and command path diverge, the path test fails: root.Find(\"hooks\",\"nudge\").CommandPath() == NudgeHook", "if the CLI surface drifts, TestCLITreeGolden fails: cli_tree.txt gains exactly the `dross hooks nudge` line", "if the debug re-entry is dropped, TestNudgeNamesDebugReentry fails: with an open debug session <slug>, the over-threshold nudge line contains \"/dross-debug <slug>\" exactly as `dross reentry` prints it"]
  status = "done"

