[[task]]
  id = "t-6"
  wave = 2
  title = "Add context-checkpoint rule to interaction playbook"
  files = ["assets/prompts/_interaction.md", "internal/cmd/interaction_snippet_test.go", "internal/cmd/execute_prompt_test.go"]
  description = """
One short \"## Context checkpoint\" section: a line starting with Marker in context means the next durable boundary leads with
\"checkpoint + /clear\" — execute §1g even mid-wave (overrides §1g's mid-wave `continue` lead) and every \"safe to /clear\" wrap-up.
Mid-command gates before their artifact is written are not durable boundaries and don't change. Under --solo the nudge is
informational — keep going. Thread not on disk → /dross-pause first. Never run a dross command to check context. execute.md is
not edited (gate_scope)."""
  covers = ["c-4", "c-8", "c-9"]
  depends_on = ["t-4"]
  test_contract = ["if the rule is lost or the marker drifts, TestInteractionSnippetHasContextNudgeRule fails: _interaction.md contains ctxnudge.Marker verbatim plus \"checkpoint + /clear\", \"next durable boundary\", \"even mid-wave\", \"§1g\", \"overrides\", \"safe to /clear\", \"--solo\", \"informational\", \"before its artifact is written\" and \"/dross-pause\"", "if the embed goes stale, the embed test fails: `dross interaction show` output contains Marker", "if the rule is duplicated into a command prompt, TestNudgeRuleLivesOnlyInPlaybook fails: Marker appears in no other assets/prompts/*.md or assets/commands/*.md (gate_scope: one rule)", "if a wrap-up the rule must reach stops loading the playbook, TestFooterPromptsLoadPlaybook (new) fails: every prompt footerCoverage marks footer-bearing (today debug, execute, pause, plan, quick, respond, ship, spec, verify) still runs `dross interaction show`", "if a context-check call joins the flow, TestContextRuleAddsNoCalls fails: no assets/prompts/*.md or assets/commands/*.md other than options.md (whose §15 documents the wired hooks) contains \"dross hooks nudge\", none contains a `dross context` call, and the new section names no `dross <verb>` (signal_path, c-8)", "if the below-threshold §1g order changes or gains a call, TestExecutePromptCheckpointWaveLead (extended) fails: executeGateSection (lowercased, backticks stripped) still contains \"mid-wave, lead with continue\" and \"lead with checkpoint\", and the checkpoint bullet names exactly `dross validate` and `dross task next`", "if the section bloats, TestContextRuleSizeBudget fails: the new section is > 700 bytes"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 2
  title = "Nudge pipeline over the hook payload"
  files = ["internal/ctxnudge/run.go", "internal/ctxnudge/run_test.go", "internal/ctxnudge/testdata/posttooluse_main.json", "internal/ctxnudge/testdata/posttooluse_subagent.json"]
  description = "FIRST capture two real PostToolUse payloads via a temporary stdin-dump hook wired ONLY in a scratch dross repo's .claude/settings.local.json — never user-level settings — one main-agent call and one inside a subagent, harmless content. Before committing, scrub home paths and session ids from the fixtures (keep key presence and shape) and check them structurally for secrets. The capture decides whether agent_id marks subagent origin; if not, fall back to \"tool_use_id not among the latest main-agent message's tool_use blocks\".\nRun(payload, Env{Threshold, Reentry}) []byte: narrow decode (hook_event_name, session_id, transcript_path, cwd, agent_id, tool_use_id), not gate.Decode. Silent unless: event == PostToolUse, main-agent origin, gate.LocateRoot(cwd) finds a repo (stat only), threshold > 0, transcript ok, band > 0 and not gatestate.NudgeClaimed. Compose via Env.Reentry BEFORE claiming, then ClaimNudge, then emit {\"systemMessage\": line, \"hookSpecificOutput\": {\"hookEventName\": \"PostToolUse\", \"additionalContext\": line}}."
  covers = ["c-2", "c-3", "c-5", "c-8"]
  depends_on = ["t-3", "t-4"]
  test_contract = ["if a subagent fire nudges or burns a band, TestSubagentFireNeitherNudgesNorClaims fails: captured subagent fixture + over-threshold transcript → nil output AND no claim file", "if a subagent transcript path is trusted, the sidechain-path test fails: transcript_path pointing at an all-sidechain subagents/agent-*.jsonl → nil", "if the envelope can block or diverges, TestEnvelopeNeverBlocks fails: captured main fixture over threshold → exactly one JSON object with systemMessage == additionalContext == the line, hookEventName == \"PostToolUse\", and no \"decision\", \"continue\" or \"permissionDecision\" key; a second Run on the same session and band → nil", "if the transcript is derived from session_id, TestReadsPayloadTranscriptPath fails: the fixture transcript sits at an arbitrary temp path named only by payload.transcript_path", "if any silent path emits, the silent-path table fails: nil output for non-JSON stdin; a JSON array; cwd outside a dross repo; cwd in a .dross with no project.toml; empty session_id; missing transcript; an Env.Threshold error; hook_event_name \"UserPromptSubmit\" or \"SessionStart\"; threshold 0 with transcript_path at a FIFO (returns at once — the off switch never opens the transcript)", "if git runs on the hot path, the Reentry-counter test fails: the Env.Reentry call counter stays 0 below threshold and when the band is already claimed", "if a failed compose burns a band, TestFailedComposeKeepsBucket fails: Env.Reentry panics → no claim written, and the next Run with a working Reentry still nudges that band", "if the captured fixtures leak, TestCapturedFixturesScrubbed fails: neither testdata/posttooluse_*.json contains \"/Users/\", \"/home/\" or a UUID-shaped session id", "if the in-process hook path is slow, TestRunUnder50ms fails: Run over a 50 MB transcript (latest main entry near EOF) with a ≤ 64 KiB payload and a stubbed Reentry, min of 5 runs, is ≥ 50 ms on either the below-threshold path or the emit path"]
  status = "done"

[[task]]
