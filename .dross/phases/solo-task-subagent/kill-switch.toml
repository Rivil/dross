# Kill switch for solo-task-subagent (c-6): the writer ships only if, on tasks
# above the size gate, median main-loop peak context drops by at least 25% and
# median per-task wall-clock rises by at most 25% (turns recorded, not gated).
# [before] is mined from the archived v1.7 solo transcripts
# (~/.local/share/dross/baseline-v1.7/: solo-task-review, board-finalize-on-
# complete, verify-staleness, debug-sessions, review-comment-ingest) with the
# filter below; [after] is the next real solo phase, mined the same way.
# Counts only — no transcript text is copied into this file.

[thresholds]
  context_drop = 0.25
  wall_clock_rise = 0.25

[calibration]
  threshold = 40000
  method = "Scanned thresholds 10,000–150,000 bytes in 5,000 steps over the [[before.task]] rows; kept those leaving at least 40% of rows on each side, and took the one with the largest ratio of median context_growth above the gate to median below it. 40,000: 48 above, 38 below, median growth 36,513.5 vs 20,679.5 (1.77×). The provisional 50,000 gave 1.43×."

[trial]
  status = "pending"

[before]
  method = "jq -cs -f <filter> <session>.jsonl per archived session that ran a v1.7 solo phase. A turn is a distinct message.id among main-loop entries (type assistant, isSidechain false, model not <synthetic>); its context is input_tokens + cache_creation_input_tokens + cache_read_input_tokens. A task's window runs from the turn whose Bash call sets it in_progress to the turn setting it done, inclusive; a $VAR task id resolves from that call's tool_result (<phase>/<task> -> <status>, or next=<task>). peak_context is the window's max context; context_growth sums only the positive turn-to-turn deltas, so a compaction inside the window never counts negative; wall_clock_s is done-turn minus in_progress-turn timestamp; turns counts the window's turns. Tasks that ended failed have no row. surface_bytes sums git cat-file -s <commit>^:<file> over the task's files and commit in that phase's changes.json; a file absent at the parent counts 0."
  filter = '''
def ts: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
def text: if type == "string" then . else ([ .[]? | select(.type == "text") | .text ] | join("\n")) end;
. as $all
| ([ $all[] | select(.type == "user") | .message.content[]? | select(type == "object" and .type == "tool_result") | {key: .tool_use_id, value: (.content | text)} ] | from_entries) as $out
| [ $all[] | select(.type == "assistant" and (.isSidechain | not) and .message.model != "<synthetic>") ]
| reduce .[] as $e ({order: [], by: {}};
    ($e.message.id) as $id
    | (if .by[$id] == null then .order += [$id] | .by[$id] = {ts: ($e.timestamp | ts), ctx: 0, calls: []} else . end)
    | .by[$id].ctx = ([.by[$id].ctx, (($e.message.usage // {}) | ((.input_tokens // 0) + (.cache_creation_input_tokens // 0) + (.cache_read_input_tokens // 0)))] | max)
    | .by[$id].calls += [ $e.message.content[]? | select(.type == "tool_use" and .name == "Bash") | {cmd: (.input.command // ""), out: ($out[.id] // "")} ])
| [ .order[] as $id | .by[$id] ] as $turns
| [ range(0; $turns | length) as $i
    | $turns[$i].calls[] as $c
    | $c.cmd | [ scan("dross task status ([a-z0-9-]+) ([^ ]+) (in_progress|done|failed)") ][]
    | . as [$p, $t, $st]
    | (if ($t | test("^t-[0-9]+$")) then $t
       else ([ $c.out | scan($p + "/(t-[0-9]+) -> " + $st) ][0][0] // [ $c.out | scan("next=(t-[0-9]+)") ][0][0]) end) as $task
    | select($task != null)
    | {i: $i, phase: $p, task: $task, st: $st} ] as $ev
| [ $ev[] | select(.st == "done") as $d
    | ([ $ev[] | select(.phase == $d.phase and .task == $d.task and .st == "in_progress" and .i <= $d.i) ] | last) as $s
    | select($s != null)
    | $turns[$s.i : $d.i + 1] as $w
    | {phase: $d.phase, task: $d.task,
       peak_context: ([ $w[].ctx ] | max),
       context_growth: ([ range(1; $w | length) as $k | ($w[$k].ctx - $w[$k - 1].ctx) | select(. > 0) ] | add // 0),
       wall_clock_s: ($turns[$d.i].ts - $turns[$s.i].ts),
       turns: ($w | length)} ]
| .[]
'''

