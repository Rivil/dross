[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["internal/verify/lifecycle_test.go:TestClassifyPartitionsEverySurvivor", "internal/verify/lifecycle_test.go:TestClassifyAssignsEachStateOnce", "internal/verify/lifecycle_test.go:TestNoSurvivorReachesTestsJSONStateless", "internal/cmd/verify_scoping_test.go:TestVerifyPrintsLifecycleCounts", "internal/cmd/verify_scoping_test.go:TestVerifyPersistsKeyAndStateIntoTestsJSON"]
  notes = "Both halves asserted: Total() equals the input count (no survivor double-counted or dropped) and each of the four states holds exactly one complete record. TestNoSurvivorReachesTestsJSONStateless pins it at the persistence boundary — an empty Lifecycle after classification fails. Proven live this run: the drain moved 91 survivors from unclassified to routed with the counts summing to the run total."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/survivor/store_test.go:TestAcceptRejectsReasonlessAndWritesNothing", "internal/survivor/store_test.go:TestLoadRejectsHandEditedReasonlessEntry", "internal/survivor/store_test.go:TestCategoryResolution", "internal/cmd/survivor_test.go:TestSurvivorAcceptRequiresAReason", "internal/verify/verify_test.go:TestSkeletonAcceptanceSuppressesExactlyOneFlag"]
  notes = "Reason enforcement is closed on both entrances — the write gate (Accept) and the read gate (Load), the latter mattering because the store is hand-editable. The rejection is asserted byte-identical against an existing store, so a failed accept cannot rewrite the file. Non-re-emission is asserted at the skeleton: an accepted survivor suppresses exactly one FLAG and does not touch the score."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/survivor_test.go:TestSurvivorAcceptWritesRepoRootStore", "internal/cmd/survivor_test.go:TestSurvivorStoreIsTracked", "internal/cmd/verify_scoping_test.go:TestVerifyReadsStoreAcrossPhases", "internal/survivor/store_test.go:TestLocatePathResolvesRepoRootFromNestedSubdir"]
  notes = "TestVerifyReadsStoreAcrossPhases is the load-bearing one: it accepts under one phase, flips current_phase to another, and asserts the acceptance still suppresses — the phase-local-read failure that killed the board mapping. Durability is also pinned structurally (the store is not gitignored) and positionally (repo-root, not under the phase dir, resolved the same from a nested subdir)."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/survivor/identity_test.go:TestKeyStableAcrossLineDrift", "internal/survivor/identity_test.go:TestKeyIsTextDerived", "internal/survivor/identity_test.go:TestAmbiguityDetection", "internal/verify/lifecycle_test.go:TestFalseSuppressionGuard", "internal/verify/lifecycle_test.go:TestAmbiguousAcceptanceDoesNotSuppress"]
  notes = "Drift and false-suppression are asserted as an exact pair on the same fixture: moving the target text from line 40 to 88 must keep the key, changing the text at a fixed line must change it. TestFalseSuppressionGuard runs the same claim through Classify. The locked ambiguity rule is pinned on both sides — detection with an occurrence count, and non-suppression with the withheld reason named in the note."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/survivor/stale_test.go:TestStaleDetectsDeletedFile", "internal/survivor/stale_test.go:TestStaleDetectsVanishedText", "internal/survivor/stale_test.go:TestStaleIgnoresLineDrift", "internal/survivor/stale_test.go:TestStaleReportsReadErrorsSeparately", "internal/survivor/stale_test.go:TestStaleSignatureHasNoClock", "internal/cmd/verify_scoping_test.go:TestVerifyReportsStaleAcceptance"]
  notes = "Both staleness shapes covered (file gone, text gone) with the two ways staleness could degrade explicitly excluded: line drift must not retire a live acceptance, and an unreadable file is reported Unverifiable rather than Stale. TestStaleSignatureHasNoClock enforces the no_acceptance_ttl lock structurally by reflecting over the signature for a time.Time/Duration parameter."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/rules/rules_test.go:TestRenderEmitsSurvivorDrainBuiltin", "internal/rules/rules_test.go:TestProjectRuleR02Retired", "internal/rules/rules_test.go:TestDrainPolicyRenderedOnce", "internal/rules/rules_test.go:TestDrainRuleNamesBothEscapes", "internal/cmd/rule_test.go:TestRuleShowEmitsSurvivorDrainInCleanRepo"]
  notes = "The ship half runs Render over the empty set (the no-project-rules repo) and again end-to-end through `dross rule show` in a freshly-inited temp repo. The delete half asserts on rule TEXT rather than the id, since nextID reallocates r-02 to the next unrelated rule and an id check would pass vacuously. TestDrainPolicyRenderedOnce counts occurrences, so a returning project copy fails instead of passing a `contains` check."

[[criterion]]
  id = "c-7"
  status = "covered"
  tests = ["internal/verify/lifecycle_test.go:TestApplyLifecycleStampsBothRecordTypes", "internal/verify/lifecycle_test.go:TestOutOfScopeMutantWireForm", "internal/verify/verify_test.go:TestSkeletonOutOfScopeIsLifecycleAware", "internal/verify/verify_test.go:TestSkeletonUnclassifiedNoteFallsAwayWhenDrained", "internal/cmd/survivor_test.go:TestSurvivorRouteAppendsToCurrentPhaseSpec", "internal/cmd/deferred_test.go:TestDeferredListTargetIncludesSurvivorEntries"]
  notes = "Routing is asserted to land in the CURRENT phase's spec and explicitly NOT in the target's, with the entry then reachable via `deferred list --target`. The unrouted out-of-scope survivor FLAGs and names both escape verbs; the routed one becomes a NOTE naming its destination. TestSkeletonUnclassifiedNoteFallsAwayWhenDrained pins the ratchet — a fully drained set reports nothing, not `0 remaining`. Demonstrated live: 89 routes moved this run from 91 unclassified to 0."

