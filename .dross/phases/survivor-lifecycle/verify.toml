  status = "covered"
  tests = ["internal/rules/rules_test.go:TestRenderEmitsSurvivorDrainBuiltin", "internal/rules/rules_test.go:TestProjectRuleR02Retired", "internal/rules/rules_test.go:TestDrainPolicyRenderedOnce", "internal/rules/rules_test.go:TestDrainRuleNamesBothEscapes", "internal/cmd/rule_test.go:TestRuleShowEmitsSurvivorDrainInCleanRepo"]
  notes = "Ship half runs Render over the empty set and again through `dross rule show` in a freshly-inited temp repo. Delete half asserts on rule TEXT, not the id, since nextID reallocates r-02 and an id check would pass vacuously. TestDrainPolicyRenderedOnce counts occurrences so a returning project copy fails. The rules.go:104 survivor is in this file but is the merge comparator's tiebreak, not c-6's claim — FLAGged, not a downgrade."

