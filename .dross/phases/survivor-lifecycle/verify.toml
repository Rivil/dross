  tests = ["internal/verify/lifecycle_test.go:TestClassifyPartitionsEverySurvivor", "internal/verify/lifecycle_test.go:TestClassifyAssignsEachStateOnce", "internal/verify/lifecycle_test.go:TestNoSurvivorReachesTestsJSONStateless", "internal/verify/lifecycle_test.go:TestAmbiguousAndRoutedSurvivorCarriesBothNotes", "internal/cmd/verify_scoping_test.go:TestVerifyPrintsLifecycleCounts"]
  notes = "Total() equals the input count and each state holds exactly one complete record; an empty state fails at the persistence boundary. t-10 added the two-note join, so a survivor carrying two facts keeps both. Proven live across three runs of this phase: 91 unclassified -> 0, then 1 accepted appearing without disturbing the 91 routed."

[[criterion]]
  id = "c-2"
  status = "weak"
  tests = ["internal/survivor/store_test.go:TestAcceptRejectsReasonlessAndWritesNothing", "internal/survivor/store_test.go:TestLoadRejectsHandEditedReasonlessEntry", "internal/survivor/store_test.go:TestCategoryResolution", "internal/survivor/store_test.go:TestSharedCategoryProseEncodedOnce", "internal/cmd/survivor_test.go:TestSurvivorAcceptRequiresAReason", "internal/verify/verify_test.go:TestSkeletonAcceptanceSuppressesExactlyOneFlag"]
  notes = "Non-re-emission and the plain reasonless rejection are solidly covered on both the write and read gates. The hole is the category-only path: Add's `case a.Category != \"\"` branch (internal/survivor/store.go:160, origin in-hunk, coverprofile count=0) is never entered, because every test that sets Category also sets Reason. That branch is exactly where a reasonless acceptance is conditionally allowed or rejected on whether the category resolves — the surface c-2 claims. The CLI --category flag has no test at all. Load-level category validation IS covered (TestCategoryResolution), so the gap is the Add gate, not the format."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["internal/cmd/survivor_test.go:TestSurvivorAcceptWritesRepoRootStore", "internal/cmd/survivor_test.go:TestSurvivorStoreIsTracked", "internal/cmd/verify_scoping_test.go:TestVerifyReadsStoreAcrossPhases", "internal/survivor/store_test.go:TestLocatePathResolvesRepoRootFromNestedSubdir"]
  notes = "TestVerifyReadsStoreAcrossPhases is load-bearing: accept under one phase, flip current_phase, assert the acceptance still suppresses — the phase-local-read failure that killed the board mapping. Durability also pinned structurally (not gitignored) and positionally (repo-root, resolved the same from a nested subdir). Demonstrated live: the survivor.go:242 acceptance recorded during execute was read back as `accepted` by this run."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/survivor/identity_test.go:TestKeyStableAcrossLineDrift", "internal/survivor/identity_test.go:TestKeyIsTextDerived", "internal/survivor/identity_test.go:TestAmbiguityDetection", "internal/verify/lifecycle_test.go:TestFalseSuppressionGuard", "internal/verify/lifecycle_test.go:TestAmbiguousAcceptanceDoesNotSuppress", "internal/verify/verify_test.go:TestSkeletonInScopeSurvivorRendersItsNote"]
  notes = "Drift and false-suppression asserted as an exact pair on one fixture: moving the text keeps the key, changing the text at a fixed line breaks it. The ambiguity rule is pinned end to end after t-10 — detected with an occurrence count, non-suppressing at Classify, and now rendered into the FLAG text so the user actually learns why the acceptance was withheld."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/survivor/stale_test.go:TestStaleDetectsDeletedFile", "internal/survivor/stale_test.go:TestStaleDetectsVanishedText", "internal/survivor/stale_test.go:TestStaleIgnoresLineDrift", "internal/survivor/stale_test.go:TestStaleReportsReadErrorsSeparately", "internal/survivor/stale_test.go:TestStaleSignatureHasNoClock", "internal/cmd/verify_scoping_test.go:TestVerifyReportsStaleAcceptance"]
  notes = "Both staleness shapes covered, with the two ways staleness could degrade explicitly excluded: line drift must not retire a live acceptance, and an unreadable file is Unverifiable rather than Stale. The no_acceptance_ttl lock is enforced structurally by reflecting over the signature for a time.Time/Duration parameter."

[[criterion]]
