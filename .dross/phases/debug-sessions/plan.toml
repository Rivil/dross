[phase]
  id = "debug-sessions"

[[task]]
  id = "t-1"
  wave = 1
  title = "Parse session markdown into counted sections"
  files = ["internal/debugsession/parse.go", "internal/debugsession/parse_test.go"]
  description = '''New pure package internal/debugsession. Parse([]byte) -> Session{Status, Hypotheses, FailedSinceReplan, Signals, Prevention, Problems}; State() -> open | needs-replan | resolved | abandoned. Exports the seven fixed headings, the `- [failed]` / `- [replan]` markers (case- and space-tolerant) and the state words for the template and prompt. Only column-0 list items outside ```/~~~ fences and <!-- --> comments count; status is read from the header above the first `## `. A malformed file reads open with a named Problem; whitespace-normalised identical Resolution items count once.'''
  covers = ["c-2", "c-4", "c-5"]
  test_contract = ["if the re-plan threshold is off by one or counts failures above the last [replan], TestReplanThreshold fails: [failed]x2 -> open; x3 -> needs-replan; x3,[replan] -> open; x3,[replan],x2 -> open; x3,[replan],x3 -> needs-replan; `[failed]`, `[FAILED]` and `[ Failed ]` all count", "if markers are counted outside their section, TestSectionScope fails: three `- [failed]` under ## Hypotheses read open", "if failures override a closed header, TestClosedHeaderWins fails: a resolved or abandoned header with five [failed] reads resolved or abandoned", "if quoted output leaks into the counts, TestParseImmunity fails: items inside ``` and ~~~ fences, inside a multi-line <!-- -->, and indented sub-bullets are not counted (1 hypothesis + 2 sub-bullets = 1); `## Fix attempts` inside a fence is not a heading; `status: resolved` in a body section or a fence leaves the header open", "if a malformed file goes unreported, TestParseProblems fails: an unclosed fence, a missing or duplicated fixed heading, `### Fix attempts` and an unrecognised status value each yield a named Problem, and an unrecognised status reads open", "if Resolution or Prevention counting regresses, TestResolutionAndPrevention fails: whitespace-normalised identical items count once; an empty `- ` counts 0; a Prevention of only a comment, blanks, an empty bullet or a fenced block reads empty; one prose line reads non-empty", "if line endings change the parse, TestCRLFParsesLikeLF fails: a CRLF file parses identically to its LF twin", "if Session grows toml/json tags or parse.go drops below the floor, TestEveryPathShapedFieldIsDeclared or the CI coverfloor (>=50% own-package) fails", "if a duplicated header status line goes unreported, TestParseProblems fails: a header carrying two `status:` lines yields a named Problem and reads open, never the later or earlier value silently"]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add debug sessions to the curated-shrink gate"
  files = ["internal/gate/lists.go", "internal/gate/drossfiles_test.go"]
  description = '''Add `debug/*.md` to Defaults().CuratedFiles beside handoff.md; extend TestCuratedShrinkBoundary with `debug/s.md` rows and scope probes.'''
  covers = ["c-8"]
  test_contract = [
    '''if the pattern is dropped, TestCuratedShrinkBoundary fails: a 499-byte Write over a 1000-byte .dross/debug/s.md is refused with a refusal naming Edit; 500 bytes is allowed; an Edit is never judged''',
    '''if creation is caught by the gate, TestCuratedShrinkBoundary fails: a Write creating a not-yet-existing .dross/debug/x.md is allowed''',
    '''if the pattern is widened to `debug/*`, TestCuratedShrinkBoundary fails: shrinking .dross/debug/.gitignore, .dross/debug/notes.txt or .dross/debug/sub/x.md is not claimed''',
    '''if the default stops being additive, TestCuratedShrinkBoundary fails: a gates.toml `curated_files = []` still enforces `debug/*.md`''',
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 2
  title = "Scaffold, load and self-ignore session files"
  files = ["internal/debugsession/store.go", "internal/debugsession/store_test.go", "internal/secretscan/writers.go", "internal/cmd/secretscan_writer_enum_test.go"]
  description = '''ValidSlug (^[a-z0-9]+(-[a-z0-9]+)*$, <=64 chars) and Template(slug, now) built from t-1's headings. Create writes `.dross/debug/.gitignore` (`*`), verifies `git check-ignore -q --` via gitrun inside a work tree, then O_EXCL-writes <slug>.md. Load (newest mtime first) and Rewrite (atomic; refuses if the file changed since read). Declared MachineLocal under a new DebugIgnoreSeed preparer.'''
  covers = ["c-1", "c-2"]
  depends_on = ["t-1"]
  test_contract = ["if the template and parser drift, TestTemplateRoundTrip fails: Parse(Template) reads open, 0/0/0, empty Prevention, no Problems, seven headings in spec order; three `- [failed]` appended under the template's own `## Fix attempts` read needs-replan", "if slug validation loosens, TestValidSlug fails: accepts flaky-login and x1; rejects \"\", \"..\", \"a/b\", \"../x\", \".x\", \"-x\", \"x-\", \"A\", \"a.md\", \"a b\", \"é\" and a 65-char slug, each writing nothing and not creating .dross/debug/", "if Create overwrites, TestCreateRefusesExisting fails: a second Create errors \"already exists\" naming the slug, and the existing file (including a resolved one) stays byte-identical", "if the ignore is not in place before the write, TestCreateIgnoredBeforeWrite fails: in a git repo after Create, `git status --porcelain` is empty and check-ignore succeeds; a `.gitignore` pre-created as a directory errors with no <slug>.md; a pre-existing `.gitignore` holding `!*` refuses naming it with no session written; outside a work tree Create succeeds and still writes `*`; the recorded gitrun argv carries `--`", "if Load mis-enumerates, TestLoad fails: no dir -> empty and nil; newest mtime first; skips .gitignore, .x.md.123.tmp, Bad Name.md, notes.txt, a name with an ESC byte and a directory d.md/; a chmod-000 session yields an entry with a Problem and its siblings are kept", "if Rewrite loses an update, TestRewrite fails: a file changed on disk since read errors and the newer bytes stay; success keeps the file mode and leaves no temp file", "if the writer is undeclared or not really ignored, TestMachineLocalWritersAreReallyIgnored (debug/<name>.md and debug/.gitignore via the DebugIgnoreSeed preparer), TestEveryDrossWriterIsDeclared or TestEveryFileConstIsDeclared fails; the pathfence unwrap and `..`-literal scans stay green; non-test debugsession files import no os/exec; store.go holds the coverfloor"]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 2
  title = "Compute close gates, header rewrite, rule command"
  files = ["internal/debugsession/close.go", "internal/debugsession/close_test.go"]
  description = "Pure. FixedCloseGaps names every missing part at once, and every Parse Problem is itself a gap; CloseText rewrites only the header status line and adds `closed:` (plus `reason:` when abandoned) — the abandon reason must be a single line (any \\n or \\r errors); RuleAddCommand drops comments and fenced blocks (Parse's emptiness rule), strips list markers, joins items with \"; \" and returns `dross rule add -- '<text>'` with POSIX single-quote escaping."
  covers = ["c-5", "c-6", "c-7"]
  depends_on = ["t-1"]
  test_contract = ["if a gap is missed or merged, TestFixedCloseGaps fails: (1 signal, empty Prevention) -> two gaps, Resolution \"1 of 2\" and Prevention; (1, prose) -> Resolution only; (2, empty) -> Prevention only; (2, Prevention = a literal `<!-- placeholder -->` comment fixture, not t-3's Template, or whitespace) -> Prevention; (2, prose) -> none; a missing `## Resolution` -> a gap naming the heading; signals inside a fence do not count", "if CloseText touches the body, TestCloseTextHeaderOnly fails: every byte from the first `## ` on equals the input; Parse(out).State() reads resolved or abandoned; an already-closed header and a missing status line each error", "if the abandon reason can inject structure, TestCloseTextReason fails: a reason containing \"\\n## Resolution\\n- x\" errors; an empty or whitespace-only reason errors", "if the quoting breaks, TestRuleAddCommandShellOracle fails: the line run under real /bin/sh -c with `dross` shadowed by a printf function yields argv exactly [rule add -- <flattened>] for a Prevention holding a single quote, a double quote, $(touch pwned), backticks, !, a backslash, a prose line starting `--` and a three-item list; no pwned file appears; the flattened text holds no newline", "if close.go drops below the floor, the CI coverfloor (>=50% own-package) fails", "if a multi-line abandon reason is accepted, TestCloseTextReason fails: a reason \"gave up\\nstatus: open\" errors, as does any reason containing \\r, and the input is returned unchanged", "if flattening keeps non-rule text, TestRuleAddFlatten fails: a placeholder `<!-- ... -->` comment plus `Always X` yields `Always X`; a fenced block is dropped; `- Always X` / `- Never Y` items yield `Always X; Never Y`", "if a malformed session can pass the --fixed gate, TestFixedCloseGaps fails: a duplicated `## Resolution` with one signal under each yields a gap naming the Problem and is never counted as 2 signals; every Parse Problem surfaces as a named gap"]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 3
  title = "Add `dross debug new|list|close` commands"
  files = ["internal/cmd/debug.go", "internal/cmd/debug_test.go", "cmd/dross/main.go", "cmd/dross/testdata/cli_tree.txt"]
  description = '''Thin cobra layer over debugsession (writes nothing itself), registered in newRoot with the cli_tree golden re-minted. new prints the path and `/dross-debug <slug>`; list prints slug, state, hypotheses, failed-since-replan, UTC mtime and indented Problems; close takes --fixed | --abandoned --reason and prints the rule line on --fixed only.'''
  covers = ["c-1", "c-2", "c-4", "c-5", "c-6", "c-7"]
  depends_on = ["t-3", "t-4"]
  test_contract = ["if new misbehaves end to end, TestDebugNew fails: in a temp dross+git repo it creates the seven headings and `status: open`; a second new errors; `new ../x` errors with nothing written outside .dross/debug", "if a session can ride a chore commit, TestDebugSessionNoChoreRide fails: after `debug new x`, autoCommitDrossDirt(repo, \"ship\") returns committed=false and HEAD is unchanged", "if list mislabels, TestDebugList fails: open / needs-replan (three [failed]) / resolved / abandoned fixtures each print exactly that state word and their counts; an os.Chtimes-pinned mtime renders UTC; swapping the hypothesis and failed columns fails; an empty dir prints the no-sessions line and exits 0", "if the --fixed gate leaks, TestDebugCloseFixedRefusal fails: one signal and an empty Prevention exits non-zero naming Resolution and Prevention, the file stays byte-identical, and a sentinel planted in Resolution is absent from the error", "if flag validation loosens, TestDebugCloseFlagMatrix fails: `--fixed --abandoned`, neither flag, `--fixed --reason r` and `--abandoned` without `--reason` each refuse naming the working form, file untouched", "if abandon demands the gates, TestDebugCloseAbandoned fails: `--abandoned --reason \"gave up\"` on a zero-signal session succeeds, the file stays on disk with an abandoned header, and no rule line is printed", "if close adds the rule or prints a broken one, TestDebugCloseFixedPrintsNeverAdds fails: a --fixed success prints exactly one `dross rule add ` line; project rules.toml and $HOME/.claude/dross/rules.toml stay byte-identical or absent; the line's sh-split argv fed to Rule() in a temp repo stores exactly the flattened Prevention, including a line starting `--`", "if unknown or closed sessions are mishandled, TestDebugCloseUnknownAndClosed fails: an unknown slug errors naming `dross debug list`; closing a resolved session refuses with the file untouched", "if an error lands in the telemetry 'other' bucket, TestDebugErrorsClassified fails: telemetry.ClassifyError is never \"other\" for invalid slug, already exists, unknown slug, gate gaps, already closed and a bad flag combination", "if the surface drifts, TestCLITreeGolden (three verbs and their flags), TestNarratedCommandsResolveAgainstTheTree or TestEveryDrossWriterIsDeclared fails", "if --fixed closes a malformed session or --abandoned is blocked by one, TestDebugCloseMalformed fails: --fixed on a duplicated-`## Resolution` session exits non-zero naming the Problem with the file byte-identical; --abandoned --reason on the same file succeeds", "if the scaffold template can pass the gate, TestDebugCloseFreshSessionRefused fails: `close --fixed` on a session just made by `debug new` exits non-zero naming both Resolution and Prevention, file byte-identical"]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 3
  title = "Name open sessions in status and reentry"
  files = ["internal/cmd/status.go", "internal/cmd/reentry.go", "internal/cmd/status_debug_test.go"]
  description = '''status prints one `debug:` line naming every open session (needs-replan labelled) with `/dross-debug <slug>`; reentryLine (not suggestNext) appends ` · debug: <slug> <state> — /dross-debug <slug>` for the newest open session plus "(+N more)". Narrates only the slash command; any debugsession error prints nothing and never fails.'''
  covers = ["c-2", "c-3", "c-4", "c-6"]
  depends_on = ["t-3", "t-4"]
  test_contract = [
    '''if a nudge appears with nothing open, TestStatusDebugNothingOpen fails: no dir, or only resolved/abandoned sessions -> no `debug:` line, status byte-identical to the no-dir run, and TestOutputGoldens/reentry unchanged''',
    '''if status splits or drops sessions, TestStatusDebugOneLine fails: two open sessions (one with three [failed]) and a runnable plan task -> exactly one line naming both, the second labelled needs-replan; appending `- [replan]` makes it read open''',
    '''if reentry omits the session, TestReentryNamesDebugSession fails: the envelope names the newer open session and `/dross-debug <slug>`; three open -> "+2 more"; needs-replan is labelled in the clause''',
    '''if a closed session lingers, TestDebugCloseDropsNudges fails: after CloseText + Rewrite (abandoned) neither status nor reentry names the slug, and the file still exists''',
    '''if status and the hook diverge, TestStatusDebugByteEqualReentry fails: with an open session, status's last line == systemMessage == additionalContext''',
    '''if the hook can break, TestDebugNudgeHookSafety fails: `.dross/debug` as a regular file, as a chmod-000 dir, and a session with its status line deleted or unrecognised -> status and reentry exit 0 with the rest intact and the session still named''',
    '''if pause or suggestNext shift, the `dross pause --auto` `- next:` line test or a TestReentryMatchesSuggestNext case fails''',
  ]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 4
  title = "Ship /dross-debug command and prompt"
  files = ["assets/commands/dross-debug.md", "assets/prompts/debug.md", "docs/interaction-audit.md", "docs/subagent-offload-audit.md", "internal/cmd/debug_prompt_test.go", "cmd/dross/main_test.go"]
  description = '''Interactive shim (AskUserQuestion) and prompt: pre-flight `dross rule show` + `dross interaction show`; the c-9 probe loop, BLOCKED hard stop, fix routing, independence and rule offer; clear-point footer to `/dross-debug <slug>`. Adds `### dross-debug` (✅) to interaction-audit and a `### debug` offload section. Run `make install` afterwards (r-01).'''
  covers = ["c-9"]
  depends_on = ["t-5"]
  test_contract = ["if a c-9 requirement is deleted, its named subtest in TestDebugPromptRequirements fails: one hypothesis per probe; evidence and verdict written to the session before the next probe (located in the probe-loop section); the tree returned after each probe to the pre-session snapshot of `git status --porcelain` plus `git diff HEAD | shasum -a 256`, both compared before and after every probe; `dross debug list` after every Fix-attempts entry, with needs-replan or any Problem -> BLOCKED on line one in pair AND solo; a confirmed fix routed to /dross-quick (standalone) or `dross task add` (mid-phase); /dross-debug never commits", "if a commit or destructive path creeps in, TestDebugPromptNoCommitPath fails: codeAdds(debug.md) is empty; no fenced `git commit`, `git reset --hard`, `git clean`, `git stash`, `git checkout -- .` or `dross rule add` line", "if the prompt and parser vocabularies drift, TestDebugPromptParity fails: every marker, heading and state word the prompt names equals debugsession's exported constants", "if session-edit discipline regresses, TestDebugPromptRequirements fails: Edit is required for session updates and a Write over an existing session is forbidden", "if close guidance regresses, TestDebugPromptRequirements fails: independence names repro gone, a red-before/green-after regression test, suite or CI green, and the landed-commit citation; the rule is offered in pair and listed in the solo wrap-up", "if session content can be published, TestDebugPromptRequirements fails: session content in a commit, PR body or board issue is forbidden, with the printed `dross rule add` named as the one sanctioned exit; Prevention must be a rule statement carrying no captured output, paths, hostnames or tokens", "if the prompt runs raw tests, TestDebugPromptRequirements fails: no raw `<runtime.test_command>` line; probes run tests through `dross test`", "if the prompt narrates a missing verb, TestDebugPromptCommandsExist (cmd/dross) fails on any `dross <verb> <sub>` in debug.md the command tree lacks, e.g. `dross debug resume`", "if classification breaks, TestCommandsPromptsParity, TestInteractionAuditEnumeratesEveryInteractiveCommand, TestInteractionCoverageFailClosed, TestSubagentOffloadAuditCoversEveryPrompt, TestFooterCoverageFailClosed or assets TestEmbedDrift fails: the prompt carries \"interaction playbook\" + `dross interaction show`, the audit section is ✅ with no ⬜/🟡/❌, and promptFooterState(root, \"debug\") == footerPresent"]
  status = "pending"

