task_seq = 7

[phase]
  id = "cmd-test-duration"

[[task]]
  id = "t-1"
  wave = 1
  title = "Secretscan per-rule prefilter; self-scan walks once"
  files = ["internal/secretscan/rules.go", "internal/secretscan/secretscan.go", "internal/secretscan/prefilter_test.go", "internal/cmd/secretscan_selfscan_test.go"]
  description = """
Each Rule gets an unexported needle set: any-of byte literals checked with bytes.Contains/Index
(assembly, so it escapes the ~20x -race tax the regex VM pays); the two (?i) rules
(authorization-header, key-context) also carry an ASCII-fold flag. scanLine runs a rule's regex
only when a pure, unexported `candidates(line)` bitmask sets that rule's bit. Fail-open: a rule
with no needles always runs its regex, and so does a fold rule on a line holding U+017F or U+212A
(those exact byte sequences, not "any non-ASCII" — em-dashes are common in .dross prose). No
package-level counter (forge and ship scan concurrently). Public API and hit set unchanged.
In internal/cmd/secretscan_selfscan_test.go the tracked-tree hit set is computed once per test
binary (sync.Once + a test-only walk counter): TestDrossTreeHasNoUnmarkedHits reads it, and
TestSelfScanIsNotVacuous scans only its planted file on top of it. Still the real tracked tree —
no fixture swap (coverage_preserved). internal/cmd tests gate on `dross test` (remote), never a
local full run. Root cause: a51ecdd (#128) added four whole-tree/.dross regex passes, ~74s each
under -race.
"""
  covers = ["c-1", "c-5"]
  test_contract = [
    "if a prefiltered scanLine differs from a reference loop that runs every regex on any seed — every hitCorpus() line, 500 randomLine() per rule, every benignCorpus() row, all-caps/mixed-case variants (`PASSWORD: …`, `AUTHORIZATION: BEARER …`) reaching the A/Z fold bounds, runtime-built U+017F/U+212A spellings, multi-rule, CRLF and allow-marker lines — or any regex match occurs with that rule's candidate bit clear, FuzzPrefilterMatchesRegex fails naming the rule (seeds run under plain go test); the mutants dropping `ASIA` from aws-access-key, dropping `token` from key-context, checking a (?i) rule against the un-folded line, and removing the U+017F/U+212A fallback each fail it",
    "if `paſſword = <hi-entropy>` or a Kelvin-sign `toKen: <hi-entropy>` (both built at runtime) stops yielding a key-context hit, TestUnicodeFoldBypass fails",
    "if candidates() returns a non-empty mask for a needle-free line (`func main() { fmt.Println(\"hi\") }`, plain TOML/markdown/Go) — the all-rules mutant that silently restores full cost — TestCandidatesPrunesNeedleFreeLines fails (benignCorpus rows are NOT asserted here: they legitimately carry needles)",
    "if a synthetic Rule with nil needles is not always a candidate, TestNoNeedlesFailsOpen fails; if any rule in Rules() has an empty needle set, TestEveryRuleHasNeedles fails naming the rule",
    "if the prefilter changes any verdict, one of the unedited TestEveryRuleHasAHitCase, TestBenignCorpusZeroHits, TestKeyContextIsKeyAware, TestCarveOutsAreNotVacuous, TestLongLineIsScannedToTheEnd, TestAllowMarkerSilencesOnlyItsLine or TestValidateOnDrossItself fails",
    "if the cached tracked-tree hit set is walked more than once per test binary, TestSelfScanWalksOnce fails (two calls to the cached helper, walk counter asserted == 1)",
    "if TestSelfScanIsNotVacuous's planted gitlab-pat file is not reported on top of the cached walk — remove its mustWrite and it must see 0 hits, not 1 — or the one hit is not gitlab-pat at the planted path, TestSelfScanIsNotVacuous fails",
    "if prefilter_test.go carries a literal credential shape instead of building it at runtime, TestDrossTreeHasNoUnmarkedHits fails with a hit in that file (pinnedMarkerSites needs no edit)",
    "[CI evidence] on the gate run's step summary, TestDrossTreeHasNoUnmarkedHits, TestSelfScanIsNotVacuous and TestValidateOnDrossItself are each ≤15s or absent from the top 20 (local -race before: ≈74s, 74s, 96s)",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Prefilter techdebt marker scan with needles"
  files = ["internal/techdebt/scan.go", "internal/techdebt/scan_test.go"]
  description = """
scanContent runs markerRe only on lines where a pure mayHaveMarker(line) finds TODO/FIXME/HACK/XXX
(strings.Contains). The needle gates the \\b regex, never replaces it; long-line and oversized-file
heuristics untouched. Worth ≈24–28s under -race across the three whole-tree passes in
internal/cmd/techdebt_selfscan_test.go. After t-1 and t-2, `make install` before verify/ship (r-01).
"""
  covers = ["c-1", "c-5"]
  test_contract = [
    "if prefiltered scanContent differs from regex-on-every-line on the corpus `TODOList` (needle, no \\b match), `xTODO`, `XXXX`, lowercase `todo`, a marker at end of line, CRLF, a marker at char 500 of a long line, binary content, `x := 1 // FIXME later`, `/* HACK */` and `XXX:`, TestScanPrefilterMatchesRegex fails",
    "if any of the four words is dropped from the needle list, TestScanPrefilterMatchesRegex and the existing TestScanMarkersMidLineAllKinds fail",
    "if mayHaveMarker returns true for `return nil` or any needle-free line (the always-true mutant) or false for any of TODO/FIXME/HACK/XXX, TestMayHaveMarker fails",
    "if the needle replaces rather than gates the \\b regex, the unedited TestScanMarkerWordBoundary fails",
    "[CI evidence] on the gate run's step summary, TestTechdebtSelfScanExcludesOwnPackage and TestTechdebtDrossTreeNoFixtureFindings are each ≤5s or absent from the top 20 (local -race before: ≈8–9.5s per whole-tree pass; the first test does two)",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Add go test -json reducer with verdict"
  files = ["cmd/testsummary/main.go", "cmd/testsummary/stream.go", "cmd/testsummary/stream_test.go", "cmd/testsummary/fixture_test.go"]
  description = """
Stdlib-only package main (goreleaser builds only ./cmd/dross). Reads a `go test -json` stream on
stdin with a long-line-tolerant reader and prints a plain go-test log: ok/FAIL per package, the
buffered output of failed tests, failed packages' package-level output (timeout panics included),
build errors. Passing tests' output is dropped; non-JSON lines pass through. Exits non-zero on any
fail event, an empty stream, or a stream with no package terminal event.
main is `os.Exit(run(stdin, stdout, getenv))`. The fixture harness writes a throwaway module from
INLINE sources into t.TempDir() (never tracked .go files — the audit sweeps walk cmd/ and fatal on
a parse error) and runs the real `go test -json ./...` once (sync.Once) with GOTOOLCHAIN=local,
GOWORK=off, GOPROXY=off.
"""
  covers = ["c-3"]
  test_contract = [
    "if, on a real-toolchain fixture with one passing and one failing test, the `--- FAIL` line or the t.Error text is missing from stdout, the passing test's t.Log or `=== RUN` lines appear, or the exit is not 1, TestReducerRealFailingModule fails",
    "if a real-toolchain fixture blocked past `-timeout 1s` does not put `panic: test timed out` and the running test's name on stdout with exit 1, TestReducerRealTimeout fails (shape is what go1.27.1's test2json emits, not a hand-written guess)",
    "if a real-toolchain fixture that fails to compile does not surface the compiler's file:line on stdout with exit 1, TestReducerRealBuildFailure fails",
    "if an all-pass stream does not exit 0, an empty stream does not exit non-zero printing `no test events`, or a stream cut mid-package does not flush its buffered output and exit non-zero, TestReducerVerdict fails",
    "if a 1 MiB single output line or a non-JSON line aborts the reader (a 64 KiB bufio.Scanner ceiling), TestReducerLongAndNonJSONLines fails",
    "if any non-test file in cmd/testsummary imports a path whose first element contains a dot, TestStdlibOnly fails (locked timing_tooling)",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Add PR-only cancel-in-progress concurrency group"
  files = [".github/workflows/ci.yml", "internal/cmd/ci_concurrency_test.go"]
  description = """
Before editing, audit ci.yml against ~/.claude/memory/reference_ci_supply_chain_hardening.md and
reference_ci_pipeline_optimisation.md (global CI hygiene rule) and surface findings. Add a
top-level block: group `ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}`,
cancel-in-progress `${{ github.event_name == 'pull_request' }}` — the run_id arm keeps main runs out
of any shared group (GitHub replaces a pending run in a shared group even without cancel-in-progress).
Add a pure line-based concurrencyProblems(workflow) checker plus a live sweep, reusing
splitYAMLComment (action_pins_test.go) and readRepoFile (release_signing_test.go) in the
TestSetupGoStepProblems shape.
"""
  covers = ["c-4"]
  test_contract = [
    "if concurrencyProblems does not flag each rejection branch from its own synthetic fixture — `cancel-in-progress: true`, a bare `${{ github.ref }}` group with no run_id arm, a group without the `ci-` prefix, job-level-only concurrency — or flags the correct block, TestConcurrencyProblems fails",
    "if ci.yml does not carry exactly one top-level (indent 0) concurrency block with zero problems and no job-level override, TestCIConcurrencyLive fails naming ci.yml (deleting the block turns it red)",
    "if the block moves an expression into a run: or adds a `uses:`, TestWorkflowsHaveNoExpressionsInRun or TestWorkflowActionsArePinned fails",
    "[CI evidence] on this phase's ship, `gh run list --branch phase/cmd-test-duration` shows every superseded pull_request run `cancelled` and only the newest completed; after merge, no main push run is `cancelled`",
  ]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 2
  title = "Render timing table and 300s budget warning"
  files = ["cmd/testsummary/table.go", "cmd/testsummary/table_test.go", "cmd/testsummary/main.go"]
  description = """
From t-3's reduced events: a markdown table of the 20 slowest top-level tests (package, test,
seconds, result) plus per-package totals, appended to $GITHUB_STEP_SUMMARY or printed to stdout
when it is unset (the c-5 laptop run). One `::warning` line per package over 300s. Neither the
table nor the warning changes the exit code (locked timeout_ceiling).
"""
  covers = ["c-3", "c-2", "c-5"]
  depends_on = ["t-3"]
  test_contract = [
    "if a 25-test, 2-package stream does not yield exactly 20 rows in descending Elapsed order with the 21st-slowest absent, or a subtest (`TestA/x`) takes a row, TestTableTop20 fails (kills the cap, sort-direction and subtest mutants)",
    "if a per-package total is the sum of its test rows rather than the package-level pass/fail event's Elapsed, TestPackageTotals fails",
    "if a package at 300.0s emits a warning, a package at 300.1s does not emit exactly one line starting `::warning` naming the package and its seconds, or an all-pass stream with a 301s package exits non-zero, TestBudgetWarning fails",
    "if the real timed-out fixture stream from t-3 no longer renders the table — package shown FAIL with its elapsed, the test running at timeout named, tests that passed before the panic still listed — TestTableRendersTimedOutRun fails",
    "if GITHUB_STEP_SUMMARY pointing at a file holding a line does not keep that line first (truncate instead of append), pointing at a directory does not emit a `::warning` while the exit code still equals the test verdict, or unset does not put the table on stdout, TestSummaryDestination fails",
    "[CI evidence] the run page's Summary tab renders both tables, and a package over 300s shows as a warning annotation",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 2
  title = "Pipe every CI go test through summarizer"
  files = [".github/workflows/ci.yml", "internal/cmd/ci_go_test_step_test.go"]
  description = """
Audit ci.yml first (global CI hygiene rule). Both go test steps (test job, mutation-ts) become
`set -o pipefail; go test <flags> -json <pkgs> | go run ./cmd/testsummary`. `-timeout 20m` STAYS in
this task (t-7 drops it after the gate). Add a goTestSteps(workflow) scanner and a
goTestStepProblems checker. No tee and no upload of the raw -json (locked timing_surface).
Depends on t-4 only because both edit ci.yml.
"""
  covers = ["c-3"]
  depends_on = ["t-3", "t-4"]
  test_contract = [
    "if goTestStepProblems, driven by synthetic YAML, does not flag by name a piped go test without `set -o pipefail` or `shell: bash`, a go test missing `-json`, a go test not piped into `./cmd/testsummary`, or — in the test job — `-short`, `-skip` or `-run`, or the loss of `-race`, `-count=1` or `./...`, TestGoTestStepProblems fails",
    "if a fixture holding a single-line `run: go test …`, a `run: |` block, a commented-out `# go test` and a `name: go test` does not yield exactly the two real invocations, TestGoTestStepScanner fails (non-vacuity)",
    "if the live sweep over .github/workflows/*.yml does not find exactly 2 go test invocations (test, mutation-ts) both clean, TestCIGoTestStepsLive fails — dropping the mutation-ts pipe or deleting cmd/testsummary/main.go turns it red",
    "if a `tee` or an upload-artifact step carries the -json stream, TestCIGoTestStepsLive fails",
    "if the summary path reaches the tool as `${{ }}` inside run: instead of the env var $GITHUB_STEP_SUMMARY, TestWorkflowsHaveNoExpressionsInRun fails; TestToolchainSingleSource, TestWorkflowActionsArePinned and TestCIShellcheckCoversScripts stay green unedited",
    "[CI evidence] on the draft-PR run, the Summary tab shows the top-20 table and package totals for both jobs, and the step log shows `ok …/internal/cmd Ns`, not raw JSON",
  ]
  status = "pending"

