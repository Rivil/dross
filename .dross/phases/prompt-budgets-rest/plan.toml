  covers = ["c-2", "c-3"]
  test_contract = ["if a new key's common value fetches, TestCommonPathFetchesNothing fails: synthetic panel=off, auto=off, ci=passed, ship_result=clean, target=given, spec_file=absent, deferral=none, lanes=unchanged and remote=unchanged fetch lines are each rejected as common path", "if a key's values are reordered (e.g. lanes → {editing, unchanged}), TestCommonPathVocabularyPinned fails: CommonPath() must equal the pinned map (mode:pair, preflight:ok, …, panel:off, ci:passed, ship_result:clean, lanes:unchanged, …)", "if a flow's landmark leaves its base prompt, TestCommonPathInline (raw, via assets.FS) fails naming the file and the needle; every needle is an exact literal, including ship's `All checks passed on PR #N. Merge now?`", "if the identity check targets a split prompt, TestExpandIdentity fails: it asserts FetchPoints(techdebt.md) is empty before comparing bytes", "if a partial copies text instead of moving it, TestPartialTextMovedNotCopied fails: any partial line of 40+ chars also present verbatim in its base prompt", "if an inlined partial's `## ` heading lands above remaining base text of the fetch line's section, TestPartialSectionsStayWhole fails (synthetic MapFS)"]
