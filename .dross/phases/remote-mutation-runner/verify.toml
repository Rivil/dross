[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["internal/remote/remote_test.go:TestSyncArgsCarriesTheLockedFlags", "internal/mutation/launcher_test.go:TestStrykerNetRemoteRunClearsTheWholeOutputTree", "internal/mutation/launcher_test.go:TestRemoteReportDirIsCreatedInTheSameCommandAsTheRm", "internal/mutation/remote_failure_test.go:TestRemoteRunClearsYesterdaysLocalReport", "internal/mutation/launcher_test.go:TestRemoteRunCreatesTheReportDirectory"]
