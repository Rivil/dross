[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/mutation/remote_failure_test.go:TestRemoteToolExitCodesAreClassifiedDistinctly", "internal/mutation/remote_failure_test.go:TestRemoteTransportFailureNeverDegradesToLocal", "internal/mutation/remote_failure_test.go:TestRemotePushFailureIsFatalAndSpawnsNothing", "internal/mutation/remote_failure_test.go:TestRemoteFetchFailureSplitsPartialFromTransport", "internal/mutation/remote_failure_test.go:TestRemoteReportlessFailureIsNotASkip", "internal/verify/verify_test.go:TestRemoteTransportFailureIsBlocking"]
  notes = "The three exit classes are asserted together because each alone is satisfiable by a rule that gets the other two wrong, and the exits come from real subprocesses so a wrong read of ExitError cannot pass. TestRemoteReportlessFailureIsNotASkip was added during this phase after a live run found the remaining hole: non-zero exit WITH no report was filed as UnmeasuredMissing and printed as 'gathered no covered mutants', which is the empty-report-that-reads-as-clean this criterion forbids."

