  status = "covered"
  tests = ["internal/mutation/remote_env_test.go:TestEnvValuesRoundTripThroughARealShell", "internal/mutation/remote_env_test.go:TestNoEnvValueEverReachesArgv", "internal/mutation/remote_env_test.go:TestNothingIsWrittenToTheRemoteFilesystemToCarryEnv", "internal/mutation/remote_env_test.go:TestUnsafeEnvNameIsRefusedBeforeAnyCommand", "internal/cmd/local_test.go:TestRemoteEnvRefusesAnUnsetName"]
  notes = "The quoting guarantee is EXECUTED rather than reasoned about: the generated script is run by /bin/sh and the observed value compared byte for byte, across values carrying $( , backticks, quotes, newlines and empty. The process-list and filesystem claims are asserted on the recorded argv and script rather than by reading the builder, so a future caller that interpolates a value cannot pass."

[[criterion]]
