  tests = ["internal/mutation/launcher_test.go:TestGremlinsRemoteRunOrderAndArgv", "internal/mutation/launcher_test.go:TestGremlinsRemotePushesOnceAndFetchesPerPackage", "internal/mutation/launcher_test.go:TestStrykerRemoteRunCdsIntoTheJoinedWorkdir", "internal/mutation/launcher_test.go:TestRemoteNilSpawnsNothingThroughTheLauncherSeam", "internal/remote/remote_test.go:TestSSHArgsNeverSpawnsTheAdapterLocally"]
