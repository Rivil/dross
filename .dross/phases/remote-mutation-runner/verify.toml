  status = "covered"
  tests = ["internal/cmd/options_docs_test.go:TestOptionsCoversEveryLocalKey", "internal/cmd/options_docs_test.go:TestOptionsCoversTheConsentVerbs", "internal/cmd/options_docs_test.go:TestOptionsCoversEveryProjectSection", "internal/cmd/options_docs_test.go:TestOptionsCoversTheProviderConditionalRemoteFields", "internal/cmd/options_docs_test.go:TestOptionsSaysMutationIsNotSettableThroughProjectSet"]
  notes = "TestOptionsCoversEveryLocalKey walks localKeys itself rather than a typed list, so a key added to the store without a prompt line fails the build. The consent test asserts both directions — the verbs are named, AND the prompt is forbidden from telling the user to write a grant key through `dross local set`, which would invert the consent_model decision. It caught a real gap on first run: the prompt described the grant verb without ever naming mutation_remote_host."

