[[criterion]]
  id = "c-7"
  status = "covered"
  tests = ["internal/mutation/restore_test.go:TestStrykerRemoteRestoreUsesTheProjectsOwnPackageManager", "internal/mutation/restore_test.go:TestStrykerRemoteRestoreRejectsTheLooseForms", "internal/mutation/restore_test.go:TestStrykerRemoteRefusesAnUnsetPackageManager", "internal/mutation/restore_test.go:TestStrykerRemoteRefusesAnUnknownPackageManager", "internal/mutation/restore_test.go:TestGremlinsRemoteIssuesNoRestore", "internal/mutation/restore_test.go:TestRemoteRestoreTableIsClosed"]
  notes = "Each manager's restore is pinned as an EXACT argv and asserted to precede the tool, and the loose forms are rejected from the other side so a lockfile-ignoring install cannot creep back. Unset and unknown are both refusals that name the setting or the value rather than guessing npm, and a Go run is asserted to issue no install at all."

