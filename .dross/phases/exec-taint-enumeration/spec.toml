[[deferred]]
  id = "3d561e984ebf0d4e"
  text = "Before `dross verify` (attached or --detach) dispatches a mutation leg, print the packages it will mutate, the mutant-site count per package (go/ast for gremlins; Stryker's own count where available) and an ETA from per-package throughput recorded on earlier runs on that host, with the basis stated. Record actual per-package durations after each run so the next estimate improves."
