  wave = 4
  title = "Carry taint across returns, fields, writers"
  files = ["internal/cmd/taint_flow_test.go", "internal/cmd/taint_engine_test.go", "internal/cmd/testdata/taint/channels_return.go.txt", "internal/cmd/testdata/taint/channels_field.go.txt", "internal/cmd/testdata/taint/channels_writer.go.txt"]
  description = "Context-sensitive summaries (param->result, param->field, param->writer-param), applied per call site,\nreplace t-5's fail-closed return. Field taint keyed by field. Reverse referent closure through\nMakeInterface, ChangeType, Phi, field loads, transform constructors and params. A tainted Write\nreceiver makes its []byte parameter a source.\nOn landing: run the exec policy over the live set once and record per-file findings (with origin) in\nthe task notes. Any finding whose origin no burn-down (t-14..t-19, t-22) owns gets `dross task add`\nbefore wave 5."
  covers = ["c-2"]
  depends_on = ["t-5"]
  test_contract = ["if taint stops at a return, channels_return's a.Rev() returning TrimSpace(string(out)) fed to b's errors.New(a.Rev()) fails to trip at b's line; a caller that only prints Rev() to os.Stderr must stay clean", "if summaries are context-insensitive, helper norm(s) called with output at site A and a literal at site B trips at both consumers; only A's must trip", "if field taint is whole-struct, channels_field's store to res.Other then read of res.Log trips; output stored in Result.Log by one function and read into Errorf by another must trip", "if writer taint is lost or over-broad, channels_writer's Run(w){c.Stdout = w; c.Run()} with a &strings.Builder then errors.New(b.String()) fails to trip, or the os.Stderr / options-struct cmd.OutOrStdout() variants trip; a writer param with no caller must be an escape; a package `var out io.Writer = os.Stderr` never reassigned is terminal, reassigned to a builder trips", "if helper wrapping hides taint, a toStr(b) conversion helper feeding Errorf fails to trip; with io.MultiWriter(os.Stderr, head), head.buf.String() into Errorf must trip while a head leaving only via printHead(os.Stderr, …) stays clean", "if an SSA edge kind is unhandled, a closure capture, a generic id[T], or a chan string between goroutines (hold.go's shape) fails to carry taint to a tripping Errorf; a two-function recursion must reach its fixpoint with its one finding"]
  status = "done"

