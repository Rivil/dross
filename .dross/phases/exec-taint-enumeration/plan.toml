[[task]]
  id = "t-5"
  wave = 3
  depends_on = ["t-3"]
  title = "Taint sources, in-function flow, sink classes"
  files = ["internal/cmd/taint_engine_test.go", "internal/cmd/testdata/taint/sources.go.txt", "internal/cmd/testdata/taint/sinks.go.txt"]
  description = '''
An engine parameterized by source/sink/clear predicates (t-12 reuses it). Exec sources matched by
types.Func/Var identity: Output/CombinedOutput results, StdoutPipe/StderrPipe reads, ExitError.Stderr
reads, referents stored into Cmd.Stdout/Stderr (taint_sources lock: every spawn, no binary classed
safe). External calls: numeric/bool result clears (clearance_model lock); any other result, error
included, stays tainted; reverse taint only into a fixed stdlib transform-package set; any other
external callee receiving taint is an escape. Terminal = os.Stdout/os.Stderr and cobra
OutOrStdout/ErrOrStderr; an error is never terminal (terminal_definition lock). A tainted return is a
fail-closed escape until t-9. Exposes a clearAt(pos) hook. Findings carry escape position + origin set.
'''
  covers = ["c-1", "c-7"]
  test_contract = [
    '''if a source kind is missed, sources.go.txt's Output, CombinedOutput, StdoutPipe/StderrPipe reads, ExitError.Stderr read after errors.As, and &bytes.Buffer on Cmd.Stdout each fail to reach errors.New with exactly one WANT finding; os/exec imported as `x` and an embedded *exec.Cmd's promoted Output() must trip identically''',
    '''if sources are matched by name, a local type with its own Output() trips; `_, err := c.Output(); fmt.Errorf("git: %w", err)` must also stay clean (ExitError renders only "exit status N")''',
    '''if the clearance model is wrong, strconv.Atoi(out)'s int into Errorf or its error compared to nil trips, or the error wrapped with %w fails to trip at the wrap line; Contains/HasPrefix/==/len must clear and TrimSpace/Split/Fields/Sprintf must stay tainted''',
    '''if terminal classification is wrong, Fprintln(os.Stderr, out) or Fprint(cmd.ErrOrStderr(), out) trips, or Fprint(&b, out) into a strings.Builder then errors.New(b.String()) fails to trip''',
    '''if unknown externals default to allow (a results-only rule), os.WriteFile(p, out, 0o600) and os.Setenv(k, tainted) fail to trip''',
    '''if the recorder is treated as a blanket sink, RecordToolFailure with a tainted `tool` argument fails to trip; Observed(len(out)) must stay clean''',
    '''if the verdict sees the binary, fixtures differing only in "git" vs "cargo" give different findings (the finding struct must have no binary field); a transform-set package that is the callee package of no corpus line fails, named''',
  ]
  status = "pending"

