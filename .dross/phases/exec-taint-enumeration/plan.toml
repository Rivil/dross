[[task]]
  id = "t-1"
  wave = 1
  title = "Load the module once for source scans"
  files = ["go.mod", "go.sum", "internal/cmd/srcprog_test.go", "internal/cmd/hermetic_env_test.go"]
  description = "One sync.Once packages.Load(\"./...\") from the repo root (srcprog_test.go, new): Tests:false; syntax +\ntypes for module packages, export data for deps; Config.Env snapshotted with HOME=ambientHome so the\nloader uses the real go caches, not TestMain's throwaway HOME; any package error is fatal. SSA bodies\nbuilt for module packages only, plus one VTA call graph seeded from CHA. golang.org/x/tools is\nimported from _test.go files only (loader_mechanism lock).\nGate before t-5: measure load+SSA+VTA under -race on the remote runner (`dross test` — local runs on\nthis laptop are unreliable) and record it in the commit body. Over 10s, narrow which SSA bodies /\nVTA scope get built first — never the loaded package set (c-5).\n"
  covers = ["c-8"]
  test_contract = ["if a second loader appears (a second Once, or a helper bypassing it), TestMain exits with \"source program loaded 2 times\"; TestOnePackagesLoadCallSite's AST walk of internal/cmd/*_test.go finds exactly one packages.Load and names any other's file:line", "if the loader inherits os.Environ() instead of the ambient go caches, TestSharedLoadUsesAmbientGoCaches fails: Config.Env GOCACHE/GOMODCACHE must equal `go env` under ambientHome and neither may sit under TestMain's HOME; with GOPROXY=off the load must still succeed", "if loadErrors() swallows a package error, feeding it a synthetic package with one TypeError fails to return an error naming that import path; the live load must have zero Errors/TypeErrors and every package must carry Types, TypesInfo and Syntax", "if SSA bodies are built for dependencies (the dominant -race cost), the check that no *ssa.Function with non-nil Blocks lies outside github.com/Rivil/dross fails", "if golang.org/x/tools/... enters cmd/dross's import closure or any non-test file imports it, the import-closure test fails; `go mod tidy -diff` must exit 0 (CI's tidy gate)", "if a _test.go file enters the load, the check that no CompiledGoFiles entry ends in _test.go fails"]
  status = "done"

