[phase]
  id = "ci-timing-trend"

[[task]]
  id = "t-1"
  wave = 1
  title = "Add timing history store and trend math"
  files = ["cmd/testsummary/history.go", "cmd/testsummary/history_test.go"]
  description = "New history.go, stdlib-only (TestStdlibOnly). A JSON history: ordered entries {sha, packages: {pkg: seconds}}, window 20; every entry is a main run (only main saves). loadHistory(path) → history + at most one note string for a missing, empty or unparseable file (never an error that reaches the exit code). upsert(sha, totals) replaces an entry with the same sha in place, else appends and trims to the newest 20. saveHistory(path). baseline(pkg, excludeSHA) = median of the package's seconds across the window, skipping the entry for excludeSHA; ok=false when absent (decision baseline). trend(pkg, excludeSHA) per decision trend_rule: take the last 10 entries (after dropping excludeSHA), keep the points where the package is present, need >= 5; x = 0..k-1 in history order; least-squares fit; warn only when slope > 0 AND the fit at x = (k-1)+10 is >= 540. Totals recorded = packages ending pass or fail with elapsed > 0; a skip (no test files) package is not recorded."
  covers = ["c-1", "c-3", "c-5", "c-6"]
  test_contract = ["loadHistory on a missing path, a zero-byte file and a file of invalid JSON each returns an empty history and exactly one note — a second note, an error return or a panic fails it", "upsert of the same sha twice leaves one entry holding the second call's totals, at the original position; a different sha appends (c-6)", "a 21st distinct sha evicts the oldest entry — len stays 20 and the first sha is gone", "saveHistory then loadHistory round-trips entries and order equal", "baseline is the median: odd count returns the middle value, even count the mean of the middle two, one outlier does not move it; a package absent from every entry returns ok=false; the excludeSHA entry never contributes", "trend with 4 rising points returns no warning; with 5+ flat or falling points returns none", "a flat history at 545s and one falling from 600s to 545s both return no trend warning — slope <= 0 never warns even when the line sits above 540", "a rising series whose fit at x=(k-1)+10 is exactly 540.0 warns; one whose fit there is 539.x does not (boundary); a projection at (k-1)+9 or (k-1)+11 instead fails one of the two", "trend uses only the last 10 entries: a steep rise confined to entries 1-10 of a 20-entry window, followed by 10 flat entries, does not warn", "an entry matching excludeSHA is dropped before the last-10 window is taken: a history whose newest entry is that sha computes the trend over the 10 entries before it", "a skip-action package and a package with elapsed 0 are not recorded into the entry; pass and fail packages are"]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 2
  title = "Add cap/trend warnings, baseline column, history wiring"
  files = ["cmd/testsummary/table.go", "cmd/testsummary/table_test.go", "cmd/testsummary/main.go", "cmd/testsummary/main_test.go"]
  description = "table.go: capSeconds = 600 constant (decision cap_source); a `::warning title=test cap::` per package with elapsed >= 90% of the cap (540s) naming the package, its seconds and the cap; a separate `::warning title=test trend::` for a package under 540s whose history trend warns. The 300s budget warning is untouched. Package totals table gains Baseline and Delta columns ('—' and empty delta when the package has no history). main.go run(): history is on only when TESTSUMMARY_HISTORY is set — load it (a degraded load prints its one note line), compute warnings and the table from the history as loaded with the current GITHUB_SHA's entry excluded (so a re-run of the same commit never compares against itself), then upsert this run's totals under GITHUB_SHA and save. Unset → no read, no write, no note, baseline '—' everywhere. The exit code stays the test verdict. Update main.go's doc comment."
  covers = ["c-2", "c-3", "c-4", "c-5"]
  test_contract = ["a package at exactly 540.0s draws one cap ::warning naming the package, '540.0' and the 600s cap; 539.9s draws no cap warning (boundary)", "a 541s package draws both the cap warning and the 300s budget warning, and the budget warning text is byte-identical to today's (existing TestBudgetWarning stays green)", "a package >= 540s whose history also trends upward draws the cap warning and no trend warning; the same history under a 400s package draws the trend warning", "the Package totals header is | Package | Seconds | Baseline | Delta | Result |; a package with history shows its median and a signed delta, one absent from history shows '—' and an empty delta", "run() with TESTSUMMARY_HISTORY pointing at a missing file: exit code matches the verdict, stdout carries exactly one note line, no trend warning, and the file now exists holding this run's totals under GITHUB_SHA", "run() with a corrupt history file: one note line, no trend warning, exit code unchanged versus the same stream with no history (c-5)", "run() run twice with the same GITHUB_SHA leaves one entry in the saved file (c-6 end to end)", "run() with TESTSUMMARY_HISTORY unset writes no file and prints no note line", "a failing stream with a history that would warn still exits 1, and a passing stream with cap + trend warnings still exits 0 — warnings never change the exit code", "run() with a history whose newest entry is this GITHUB_SHA (a re-run): the baseline and trend ignore that entry — a self-entry at 1000s neither moves the baseline nor triggers a trend warning — and the saved file still holds one entry for the sha"]
  depends_on = ["t-1"]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 3
  title = "Wire timing cache into CI with guard test"
  files = [".github/workflows/ci.yml", "internal/cmd/ci_timing_cache_test.go", "internal/cmd/ci_go_test_step_test.go", "ARCHITECTURE.md"]
  description = "Supply-chain audit is a deliverable, not a silent step: audit ci.yml against the CI supply-chain hardening checklist (global CI-hygiene rule) first; the task report lists each checklist item checked and its outcome, and any finding is raised as a question before the edit. Test job: an actions/cache/restore step (SHA-pinned, `# vX.Y.Z` comment) before `go test`, key test-timing-${{ github.sha }}, restore-keys test-timing-; the go test step gains env TESTSUMMARY_HISTORY at a path under ${{ runner.temp }} (never a literal $RUNNER_TEMP inside env:/with:, which is not shell-expanded); an actions/cache/save step after go test, `if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1`, same path and key (decision history_store; a re-run would collide with the immutable key). Only the test job's go test carries TESTSUMMARY_HISTORY; mutation-ts does not. Extend the shared workflowSteps scanner in ci_go_test_step_test.go to record a step's with:, env: and if: (TestGoTestStepScanner keeps pinning it); the new guard is a pure checker plus a live sweep of ci.yml. ARCHITECTURE.md: the CI/testsummary entries gain the history, cap and trend behaviour with current file:line refs."
  covers = ["c-1", "c-6"]
  test_contract = ["TestCITimingCacheLive fails if the test job has no actions/cache/restore step before go test, or its key is not test-timing-${{ github.sha }} with restore-key test-timing-", "it fails if the save step is missing, runs before go test, lacks always(), is not gated to a push on refs/heads/main, or lacks the run_attempt == 1 arm", "it fails if the go test step's TESTSUMMARY_HISTORY does not equal the restore and save steps' path, or if any of the three spells the path with a literal $RUNNER_TEMP", "it fails if any go test outside the test job (mutation-ts) carries TESTSUMMARY_HISTORY", "the checker run against synthetic workflows reports each of those breaks separately and passes the wired fixture — the live sweep cannot go green by matching nothing", "TestGoTestStepScanner's fixture gains a step with with:/env:/if: and asserts the extended workflowSteps records each field — a scanner that drops one fails it", "TestWorkflowActionsArePinned rejects the new cache steps if either is unpinned or lacks a three-part version comment", "TestCIGoTestStepsLive and TestCoverFloorIsWiredIntoCI stay green with the new steps around go test", "dross architecture check reports no moved or unresolved link for the updated testsummary and CI entries"]
  depends_on = ["t-2"]
  status = "pending"
