task_seq = 7

[phase]
  id = "red-proof-repoint"

[[task]]
  id = "t-1"
  wave = 1
  title = "Rewrite the pinned SHA byte-faithfully"
  files = ["internal/cmd/redproof_doc.go", "internal/cmd/redproof_doc_test.go"]
  description = """
redProofRewriteDoc(body, oldSHA, newSHA) -> (newBody, count, err). Replaces every literal
occurrence of the OLD pin — full form or any >=7-char prefix of it — with the new SHA
truncated to the same width, per the locked doc_rewrite_scope decision. Nothing else in the
doc moves. count == 0 is an error value, never a silent success.
"""
  covers = ["c-6", "c-2"]
  test_contract = [
    "if the rewriter touches any byte outside the pin, TestRewriteDocByteFaithful fails — it rewrites a COPY of fixtures/hostile-config-c5/RUN.md keyed to whatever pin the copy carries (never the literal a6ef7295, which this phase's own first repoint rewrites) and asserts output == input with only the three pin spans substituted: the `BASE=` line, the `base commit:` line, and the `git worktree add --detach` recipe",
    "if the rewriter keys on \"any 40-hex run\" instead of the old pin's value, TestRewriteDocLeavesUnrelatedSHA fails — the second, unrelated SHA the same RUN.md copy carries comes back changed",
    "if prefix matching is loosened below full-prefix equality, TestRewriteDocNearMissPrefix fails — a hex run sharing the pin's first 6 chars but diverging at char 7 is asserted untouched",
    "if an abbreviated occurrence is expanded to the full SHA, TestRewriteDocPreservesWidth fails — table-driven over synthetic widths 7/8/12/40, a 7-char occurrence must come back 7 chars wide",
    "if a doc with zero occurrences returns a nil error, TestRewriteDocNoOccurrence fails — it asserts count 0 and an error naming the doc, so a caller cannot report a rewrite that did not happen",
    "if the rewritten bytes no longer satisfy the cross-check this function exists for, TestRewriteDocReparses fails — redProofSHA(newBody) is asserted to return the new SHA",
    "if the live fixture stops being rewritable at all, TestRewriteDocLiveFixtureRoundTrips fails — it reads the real RUN.md, rewrites whatever pin redProofSHA finds in it to a synthetic SHA and back, and asserts the round-trip is byte-identical without naming any SHA value",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 2
  title = "Plan and apply a repoint (no cobra)"
  files = ["internal/cmd/redproof_repoint.go", "internal/cmd/redproof_repoint_test.go"]
  description = """
planRedProofRepoint(root, repoDir, pin, excludedRefs) -> plan{verdict, oldSHA, newSHA,
files, why} over classifyReachability plus a NON-CACHING fork-point read;
applyRedProofRepoint(plan) writes the doc first, the changes.json pin second, and rolls
back on a half-write. Callable from both the verb (t-5) and the ship hook (t-6) without
re-entering cobra. excludedRefs is threaded from here so t-6 can name a ref that is about
to die; the verb passes none.
"""
  covers = ["c-2", "c-3", "c-4", "c-5"]
  depends_on = ["t-1"]
  test_contract = [
    "if a sound pin can be repointed at the decision layer, TestPlanSoundPinNothingToDo fails — a reachable pin must yield nothing-to-do carrying NO target, and a plan+apply run over it leaves changes.json and the doc byte-identical (asserted by hash)",
    "if an indeterminate verdict is folded into rotted, TestPlanIndeterminateIsNotRotted fails — a shallow clone and, separately, a repo with no refs/remotes/origin/* refs both yield nothing-to-do carrying the indeterminate reason, so shallow CI clones are never rewritten",
    "if a target the reachability check does not call reachable can be written, TestPlanRefusesUnreachableTarget fails — plan refuses naming the fork point and carrying classifyReachability's own why-string, and neither file is written",
    "if an unresolvable fork point degrades to a blank SHA, TestPlanRefusesUnresolvableForkPoint fails — a phase with no base and no base_commit must produce an error naming the phase, never a proposed \"\"",
    "if the planning path calls the caching phaseForkPoint (forkpoint.go:47-50 sets BaseCommit and Save()s it), TestPlanDoesNotCacheForkPoint fails — planning for a phase whose changes.json carries no base_commit must leave that file byte-identical",
    "if the plan understates what it touches, TestPlanFilesExact fails — the files list is asserted as a set equal to [.dross/phases/<id>/changes.json, pin.Doc]",
    "if a half-repair can survive, TestApplyRollsBack fails — with the doc unwritable (chmod 0444) apply errors and changes.json still pins the OLD sha; with the record made read-only after a successful doc write, the doc is restored to its original bytes and the error names both files",
    "if excluded refs are ignored, TestPlanExcludedRef fails — a pin contained ONLY by refs/remotes/origin/phase/<id> classifies unreachable when that ref is excluded and reachable when it is not",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Record a replay command on the pin"
  files = ["internal/changes/changes.go", "internal/cmd/redproof_set.go", "internal/cmd/redproof_set_test.go"]
  description = """
changes.RedProof (changes.go:68) gains Replay string `json:"replay,omitempty"`, and
`dross phase red-proof set` gains an optional --replay carrying the command that replays
the proof. Recording only — t-4 runs it.
"""
  covers = ["c-8"]
  test_contract = [
    "if Replay stops round-tripping, TestRedProofSetRecordsReplay fails — `red-proof set <id> --sha X --doc D --replay \"go test ./x\"` must read back through changes.Load with the command intact",
    "if a later set without --replay silently blanks a recorded command, TestRedProofSetPreservesReplay fails — the behaviour is asserted either way (preserve or refuse), never a silent drop",
    "if the new field is made required, TestRedProofLegacyRecordLoads fails — the live config-trust-hardening record, written before the field existed, must load with Replay == \"\" and re-save byte-identically apart from the fields set",
    "if a blank --replay is stored, TestRedProofSetRejectsEmptyReplay fails — an empty or whitespace command reads as \"recorded\" to t-5's verified/unverified split and would be spawned as nothing",
    "if a --replay beginning with \"-\" reaches the record, TestRedProofSetRejectsLeadingDash fails — argfence.RejectLeadingDash must refuse before changes.json is written (sh honours no end-of-options token), leaving the file byte-identical",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Run a recorded replay red, consent-gated"
  files = ["internal/cmd/redproof_replay.go", "internal/cmd/test.go", "internal/cmd/trust.go", "internal/cmd/local.go", "internal/cmd/redproof_replay_test.go"]
  description = """
runRedProofReplay(repoDir, sha, line) adds a detached worktree at sha, runs line through
the shArgv/spawnLocal seam with the worktree as cwd, removes the worktree, and returns
red/green plus the captured tail. spawnLocal (test.go:78 -> runLocalCommand, :88) is
contextless today, so this task adds the exec.CommandContext variant the timeout needs.
Refuses to spawn unless sha256(line) matches a fingerprint in local.toml's new
trusted_replay_commands (gitignored, absent from localKeys), granted through the existing
Trust() verb in trust.go — mirroring TrustedTestCommand (local.go:78, trust.go:127),
because changes.json is tracked and spawning what it records is code execution on clone.
Trust() is cobra.NoArgs today and grants runtime.test_command; a replay line belongs to one
phase, so the grant arrives as `dross trust --replay <phase-id>` — a flag, leaving the
existing no-args test-command grant path untouched.
"""
  covers = ["c-8"]
  test_contract = [
    "if the consent gate can be bypassed, TestReplayRefusesUnconsented fails — an ungranted line is refused with the grant command named, and the replaced spawn seam records ZERO invocations",
    "if red and green collapse into one return, TestReplayRedVsGreen fails — a consented line exiting non-zero returns red=true and one exiting 0 returns red=false with the tail; any non-zero exit counts as red and the exit code is reported",
    "if the replay runs against the working tree instead of the proposed commit, TestReplayRunsAtProposedCommit fails — the fake spawn seam asserts cwd is a directory outside the repo working tree whose `git rev-parse HEAD` is the proposed sha",
    "if a worktree survives any exit path, TestReplayCleansWorktree fails — green, red, spawn error and timeout are each asserted to leave `git worktree list` carrying no entry and the temp dir absent",
    "if a hung replay is reported as red, TestReplayTimeoutIsRefusal fails — a timeout must be killed and treated as a refusal, never as evidence the proof went red",
    "if the `git worktree add --detach <sha>` call passes the SHA outside git's end-of-options token, subprocargs_audit_test flags it",
    "if the grant path stops printing before it trusts, TestTrustGrantsReplayCommand fails — `dross trust --replay <phase-id>` must show the replay line it is about to fingerprint, then write it, and a subsequent runRedProofReplay of that line spawns",
    "if the new flag disturbs the existing grant, TestTrustTestCommandUnchanged fails — bare `dross trust` still fingerprints runtime.test_command and still refuses extra positionals",
    "if trusted_replay_commands leaks into the shared key surface, TestReplayTrustNotInLocalKeys fails — the key is asserted absent from localKeys (local.go:143) and its file gitignored, so a consent grant can never be committed",
    "if the spawn seam loses its kill path, TestSpawnLocalCtxCancels fails — the new context variant in test.go must terminate a command that outlives its deadline, and the existing spawnLocal callers keep their current signature behaviour",
  ]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 3
  title = "Add `dross phase red-proof repoint`"
  files = ["internal/cmd/redproof_repoint_cmd.go", "internal/cmd/redproof_set.go", "internal/cmd/redproof_repoint_cmd_test.go"]
  description = """
Cobra sibling of `red-proof set` on the existing phaseRedProof() tree (locked
repoint_surface): bare form scans discoverRedProofPins (redproof.go:119), an optional
<phase-id> narrows it to one (locked repoint_target_selection). Dry-run by default,
--apply writes. Wires t-2's plan/apply, t-1's rewrite and t-4's replay gate, printing the
per-pin outcome. Passes no excluded refs; does not commit (locked repoint_commit).
"""
  covers = ["c-1", "c-2", "c-3", "c-4", "c-5", "c-8"]
  depends_on = ["t-1", "t-2", "t-3", "t-4"]
  test_contract = [
    "if dry-run writes anything, TestRepointDryRunWritesNothing fails — on a rotted pin stdout names the old SHA, the proposed SHA and BOTH file paths, and afterwards changes.json and the doc are byte-identical by hash, including no base_commit cache write",
    "if the repair does not actually clear doctor, TestRepointClearsDoctor fails — in a fixture where the pin's commit lives only on a deleted branch, one `repoint --apply` then redProofChecks (doctor.go:500) must return no issue line for that phase, with no file touched by hand",
    "if a repoint trades one issue for another, TestRepointUpdatesDoc fails — after --apply, redProofDocSHA(doc) must equal the newly recorded SHA",
    "if the verb can write an unreachable target, TestRepointRefusesUnreachable fails — it exits non-zero with the reason and writes neither file",
    "if a sound pin is rewritten, TestRepointSoundPinNoOp fails — a repo whose only pin is sound prints nothing-to-do, exits 0 and leaves both files byte-identical even under --apply",
    "if the blanket scan touches sound phases, TestRepointBlanketScopes fails — over two phases (one rotted, one sound), `repoint --apply` repairs only the rotted one and the sound phase's changes.json is byte-identical",
    "if a refusal aborts the blanket run, TestRepointBlanketContinuesPastRefusal fails — over three rotted pins whose middle one refuses, the other two are still repaired and the run exits non-zero",
    "if a recorded replay that goes GREEN is accepted, TestRepointRefusesGreenReplay fails — the repoint is refused, output says the proof did not go red at the proposed commit, and both files are unchanged",
    "if an unrecorded replay is implied to have been checked, TestRepointUnverifiedWording fails — a pin with no Replay is repointed and stdout carries \"unverified\", asserted not to print any claim of a checked replay",
    "if a replay that could not be RUN is treated as evidence, TestRepointRefusesUnrunnableReplay fails — a failed `worktree add`, a spawn error and a timeout each REFUSE the repoint naming the reason (locked replay_consent_states), distinct from the unconsented case which repoints as unverified: an error is not a red proof",
    "if a recorded-but-unconsented replay blocks the repair, TestRepointUnconsentedReplayRepoints fails — the pin is repointed and reported unverified (naming the grant command), NOT refused: a rotted pin whose replay was never granted on this machine must still be repairable by the single command c-1 promises, and this matches t-6's ship-hook treatment",
    "if dry-run spawns the replay, TestRepointDryRunNoSpawn fails — the replay line is printed and the spawn seam records zero invocations",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 3
  title = "Auto-repoint doomed pins at ship; warn at complete"
  files = ["internal/cmd/ship.go", "internal/cmd/phase.go", "internal/cmd/redproof_lifecycle.go", "internal/cmd/redproof_lifecycle_test.go"]
  description = """
Ship, before its pre-stage clean-tree gate (autoCommitDrossDirt, ship.go:228), repoints any
pin reachable ONLY from refs/remotes/origin/phase/<id> via t-2's apply path, and commits
the two files as `chore(dross): repoint red proof for <id>` so the rewrite rides the
phase's own PR. A recorded+consented replay that goes green refuses; an unrecorded or
unconsented one repoints and reports unverified. `phase complete` gains a pre-teardown
check that WARNS — naming the phase and the repoint verb — then proceeds.

The ship hook and the complete warning ship together deliberately: they are the two ends of
one guarantee (the pin survives the branch's death) and share the doomed-pin predicate, so
splitting them would land the warning naming a repair that the same wave has not yet built.

On repoint_commit: the locked decision permits a caller to commit, and ship is a caller.
The rationale it guards against — a CLI verb landing an unreviewed fixtures/ prose diff in
history — does not apply here, because ship's commit lands on the phase branch before the
PR is opened, so the doc rewrite is reviewed in the phase's own PR alongside the code that
produced it. The repoint verb itself (t-5) still commits nothing.
"""
  covers = ["c-7"]
  depends_on = ["t-1", "t-2", "t-3", "t-4"]
  test_contract = [
    "if the ship hook stops firing, TestShipRepointsDoomedPin fails — in a fixture where the pin names a commit on phase/<id> only, running ship (push/PR stubbed) then simulating the squash-merge (base fast-forwarded, phase branch deleted local and origin) must leave classifyReachability returning reachable and redProofChecks reporting no issue, with no repoint invoked by the test",
    "if the doomed predicate collapses into the rotted predicate, TestDoomedPinIsNotRotted fails — the same fixture put through t-2's planRedProofRepoint with NO excluded refs reports nothing-to-do (still reachable, c-5) while the ship hook's excluded-ref plan repoints it; both assertions live in one test, driving the decision layer rather than t-5's verb so the tension is pinned without a same-wave dependency",
    "if the hook's own commit trips ship's clean-tree gate, TestShipRepointCommitScope fails — after the hook, autoCommitDrossDirt sees a clean tree and `diff-tree --name-only` on the phase branch tip shows exactly [changes.json, the doc]",
    "if the hook writes on the base branch, TestShipRepointLeavesBaseClean fails — the fixture is a DOOMED pin, so the hook actually fires and commits two files; the assertion is that the commit lands on phase/<id> and that pushBaseIfAheadDrossOnly (basebranch.go:62, refusal at :96) still returns without refusing. A sound-pin fixture would pass this test even for a hook writing all over the base",
    "if complete refuses on a doomed pin, TestCompleteWarnsAndFinishes fails — with a doomed pin still recorded, complete prints a hint naming `dross phase red-proof repoint <id> --apply` and STILL finishes: branch deleted, exit 0, because a merged phase must never be left uncompletable",
    "if the ship hook skips the repair when no consented replay exists, TestShipRepointsUnverified fails — the pin is repointed and the output states the repair is unverified",
  ]
  status = "pending"

