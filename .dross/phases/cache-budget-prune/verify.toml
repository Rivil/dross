[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["internal/stack/mutation_cache_test.go:TestGoProfileDeclaresMutationCache", "internal/stack/mutation_cache_test.go:TestProfileWithoutMutationCacheLoads", "internal/stack/mutation_cache_test.go:TestMutationCacheRejectsBadVarName", "internal/cmd/verify_scratch_test.go:TestAdaptersCarryProfileCacheVars", "internal/cmd/verify_scratch_test.go:TestProfileCacheVarsFallsBackToDetection"]
  notes = "TestGoProfileDeclaresMutationCache reads the EMBEDDED profile, not a fixture, so a shipped go.toml that lost the declaration fails here rather than silently reverting every Go repo to the shared cache. TestProfileWithoutMutationCacheLoads proves the block is additive across every other shipped profile. TestMutationCacheRejectsBadVarName refuses a name carrying whitespace or '=' at load, because it reaches an `export` line on a remote shell. TestProfileCacheVarsFallsBackToDetection is the one that keeps this from being dead config: dross's own project.toml has no stack.profile, so resolving only the recorded id would leave the feature inert on every repo onboarded before that field existed."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["internal/mutation/launcher_scratch_test.go:TestRemoteScriptCreatesScratchDir", "internal/mutation/launcher_scratch_test.go:TestRemoteScriptExportsTmpdir", "internal/mutation/launcher_scratch_test.go:TestRemoteScratchIsBesideWorkdir", "internal/mutation/launcher_scratch_test.go:TestRemoteCloseWipesScratch", "internal/mutation/launcher_scratch_test.go:TestScratchIsNotInsideTheTree"]
  notes = "TMPDIR is exported alongside the declared cache vars because gremlins copies the module through os.MkdirTemp, which honours TMPDIR and not GOTMPDIR — redirecting the Go toolchain alone covers the compiler and leaves the harness's own scratch on the host's default volume, which on helicon is a 32 GB tmpfs in RAM. TestRemoteScriptCreatesScratchDir pins the mkdir AHEAD of the tool, and TestScratchIsNotInsideTheTree pins the placement; both encode failures the first live runs found rather than anything the unit tests predicted. Proven on the host: the scratch appeared at 194 MB during a run and was gone afterwards."

