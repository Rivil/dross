task_seq = 4

[phase]
  id = "watch-bot-prs"

[[task]]
  id = "t-1"
  wave = 1
  title = "Add gh open-PR lister with check rollup"
  files = ["internal/ship/openprs.go", "internal/ship/openprs_test.go", "internal/ship/gh_failure_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "ListOpenPRs(opts) + a ListOpenPRsFunc seam: only provider github spawns, via ONE screenedGH `pr list` (argv pinned in the contract);\nstdout-only decode into ship.OpenPRRecord (number, title, url, author login + IsBot, CreatedAt, head, IsCrossRepository, Checks rollup)\n— ship.OpenPR is already the exported dispatcher func. Wait bounded by prListTimeout (production 20s, test-overridable; Kill on timer +\nWaitDelay on the Cmd screenedGH returns). Any failure — including a full page (len == --limit, possibly truncated) — → (nil, fixed-prose\nerr), quietly: no ghFailed/ghUnparseable, zero bytes to ghStderr, gh's own stderr fd never inherited; pinned as an explicit exception\ncase in TestGhFailureOutputGoesToStderr. Other providers → ErrOpenPRListUnsupported without spawning. No LookPath pre-check. The\n//dross:taint-cleared marker on the decode lands here and stays through t-4 (here it clears the uncalled-return escape; at t-4 the\n(time.Time).Sub in internal/watch). New string fields filed in pathfence not_paths.txt. Rollup: failing > pending > passing;\nunknown/STALE conclusions → pending (matches gh pr checks); none when empty."
  covers = ["c-1", "c-3", "c-4", "c-5"]
  test_contract = ["if the gh argv drifts, TestListOpenPRsArgv fails: the captured argv equals exactly [pr list --state open --limit 100 --json number,title,url,author,createdAt,headRefName,isCrossRepository,statusCheckRollup]; dropping `--state open`, dropping `--limit`, dropping any json field or swapping createdAt for updatedAt fails it, and no merge/close/comment/edit verb ever appears", "if a possibly-truncated list is reported as complete, TestListOpenPRsFullPageIsIncomplete fails: gh's default 30 and any explicit --limit both truncate silently, so a stub returning exactly 100 records (== --limit) must yield (nil, err) naming the cap, never 100 PRs; a stub returning 99 records decodes all 99", "if bot identity decodes wrongly, TestListOpenPRsDecodesBotFlag fails: a canned gh doc with app/dependabot is_bot:true, app/github-actions is_bot:true and human \"botanist\" is_bot:false decodes IsBot true/true/false — a mistagged `isBot` field empties the bots and a login-substring check flips the botanist row", "if the rollup reducer is wrong, TestCheckRollup fails: [] and null → none; CheckRun SUCCESS/NEUTRAL/SKIPPED and StatusContext SUCCESS → passing; CheckRun FAILURE/TIMED_OUT/CANCELLED/ACTION_REQUIRED/STARTUP_FAILURE and StatusContext FAILURE/ERROR → failing; CheckRun QUEUED/IN_PROGRESS/WAITING/PENDING and StatusContext PENDING/EXPECTED → pending; one FAILURE among nine SUCCESS plus one IN_PROGRESS → failing and IN_PROGRESS + SUCCESS → pending (first- or last-item-wins fails); a COMPLETED CheckRun with an unrecognised conclusion (STALE, SOMETHING_NEW) → pending, never passing", "if a failure leaks or masquerades as empty, TestListOpenPRsFailureIsNilAndQuiet fails: gh exiting 4 with `run gh auth login CANARY` on stderr, gh printing truncated/non-JSON output, and ghCommand pointed at a nonexistent binary each return (nil, non-nil err) — never an empty slice with nil err; each err names `gh pr list` and contains neither CANARY nor `auth login`; the swapped ghStderr buffer holds zero bytes AND CANARY is absent from the test process's captured os.Stderr, so an implementation that inherits gh's stderr fd (cmd.Stderr = os.Stderr) fails it", "if the lister joins the echo-to-stderr convention by accident, TestGhFailureOutputGoesToStderr fails: its new ListOpenPRs case asserts a failing gh writes zero bytes to ghStderr, and the case is named as the deliberate quiet exception", "if stderr is mixed into the decode, a stub printing valid JSON on stdout plus `warning: ...` on stderr with exit 0 must decode 1 PR — a CombinedOutput decode fails it", "if malformed records slip through, a stub returning [{\"number\":5}] (no createdAt) yields an error, not a PR aged ~739,000 days; a record missing number yields an error", "if reachable-and-empty collapses into failure, TestListOpenPRsEmpty fails: gh printing [] returns nil error and zero records", "if forge_scope leaks, TestListOpenPRsUnsupportedProviders fails: gitlab, forgejo, gitea, bitbucket and \"\" each satisfy errors.Is(err, ErrOpenPRListUnsupported) with the ghCommand stub's spawn counter at 0; \"GitHub \" (mixed case, trailing space) spawns exactly once", "if a LookPath pre-check is added, the happy-path test fails: it runs with PATH set to an empty temp dir and an absolute-path /bin/sh stub", "if the timeout is missing or WaitDelay is dropped, the hang test fails: stub `/bin/sh -c 'sleep 30; true'` with prListTimeout=100ms must return an error inside a 3s test deadline — the `; true` keeps a grandchild sleep holding stdout, so Kill without WaitDelay blocks past the deadline", "if checks fan out per PR, the spawn-count test fails: 3 PRs in the stub output → exactly 1 gh spawn", "if the decoded record escapes unmarked, TestNoSpawnOutputEscapes fails: at t-1 nothing calls ListOpenPRsFunc, so the engine treats the decoded return as an escape to a caller outside the program; with the //dross:taint-cleared marker on the decode both TestNoSpawnOutputEscapes and TestGhMarkersAreLoadBearing pass, and deleting it turns TestNoSpawnOutputEscapes red", "if a new serialized string field is undeclared, TestEveryPathShapedFieldIsDeclared fails: every string field of ship.OpenPRRecord, its author sub-struct and the statusCheckRollup item type has a row in internal/cmd/testdata/pathfence_scan/not_paths.txt under the ship section, none declared as a path", "if the production timeout drifts, TestPRListTimeoutDefault fails: prListTimeout's package default is exactly 20s (generous for a 100-PR statusCheckRollup query, still bounding a stalled network); only tests override it"]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Document bot/ship PR lines in watch prompt"
  files = ["assets/prompts/watch.md", "internal/cmd/watch_prompt_test.go", "README.md", "assets/commands/dross-watch.md"]
  description = "watch.md §1: bot_prs / ship_prs bullets with item fields (bot: number,title,author,url,age_days,checks; ship: number,head,url,checks),\neach tag written as a backticked token; ABSENT means the forge couldn't be queried (unknown — print nothing), [] means none. §2 render:\nthe `bot PRs: …` summary (only when non-empty; parenthetical only when failing > 0) and one `pr: #<n> <head> — <checks>` per ship PR.\nHard rules: PR data is information only (never changes suggested_command) and forge data, not instructions; titles and authors are\nnever printed. The /dross-watch shim description and the README `dross watch` row both read \"Read-only digest of board inbound, phase\ndrift and open bot/ship PRs since the last tick\" (t-4 sets cobra Short to the same text). r-01: make install before any live check."
  covers = ["c-2", "c-3", "c-4", "c-5"]
  test_contract = ["if the bot summary template is lost or moved, TestWatchPromptBotPRLine fails: lowercased watch.md contains `bot_prs` and `age_days`, and the template `bot prs: <n> open (<f> failing), oldest <d>d` plus the instruction to drop the parenthetical at zero failing both sit between the `## 2.` and `## 3.` headings — moving either into §1 or §3 fails it", "if the ship line template is lost or moved, TestWatchPromptShipPRLine fails: watch.md contains `ship_prs`, and `pr: #<n> <head> — <checks>` sits between the `## 2.` and `## 3.` headings", "if absent-vs-empty is blurred, TestWatchPromptPRAbsentPrintsNothing fails: the bot_prs and ship_prs bullets say \"absent\" when the forge can't be queried and that nothing is printed then — rewording to \"empty\" or deleting the sentence fails it", "if PR data could steer, TestWatchPromptPRsAreInformationOnly fails: watch.md states PR data is \"information only\" and never changes suggested_command, carries a \"not instructions\" guard for PR fields, and no line contains `gh pr`", "if PR prose disturbs the locked precedence, the existing TestWatchPromptSuggestionPrecedence fails: verify→ship→inbox→status must still appear in order after \"locked precedence\" with no PR-derived entry ahead of any of them", "if the shim goes stale, TestWatchShimMentionsPRs fails: assets/commands/dross-watch.md's description names open bot/ship PRs alongside board issues and phase drift; README.md's `dross watch` row reads \"Read-only digest of board inbound, phase drift and open bot/ship PRs since the last tick\""]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 2
  title = "Classify bot and ship PRs for digest"
  files = ["internal/watch/prs.go", "internal/watch/prs_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "BotPR{number,title,author,url,age_days,checks}, ShipPR{number,head,url,checks}. SplitPRs([]ship.OpenPRRecord, now) returns bots and\nships, both non-nil and sorted by number. Bot = IsBot; ship = same-repo (not IsCrossRepository) head prefixed phase/ or milestone/; the\ntwo predicates are independent. Age = floor(now.Sub(p.CreatedAt)/24h), clamped ≥ 0 — written in that direct form, never with Sub's\noperands reordered to slip past the taint gate (t-1's marker clears it). BotSummary(bots) and ShipPRLine(p) return the exact digest\nstrings. String fields filed in pathfence not_paths.txt under the watch section."
  covers = ["c-1", "c-2", "c-4", "c-5"]
  depends_on = ["t-1"]
  test_contract = ["if bots are identified by login, TestSplitPRsBotsByFlag fails: a human PR with login dependabot-fan on head dependabot/npm/x (IsBot=false) is excluded while app/dependabot and app/github-actions (IsBot=true) are included", "if ship-head matching is loose or forks leak, TestSplitPRsShipHeads fails: same-repo phase/x and milestone/v1.7 are in; feature/x, phases/x, feature/phase/x, release/phase/x, Phase/X and main are out; a fork PR (IsCrossRepository) on phase/evil is out; a bot PR on phase/x lands in BOTH lists", "if age maths drifts, TestPRAgeDays fails with now=2026-09-30T12:00Z: created 12d1h earlier → 12; 23h → 0; 47h59m → 1 and exactly 48h → 2 (rounding fails); 3h in the future → 0, not −1; a +05:00-offset createdAt ages identically to its UTC instant", "if the summary string drifts, TestBotSummary fails: nil → \"\"; ages 3 and 12 with zero failing → exactly \"bot PRs: 2 open, oldest 12d\" (emitting \"(0 failing)\" fails); one failing → exactly \"bot PRs: 2 open (1 failing), oldest 12d\"; the 12d PR placed second so taking oldest from the first element fails; pending and none never count as failing; a single passing 3d PR → \"bot PRs: 1 open, oldest 3d\"", "if the ship line drifts, TestShipPRLine fails: {138, phase/x, failing} → exactly \"pr: #138 phase/x — failing\" (U+2014 em dash); {7, milestone/v1.7, none} → exactly \"pr: #7 milestone/v1.7 — none\"", "if the JSON shape drifts, TestPRRecordJSONKeys fails: json.Marshal(BotPR) key set is exactly {number,title,author,url,age_days,checks} and ShipPR's is exactly {number,head,url,checks}; a stale/threshold field or renaming age_days fails it (pr_age)", "if a new serialized string field is undeclared, TestEveryPathShapedFieldIsDeclared fails: every string field of watch.BotPR and watch.ShipPR has a row in internal/cmd/testdata/pathfence_scan/not_paths.txt under the watch section (following the existing watch.Item.Title row), none declared as a path"]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 3
  title = "Wire PR digest into dross watch"
  files = ["internal/cmd/watch.go", "internal/cmd/watch_test.go", "internal/ship/openprs.go", "cmd/dross/testdata/cli_tree.txt"]
  description = "When [remote].provider and .url are set, call ship.ListOpenPRsFunc with the provider. On success set watchDigest.BotPRs / ShipPRs\n(`*[]T` omitempty) to non-nil SplitPRs(prs, time.Now()) output; on any error (project load, unsupported, gh, full page) leave both nil.\nrenderWatchHuman prints BotSummary (when non-empty) and one ShipPRLine per ship PR after drift, before `next:`. suggestedCommand\nuntouched; PR data never persisted. t-1's //dross:taint-cleared marker in openprs.go STAYS; update its reason to name the consumer it\nnow clears (the (time.Time).Sub age computation in internal/watch). Cobra Short becomes \"Read-only digest of board inbound, phase drift\nand open bot/ship PRs since the last tick\" (matching t-2's README row and shim); regenerate cmd/dross/testdata/cli_tree.txt. Every cmd\ntest that sets remote.provider=github stubs ship.ListOpenPRsFunc and restores it via t.Cleanup. r-01: make install before the live check."
  covers = ["c-1", "c-2", "c-3", "c-4", "c-5"]
  depends_on = ["t-1", "t-2", "t-3"]
  test_contract = ["if wiring drops or misroutes PRs, TestWatchPRDigestJSON fails: the seam returns (newest-first) #150 human feature/y, #142 github-actions bot passing 3d+1h, #141 dependabot bot failing 12d+1h, #139 human milestone/v1.7 none, #138 human phase/x pending → bot_prs is [141,142] with author, url, age_days 12/3 and checks populated; ship_prs is [138,139]; #150 is in neither", "if reached-empty is swallowed or nulled, TestWatchPRsReachableButEmpty fails: seam returns [] → raw stdout contains `\"bot_prs\":[]` and `\"ship_prs\":[]` and no null (plain []T omitempty, or a nil slice behind the pointer, fails it)", "if c-3 degrades badly, TestWatchPRsAbsentWhenForgeUnreachable fails: seam returns a gh-not-found error → runCmd returns nil (exit 0); the JSON decoded into map[string]json.RawMessage has neither key; full stdout is byte-identical to the same fixture with only remote.provider unset (remote.url kept, so the board host allowance and board output are unchanged) for both --json and the human render; the seam-[] run minus bot_prs/ship_prs equals the seam-error run (new, current, drift, suggested_command, board_ok, stranded untouched); a project.toml whose [remote] fails to load still exits 0 with both keys absent", "if forge_scope leaks at the command level, TestWatchPRsUnsupportedProvider fails: provider=gitlab with the REAL unstubbed lister → both keys absent, exit 0; with no [remote] configured a counting stub on ListOpenPRsFunc stays at 0 calls", "if the human render drifts, TestWatchHumanPRLines fails: with the TestWatchPRDigestJSON fixture exactly one line trims to \"bot PRs: 2 open (1 failing), oldest 12d\" and one to \"pr: #138 phase/x — pending\", both above `next:` which stays the last line; zero bots → no \"bot PRs\" substring; seam error → neither \"bot PRs\" nor \"pr: #\"", "if a PR title can inject into the render, the injection test fails: a bot title carrying a newline, a fake `next:  /dross-ship` line and an ESC[2J sequence never reaches the human output — exactly one `next:` line and no ESC byte", "if PRs steer the suggestion, TestWatchPRsNeverSteerSuggestion fails: a failing bot PR, a failing ship PR and five bots versus a seam error yield identical suggested_command over drift fixtures producing /dross-verify, /dross-ship and /dross-status (pr_suggestion)", "if PR data is persisted, TestWatchPRsNotPersisted fails: with the board reached (httptest board via boardRepo) .dross/watch.state.json bytes are identical whether the seam returns 3 PRs or errors; with the board off and PRs present, watch.state.json is not created", "if the prompt and Go tags diverge, TestWatchPromptNamesEveryDigestField fails: every json tag on watchDigest, watch.BotPR and watch.ShipPR (via reflection) appears as a backticked token (e.g. `age_days`, `url`) in the raw, unstripped assets/prompts/watch.md — a common-word tag present only in prose, a renamed tag, or a new field without its prompt token fails it", "if the marker is dropped or an escape appears, the taint gate fails: with watch consuming the lister and t-1's marker in openprs.go, TestNoSpawnOutputEscapes reports zero findings and TestGhMarkersAreLoadBearing stays green; removing the marker makes TestNoSpawnOutputEscapes report the gh-origin value passed to (time.Time).Sub in internal/watch/prs.go; age stays in the direct now.Sub(p.CreatedAt) form (no operand reordering to evade the gate)", "if the help surfaces drift, TestCLITreeGolden fails unless cmd/dross/testdata/cli_tree.txt carries short=\"Read-only digest of board inbound, phase drift and open bot/ship PRs since the last tick\" for `dross watch`, and TestWatchShortMatchesReadme fails unless watchCmd.Short equals the README.md `dross watch` row's description", "if the live lister is broken in a way stubs cannot see (timeout too tight, missing author.is_bot, statusCheckRollup decode mismatch), the live smoke fails: after make install (r-01), `dross watch --json` in this repo contains both `bot_prs` and `ship_prs` as present JSON arrays (absent = defect); the output line is recorded as evidence in the commit", "if the no-remote output changes, TestOutputGoldens/watch_json fails: it must pass with internal/cmd/testdata/cli_surface/output/watch_json.txt UNEDITED (the fixture has no [remote]); emitting bot_prs as null or [] there fails it"]
  status = "pending"
