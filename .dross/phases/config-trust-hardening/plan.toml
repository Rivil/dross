[[task]]
id            = "t-5"
wave          = 1
title         = "Add host-allowlist derivation package"
files         = [
  "internal/hostallow/hostallow.go",
  "internal/hostallow/hostallow_test.go",
]
description   = """
New standalone package (imported by both internal/forge and internal/ship, which
must stay decoupled). Policy{RemoteURL, Extra} with Derive(remoteURL, extra) and
(Policy) Check(kind, rawURL) error. Allowed = host of [remote].url + built-in SaaS
defaults + Extra. No allow-all, no user wildcard, no fallback return path. Exports a
sentinel ErrRefused, wrapped by every Check refusal, so callers can distinguish a
policy refusal from a transient network error (t-14 depends on this).
"""
covers        = ["c-4"]
test_contract = [
  "if Check stops refusing an off-allowlist host, TestCheckRefusesOffAllowlistHost fails — it asserts the error names \"attacker.example\". The `dross local set allow_hosts` hint is asserted at the CLI boundary by t-10, not here, so this package stays CLI-agnostic",
  "if suffix matching degrades to strings.HasSuffix, TestSuffixWildcardIsNotSubstring fails: \"*.atlassian.net\" must allow acme.atlassian.net but refuse evil-atlassian.net and atlassian.net.attacker.example",
  "if derivation stops covering the remote's own host, TestCheckAllowsRemoteHost fails on the self-hosted pair (remote and api_base both git.corp.internal, empty Extra)",
  "if scheme or port are ignored, TestCheckRefusesSchemeAndPort fails — http:// on an allowed host and api.github.com:8443 must both be refused",
  "if a zero Policy is treated as unrestricted, TestDeriveEmptyIsNotAllowAll fails: Derive(\"\", nil) must return the SaaS defaults only, so a caller that forgets the field fails closed",
  "if a refusal stops wrapping the sentinel, TestCheckRefusalIsErrRefused fails — errors.Is(err, hostallow.ErrRefused) must hold for every refusal path, which is what lets t-14 keep a refusal out of the degrade arms",
]
depends_on    = []
status        = "pending"

[[task]]
id            = "t-6"
wave          = 1
title         = "Gitignore local.toml and refuse a tracked one"
files         = [
  "internal/cmd/gitignore.go",
  "internal/cmd/local.go",
  "internal/cmd/gitignore_test.go",
  "internal/cmd/local_test.go",
  "README.md",
  "docs/dross.1",
]
description   = """
Generalize drossGitignoreBlock / ignoresDrossState over a path list so the seeded
block covers .dross/state.json AND .dross/local.toml — init.go and onboard.go already
call ensureDrossGitignore, so neither is edited. Add allow_hosts to the closed
localKeys set (comma-separated string) plus readAllowHosts(root, repoDir), which runs
`git ls-files --error-unmatch -- .dross/local.toml` and errors when git reports the
file tracked rather than parsing it. README.md:187's "First key: `quick_base`" line
goes stale on this edit and is updated here; docs/dross.1 has no local-store section
at all, so its FILES section gains a new `.dross/local.toml` entry rather than an
update.
Note for existing repos: init/onboard never run again, so an already-onboarded repo
gains the ignore line only via t-10's doctor finding — the tracked-file refusal is
what actually holds the c-7 guarantee there.
"""
covers        = ["c-7"]
test_contract = [
  "if the seeded block stops covering local.toml, TestEnsureGitignoreCoversLocalToml fails — a repo with no .gitignore must end matching both paths, and a second call must leave the file byte-identical",
  "if broader-pattern detection regresses, TestIgnoresLocalTomlViaBroaderPattern fails: an existing \".dross/*.toml\" line must suppress the local.toml append but not state.json",
  "if the docs go stale, TestDocsCoverAllowHosts fails — README's local-key line and docs/dross.1's FILES section must each name allow_hosts and .dross/local.toml; it is the only gate on the doc half of this task",
  "if readAllowHosts parses a tracked local.toml instead of refusing it, TestReadAllowHostsRefusesTrackedLocal fails — with the file git-added and naming attacker.example it must return an error naming the file as tracked, name the `git rm --cached` fix, and return a nil slice",
]
depends_on    = []
status        = "pending"

