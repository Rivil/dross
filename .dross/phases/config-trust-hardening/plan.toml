task_seq = 0

[phase]
  id = "config-trust-hardening"

[[task]]
  id = "t-1"
  wave = 1
  title = "Author hostile-config fixture and refusal contract"
  files = ["fixtures/hostile-config-c5/project.toml", "fixtures/hostile-config-c5/local-tracked.toml", "fixtures/hostile-config-c5/RUN.md", "fixtures/hostile-config-c5/expected-refusals.txt"]
  description = "Inert fixture data only, matching the RUN.md + expected-*.txt shape of the existing\nfixtures/terraform-c3 and fixtures/iac-multi-c5. project.toml carries a\nsentinel-writing git_main_branch payload (both the `--upload-pack=touch` and\n`--output=` shapes, the latter driving the `dross repair` vector), a leading-dash\nbranch_pattern, and an attacker-controlled api_base; expected-refusals.txt pins one\nerror prefix per vector\nso implementers match strings they did not choose. No Go test lands here — t-14 is\nits gate.\n"
  covers = ["c-5"]
  test_contract = ["if the fixture's project.toml stops carrying the --upload-pack sentinel payload, t-14's TestHostileConfigNoPwnSentinel becomes vacuous and its own must-fail replay in RUN.md no longer reproduces", "if expected-refusals.txt loses a vector line, t-14's TestEveryVectorHasASubtest fails because the subtest-name set no longer equals the vector-id set"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add ref-name guard to guarded switch helpers"
  files = ["internal/cmd/refguard.go", "internal/cmd/refguard_test.go", "internal/cmd/switchbranch.go"]
  description = "New validateGitRef(kind, name) rejecting leading \"-\", empty, and names git\ncheck-ref-format rejects (space, \"..\", control chars, \".lock\" suffix). Called at the\ntop of checkoutBranch, checkoutBranchNew (branch AND base), guardedFF and\nguardedResetHard — before guardLiveState and before any exec.\n"
  covers = ["c-1"]
  test_contract = ["if validateGitRef stops rejecting a leading dash, TestGuardedHelpersRefuseLeadingDash fails on the named error assertion", "if the guard is moved after the first exec, TestGuardedHelpersRefuseLeadingDash fails because the returned error contains git's own \"not a git repository\" text — the helper is pointed at a temp dir that is not a repo, so any error mentioning it proves git ran", "if the reject table is over-tightened, TestValidateGitRefAccepts fails on \"main\", \"milestone/v1.2\", \"phase/config-trust-hardening\" or \"release-1.0\"", "if the guard is dropped from any one of the four helper call sites, that helper's subtest in TestGuardedHelpersRefuseLeadingDash fails independently"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Add git separator argument builders"
  files = ["internal/cmd/gitargs.go", "internal/cmd/gitargs_test.go"]
  description = "gitRefArgs(sub, opts, refs...) emits \"--end-of-options\" before refs; gitPathArgs\nemits \"--\" before pathspecs; gitRefPathArgs covers mixed shapes (checkout <sha> --\n<paths>). Token choice per the locked ref_separator_token decision in spec.toml.\nRequires git >= 2.24; t-10's doctor reports a version below that.\n"
  covers = ["c-2"]
  test_contract = ["if gitRefArgs emits the separator conditionally, TestGitRefArgsSeparator fails — it asserts the separator is present even when the ref looks benign, because a conditional separator is absent exactly when it matters", "if gitRefArgs(\"checkout\", nil, \"-x\") stops yielding exactly [\"checkout\",\"--end-of-options\",\"-x\"], TestGitRefArgsSeparator fails on the argv comparison", "if gitPathArgs places opts after the separator, TestGitPathArgsSeparator fails because \"--porcelain\" is demoted to a pathspec"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Pin stryker core to an exact version"
  files = ["internal/mutation/stryker.go", "internal/mutation/stryker_test.go"]
  description = "A const strykerPin replaces the bare \"@stryker-mutator/core\" in both the npx\ninvocation and the install hint.\n"
