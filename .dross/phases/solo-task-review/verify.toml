  text = "mutants_test_gap = 4 overstates the reachable gap: 3 of the 4 (internal/gate/commit.go:186 ×2, internal/treefp/treefp.go:253) are empty `case X:` arms. go-cover emits a 0-statement block at the colon on the same line (186.52,186.52 0 0; 253.18,253.18 0 0), so survivor.Derive's line-granular placement counts the condition line as in-block. Both arms are exercised (commit_test.go:154,167; treefp_test.go:224), so they are the switch-case attribution ceiling. The one real reachable gap is internal/cmd/doctor.go:1471, the body of the remoteLockStatusFn ssh seam that tests replace (accepted as a process-construction seam). Classifier fix deferred."

