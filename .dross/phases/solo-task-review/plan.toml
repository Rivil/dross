[[task]]
  id = "t-10"
  wave = 5
  title = "Record reviewer verdicts from PostToolUse"
  files = ["internal/gate/review.go", "internal/gate/review_test.go"]
  description = "Recorder claims Agent/Task calls for review.ReviewerAgent under t-19's ArmedScope, regenerates the context, compares digests: pass/block bound to its\ntree, stale (digest mismatch, no context line), unavailable (parse failure, widened prompt). Background or unarmed: records nothing."
  covers = ["c-1", "c-2", "c-3", "c-4", "c-5", "c-8"]
  depends_on = ["t-1", "t-2", "t-3", "t-6", "t-13", "t-19"]
  test_contract = ["from t-1's captured envelope carrying a pass verdict and a matching context line, in a solo-armed fixture repo, the recorder appends a pass round whose tree equals treefp.WorkingTree; subagent_type general-purpose, fork or absent, or tool_name Bash, writes nothing — TestRecorderClaims", "if a verdict declaring \"pass\" with one spec finding records a pass round, TestRecorderSpecBlocks fails (c-2)", "if a prompt carrying the context line plus any other text (e.g. pasted conversation) records anything but an unavailable round naming the prompt, TestRecorderRejectsWidenedPrompt fails (c-5)", "if a file edited after `dross review context` and before the verdict, or a prompt with no context line, yields anything but a stale round plus a warning naming `dross review context`, TestRecorderStaleContext fails", "if an unparseable reply records anything but an unavailable round naming the parse error, or a later pass for the same attempt reads as pass, TestRecorderUnavailableSticky fails (review_unavailable)", "if t-1's background fixture writes review.json or emits other than one warning, TestRecorderBackgroundLaunch fails", "if a reviewer run with execute.json pair or absent, no task in_progress, or HEAD off phase/<id> writes review.json, TestRecorderPairSilent fails (c-1)", "if any non-test file outside internal/gate calls gatestate.SaveReview, TestReviewRecordSingleWriter fails; the same test asserts Bash `dross gate record` fed a forged reviewer payload stays refused by gate-off-guard (review_pass_signal)", "if either tool name \"Agent\" or \"Task\" stops being claimed, TestRecorderToolRename fails", "if the digest the recorder regenerates differs from the one `dross review context` printed for the same armed scope (including with a secret path added via gates.toml), TestContextDigestParity fails", "if a prompt equal to the context line apart from leading/trailing whitespace is treated as widened, or any interior addition is not, TestRecorderPromptExactness fails"]
  status = "done"

