task_seq = 25

[phase]
  id = "solo-task-review"

[[task]]
  id = "t-1"
  wave = 1
  title = "Capture real Agent PostToolUse payloads"
  files = ["internal/gate/testdata/agent_reviewer_post.json", "internal/gate/testdata/agent_background_post.json", "internal/gate/fixture_test.go"]
  description = "Go/no-go capture in a scratch repo via headless `claude -p` (subscription OAuth, never --bare): a scratch reviewer agent (omitClaudeMd, tools Read),\na project CLAUDE.md canary token and a temporary stdin-dump PostToolUse hook in the scratch repo's .claude/settings.local.json (never ~/.claude). The\nreviewer answers yes/no probes (project canary token; a distinctive phrase from ~/.claude/CLAUDE.md; one from auto-memory) — it never quotes its\ninstructions. Before committing, grep the fixtures for every non-trivial line of ~/.claude/CLAUDE.md (count must be 0). Capture one foreground and one\nbackground spawn. STOP before t-7 and t-10 if no final text, no subagent_type, or any probe answers yes."
  covers = ["c-1", "c-5"]
  test_contract = ["if the reviewer fixture stops being a real capture (session_id, transcript_path, toolu_ id) with tool_name Agent or Task, tool_input.subagent_type dross-task-reviewer, and exactly one dross-verdict fence readable from tool_response alone, TestCapturedAgentReviewerFixture fails", "if the captured reviewer reply answers yes to the project-canary, user-CLAUDE.md or auto-memory probe, or quotes the canary token, TestCapturedReviewerIsolation fails (omitClaudeMd not honoured; re-decide reviewer_isolation)", "if the background fixture's tool_response carries a dross-verdict fence, TestCapturedBackgroundAgentFixture fails"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Parse reviewer verdicts and track fix rounds"
  files = ["internal/review/verdict.go", "internal/review/verdict_test.go", "internal/review/ledger.go", "internal/review/ledger_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "ReviewerAgent = \"dross-task-reviewer\". ParseVerdict reads one ```dross-verdict JSON fence {verdict, spec[], quality[] (severity BLOCKING|FLAG|NOTE)};\nspec findings always block; pass is derived and cross-checked against the stated verdict. Ledger Round{tree, digest, outcome pass|block|unavailable|stale,\nfindings, cause}; State(); Resolve() labels every finding."
  covers = ["c-2", "c-3", "c-6"]
  test_contract = ["parse table: zero fences, two fences, malformed JSON, unknown severity, a spec finding with no criterion, an empty finding text → each errors; \"pass\" carrying a quality BLOCKING, or \"block\" carrying only FLAG/NOTE → an error naming the inconsistency, never a pass — TestParseVerdict", "if a spec finding tagged FLAG or NOTE stays non-blocking, or a \"pass\" carrying it parses as a pass, TestSpecFindingsAlwaysBlock fails (c-2)", "if ParseVerdict returns spec and quality findings in one list instead of separate Spec and Quality fields, TestFindingsKeepKind fails (c-2 \"reports … separately\")", "if quality FLAG/NOTE start blocking, TestQualityGrades fails: \"pass\" with one FLAG and one NOTE is a pass that keeps both (quality_blocking)", "ledger table: [] none; [pass T1] pass(T1); [block] blocked; [block, pass T2] pass(T2); [block, block] exhausted; [pass T1, block, block] exhausted; [block, stale, block] exhausted; [block, block, pass] exhausted; [unavailable, pass] unavailable — any drift fails TestLedgerState (c-3)", "if Resolve mislabels, TestResolve fails: [block{B1,F1}, pass{N1}] → B1 \"fixed in the fix round\", F1 and N1 \"non-blocking, left\"; [block{B1}, block{B2}] → B2 \"unresolved — task failed\"", "an unfiled json-tagged string field in internal/review fails TestEveryPathShapedFieldIsDeclared", "if a spec finding citing criterion \"description\" (a solo quick's only spec source) is rejected as criterion-less, or one citing \"description\" is accepted in a task-scope parse, TestQuickSpecFindingCitesDescription fails"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Build the review context from the whole diff"
  files = ["internal/treefp/treefp.go", "internal/treefp/treefp_test.go", "internal/review/context.go", "internal/review/context_test.go"]
  description = "treefp gains Base (HEAD minus .dross/; empty tree if unborn), a config-independent Patch (`git diff-tree -p --no-color --no-ext-diff --no-textconv\n--no-renames`) and Dirty. review.BuildContext renders the task record (no status), covered criteria only, the phase's locked decisions + hard rules\n(or a quick's description), then the patch; secret paths named, content withheld."
  covers = ["c-1", "c-5", "c-8"]
  test_contract = ["if a staged, unstaged or untracked-unignored file, or an edit to a file no task declares, is missing from the patch, or an ignored file or any .dross/ path appears, TestPatchWholeDiff fails (review_input)", "if BuildContext's tree differs from treefp.WorkingTree() on the same repo, TestContextTreeMatchesWorkingTree fails (the pass would vouch for a tree the gate never compares)", "if color.ui=always, diff.external=<marker script>, a .gitattributes textconv driver, diff.noprefix=true or diff.renames=copies changes the context bytes, adds ANSI escapes or creates the marker, TestPatchConfigIndependent fails", "if an unborn HEAD does not show every file as added against the empty tree, TestPatchUnbornHead fails", "if the real index's sha256 or `git diff --cached --name-only` differs across BuildContext and Dirty in a partially staged repo, TestContextLeavesIndexAlone fails", "if a withheld path's content appears (its path must appear), TestContextWithholdsSecretPaths fails", "if an uncovered criterion's text, the task's status or an unlocked decision appears, a locked decision or hard rule is missing, or flipping the task pending→in_progress changes the digest, TestContextScope fails; a quick scope carries the description and no plan content", "if two builds on an unchanged tree differ in digest, or a one-byte edit leaves it equal, TestContextDigest fails", "if Dirty reports a .dross/-only change or misses an untracked unignored file, TestDirtyIgnoresDross fails", "if BuildContext is handed a secret-list load error (a malformed gates.toml) and renders anyway instead of erroring naming the file, TestContextMalformedGatesRefuses fails", "if internal/review imports internal/gate or internal/gatestate (gatestate stores []review.Round, so either import cycles), TestReviewImportDirection fails; secret paths reach BuildContext as a parameter", "if a quick scope's context omits the hard rules (quality_blocking grades rule violations on quicks too), TestContextScope fails"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Record a failure reason on tasks"
  files = ["internal/phase/phase.go", "internal/cmd/task.go", "internal/cmd/task_reason_test.go", "cmd/dross/testdata/cli_tree.txt", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "Task.Reason (toml reason,omitempty). `dross task status <p> <t> failed --reason <text>` stores it, any other status clears it, --reason with a\nnon-failed status errors, and `task show` prints it."
  covers = ["c-3"]
  test_contract = ["if `task status p t-2 failed --reason \"x\"` does not survive a plan.toml round-trip (newline, quotes and `]]` included), or `task show` omits it, TestTaskFailedReason fails", "if setting t-2 back to pending or in_progress keeps the reason, TestReasonClearedOnRetry fails", "if --reason with done or pending is accepted instead of erroring, TestReasonOnlyWithFailed fails", "if a status write leaves a reason-less plan with a new `reason` key, TestReasonOmitEmpty fails", "an unfiled phase.Task.Reason fails TestEveryPathShapedFieldIsDeclared; a missing `--reason` row fails TestCLITreeGolden"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 1
  title = "Add a reviews map to the change record"
  files = ["internal/changes/changes.go", "internal/changes/changes_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = "Changes.Reviews map[taskID]TaskReview{outcome, rounds, findings[{round, kind, severity, criterion, text, resolution}]} (json reviews,omitempty), on\nchanges' own types (importing internal/review would cycle via phase/done.go). SetReview writes only that entry; Record() never touches Reviews."
  covers = ["c-6"]
  test_contract = ["if a changes.json fixture without reviews changes a byte across Load→Save, TestReviewsOmitEmpty fails", "if Record(t-3, …) after SetReview(t-3) drops the review, or SetReview creates a Tasks entry (a failed task has no TaskRecord, so its files stay out of verify's mutation scope), TestReviewsSeparateFromTasks fails", "if SetReview on a missing changes.json does not create one holding only phase + reviews, or clobbers pr, base, base_commit or status on an existing one, TestSetReviewPreservesRecord fails", "if a TaskReview does not round-trip through Save/Load with kind, severity and resolution intact, TestReviewsRoundTrip fails", "an unfiled new tagged field fails TestEveryPathShapedFieldIsDeclared"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "Store review, quick and context records"
  files = ["internal/gatestate/store.go", "internal/gatestate/store_test.go", "internal/gate/override_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt", "internal/gate/override.go"]
  description = "New .dross/gate/ records: review.json {kind task|quick, phase, task, attempt, rounds []review.Round}, quick.json {mode, description, head, at} and\nreview-context.md, on the store's atomic temp+rename: missing = none, corrupt = error naming the path, git-tracked = refused unread. RemoveQuick treats\nnone as success."
  covers = ["c-4", "c-8"]
  depends_on = ["t-2"]
  test_contract = ["if a truncated review.json or quick.json decodes to a zero record instead of an error naming .dross/gate/<file>, or a missing one returns anything but (nil, nil), TestReviewRecordDecode fails", "if a pass round with an empty tree is accepted, TestReviewEmptyTreeRejected fails (an empty tree matches only another empty fingerprint)", "if spec and quality findings collapse into one list on disk, TestReviewRoundTrip fails", "if N concurrent SaveReview writers and LoadReview readers ever observe a partial record, the concurrency test fails", "if a force-added review.json or quick.json is read instead of refused, TestTrackedRecordRefused fails", "if Write/Edit of .dross/gate/review.json, quick.json or review-context.md, or Bash `echo x > .dross/gate/review.json` / `cp /tmp/r .dross/gate/review-context.md`, gets past tamper-guard, the tamper table fails", "unfiled tagged fields fail TestEveryPathShapedFieldIsDeclared", "if Bash `rm .dross/gate/review.json`, `rm -f .dross/gate/quick.json`, `mv .dross/gate/review.json /tmp/x` (the record as SOURCE) or `git clean -fX .dross` gets past tamper-guard, TestReviewRecordDeleteRefused fails — review.json is the first gate record whose deletion is more lenient (it would reset the fix-round cap)"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 2
  title = "Ship the isolated reviewer definition"
  files = ["assets/agents/dross-task-reviewer.md", "assets/embed.go", "assets/embed_test.go", "internal/review/agentdef_test.go"]
  description = "Frontmatter: name dross-task-reviewer, omitClaudeMd: true, tools Read/Grep/Glob, no memory, no model. Body: Read the named context file (no verdict\nif its digest differs); a covered criterion's sub-surface with no code or test is a spec finding (always blocks); grade quality BLOCKING/FLAG/NOTE;\nend with one dross-verdict fence. embed.go gains `all:agents`."
  covers = ["c-2", "c-5", "c-7"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if omitClaudeMd is removed or false, a `memory` key appears, a `model` other than inherit appears, `tools` is dropped (inherit-all) or gains Bash, Edit, Write, MultiEdit, NotebookEdit, Agent, Task, WebFetch or WebSearch, TestReviewerDefinitionIsolation fails (c-5)", "if the frontmatter name drifts from review.ReviewerAgent, TestReviewerNameMatchesRecorder fails", "if the body's worked example stops parsing with review.ParseVerdict into at least one spec and one quality finding, or the body stops saying spec findings always block and naming the three quality grades, TestReviewerBodyMatchesParser fails", "if the embedded assets/agents set differs from disk (a narrowed embed pattern), TestEmbedDrift fails", "if the body stops saying spec findings are judged only on the sub-surfaces the task record's description and test_contract claim for each covered criterion (a sub-surface the record does not claim — owned by a sibling task — is not a finding), TestReviewerBodyScopesSpecFindings fails (c-2 as amended)", "if the body stops limiting reads to the named context file plus repo source files — nothing else under .dross/, no CLAUDE.md, nothing under ~/.claude — TestReviewerBodyLimitsReads fails (c-5)", "if the body stops defining quality BLOCKING as exactly quality_blocking's list (correctness bug, unmet test_contract, locked-decision or rule violation) with FLAG/NOTE recorded only, or stops telling a quick review to cite criterion \"description\", TestReviewerBodyDefinesGrades fails"]
  status = "done"

