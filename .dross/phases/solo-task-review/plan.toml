[[task]]
  id = "t-12"
  wave = 3
  title = "Attach reviews and guard failed-task marking"
  files = ["internal/cmd/changes.go", "internal/cmd/task.go", "internal/cmd/review_attach.go", "internal/cmd/review_attach_test.go"]
  description = "`changes record <p> <t>` and `task status <p> <t> failed` copy review.json's rounds for (p, t), resolved by review.Resolve, into changes.Reviews;\nnever review content from a flag. Without --reason, `failed` derives the reason from an exhausted or unavailable record. In a solo run, `failed`\nrefuses while treefp.Dirty reports code changes, naming the stash command."
  covers = ["c-3", "c-6"]
  depends_on = ["t-2", "t-3", "t-4", "t-5", "t-6"]
  test_contract = ["with review.json [block, pass] for (p, t-3), `changes record p t-3 --files a.go --commit abc` writes reviews.t-3 outcome pass, rounds 2, B1 \"fixed in the fix round\", FLAGs \"non-blocking, left\"; a record for t-2, another phase, or a quick record attaches nothing — TestChangesRecordAttachesReview", "if a pair-mode task's changes.json gains a \"reviews\" key, TestPairRecordHasNoReview fails", "if `task status p t-3 failed` (no --reason) over an exhausted record does not set the derived reason and attach \"unresolved — task failed\", over an unavailable record does not name the cause, or with --reason \"x\" does not keep \"x\", TestFailedReasonFromReview fails", "if `failed` succeeds in a solo run while a.go is modified or an untracked b.go exists, or refuses when only .dross/ is dirty or the run is pair, TestSoloFailedRequiresStash fails", "if a corrupt review.json makes `changes record` exit non-zero or skip the task record, TestAttachErrorWarns fails", "if `changes record` or `task status` gains a flag carrying review content, TestNoReviewFlags fails"]
  status = "done"

