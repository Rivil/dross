  test_contract = ["if \"node\" is missing from the policy table, TestPolicyCoversEveryKnownBinary fails on the key set and TestAuditKnowsEveryPolicyBinary fails on the missing valueTakingFlags entry; present in valueTakingFlags without a policy fails that test's stale-entry arm", "if the node policy is not Reject, TestFenceRejectTools' new node case fails — argfence.Fence(\"node\", …) must refuse a leading-dash derived value"]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 2
  title = "Print the construct, not the pad, in cmd readouts"
  files = ["internal/cmd/verify.go", "internal/cmd/verifyscope.go", "internal/cmd/verifyscope_test.go", "internal/cmd/verify_scoping_test.go", "internal/cmd/verify_range_e2e_test.go"]
  description = "printRangeProvenance (verify.go ~1517): drop the pad hunt; print `ranged stryker N file(s)` then one line per range `  <file>:<start>-<end>  (<construct>)`. verifyscope.go ~282: `10-48 (FunctionDeclaration tally)` in place of `(pad 25)`; an EffectiveRange with empty Construct prints `10-48 (construct unrecorded)`. verifyscope_test's provenance fixture stops setting Pad and asserts the label in text and \"construct\": in --json; the e2e test drops its `pad 25` assertion but keeps {15,66} until t-6 changes behaviour; `stubRangeAdapter` (verify_scoping_test.go ~597) gains a canned `Constructs` returning [{30,50,FunctionDeclaration,edited}] (additive prep for t-6). After this task NO file under internal/cmd reads `.Pad` — `grep -rn '\\.Pad\\b' internal/cmd` must be empty before commit. internal/cmd tests gate on `dross test` (remote).\n"
  covers = ["c-3"]
  depends_on = ["t-1"]
  test_contract = ["if a pad-era tests.json (ranges with \"pad\": 25, no construct) breaks `dross verify scope`, TestVerifyScopeOnAPadEraRecordSaysUnrecorded fails — it must load and print `(construct unrecorded)` for that range and never the word pad", "if the construct label is not printed beside the raw hunk, TestVerifyScopePrintsRawAndEffective fails — a record with construct \"FunctionDeclaration tally\" prints `1-37 (FunctionDeclaration tally)` beside the raw `10-12`; TestVerifyScopeJSONIsTheRecordVerbatim asserts `\"construct\": \"FunctionDeclaration tally\"` and no \"pad\" key in --json", "if verify output loses the per-range line or still prints the pad, TestVerifyOutputNamesTheConstructPerRange fails — at this wave PlanRanges still stamps Pad and never sets Construct, so a run through Verify() with the stub prints `ranged stryker 1 file(s)` and a per-range line ending `(construct unrecorded)`, never \"pad\"; t-6 re-points the same test to the real construct label. TestVerifyOutputNamesWholeFileLegs' \"(pad\" needle is replaced by the construct line"]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 3
  title = "Retire the pad and wire construct planning"
  files = ["internal/verify/range_provenance.go", "internal/verify/verify.go", "internal/verify/range_provenance_test.go", "internal/verify/range_dispatch_test.go", "internal/verify/range_record_test.go", "internal/verify/range_summary_test.go", "internal/cmd/verify.go", "internal/cmd/verify_scoping_test.go", "internal/cmd/verify_range_e2e_test.go"]
  description = "Delete hunkContextLines, padAndMerge, EffectiveRange.Pad, LegSummary.Pad, legProvenance's pad return (both Skeleton call sites) and every comment describing the pad. `WholeFileASTUnavailable = \"ast-unavailable\"` joins the closed reason set. `type ASTIndex map[string]ASTResult{Constructs []mutation.Construct; Err error}`. `PlanRanges(a, files, scope, asts ASTIndex)` stays pure; per file: absent-from-hunks → malformed-range (raw hunk, before any resolution) → ast-unavailable (missing entry OR Err, on a RangeRunner) with Degraded line `<tool>: AST unavailable for <file> (<detail>); mutating the whole file` → ranged: Ranges = expandToConstructs, Dispatch projected from the same values in the same loop. `resolveConstructs(a, files, scope) ASTIndex` in verify.go runs BEFORE PlanRanges inside RunScoped, only when `a` is a RangeRunner and the scope has hunks, only for files whose hunks are present and well-formed; a RangeRunner that is not a ConstructResolver gets Err \"adapter has no construct resolver\" per such file. legProvenance renders `file:start-end (construct)`. collectDetachedFrom passes nil. Pad-pinning tests (TestPadAndMerge* ×5, TestRunScopedPassesPaddedRanges, TestEffectiveRangesArePostPadPostMerge, TestLegRecordsEffectiveRangesWithPad, TestGremlinsLegHasNoPad) are replaced by construct equivalents; the cmd e2e assertion becomes the stub's {30,50} labelled \"FunctionDeclaration edited\"; a second cmd stub WITHOUT Constructs exercises the printed warning. This is the one oversized task (8 files) by design — the pad deletion is atomic or the commit is red.\n"
  covers = ["c-1", "c-2", "c-3", "c-4"]
  depends_on = ["t-1", "t-5"]
  test_contract = ["if an AST failure takes its neighbours down or leaks its detail into the reason, TestASTUnavailableDegradesAndFallsWholeOnlyItsOwnFile fails — a rangingAdapter whose Constructs returns ErrASTUnavailable(\"parse error at 12:4\") for a.ts: WholeFile[a.ts] == \"ast-unavailable\" exactly, Scope.Degraded contains \"parse error at 12:4\", Dispatch has no a.ts, and a sibling whose resolver succeeds is still ranged", "if a RangeRunner without a resolver is ranged on bare hunks, TestRangeRunnerWithoutResolverDegrades fails — every hunked file ast-unavailable, Degraded non-empty, RunScoped calls Run not RunRanges", "if the resolver is asked for files it should never see, or after dispatch, TestResolverIsAskedOnlyForRangeableFilesAndBeforeDispatch fails — a counting resolver sees ZERO calls for a plainAdapter leg, a hunk-less scope, a file absent from hunks, and a malformed raw hunk; exactly one call per rangeable file otherwise, every call before RunRanges", "if the malformed check moves after expansion, TestMalformedRawHunkIsCaughtBeforeExpansion (renamed) fails — {0,3} still records malformed-range with the resolver never called", "if a resolver error aborts the leg, TestResolverFailureStillRunsTheLeg fails — the leg has Mutation set, Error empty, WholeFile all ast-unavailable", "if any pad field survives, TestRecordCarriesConstructNotPad / TestLegSummaryHasNoPad fail — reflect finds no Pad on EffectiveRange or LegSummary; a marshalled LanguageRun has no \"pad\" key and every range a non-empty \"construct\"", "if the reason set drifts, TestWholeFileReasonsAreAClosedSet fails — exactly five constants, \"ast-unavailable\" among them", "if verify.toml loses the construct or keeps the pad, TestVerifyTomlStatesEffectiveRanges fails — leg `ranges` entry is `src/a.ts:10-48 (FunctionDeclaration tally)` and no `pad =` line; TestGremlinsLegHasNoRanges (renamed) and TestLegProvenanceIsSorted hold on the construct-bearing strings", "if a nil index panics on a non-range adapter, TestNilIndexOnANonRangeAdapter fails — PlanRanges(&Gremlins{}, files, scope, nil) still returns adapter-lacks-range-runner", "if the record and the dispatch drift, TestRecordedRangesAreTheDispatchedRanges fails — plan.Ranges projected to {Start,End} DeepEquals plan.Dispatch", "if the printed warning is lost, TestVerifyOutputWarnsWhenTheASTIsUnavailable fails — the cmd stub without Constructs prints `scope degraded: stryker: AST unavailable for internal/pkg/c.go` and `whole-file stryker … ast-unavailable`, and \"ranged\" never appears", "if end-to-end dispatch skips the resolver, TestRangedDispatchReachesTheAdapterEndToEnd (re-pointed) fails — the stub's Constructs is asked for internal/pkg/c.go, RunRanges receives {internal/pkg/c.go: [{30,50}]}, and tests.json records {30,50,\"FunctionDeclaration edited\"}, never the raw hunk", "if the wired planner never reaches the readout, TestVerifyOutputNamesTheConstructPerRange (re-pointed from t-5's placeholder) fails — the per-range line now ends `(FunctionDeclaration edited)`, and `(construct unrecorded)` no longer appears for a fresh run"]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 4
  title = "Resolve TS constructs via Babel under node"
  files = ["internal/mutation/construct.go", "internal/mutation/astspan.js", "internal/mutation/construct_test.go", "internal/mutation/stryker.go"]
  description = "`(*Stryker).Constructs(file)`: refuse `.svelte` up front (ErrASTUnavailable \"no parser for .svelte\", no spawn); read the source from filepath.Join(ProjectRoot, file); build stdin = `const __dross = <json.Marshal({\"file\":…,\"source\":…})>;\\n` + the embedded astspan.js (//go:embed) — the script never touches the filesystem beyond require.resolve; spawn via `strykerBuildCmd(s, []string{\"node\",\"-\"})` with cmd.Dir = s.workDir(), a 30s deadline (unexported var so tests lower it), NEVER via launcherCommand/newLauncher (planning_locus lock). argv is two literals. Script: createRequire from `node_modules/@stryker-mutator/instrumenter/package.json` under cwd (fall back to require.resolve with paths from @stryker-mutator/core — pnpm layout verified) → `@babel/parser`; plugins [\"typescript\"] for .ts/.js/.mjs/.cjs and [\"typescript\",\"jsx\"] for .tsx/.jsx; sourceType \"module\"; errorRecovery false; emits `{\"constructs\":[{start,end,kind,name}]}` for every Program.body node (span = the outermost node incl. the Export{Named,Default}Declaration wrapper; kind/name from the unwrapped declaration — Function/Class/TSInterface/TSTypeAlias/TSEnum `.id.name`, VariableDeclaration first declarator, \"\" otherwise) or `{\"error\":{\"message\",\"line\",\"column\"}}` with exit 2. Go classifies: exec.ErrNotFound → \"node not on PATH\"; error JSON → \"parse error at L:C: msg\" or \"cannot resolve @babel/parser from <workdir>\"; deadline → \"timed out after 30s\"; undecodable stdout → \"malformed resolver output\"; every arm wraps ErrASTUnavailable. Failure-arm tests use a fake `node` on PATH (t.TempDir shell script) — no Babel needed. Stryker 9.6.1 keeps a mutant only when locationIncluded(range, node.loc) — full span containment — verified at plan time.\n"
  covers = ["c-1", "c-4"]
  depends_on = ["t-6"]
  test_contract = ["if the spawn is unreachable from the consent gate or marked exempt, TestEverySpawnSiteGatedOrExempt fails — the spawn is reached from Verify's requireExecConsent via RunScoped → resolveConstructs → ConstructResolver fan-out with no //dross:exec-exempt marker", "if the Prefix is ignored or the remote is used, TestConstructsHonoursPrefixAndNeverTheRemote fails — Prefix \"docker compose exec -T app\" builds argv [docker compose exec -T app node -]; with Remote set, launcherCommand is swapped for a func that t.Fatal()s, PATH emptied, and the stub is never called", "if the request goes on argv or the cwd is wrong, TestConstructsPassesTheRequestOnStdinNotArgv fails — a fake node echoing canned JSON: Constructs returns [{10,60,\"FunctionDeclaration\",\"run\"}], recorded argv is exactly [\"node\",\"-\"], cwd == workDir, captured stdin contains `\"file\":\"src/a.ts\"` and the file's source", "if any failure arm loses its cause or its sentinel, TestConstructsClassifies<Cause> ×5 fails — node absent → \"node not on PATH\"; exit 2 with {\"error\":{\"line\":12,\"column\":4}} → \"parse error at 12:4\"; exit 2 with a resolve error → names \"@babel/parser\"; prints `nope` → \"malformed resolver output\"; sleeps past the lowered deadline → \"timed out\"; each errors.Is(err, ErrASTUnavailable)", "if .svelte spawns anyway, TestSvelteIsUnavailableWithoutASpawn fails — Constructs(\"web/src/App.svelte\") returns ErrASTUnavailable \"no parser for .svelte\" and the fake node records ZERO invocations", "if the embed breaks, TestEmbeddedScriptIsNonEmpty fails"]
  status = "pending"

