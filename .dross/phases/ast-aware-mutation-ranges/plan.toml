  title = "Register node in the argfence policy table"
  files = ["internal/argfence/policy.go", "internal/argfence/argfence_test.go", "internal/cmd/subprocargs_audit_test.go"]
  description = "`table` gains `\"node\": {Kind: Reject, Why: \"node reads options ahead of the script operand and honours no end-of-options token; the only positional dross passes is the literal `-`, the request rides on stdin\"}`. TestPolicyCoversEveryKnownBinary's want-list and subprocargs' `valueTakingFlags` gain \"node\" (an empty flag set). Rationale: node joins the policy table so any FUTURE derived operand is refused by argfence and the audit stays consistent — NOT because t-7's spawn would trip the subprocargs audit (it goes through strykerBuildCmd's spread, which the audit skips, and its argv is two literals). Additive, parallel, wave 1."
