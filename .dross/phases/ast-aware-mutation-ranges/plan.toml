[[task]]
  id = "t-1"
  wave = 1
  title = "Add construct seam and pure hunk expansion"
  files = ["internal/mutation/construct.go", "internal/verify/range_expand.go", "internal/verify/range_expand_test.go", "internal/verify/range_dispatch_test.go", "internal/verify/range_provenance.go"]
  description = "construct.go: `Construct{Start, End int; Kind, Name string}`, `(Construct).Label()` (\"Kind Name\", or \"Kind\" when Name is empty), `ConstructResolver interface { Adapter; Constructs(file string) ([]Construct, error) }` as the OPTIONAL half beside RangeRunner, and the `ErrASTUnavailable` sentinel. No spawn, no implementer. range_expand.go: `ConstructHunk = \"hunk\"` and `expandToConstructs(hunks []Range, cs []mutation.Construct) []EffectiveRange`: every hunk line covered by a top-level construct maps to that construct's FULL span (deduped by span, labelled Label()); every maximal run of uncovered hunk lines becomes one bare range labelled \"hunk\"; output sorted by Start, pairwise non-overlapping. `EffectiveRange` gains `Construct string` (json \"construct\") ADDITIVELY here — `Pad` stays until t-6 so nothing downstream breaks. range_dispatch_test's `rangingAdapter` gains a canned `Constructs` method (additive prep for t-6). Gate on `go test -count=1 ./internal/mutation/ ./internal/verify/` + `go vet ./...` observed locally; `make install` after (r-01).\n"
  covers = ["c-1", "c-3"]
  test_contract = ["if expansion returns the hunk or a padded window instead of the construct span, TestExpandWidensToTheEnclosingConstruct fails — hunk {40,41} with constructs [{10,60,FunctionDeclaration,run}] must yield exactly [{10,60,\"FunctionDeclaration run\"}]", "if a hunk spanning two constructs is merged into one range, TestExpandSplitsAHunkAcrossConstructs fails — hunk {18,23} over [{1,20,a},{21,40,b}] yields {1,20},{21,40} in that order", "if two hunks inside one construct produce two ranges, TestExpandDedupesHunksInOneConstruct fails — hunks {12,12} and {30,31} inside {10,60} yield ONE range", "if uncovered hunk lines are dropped or widened, TestExpandKeepsUncoveredLinesAsTheBareHunk fails — hunk {5,7} touching no construct yields [{5,7,\"hunk\"}]; a hunk past the last construct likewise", "if a straddling hunk loses its uncovered tail, or any two output ranges overlap, TestExpandOutputNeverOverlaps fails — hunk {18,26} with 18-20 in {1,20} yields [{1,20,…},{21,26,\"hunk\"}]; a property check over 200 random layouts asserts no overlap and every hunk line lies in exactly one output range", "if an empty construct list changes the hunks, TestExpandWithNoConstructsIsTheRawHunks fails — every hunk returned verbatim labelled \"hunk\"", "if Label emits a trailing space for a missing Name, TestLabelOmitsAMissingName fails — {Kind:\"ExpressionStatement\"} labels as exactly \"ExpressionStatement\""]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Kill verify.go:115 reuse-report survivor at command level"
  files = ["internal/cmd/verify_reuse_report_test.go"]
  description = "Two command-level tests through `runCmd(t, Verify(), …)` on a scopedVerifyRepo with a .go-only phase and `configuredAdaptersFn` stubbed to return [gremlins stub, a zero `*mutation.Stryker{}`] — the real type is needed because applyReuseReport type-asserts `*mutation.Stryker`, and a .go-only phase guarantees it is never dispatched, so nothing spawns. After the phase's verify run no longer lists survivor a22f0ab51a69e9e8, close the routed deferred (82e3e60f30734120) via `dross deferred unroute` + `dismiss` on mutation-range-provenance. Do not `survivor accept` — the criterion names the test as the fix. internal/cmd tests gate on `dross test` (remote), never --local.\n"
  covers = ["c-6"]
  test_contract = ["if `if reuseReport` at verify.go:115 is negated, a plain `dross verify <phase>` calls applyReuseReport — either the no-stryker-adapter error or Stryker.ReuseReport flipped true; TestPlainVerifyLeavesReuseReportOff asserts nil error AND ReuseReport == false afterwards, failing on both arms", "if the negation skips the refusal under `--reuse-report --detach`, the command proceeds to detachRequiresAHost and errors differently; TestReuseReportWithDetachRefusesThroughTheCommand asserts the error contains \"--reuse-report with --detach\"", "observed at verify time, not unit-asserted: the phase's verify run must not re-list a22f0ab51a69e9e8 — if it does, the tests did not reach the mutant and the task is not done"]
  status = "pending"

