[[task]]
  id = "t-5"
  wave = 1
  title = "Build idempotent completion-gated board finalizer"
  files = ["internal/boardsync/finalize.go", "internal/boardsync/finalize_test.go", "internal/boardsync/task.go", "internal/boardsync/phase.go", "internal/boardsync/ctx.go", "internal/cmd/issue_test.go"]
  description = "FinalizePhase(ctx, id) refuses unless the phase's changes.json is Complete(). It resolves or creates the phase card and every task card (plan tasks, plus\nany card carrying dross/phase:<id> and a dross/task:<id>/ label); task cards close at task-complete, then the phase card at complete. A card already at\nits terminal label AND done gets no write. Milestone linking uses only board.json's cached id, never EnsureMilestoneLink. Per-card failures are\nrecorded and the rest continue. Adds StatusComplete and StatusTaskComplete constants to ctx.go; FinalizePhase passes them, not string literals."
  covers = ["c-1"]
  test_contract = ["stateBoard/faultBoard with a phase card at shipped and 3 task cards at task-in-review: afterwards every task card carries dross/status:task-complete and reads closed, and the phase card carries dross/status:complete and reads closed", "no cards at all: the phase card and every task card are created then closed (close-on-create), and board.json gains the phase link and three task links", "a second FinalizePhase on that board logs only Get/List calls (zero Create/Update/Close/SetState) and leaves board.json byte-identical; a card that reads done but lacks its terminal status label is relabelled (the skip needs both)", "changes.json status=shipped → an error naming shipped before any board call (faultBoard.calls is empty)", "faultBoard.refuseClose on t-2's card → t-1, t-3 and the phase card still close, and the error names t-2 (TaskCloseError aggregation is not short-circuited)", "plan.toml absent → the phase card closes and a task card found by its dross/phase:<id> + dross/task: labels closes too; a marker card with dross/phase:<id> but no dross/task: label is not touched", "a missing phase card for a phase whose milestone has no cached board id → card created and closed, and faultBoard.milestones stays empty; issue_test's ctx.go-constant membership check covers StatusComplete", "TestLifecycleVocabularyIsTheConfigenumSet (internal/cmd/issue_test.go) lists StatusComplete and StatusTaskComplete, and fails if either constant is dropped from ctx.go or drifts from the configenum set"]
  status = "done"

