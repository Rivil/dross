  depends_on = ["t-3"]
  test_contract = ["survivor key accepted in survivors.toml → disposed, and why names survivors.toml", "routed survivor: target tests.json missing → not; a finalized, newer, error-free run whose scope contains the file and whose key is absent → disposed; key in OutOfScope → not; scope never touched the file → not; leg error → not; target run older than the source run → not; verify.toml not finalized → not; deferred text that does not parse to a file → not", "plain item: target complete + a target criterion deferred=[id] → disposed, why naming phases/<target>/spec.toml and the criterion id; target complete with no absorbing criterion → not (the 47a5c93 rule); absorbing criterion but target only shipped → not; a criterion listing the id in a complete phase that is NOT the item's target → not; item with an empty id → not", "the signature takes (root, entry) and no board client, so a verdict derived from card state cannot compile"]
  status = "done"

