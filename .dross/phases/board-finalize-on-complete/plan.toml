[[task]]
  id = "t-7"
  wave = 2
  title = "Match keyed array-of-tables elements by identity"
  files = ["internal/project/patch.go", "internal/project/patch_diff.go", "internal/project/patch_save.go", "internal/project/patch_keyed_test.go", "ARCHITECTURE.md"]
  description = "The door gains an OPTIONAL identity map (options struct; nil = today's positional/deep-equal matching), so project.Save, the diff(old, new) test callers and\nt-8's survivor.Save compile unchanged. Keyed arrays (e.g. task→id) match by key, never by position: a matched element gets per-field ops, a reorder becomes a\nblock move, an insertion at index i an insert-before op, a removal a block delete. A comment run directly above a [[header]] (no blank line between) travels\nwith that element. Re-points the ARCHITECTURE.md apply/diff anchors this edit shifts."
  covers = ["c-4"]
  depends_on = ["t-2"]
  test_contract = ["keyed reorder [t-1,t-2,t-3]→[t-1,t-3,t-2] relocates t-3's block whole: no field is rewritten in place, and the t-1 and t-2 blocks remain byte-identical substrings", "inserting a new element at index 1 lands it between t-1 and t-2, not at EOF, and verifyPatched accepts it; cutting the inserted block back out returns the original bytes exactly", "a comment directly above t-3's header moves with t-3 and one separated by a blank line stays put; deleting t-2 keeps '# about t-3' and removes t-2's own body comment", "changing t-4.status while removing t-2 in one diff touches exactly two regions: t-4's status line and t-2's block", "a duplicate identity value on either side → error, no write; a keyed patch that would not decode to the saved value is refused and the file is untouched", "TestDiffArrayOfTablesEditInPlace (unkeyed stack.locked) and the project lossless suite stay green", "existing callers compile and pass unmodified: save_lossless_test.go and patch_diff_test.go still call diff(old, new) with no identity map, and project.Save passes none", "TestArchitectureNamesLosslessWriter still resolves every apply/diff anchor after the keyed-patcher edit"]
  status = "done"

