[phase]
id = "tool-output-not-persisted"

[[task]]
id    = "t-1"
wave  = 1
title = "Add the shared tool-failure recorder"
files = [
  "internal/mutation/toolfail.go",
  "internal/mutation/toolfail_test.go",
  "internal/mutation/stryker.go",
]
description = """
toolfail.go holds the unexported record type, the constructor
RecordToolFailure(tool string, exit int, c capture), and the carrier
RecordLegError(err) returning a named LegError type. `capture` has two
constructors — Observed(n int) and NotCaptured(why string) — so a detached run
records `output was not captured; this run was detached` rather than a
structurally false `0 bytes`. Error() is fixed prose naming the tool, its exit
status, the capture clause and the stderr pointer; Unwrap preserves the wrapped
error's identity. headBuffer moves here from stryker.go, gains a `seen` counter
totalling every byte written (not the retained prefix), and a printHead(w, tool,
n) replacing quote() — the banner is tool-parameterised, since t-4 routes
gremlins and stryker.net through the same helper.
"""
covers = ["c-1", "c-3"]
test_contract = [
  "a headBuffer with a 64 KiB limit fed 100 KiB reports 102400 bytes; a record built from buf.Len() reads the saturated 65536 and fails",
  "reflect pins RecordToolFailure's parameter list as exactly (string, int, capture) and the record type as having no exported field — adding a second string or a []byte parameter fails, which are the only two routes by which captured output could re-enter",
  "a canary fed through the headBuffer appears nowhere in the returned error's text, at any truncation length",
  "Error() dropping the exit status, the capture clause, or the stderr-pointer sentence fails",
  "Error() built from Observed(n) says the number is tool output OBSERVED, not retained — the wording c-1 and c-2 word as `captured` is pinned here so verify.toml and the criterion cannot be read as disagreeing next to a 64 KiB cap",
  "a record built from NotCaptured names why nothing was captured and contains no byte count at all; substituting Observed(0) for it fails",
  "Error() contains the tool name as a bare token, so telemetry's mutation bucket — which keys on the substrings `stryker`, `gremlins` and `mutation adapter` at telemetry.go:316 — keeps classifying these errors; a rewording that drops the tool name pushes them into `other` and fails here",
  "errors.Is(record wrapping a sentinel, sentinel) holds, or the RemoteTransport classification silently stops firing",
  "printHead(w, `stryker`, n) writes byte-for-byte what quote() produced, header line and continuation tail included; called with another tool name it writes the identical shape with that name substituted",
  "a start failure (no *exec.ExitError) records `did not start`, not exit status -1",
]
status = "pending"

[[task]]
id    = "t-2"
wave  = 1
title = "Declare the tool-text sink registry"
files = [
  "internal/toolfence/fields.go",
  "internal/toolfence/fields_test.go",
]
description = """
A leaf package mirroring pathfence.Fields: Field{Struct, Field, Tag, Artifact}
with exactly one disposition. Three dispositions — Recorded{Carrier} for a field
written only through the carrier, NotToolStream{Why, Writers} for a persisted
text field provably not captured stream, and Renderable{Why, SourcedFrom} for a
field derived from a Recorded one that a composer may print (spec decision
renderable_derivation). Entries: Recorded — verify.LanguageRun.Error,
verify.LegSummary.Error; Renderable — verify.Finding.Text; NotToolStream —
telemetry.Event.ErrorDetail, verify.SkippedFile.Reason,
verify.CriterionResult.Notes, verify.OutOfScopeMutant.Note,
verify.Scope.Degraded, mutation.Mutant.Snippet, mutation.Mutant.Note.
Scope.Degraded is a []string, so the registry and walker cover slice-of-string
sinks as well as scalars; its Why records that it holds gitReason(err) values
and carries no tool output only because exec.ExitError.Error() omits the stderr
that .Output() captured — a stdlib property, not a guarantee. A package doc
comment states the registry's scope — the internal/cmd, verify, mutation and
telemetry path, where the recorder is the only writer — and why the
agent-authored ledgers (security.Finding, quality.Finding, techdebt.Finding) are
a separate problem rather than an oversight. It also defines what `Writer` means
for a field no Go code writes (CriterionResult.Notes is authored by the agent
editing verify.toml), so the stale-declaration arm is not expected to resolve it
to a call site.
"""
covers = ["c-4"]
test_contract = [
  "Validate, fed synthetic entries, names each of: no disposition, more than one disposition, Recorded with a blank Carrier, NotToolStream with an empty Why, NotToolStream naming no Writer, Renderable with no SourcedFrom, and a duplicated Name — so a Validate returning nil unconditionally cannot pass",
  "the by-name pin fails when any of LanguageRun.Error, LegSummary.Error, Finding.Text, CriterionResult.Notes, Scope.Degraded or telemetry.Event.ErrorDetail is deleted, and fails on a count check so a new entry cannot be added unpinned",
  "the scope statement is asserted, not just written: the test names the four walked roots and fails if the registry declares a field from a package outside them without the doc comment being updated",
]
status = "pending"

[[task]]
id         = "t-3"
wave       = 2
depends_on = ["t-1"]
title      = "Route stryker's failure paths through the recorder"
files = [
  "internal/mutation/stryker.go",
  "internal/mutation/stryker_test.go",
  "internal/mutation/stryker_failure_test.go",
]
description = """
The missing-report branch stops building its error from head.quote: it prints the
head to os.Stderr at the failure point via printHead and returns the record
wrapped with the dross-authored context — `stryker did not write a report at
<path>: %w` — so the expected report path survives in the error while the tool's
own output does not. The initial-test truncation note stays as fixed prose.
checkInstrumented prints its head to stderr and keeps its own dropped-path
message, without the embedded quote — the tool succeeded there and the
dropped-path list is the whole diagnostic. The existing pins in stryker_test.go
MOVE rather than relax: :749 (cause is inside err.Error()) becomes an assertion
that the cause is in captured stderr, and :948's newline cap on the error is
retargeted at the stderr block so it cannot pass vacuously. :454 and :457 stay
green unchanged, which is what the wrapping above is for.
"""
covers = ["c-1", "c-2", "c-3"]
test_contract = [
  "with strykerBuildCmd stubbed to print CANARY-A, exit 3 and write no report: the error contains `exit status 3` and NOT CANARY-A, while captured stderr contains CANARY-A twice — once teed live, once under the re-printed head banner. Deleting the re-print fails the stderr half; keeping the quote in the error fails the other",
  "the error still says `did not write a report` and still names s.reportPath(), so stryker_test.go:454 and :457 pass without edit — a record returned bare, unwrapped, fails them",
  "the retargeted newline cap counts lines in the stderr block, not the error, so a printHead that stopped emitting anything fails instead of passing on a one-line error",
  "the truncation note still attaches when the head contains strykerInitialTestFailureText and does not when it doesn't",
  "checkInstrumented's error still names every dropped path and still adds the `stryker said so itself` hint when the head matched, while carrying no quoted output",
]
status = "pending"

[[task]]
id         = "t-4"
wave       = 2
depends_on = ["t-1"]
title      = "Route gremlins and stryker.net through the recorder"
files = [
  "internal/mutation/gremlins.go",
  "internal/mutation/stryker_net.go",
  "internal/mutation/stryker_net_test.go",
  "internal/mutation/gremlins_failure_test.go",
  "internal/mutation/stryker_net_failure_test.go",
]
description = """
THREE gremlins failure sites, not two: the attached loop's invocation-failed and
reportless-exit paths, and Gremlins.Collect's detached fatal path (gremlins.go:566,
wrapping ReportlessExit) — the path this repo actually runs. The detached site
records NotCaptured, since a detached run tees nothing; the attached sites gain
the headBuffer tee gremlins lacks today. stryker.net's invocation-failed path
routes the same way and gains the same tee (stryker_net.go:149 is the identical
uncaptured-stdout gap). Its no-report case is recorded at the CALL SITE,
stryker_net.go:168, not inside findReport — findReport is a package-level
function (:302) called directly by stryker_net_test.go and indirectly by
launcher_test.go, and it has no access to Run's exit status. The call site
discriminates findReport's three returns: the no-report case becomes a record
carrying the retained exit status, while the walk failure and dir-not-exist cases
pass through unchanged as dross-authored diagnostics. findReport's own messages
are unchanged, so stryker_net_test.go:105's `no mutation-report.json` pin stays
green. Launcher transport errors are untouched.
"""
covers = ["c-1"]
test_contract = [
  "errors.As(err, &record) succeeds on all THREE gremlins fatal paths — attached invocation-failed, attached reportless-exit, and Collect's detached site — and each message names the real exit status; reverting any to a bare fmt.Errorf fails",
  "the detached Collect record carries NotCaptured naming the detached run, not `0 bytes` — substituting Observed(0) fails",
  "a reportless-exit record satisfies errors.Is(err, remote.ErrRemoteCommand), so verify.go's and cmd/test.go's classification off the live error value keeps firing",
  "the remote-ssh-could-not-start path still names the host and satisfies errors.Is(err, remote.ErrTransport), so verify still grades it BLOCKING rather than FLAG",
  "if gremlins' attached output stops being teed, its record reports 0 bytes observed and the test fails — and the symmetric assertion holds for stryker.net",
  "stryker.net's no-report error names tool and exit status through the recorder and no longer says `check stryker config`; recording it inside findReport instead of at :168 fails, because findReport's direct callers in stryker_net_test.go get no exit status to record",
  "findReport's walk-failure and dir-not-exist returns reach the caller unconverted — turning either into a record fails, since neither is a tool exit",
]
status = "pending"

[[task]]
id         = "t-5"
wave       = 2
depends_on = ["t-1"]
title      = "Funnel leg errors through the recorder carrier"
files = [
  "internal/verify/verify.go",
  "internal/verify/legerror_test.go",
]
description = """
One change: verify.go:565's `Error: err.Error()` becomes
`Error: RecordLegError(err).String()`. The field stays a marshalling `string`
(pathfence's precedent: the wrapper's unexported fields cannot marshal, so the
type lives on the derived value), and LegSummary.Error's population from
LanguageRun.Error at verify.go:693 is already in place and untouched. Without
this the c-4 walker's assignment arm is red against the live tree.
"""
covers = ["c-1", "c-4"]
test_contract = [
  "a reflect check on RecordLegError's Out(0) fails the moment it reverts to string — the named type is what t-7's accepted-RHS arm keys on",
  "LanguageRun.Error and LegSummary.Error stay Go `string` and still round-trip through tests.json and verify.toml unchanged; changing either field's type fails here rather than at the serializer",
  "a leg failing with a non-tool error (an argfence refusal) still records that error's text, asserted by substring, so the funnel cannot swallow dross-authored diagnostics — this is also what lets t-3 leave checkInstrumented's own prose intact",
  "reverting the assignment to err.Error() fails the t-7 walker",
]
status = "pending"

[[task]]
id         = "t-6"
wave       = 3
depends_on = ["t-3", "t-4"]
title      = "Ban tool output inside error constructors"
files = [
