  "no composer's output contains any canary; a composer rendering a Renderable field (Finding.Text) is allowed and does not trip it",
  "the sink-keyed scan resolves all four inline body sites (milestone.go:281, issue.go:609, issue.go:785, issue.go:1337) alongside the four named composers; a scan keyed on func shape finds none of the four and fails the count",
  "the leaky_body fixture, assigning a fmt.Sprintf of leg.Error to a forge.IssueInput.Body, trips the scan",
  "the enumeration fails when the resolved composer set is empty, counted PER GROUP so a vacuous board half cannot hide behind a healthy PR half",
