description = """
One file in package cmd: three of the four named composers (renderPhaseBody,
milestoneBody, renderTaskBody) are unexported in cmd and ship.BuildPRBody is
exported, so only a cmd-side test can call all four. Depends on t-2's registry
alone — it builds its own synthetic phase.Spec / verify.Verify / phase.Plan and
never reads the carrier, so it is wave 2. Both proof halves run: every Recorded
field is filled with its own canary and each named composer is CALLED, plus an
AST scan keyed on the SINK rather than on composer function shape — every
assignment to forge.IssueInput.Body, forge.IssuePatch.Body, ship.OpenOpts.Body
and a comment's Body field. Sink-keying is what makes the four literal body
sites visible: milestone.go:281, issue.go:609, issue.go:785 and issue.go:1337
are inline fmt.Sprintf assignments, not funcs returning a body, so a
func-shaped scan resolves none of them. `dross ship comment` is enumerated as a
pass-through with a Why: its body comes only from --body / --body-file.
"""
