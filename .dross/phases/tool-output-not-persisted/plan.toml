  "any argument of errors.New, fmt.Errorf or fmt.Sprintf that contains a call to headBuffer.printHead or a read of head.buf is reported",
  "a self-test drives the same scanner over an in-test fixture where errors.New(h.printHead(...)) IS reported and fmt.Fprint(os.Stderr, ...) is NOT, so a scanner that stopped matching fails on a written-down answer instead of passing vacuously",
]
status = "pending"

[[task]]
id         = "t-7"
wave       = 3
depends_on = ["t-2", "t-5"]
title      = "Walk the declared sinks and their writers"
files = [
  "internal/cmd/toolfence_enum_test.go",
  "internal/cmd/toolfence_carrier_test.go",
  "internal/cmd/testdata/toolfence/writer_ok.go.txt",
  "internal/cmd/testdata/toolfence/writer_raw.go.txt",
  "internal/cmd/testdata/toolfence/undeclared_sink.go.txt",
]
description = """
Placed in internal/cmd beside pathfence_enum_test.go — internal/cmd imports the
registry, so the walker cannot live in internal/toolfence. FOUR walk roots: `.`
(internal/cmd itself), ../verify, ../mutation and ../telemetry. internal/cmd is
in scope because it holds three declared fields' live writers — verify.go:646
constructs the LanguageRun carrying the Recorded Error, verify.go:825 assigns
SkippedFile.Reason, and telemetry.go:61 is Event.ErrorDetail's only writer in the
tree. Matching rule is written down and asserted: EXACT match against the tag
vocabulary {error, message, note, notes, detail, output, stderr, reason, text,
degraded}, over both string and []string fields, with untagged exported string
fields on serialized structs matched by lowercased field name so mutation.Mutant
(which carries no tags) is not silently excluded.
"""
covers = ["c-4"]
test_contract = [
  "writer_raw, assigning a string literal to LegSummary.Error, trips the guard; writer_ok, assigning RecordLegError(err).String(), does not — the accepted arm covers a method call or conversion wrapping the carrier's return, not only a bare call",
  "a writer_raw variant placed under the internal/cmd root trips the guard too, so the package holding three declared fields' writers is provably walked rather than declared walked",
  "undeclared_sink — a persisted struct with json:`stderr` and no registry entry — trips the undeclared arm",
  "renaming verify.LanguageRun.Error without updating the registry fails the stale-declaration arm",
  "an RHS that copies an already-declared field (LegSummary.Error = lr.Error) is accepted, without needing a no-op wrapper",
  "the exemption is pinned from both sides: a raw fmt.Sprintf assigned to a NotToolStream field is ACCEPTED (this is what keeps lifecycle.go's Mutant.Note assignments green), and flipping a Recorded entry to NotToolStream to silence writer_raw FAILS — so reclassification is not the cheap way out of a future red",
  "the vocabulary is asserted exact: adding a synthetic field tagged `notes` to a walked struct trips the undeclared arm, and one tagged `footnote` does not — so a prefix-matching regression is visible rather than silently widening the guard",
  "a []string field tagged `degraded` is seen by both arms; restricting the walk to string-typed fields fails",
  "vacuity floor: fewer than three declared fields found, or zero assignment sites seen in each of the four roots, fails",
]
status = "pending"

