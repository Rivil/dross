  title = "Kill the two recorder survivors and pin stryker's record structurally"
  files = ["internal/mutation/toolfail_test.go", "internal/mutation/stryker_failure_test.go", "internal/mutation/stryker.go", "internal/mutation/toolfence_residual_test.go"]
