[[task]]
  id = "t-3"
  wave = 1
  title = "Status reads shipped from the record, names retry"
  files = ["internal/cmd/status.go", "internal/cmd/status_test.go", "internal/watch/drift_test.go"]
  description = "Derived \"record pending\" shape: ch.PR > 0 && ch.Status != changes.StatusShipped\n&& !changes.Complete && !stateShipped — no new field or marker. Precedence: a\nshipped state.json outranks a missing changes.json status, so legacy records\n(shipped before Status existed) keep reading shipped. shippedUnmergedPhase\n(status.go:575-600): the shipped signal becomes `state shipped || ch.Status ==\nStatusShipped`; the pending shape prints \"pending: phase/<id> — PR #N is open\nbut its record has not reached origin; re-run `dross ship <id>`\" instead of the\nshipped line. suggestNext (status.go:295-311): split the phaseMergeState consult\nso the order is mergeMerged -> pending-retry arm (\"`dross ship <id>` — push the\nPR record for #N\") -> mergeOpen. drift.go unchanged; pin it with a test.\nwriteOracleChanges (status_test.go:1333) gains a status argument so the oracle\nfixtures seed status=\"shipped\"; the retry arm is never weakened to make them pass."
  covers = ["c-2"]
  test_contract = ["fixture phase/x checked out, changes.json {pr:42, base:main, no status}, state status cleared: `dross status` contains `re-run \\`dross ship x\\`` and NOT `shipped:`; suggestFor returns a string containing `dross ship x` and not `merge the open PR`; today (status.go:597-600 keys on pr != 0) prints the shipped line", "TestStatusShippedFromPRRecordAlone (status_test.go:993) re-seeded with changes.json status=\"shipped\" must still print `shipped:` and `#42`", "TestSuggestNextMergedLegacyRecordStillCompletes: {pr:42, status:\"\"} with phase/x already in origin/main's ancestry: next step names `dross phase complete`, not ship (a retry arm ordered before the merged consult fails this)", "control: same fixture with changes.json status=\"complete\" prints neither line (Complete suppressor unchanged)", "watch pin TestDriftPROpenButStateNotShipped: state {} + changes {pr:42, no status} + verdict pass yields DriftVerifiedUnshipped, ok=true; state shipped + changes status shipped + pr 42 yields no drift", "TestStatusCountsShippedPhaseDone (status_test.go:370) still counts a status=\"shipped\" record as done through phaseDone (phasedone.go:50)", "TestSuggestNextOpenPRAdvisesTheMerge (status_test.go:1582) is re-seeded via writeOracleChanges with status=\"shipped\" and stays green; TestSuggestNextMergedPRAdvisesCompletion and TestSuggestNextNoPRFallsThrough (same fixture) stay green through the re-seed", "legacy precedence: state.json shipped + changes.json {pr:42, no status} prints `shipped:` and NOT the retry line; suggestFor does not name `dross ship x`; a pending shape that ignores state fails"]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 3
  title = "Replace ship prompt's do-not-re-run guidance"
  files = ["assets/prompts/ship.md", "internal/cmd/ship_prompt_test.go"]
  description = "ship.md:134 — replace \"Do NOT re-run `dross ship` (would open a second PR)\"\nwith: re-running `dross ship` is safe — it recognises the open PR, pushes\nanything pending on phase/<id>, and reports the existing PR by number (the URL\nis the one from the first run or the provider page; changes.json stores no\nurl); `dross ship --force` is the path when ship refuses a diverged branch, and\n`git pull --rebase origin phase/<id>` when it refuses a behind-only one.\nship.md:107-115 — the CLI step list becomes: gate phase/<id> on origin, open the\nPR (skipped when the record or the provider already has one), commit + push the\nPR record, THEN mark shipped. Recovery (ship.md:190-202): add item 4 \"Record\npush failed\": status reads verified and names the retry; run `dross ship\n<phase-id>` again. Wave 3 so the installed prompt never describes a ship the\ninstalled binary cannot do. `make install` after the edit (r-01)."
  covers = ["c-3"]
  depends_on = ["t-6"]
  test_contract = ["a test reads assets/prompts/ship.md via repoRootFromTest and fails on strings.Contains(content, `Do NOT re-run`) or `would open a second PR`; fails unless the On-failure block contains `re-run \\`dross ship\\`` (or `re-running \\`dross ship\\``); fails unless the Recovery section names `record push` and `dross ship` — asserted by section-slicing, the way TestShipPromptRecoverySection does", "existing TestShipPromptRecoverySection keeps its required phrases; dropping `dross phase complete --recover` or `dross ship recover` fails it", "TestPromptsNeverStageStateJSONByPath (ship_test.go:1412) stays green", "the rewritten re-run guidance does not claim a URL is returned on re-run: a test fails if the On-failure block contains `<pr-url>` between the \"re-run\" sentence and the next heading"]
  status = "pending"

