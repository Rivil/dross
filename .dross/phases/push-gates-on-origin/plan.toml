[[task]]
  id = "t-6"
  wave = 2
  title = "Gate record push on origin; flip shipped after"
  files = ["internal/cmd/ship.go", "internal/cmd/ship_test.go"]
  description = "Restructure ship.go:269-449 into ordered stages, all after the base safety net:\n(a) load changes.json; existingPR := ch.PR.\n(b) pushPhaseBranch(repoDir, phaseBranch, forcePush) replaces the unconditional\n    push at 336-347 (a diverged OR behind-only branch refuses BEFORE any PR\n    exists; the guided error is pushPhaseBranch's own).\n(c) existingPR == 0 -> ship.OpenPR as today; else res = {Number: existingPR},\n    narrate \"PR #N already open — pushing the pending record\", shipResultTag\n    gains an \"existing\" arm, --json emits the existing number with an empty url\n    (changes.json stores none).\n(d) SetPR/SetBase (no SetStatus) -> git add -> commit \"chore(dross): record PR\n    #N for <id>\" only if staged.\n(e) pushPhaseBranch again — hard error on failure, wording ends \"re-run `dross\n    ship <id>` to push the record\"; the record commit is left in place. A\n    divergence refusal here surfaces pushPhaseBranch's pull/--force guidance\n    verbatim, never the bare re-run.\n(f) only now: state.CurrentPhaseStatus = \"shipped\" + history-guarded `shipped\n    <id>` + Save; changes.SetStatus(StatusShipped) -> commit \"chore(dross): mark\n    <id> shipped\" if staged -> pushPhaseBranch a third time. On failure here:\n    emit --json first, then return a non-zero error whose text says the phase IS\n    shipped and names `dross ship <id>` to push the marker; state stays shipped.\n    A divergence refusal at (f) likewise carries the pull/--force guidance so the\n    re-run cannot loop on the same refusal. This is a deliberate second\n    retry state: unlike c-4 it cannot lie, because both markers already read\n    shipped and only the origin copy lags.\nDelete the pre-push state save + \"chore(dross): ship\" commit at 269-287. Move\nthe \"Marked shipped\" narration after (f)."
  covers = ["c-1", "c-2", "c-3", "c-4"]
  depends_on = ["t-1"]
  test_contract = ["happy path (TestShipFullFlowAgainstMockProvider, ship_test.go:322, updated): tree clean; local HEAD == `git rev-parse phase/x` in the bare origin; `git show phase/x:.dross/phases/x/changes.json` in origin has pr==99 AND status==\"shipped\"; state shipped; log has no `chore(dross): ship x`", "c-4 TestShipFailedRecordPushIsNotShipped: bare origin gets a pre-receive hook that exits 1 only when `git log -1 --format=%s \"$new\"` contains `record PR` (first push and PR open succeed, record push fails). After run 1: err != nil and contains `dross ship x`; state CurrentPhaseStatus != \"shipped\" and history has no `shipped x`; local changes.json pr==99 and status != \"shipped\" (residue locked); local HEAD subject == `chore(dross): record PR #99 for x`; origin's changes.json pr==0; phaseDone(root,\"x\") == false and `dross phase list` line for x has no ✓; `dross status` output lacks `shipped:` and contains `dross ship`. A mutant that flips state before the push fails the status assertion; one that keeps SetStatus in the record commit fails the local changes.json status assertion", "c-4 second run: hook removed; run 2 returns nil; POST /pulls count across both runs == 1 (c-3); origin phase/x tip's changes.json pr==99 and status shipped; state shipped; tree clean; output contains `#99`", "c-1 TestShipPushesLocalOnlyRecordWithNothingStaged: after a successful ship, `git update-ref` origin's phase/x back one commit in the bare repo — index clean — re-run ship: origin tip == local HEAD again; today's `diff --cached --quiet` gate (ship.go:432) pushes nothing and this fails", "TestShipInSyncIssuesNoPush: a pre-receive hook on the bare remote that always exits 1 and writes a marker file must not fire on a re-run whose branch is already on origin", "c-3 TestShipIsReShippable (ship_test.go:819, tightened): POST /pulls == 1 over two runs; second run's stdout contains `#99`; `shipped x` history entry count == 1", "diverged phase branch: push a foreign commit to origin phase/x from a throwaway branch after the first ship, add a local commit, re-run: err mentions `git pull` and `--force`, POST count stays 1, origin tip unchanged; with --force the re-run succeeds and origin tip == local HEAD", "TestShipMarkerPushFailureIsShippedButErrors: hook rejects only subjects containing `mark x shipped`; ship returns a non-zero error mentioning both `shipped` and `dross ship`; --json output is still emitted with number 99; state.json AND changes.json both read shipped; re-run pushes the marker (remote tip subject == `chore(dross): mark x shipped`)", "TestShipFlipIsAtomic: after a clean ship state.json shipped <=> changes.json status shipped (both true); after the c-4 failure fixture both false", "TestShipDoesNotPersistPRWhenOpenFails (ship_test.go:546) extended: when the provider 500s, still no `record PR` commit and pr==0, AND state still reads the pre-ship status, not shipped (a state flip left before OpenPR fails this)", "TestShipEarlyReturnsLeaveBaseIntact and TestShipNoPushIssuesNoRecordPush unchanged and green: --no-push/--print-body make no push and no commit", "TestShipCover_ResultTag (ship_test.go:1023) gains the `existing` arm; TestShipJSONReportsExistingPR: second run under --json yields {\"number\":99,\"result\":\"existing\"}", "TestShipRecordsShippedNotCompleted (ship_test.go:1341) and TestShipPushesPRRecordToPhaseBranch (ship_test.go:453) stay green", "TestShipRecordPushDivergedNamesPull: foreign commit on origin phase/x between (b) and (e) (pushed by the pre-receive hook itself or a second clone): the (e) error contains `git pull --rebase origin phase/x` and `--force`, not only `re-run`; the record commit is HEAD; state not shipped", "TestShipMarkerPushDivergedNamesPull: foreign commit lands on origin phase/x between (e) and (f): the returned error contains `shipped`, `git pull --rebase origin phase/x` and `--force`; state.json and changes.json read shipped", "TestShipJSONReportsExistingPR pins the full shape: second run under --json yields number 99, result \"existing\", and url \"\" — a mutant that fabricates a url fails", "TestShipBehindOnlyRefusesBeforeOpen: origin phase/x one commit ahead of local before the first ship: err names `git pull --rebase origin phase/x`; POST /pulls count == 0; no `record PR` commit"]
  status = "pending"

[[task]]
  id = "t-7"
  wave = 3
  title = "Provider fallback when record has no PR"
  files = ["internal/cmd/ship.go", "internal/cmd/ship_test.go", "internal/cmd/hostpolicy_test.go"]
  description = "Between stages (b) and (c) of t-6: when existingPR == 0 call\nship.FindOpenPRByHeadFunc(opts, phaseBranch) (remotePolicy + buildOpenOpts\nhoisted above it). Hit -> treat as the existing PR (record it, narrate \"found\nopen PR #N for phase/<id>\", no OpenPR). (nil, nil) -> OpenPR. errors.Is(err,\nship.ErrHeadPRLookupUnsupported) -> narrate the skip and OpenPR. Any other error\n-> refuse before OpenPR (\"could not check origin for an open PR on phase/<id>:\n…; fix and re-run `dross ship`\") — fail-closed. shipFixture (ship_test.go:110)\ninstalls a default stubOpenPRByHead(t, nil, nil) (t.Cleanup-restored, mirroring\nstubPRMerged, phase_test.go:29) so the hand-rolled forgejo mocks never see a GET\n/pulls; c-5 tests override it. hostpolicy_test.go:125: add the\nFindOpenPRByHeadFunc stub-and-restore alongside the PRStatusFunc one.\n"
  covers = ["c-5"]
  depends_on = ["t-2", "t-5", "t-6"]
  test_contract = ["ship-died-after-open shape: after a successful ship, rewrite changes.json without pr and commit; stub returns {Number: 77, URL: \".../77\"}; re-run: stub called once with head `phase/x`; POST /pulls count stays 1; origin phase/x tip's changes.json pr==77; stdout contains `#77`", "stub returns (nil, nil) on a first ship: POST /pulls exactly once", "stub returns errors.New(\"boom\"): ship returns an error naming `dross ship`; POST count == 0; no `record PR` commit; changes.json pr stays 0", "stub returns ErrHeadPRLookupUnsupported: narration contains `skipped` and POST count == 1", "record-first: with changes.json pr==99 the stub's call count is 0 across a re-run (a lookup-first mutant fails; the record wins, the provider is never asked)", "--no-push and --print-body: stub call count 0"]
  status = "pending"
