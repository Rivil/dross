[[task]]
  id = "t-1"
  wave = 1
  title = "Extract shared origin gate; add phase-branch push"
  files = ["internal/cmd/originpush.go", "internal/cmd/originpush_test.go", "internal/cmd/basebranch.go"]
  description = "Lift basebranch.go:63-86 (fetch, rev-parse origin ref, two rev-lists) into\ncompareWithOrigin(repoDir, branch) returning originDelta{Missing bool; Ahead\n[]string; Behind bool}. pushBaseIfAheadDrossOnly keeps its exact policy\n(.dross-only filter, diverged -> silent no-op, hard error on push failure) but\nconsumes the delta. Add pushPhaseBranch(repoDir, branch string, force bool)\n(pushed bool, err error): Missing or Ahead&&!Behind -> `push -u origin <b>`;\nlevel -> no push, pushed=false; Behind&&!Ahead -> guided error naming\n`git pull --rebase origin <b>` (local must be up to date to ship; nothing to\nforce, so --force is not offered); Ahead&&Behind&&!force -> guided error naming\n`git pull --rebase origin <b>` and `dross ship --force`; force ->\n`push -u --force-with-lease`. All argv via gitRefArgs. `-u` on every non-force push."
  covers = ["c-1"]
  test_contract = ["local phase/x one commit ahead of origin/phase/x with a CLEAN index: pushPhaseBranch pushes and `git rev-list origin/phase/x..phase/x` is empty afterwards; a gate reading `git diff --cached` (today's ship.go:432) pushes nothing and fails here", "level branch plus a pre-receive hook refusing everything: pushed=false, err=nil; an always-push mutant errors", "diverged fixture (TestPushBaseDivergedNoop recipe on phase/x): err mentions `git pull` and `--force`, origin tip unchanged; same fixture with force=true: origin tip == local HEAD", "origin/phase/x missing: push succeeds AND `git rev-parse --abbrev-ref phase/x@{upstream}` == origin/phase/x (the -u is load-bearing for the prompt's later `git push`)", "TestOriginCmpSeesUnfetchedRemoteCommit: a commit pushed to origin from a second clone classifies Behind; a helper that skips the fetch reads in-sync and fails", "TestOriginCmpMissingRemoteRef: a never-pushed branch reads Missing=true, err == nil (the first-ship case); swallowing it as an error fails", "shared-helper proof: a mutant inverting Behind fails BOTH the existing TestPushBaseDivergedNoop (basebranch_test.go:237) AND the new TestPushPhaseBranchDivergedRefuses; TestPushBaseDrossOnlyAheadPushes, TestPushBaseNotAheadNoop, TestPushBaseCodeAheadRefusesAndPushesNothing, TestPushBaseRejectedPushSurfacesGitOutput and TestPushBaseUnreachableOriginHardError stay green unchanged", "source pin: a test reads internal/cmd/basebranch.go and fails if it still contains a `rev-list` argv of its own (the `neither carries its own copy` half of shared_origin_gate)", "TestPushPhaseBranchBehindOnlyRefuses: origin/phase/x one commit ahead of local, local has nothing new: pushPhaseBranch returns an error naming `git pull --rebase origin phase/x` and NOT `--force`; nothing is pushed; a behind-only no-op mutant returns nil and fails"]
  status = "pending"

