[phase]
  id = "project-toml-lossless-writes"

[[task]]
  id = "t-1"
  wave = 1
  title = "Build raw-byte project.toml patcher (index + apply)"
  files = ["internal/project/patch.go", "internal/project/patch_value.go", "internal/project/patch_test.go", "internal/project/testdata/lossless.toml"]
  description = "indexDoc(src []byte) (*doc, error) classifies every line: header (table / array-of-tables\nwith dotted path + running element index), key line (indent, full key path incl. quoted and\ndotted keys, value start offset, value END line — multi-line arrays and \"\"\"/''' strings span\nlines), comment, blank; records EOL (\\n vs \\r\\n) and whether the last line is newline-\nterminated. Inline tables {…} are indexed as a value span but flagged so apply refuses them\nby line number. apply(src []byte, ops []op) ([]byte, error) re-indexes after every op. Set on\nan existing key replaces ONLY the value span (indent, key spelling, trailing # comment\nsurvive; a multi-line value is replaced whole). Set on a missing key inserts after the\ntable's last key line, copying sibling indent (header indent + indent unit when empty).\nMissing table / array-of-tables element → new header block after the last header sharing\nthe parent prefix, else EOF (missing final newline added first). Delete key → remove the\nline; delete array-of-tables element → remove its header-to-next-header span; a header left\nwith no keys (modeled or not) AND no comments is removed — one sheltering a hand-added key\nor comment stays. renderValue(v any) string encodes a one-key map through BurntSushi and\nstrips the `k = ` prefix so escaping is byte-for-byte today's. Inline-table target → error\nnaming key + line + the [board.state_map]-style rewrite; returned bytes equal the input.\nop = {table []string, elem int (-1 unless array-of-tables), key string, value any (nil = delete)}\nplus append-element / delete-element for array-of-tables. No new TOML dependency (locked).\n"
  covers = ["c-1", "c-2", "c-6"]
  test_contract = ["if the value scanner stops at the # inside `desc = \"a # b\"  # real`, TestIndexValueSpanIgnoresHashInsideStrings fails (span must end before `  # real`)", "if a multi-line `non_goals = [\\n \"a\", # c\\n \"b\",\\n]` is not indexed as one 4-line value span, TestIndexMultilineArraySpan fails", "if a \"\"\" string containing ] and = is split, TestIndexMultilineBasicString fails", "if [[stack.locked]] elements are not numbered 0..3 in file order, TestIndexArrayOfTablesElementIndex fails", "if a CRLF file is indexed with EOL \\n, TestIndexRecordsCRLF fails", "if `\"fix versions\" = \"x\"` (quoted key) or `state_map.planned = \"x\"` (dotted key inside [board]) is not resolved to its full key path, TestIndexQuotedAndDottedKeys fails", "if replacing `version = \"1.7.5.0\"  # bumped` loses the trailing comment or the 2-space indent, TestApplyReplaceKeepsIndentAndTrailingComment fails", "if replacing a three-line goals.non_goals array leaves orphaned `\"…\",` lines, TestApplyMultilineArrayReplacedWhole fails (output must toml.Decode)", "if inserting `profile = \"go\"` into [stack] lands after [[stack.locked]] (outside the table's direct-key span), TestApplyInsertStaysInsideTableSpan fails", "if inserting paths.source into the empty [paths] of the repo-shaped fixture does not yield `  source = \"internal\"` before [env] with every other line byte-identical, TestApplyAddKeyMatchesSiblingIndent fails", "if a new [board.state_map] on the repo's own project.toml shape is not emitted as `  [board.state_map]` / `    planned = …` after [board]'s last key and before [paths], TestApplyNewSubtableMatchesEncoderLayout fails", "if two set ops on the same table land on the same line (stale offsets), TestApplyTwoOpsSameTableBothLand fails", "if deleting project.description removes more than one line or the `# ` comment line above it, TestApplyDeleteLeavesNeighbourComment fails", "if deleting the last state_map key leaves an empty [board.state_map] header, TestApplyDeleteLastKeyRemovesEmptyHeader fails; if the header held a comment and was removed anyway, TestApplyKeepsHeaderThatHoldsAComment fails; if it held an unmodeled key and was removed anyway, TestApplyKeepsHeaderThatHoldsUnmodeledKey fails (c-2)", "if appending a fifth [[stack.locked]] block lands at EOF instead of after the fourth, TestApplyAppendArrayElementAfterLastSibling fails", "if deleting [[competition]] element 0 removes anything but that block's lines, or `note = \"hand-added\"` under element 1 is not byte-for-byte intact, TestApplyDeleteArrayElementKeepsSiblings fails", "if renderValue(\"a\\\"b\\\\c\\n\") differs from what toml.NewEncoder writes for the same string, TestRenderValueMatchesEncoder fails", "if a CRLF source gets an inserted line ending in bare \\n, TestApplyPreservesCRLF fails", "if a file with no trailing newline gets a new table glued onto its last line, TestApplyEOFNewline fails", "if an inline-table target is silently rewritten instead of refused with its key and line number (returned bytes == input), TestApplyRefusesInlineTableByLine fails", "every apply test additionally asserts toml.Decode(after) succeeds and the decoded value at the op path equals the op value"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 2
  title = "Diff two Projects into shape-typed ops"
  files = ["internal/project/patch_diff.go", "internal/project/patch_diff_test.go"]
  description = "diff(old, new *Project) ([]op, error). Each side is converted to a generic tree\n(toml.Marshal → toml.Unmarshal into map[string]any) so omitempty, toml:\"-\" and every tag\nsemantic come from the locked encoder, not a second tag interpreter. Walk both trees; emit\nops only for differing leaves. Present in old, absent in new (omitempty leaf went zero) →\ndelete; present in new, absent in old → set (insert); non-omitempty leaf that went zero →\nset-to-zero-literal. Tables/maps → per-key set/delete, never whole-table replace.\nArray-of-tables: lengths equal → positional field-wise diff; lengths differ → match by deep\nequality, delete-element for unmatched old, append-element (whole block) for unmatched new.\nUnclassifiable node kind → error naming the path, never a silent skip.\nEncoder hand-off (plan-review flag 3): the tree conversion goes through ONE local\nunexported helper, encodeCanonical(p *Project) ([]byte, error) — the only place in the\npackage that calls the BurntSushi encoder besides today's Save — not a bare toml.Marshal at\nthe call site; t-3 renames/folds it into encodeFresh so the package ends with exactly one\nencoder call site for t-5 to pin."
  covers = ["c-3", "c-6"]
  depends_on = ["t-1"]
  test_contract = ["if the differ emits an op for an unchanged field, TestDiffNoChangeIsNoOps fails (Load of the tracked .dross/project.toml diffed against itself → zero ops)", "if setting Project.Version alone yields anything but one scalar op at table [project] key version, TestDiffScalarChangeIsOneOp fails", "if clearing Stack.Profile (omitempty) emits a set-\"\" op instead of a delete, TestDiffOmitemptyZeroIsDelete fails", "if clearing Repo.Layout (no omitempty) emits a delete instead of `layout = \"\"`, or Repo.SquashMerge=false emits a delete instead of `squash_merge = false`, TestDiffRequiredZeroIsSetLiteral fails", "if deleting one state_map key yields a whole-map op, or adding Runtime.Services[\"db\"] yields anything but per-key set ops under [runtime.services.db], TestDiffMapDeleteIsPerKey fails", "if changing lane 1's Command among three lanes yields anything but one set op at elem 1 key command, TestDiffArrayOfTablesEditInPlace fails", "if removing the middle of three test lanes yields anything but one delete-element op for elem 1 (zero ops touching elems 0 and 2), TestDiffArrayOfTablesShrinkRemovesOnlyThatElement fails", "if adding a fourth lane yields anything but one append-element op, TestDiffArrayOfTablesGrowAppends fails", "if a walk of the generic tree of a fully-populated Project{} (every field set, every map/slice non-empty, every array-of-tables with two elements) hits a node kind the differ cannot classify, TestDiffCoversEveryProjectValueKind fails — a future field of a new shape reddens the suite the day it lands", "if the generic-tree conversion calls toml.Marshal (or toml.NewEncoder) anywhere but the single encodeCanonical helper, TestDiffUsesOneEncoderHelper (go/ast over internal/project/patch_diff.go) fails"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 3
  title = "Make Save diff-driven, verified, atomic"
  files = ["internal/project/project.go", "internal/project/project_test.go", "internal/project/save_lossless_test.go"]
  description = "Save(path) keeps its signature and stays the ONLY project.toml writer. Path absent →\nencodeFresh (the only toml.NewEncoder call site left in the package, Indent \"  \" as today;\ninit/onboard and ~30 test call sites unchanged). Path present → ReadFile, Load (a decode\nrefusal — including the remote_host trap — returns the error, never falls back to whole-file\nencode), diff, apply, then VERIFY: encodeFresh(Load(patched)) must equal encodeFresh(p)\n(canonical re-encode, so nil-vs-empty-slice and map order cannot false-positive); on\nmismatch return an error naming the first differing key and leave the file untouched.\nWrite via temp file in the same dir + fsync + rename, preserving the original mode. Zero\nops → no write at all (mtime untouched). onboard's overwrite of an existing project.toml\nbecomes a patch as a consequence.\nEncoder hand-off (plan-review flag 3): fold t-2's encodeCanonical into encodeFresh (or make\nencodeCanonical call encodeFresh) so that after this task internal/project has exactly ONE\nBurntSushi encoder call site — no toml.Marshal anywhere in the package — which t-5 pins."
  covers = ["c-1", "c-2", "c-3", "c-6"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if a patcher bug yields a document that decodes differently from p, TestSaveRefusesUnverifiedPatch (injects an op whose rendered value is mis-typed) fails because the original bytes were replaced", "if Save on a file whose Load is refused (remote_host set) overwrites it instead of erroring, TestSaveNeverOverwritesARefusedFile fails", "if Load then Save with no mutation changes a single byte of the fixture (comments, unmodeled keys, 2-space indent, multi-line array), TestSaveNoopIsByteIdentical fails — a spurious op from the diff layer shows up here as a changed line", "if a Save with no struct change rewrites the file, TestSaveNoChangeLeavesMtime fails", "if setting Project.Version changes more than exactly one line, TestSaveSingleFieldChangesOneLine fails", "if Board.Enabled=false does not remove exactly the `enabled = true` line and nothing else, TestSaveOmitemptyZeroDeletesLine fails; if clearing Stack.Profile does not remove exactly the `profile =` line, or Repo.SquashMerge=false does not rewrite it as false in place, TestSaveUnsetDeletesLine fails", "if Stack.Languages = [\"go\",\"sql\"] changes anything but the `languages =` line, TestSaveListReplacesOneValue fails", "if adding StateMap[\"uat\"] to an existing [board.state_map] with two entries adds more than one line, or with no such table does not produce [board.state_map] + one line after [board]'s last key and before the next header, TestSaveStateMapPerKey fails", "if adding Runtime.Services[\"db\"] does not append a [runtime.services.db] subtable inside the runtime region, or changing Constraints[\"hosting\"] touches more than one line, TestSaveMapTablesAreLeafOps fails", "with three [[runtime.test_lane]] blocks: if append does not add one new block after the third; if editing lane 1's Command changes anything but that `command =` line or a comment / hand-added note inside lane 1's block does not survive; if removing lane 0 removes anything but lane 0's block — TestSaveArrayOfTablesAlignment fails", "if an apply/verify error mid-way leaves a truncated or altered project.toml (today's os.Create shape), TestSaveFailureLeavesOriginalBytes fails (inline-table target is the injected refusal; on-disk bytes must equal the input)", "if Save on a missing path stops producing today's encoder output, the existing TestRoundTrip, TestSaveDefaultsAreOmittedAndOptionalsRemainEmpty and TestNoTestLaneIsAbsentFromTheDocument fail", "if a 0-byte existing file cannot be patched into a Load-equal document, TestSaveOntoEmptyFile fails", "every case above also Loads the result and asserts canonical equality with the struct that was saved (semantics, not just bytes)", "if after this task internal/project contains more than one BurntSushi encoder call site (toml.NewEncoder or toml.Marshal), or the differ's tree conversion no longer routes through encodeFresh, TestProjectPackageHasOneEncoder fails"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 4
  title = "Prove every writer path is lossless end to end"
  files = ["internal/cmd/project_lossless_test.go"]
  description = "One fixture project.toml seeded with: a leading `# ` header comment, a mid-table comment\ninside [runtime], an inline `# why` after version, `note = \"hand-added\"` under\n[[competition]], a note under [[stack.locked]], an unmodeled [custom] table, an unmodeled\nkey in [remote], a multi-line non_goals = [ … ], three [[runtime.test_lane]] blocks (one\ncarrying a comment), 2-space indentation; a go.mod beside it so `stack apply` resolves the\ngo profile. Helper onlyLinesChanged(t, before, after, wantAdded, wantRemoved) asserts the\nadded/removed line set is exactly the targeted key(s). Each subtest runs the real cobra\ncommand in-process (runCmd, chdir, mustRead from cmd_test.go) in a t.TempDir root; after\nevery write a shared assertion requires both note keys, [custom], the unmodeled [remote]\nkey and every `# ` comment line to survive (c-2). Writer matrix: state set version;\nproject set (scalar, stack.languages array, remote.reviewers absent-key insert,\nboard.state_map.planned + board.fields.state absent-subtable, --unset scalar, --unset last\nstate_map key); issue enable/disable; test lane add / edit --command / remove (middle of\nthree); stack apply. Plus a copy of the repo's own tracked .dross/project.toml with only the\nversion bumped through state set version.\n"
  covers = ["c-1", "c-2", "c-4", "c-6"]
  depends_on = ["t-3"]
  test_contract = ["if `state set version` touches any line but the `version =` line of the fixture, TestLosslessStateSetVersion fails on the changed-lines set", "if either note, the [custom] table, the unmodeled [remote] key or any `# ` comment line is missing after ANY write in the matrix, TestLosslessUnmodeledKeysSurviveEveryWriter fails (runs the whole matrix and greps for each after every step) — if any writer round-trips the whole struct, this is the assertion that reddens", "if `project set stack.languages go,toml` rewrites the multi-line non_goals array or anything outside its own line, TestLosslessArrayWriteIsOneLine fails", "if `project set remote.reviewers a,b` on an absent key adds more than one line or adds it outside [remote], TestLosslessAbsentKeyInsertsInsideTable fails", "if `project set board.state_map.planned X` / `board.fields.state Status` on an absent sub-table produces anything but header + one line after [board]'s last key, TestLosslessSubtableCreatedOnFirstWrite fails", "if `project set --unset project.description` removes the comment beside it, or --unset of the last state_map key leaves the empty header, TestLosslessUnsetIsOneLine fails", "if `issue enable` / `issue disable` change anything but the enabled line, TestLosslessIssueToggle fails", "if `test lane remove` on the middle of three lanes touches lane 1's or lane 3's block, TestLosslessLaneRemoveLeavesSiblings fails; if `lane edit` touches more than its `command =` line or drops the block's comment, or `lane add` adds anything but one block after the last, TestLosslessLaneAddEditOneBlock fails", "if `stack apply` touches anything outside the [runtime] keys the profile sets and stack.profile, TestLosslessStackApply fails", "if bumping the version on the real project.toml copy yields a diff of more than one line (indentation of `  [[stack.locked]]` or the empty [paths]/[env] headers re-rendered), TestLosslessRealProjectTomlOneLineDiff fails"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 4
  title = "Pin the single project.toml write path"
  files = ["internal/cmd/project_writer_pin_test.go"]
  description = "go/ast scan (same technique and FLAG/PASS snippet-table self-check as\nhermetic_dross_read_test.go) of every non-test .go under internal/: (a) outside\ninternal/project, any os.WriteFile / os.Create / os.OpenFile / os.Rename whose path\nargument mentions project.File or the literal \"project.toml\" — including the two-step\n`p := filepath.Join(root, project.File); os.WriteFile(p, …)` shape — is a violation;\n(b) outside internal/project, any toml.NewEncoder / toml.Marshal whose argument is not\nos.Stdout and whose enclosing file references project.File is a violation; (c) inside\ninternal/project, exactly one toml.NewEncoder call site exists, its enclosing FuncDecl is\nencodeFresh, and encodeFresh's only callers are Save and the verify step. Violations are\ncomputed by a pure function over source text so the teeth are proven on synthetic input.\nWave 3 (not 1) because clause (c) is false until t-3 lands.\nClause (c) counts toml.Marshal alongside toml.NewEncoder inside internal/project (plan-review\nflag 3): the differ's tree conversion and the verify step both go through encodeFresh, so\ntoml.Marshal call sites in the package are zero — a future re-encode fallback written as\ntoml.Marshal(p) is caught the same as a second NewEncoder."
  covers = ["c-3"]
  depends_on = ["t-3"]
  test_contract = ["if a new cmd file does os.WriteFile(filepath.Join(root, project.File), …), TestProjectTomlHasOneWriter fails naming the file:line", "if someone adds a second toml.NewEncoder in internal/project (a re-encode fallback), TestEncodeFreshIsTheOnlyEncoder fails", "if the detector misses the `p := filepath.Join(root, project.File); os.WriteFile(p, …)` two-step shape or the literal \"project.toml\", TestWriterPinCatchesIndirectPath (synthetic source) fails", "if a snippet outside internal/project calling toml.NewEncoder(f).Encode(p) with any receiver other than os.Stdout is not reported, TestDetectsStrayProjectEncoder fails", "if it flags projectShow's toml.NewEncoder(os.Stdout) or a plain p.Save(path), TestWriterPinAllowsStdoutEncode fails", "if any non-test .go under internal/ (except internal/project) has a finding today, TestNoWriterBypassesProjectSave fails", "if a toml.Marshal(p) call is added inside internal/project (a re-encode fallback that bypasses encodeFresh), TestEncodeFreshIsTheOnlyEncoder fails — Marshal is counted as an encoder call site, zero allowed"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 5
  title = "Document the fix and retire the per-repo bans"
  files = ["README.md", "ARCHITECTURE.md", "internal/cmd/lossless_docs_test.go"]
  description = "README's `### Updating` section gains a short subsection stating that `dross project set`\nand `dross state set version` are now surgical — comments and unknown keys survive, only the\ntargeted line changes — so per-repo rules banning them (e.g. codriver.nvim's r-01) are safe\nto retire. The `dross project {show,get,set}` table row is NOT also edited (one location,\none pin). ARCHITECTURE.md's project-config entry names Save as the sole project.toml writer\nand the raw-byte patcher with internal/project/patch.go file:line pointers (same pin shape\nas TestArchitectureNamesHermeticGuard). No PR-body task: ship.BuildPRBody\n(internal/ship/body.go:20) renders every spec criterion verbatim, so c-5's own wording lands\nin the PR; the README note is what outlives it. Lands after t-4 so the lossless claim is\nwritten only once the tests that prove it exist.\n"
  covers = ["c-5"]
  depends_on = ["t-4"]
  test_contract = ["if README.md's `### Updating` section no longer contains a subsection naming both `dross project set` and `dross state set version` together with \"safe to retire\" and \"r-01\", TestReadmeRetiresProjectSetBans fails (docText(t, \"README.md\")); deleting or renaming the subsection fails the test", "if ARCHITECTURE.md's project-config section stops naming Save as the sole writer and internal/project/patch.go with a valid file:line pointer, TestArchitectureNamesLosslessWriter fails"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 5
  title = "Kill the 141 NOT COVERED patcher mutants with targeted tests"
  files = ["internal/project/patch_test.go", "internal/project/patch_diff_test.go", "internal/project/save_lossless_test.go", "internal/project/testdata/lossless.toml"]
  description = "Verify 2026-09-13 (r-20260913-164337): 0 of 400 reached mutants lived, but 141 in-hunk mutants were NOT COVERED — go test -cover confirms real gaps, not the switch-case ceiling: scanLiteral, scanMultilineLiteral, firstBytes 0%; unescapeBasic 5.9%; toBlock 18%; scanString 40%; verifyPatched 43%; writeAtomic 44%; setKey's dotted-key-spelling and root-table branches; parseKeyPath's quoted/literal key arms; qualify's four refusals; scanBracketed nested/comment paths; removeBlock's leading-blank and first-block cases; classify's struct/unknown arm. Extend the fixture and the unit tests so every one of these paths runs under an assertion; no production code changes unless a test exposes a bug (then fix + note in the commit). Re-run dross verify afterwards; the goal is unclassified_in_scope = 0 with no survivor accepted — every shape here can appear in a hand-edited file."
  covers = ["c-1", "c-2", "c-6"]
  depends_on = ["t-4"]
  test_contract = ["if a fixture key with a literal-string value ('it''s # not a comment') or a '''multi-line literal''' spanning three lines is not indexed as one value span ending at the closing quote(s) — including the ''''' four/five-quote tail — TestIndexLiteralStrings fails", "if a quoted key carrying \\\" \\\\ \\t \\u00e9 \\U0001F600 escapes is not resolved to its decoded name, or a dangling/short/bad-hex escape is not refused by message, TestIndexQuotedKeyEscapes fails", "if a literal-quoted key ('a.b' = 1) is split on the dot instead of kept as one name, TestIndexLiteralKeyKeepsDots fails", "if firstBytes does not truncate at the first newline and at n bytes (both branches), TestFirstBytesTruncates fails", "if setting state_map.uat on a [board] that spells the table as dotted keys (state_map.planned = \"x\") does not insert one line with the same state_map. prefix after the last such key, TestApplySetDottedKeyMirrorsSpelling fails", "if setting a root-level key on a doc with no [table] before it (and on an empty doc) does not land after the last root key line / at the top, TestApplySetRootKey fails", "if qualify accepts a table nested inside an array-of-tables element, an array op with elem=-1, or elem >= len, or if setKey reaching the elem>=0-without-header branch is not an error, TestQualifyRefusals fails on the missing message", "if a nested array containing strings with ']' and '#' inside, or an array with a comment after '[' on its own line, is not scanned to the true closing bracket, TestScanBracketedNested fails", "if scanValue's bare-value arm does not stop before a trailing '  # c' and strip trailing tabs, or a key with no value / a value at EOF is not refused as \"missing value\", TestScanValueBareAndMissing fails", "if removing the first block of a doc (no leading blanks) does not also drop the blank lines below it, or removing a mid block leaves its leading blank lines, TestRemoveBlockBlankHandling fails; if removing the unterminated last line leaves a dangling EOL, TestRemoveLinesUnterminatedTail fails", "if Save on a patch that decodes but as a different struct (inject an op that flips repo.squash_merge to the wrong literal) does not name the first differing key in its error, TestSaveVerifyNamesDifferingKey fails — the current TestSaveRefusesUnverifiedPatch fails decode and never reaches the line-diff loop", "if writeAtomic's failure paths (temp create refused, rename onto a directory) leave a temp file behind or alter the original, TestWriteAtomicFailurePaths fails", "if classify does not treat a time.Time leaf as a scalar and refuse an unknown type by path, TestClassifyStructAndUnknown fails", "if toBlock does not carry every key of a rendered table element in encoder order, TestToBlockOrder fails", "dross verify after this task reports unclassified_in_scope = 0 with 0 accepted survivors; a remaining NOT COVERED mutant in patch.go/patch_diff.go/project.go is the failure"]
  status = "pending"
