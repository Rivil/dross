[phase]
  id = "milestone-closeout-check"

[[task]]
  id = "t-1"
  wave = 1
  title = "Persist undisposed out-of-scope survivors in verify.toml"
  files = ["internal/verify/verify.go", "internal/verify/verify_test.go", "internal/verify/lifecycle.go", "internal/verify/lifecycle_test.go", "assets/prompts/verify.md", "internal/cmd/verify_prompt_test.go"]
  description = """
Add `SurvivorRecord{Key, File, Line, Op, Ambiguous}` and `Verify.Survivors` (`toml:"survivor,omitempty"`). The skeleton fills it from every out-of-scope row whose lifecycle is unclassified (neither accepted nor routed), including rows whose lifecycle was never set. ApplyLifecycle stamps Ambiguous onto out-of-scope mutants whose acceptance was withheld as ambiguous. Keyless rows are recorded, not skipped. Same file/line/op recorded once. verify.md §3 gains one line telling the agent to leave `[[survivor]]` records exactly as written.
"""
  covers = ["c-3"]
  test_contract = [
    "if accepted, routed or in-scope survivors leak into the records, or the keyless unclassified row is dropped, TestSkeletonRecordsUndisposedSurvivors fails: OutOfScope = unclassified k1 f.go:12, accepted k2, routed k3, unclassified keyless, plus one in-scope unclassified must yield exactly k1 and the keyless row, each with file/line/op",
    "if lifecycle stops stamping the ambiguous flag, the test for an accepted-but-ambiguous out-of-scope survivor fails: it must be recorded with ambiguous=true",
    "if two out-of-scope rows at the same file/line/op produce two records, the re-run idempotency test fails (exactly one record)",
    "if Save→LoadVerify drops any Survivors field, or a legacy verify.toml with no [[survivor]] loads non-nil Survivors or re-saves with a `survivor` table, the round-trip test fails",
    "if verify.md §3 loses the 'leave [[survivor]] records as written' line, verify_prompt_test fails; if verify.md grows past 15000 B, TestPromptByteBudget fails",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add closeout_ack records and item-id grammar"
  files = ["internal/milestone/milestone.go", "internal/milestone/milestone_test.go"]
  description = """
Add `CloseoutAck{Item, Reason, At}` and `Milestone.Closeout` (`toml:"closeout_ack,omitempty"`). `(*Milestone).Ack(item, reason, at)` upserts by item and refuses a blank/whitespace reason. `ParseAckItem(id)` / `FormatAckItem` accept only `phase:<slug>`, `deferred:<source>#<int>`, `survivor:<key>`; shared by collector and ack command.
"""
  covers = ["c-5", "c-9"]
  test_contract = [
    "if Ack accepts a whitespace-only reason, the test calling Ack(\"phase:p\", \"   \", t) fails: it must error and leave len(m.Closeout) unchanged",
    "if Ack appends instead of upserting, the test calling Ack(item,\"r1\",t1) then Ack(item,\"r2\",t2) fails: len must be 1 with Reason \"r2\" and At t2",
    "if ParseAckItem accepts any of \"bogus\", \"phase:\", \"deferred:src\", \"deferred:src#x\", \"deferred:x#-1\", \"survivor:\" or an unknown prefix, or rejects \"deferred:_project#0\", or Parse(Format(x)) does not round-trip, the ParseAckItem table test fails",
    "if Save→Load loses item/reason/at, or a toml with no acks loads non-nil Closeout or re-saves with a closeout_ack key, TestRoundTrip fails",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "Run close-out check in milestone completion arm"
  files = ["assets/prompts/milestone.md", "assets/prompts/_milestone.closeout.md", "assets/partials.go", "internal/cmd/milestone_dispatch_prompt_test.go"]
  description = "§8 step 1 runs `dross milestone complete <version> --check` before the close-out AskUserQuestion. A `**When** closeout=unresolved` fetch line pulls the new `closeout` partial (_milestone.closeout.md), which walks each unresolved item one per turn (resolve now / acknowledge with a reason via `dross milestone ack`) and re-runs --check; the PR opens only once --check exits 0. Add `\"closeout\": {\"clean\",\"unresolved\"}` to TriggerVocabulary."
  covers = ["c-7"]
  test_contract = [
    "if the --check command no longer precedes the close-out AskUserQuestion and the bare `dross milestone complete <version>` open command in '## 8. Completion arm', or the closeout=unresolved fetch line is missing, TestMilestonePromptCompletionArmChecksFirst fails",
    "if the expanded closeout partial loses any of: 'one per turn', AskUserQuestion, a resolve option, an acknowledge option, `dross milestone ack`, `--reason`, or re-running --check until exit 0 before the PR opens, TestMilestonePromptCloseoutPartialWalksOnePerTurn fails",
    "if milestone.md grows past 15000 B, TestPromptByteBudget fails; if the closeout key is missing from TriggerVocabulary, the partial fetch-line lint fails",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 2
  depends_on = ["t-1", "t-2"]
  title = "Build the close-out enumeration collector"
  files = ["internal/cmd/milestone_closeout.go", "internal/cmd/milestone_closeout_test.go"]
  description = """
`milestoneCloseout(root, version)` returns four kinds: unverified (milestoneUnverifiedPhases; no ack id), not-done (phase done over the phases array, deduped), unabsorbed deferred items (read-only collect; routed-survivor entries excluded), undisposed survivors (verify.toml records re-classified against acceptedReasons/routedSurvivors, honouring Ambiguous). Each item carries its ack id and clearing command. A collector error becomes a blocking, non-ackable line under its kind; other kinds still run. Acks split into applied and stale; Blocking() excludes acked items. Render: fixed kind order, sorted within kind, stale acks under their own heading.
"""
  covers = ["c-1", "c-2", "c-3", "c-4", "c-8", "c-11"]
  test_contract = [
    "c-1: if the not-done kind mis-classifies, the test with phases [done, shipped, built (dir, no status), ghost (no dir), built listed twice] fails: NotDone must equal [built, ghost] in roadmap order with built once; a malformed changes.json counts as not done",
    "c-2: if absorb filtering breaks, the deferred-kind test fails: src#1 targeting p1 is listed with source, index and target; absorbing it into a p1 criterion removes it; absorption by a different phase's criterion does not; dismissed, someday, out-of-milestone and routed-survivor entries are never listed; `_project` routed to p1 lists as deferred:_project#0; an unscaffolded target lists its items; a pre-identity item is listed and its source spec stays byte-identical (no EnsureIDs mint)",
    "c-3: if survivor re-classification breaks, the survivor-kind test fails: p1 record K f.go:12 is listed naming f.go:12 and p1; a survivors.toml acceptance clears it unless ambiguous=true (only a route clears that); a targeted deferred entry with survivor=K clears it, a dismissed or target-less one does not; K recorded by p1 and p2 is one survivor:K item naming both; a keyless record lists as survivor:<file>:<line>:<op>; a phase with no records contributes nothing",
    "c-4: if render drops a kind or a clearing command, or the collector returns early, the render test fails: one item per kind yields four headings in fixed order each line naming its clearing command, and an erroring collector stub alongside an item-returning one yields both",
    "c-4: if a malformed source spec.toml or survivors.toml yields an empty kind instead of a blocking error line, the collector-error test fails",
    "c-11: if acks are mis-partitioned, the ack-join test fails: an ack for an item no longer produced lands in Stale, not Applied, and Blocking() ignores it; ack phase:x where x is only unverified does not clear the unverified item",
    "c-8: if an empty milestone errors or blocks, the empty test fails: no milestone toml and phases = [] both give Blocking()==0 with no error; two renders of the same tree are byte-identical with no wall-clock value",
  ]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 3
  depends_on = ["t-2", "t-4"]
  title = "Add the dross milestone ack command"
  files = ["internal/cmd/milestone_ack.go", "internal/cmd/milestone_ack_test.go", "internal/cmd/milestone.go", "README.md"]
  description = """
`dross milestone ack <item> [version] --reason "..."` (default version: state.current_milestone) validates via ParseAckItem, requires the item to be currently unresolved OR already acknowledged, then upserts and saves. Register in Milestone(); add `ack` to the README milestone subcommand row.
"""
  covers = ["c-5", "c-9"]
  test_contract = [
    "if ack does not write the record, the test running `ack phase:built --reason \"moved to v2.0\"` fails: exactly one [[closeout_ack]] with that item, reason and a non-zero at",
    "if an empty reason is accepted, the test with --reason \"\" and --reason \"  \" fails: both exit non-zero and the toml sha256 is unchanged",
    "if re-ack is refused as unknown or duplicates the record, the re-ack test fails: one record carrying the latest reason",
    "if membership validation breaks, the refusal test fails: `bogus` (error lists the three forms), `phase:done`, `phase:nope` (not in milestone) and phase:<slug> for a done-but-unverified phase (error points at /dross-verify or --force-unverified) are refused with the toml unchanged",
    "if ack with no milestone toml creates a file, the no-milestone test fails: refused with 'nothing to acknowledge' and no file created",
    "if the struct-based writers drop acks, the test running `dross milestone add <v> phases p-z` after an ack fails: the [[closeout_ack]] record must survive",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 4
  depends_on = ["t-4", "t-5"]
  title = "Wire close-out into milestone complete with --check"
  files = ["internal/cmd/milestone.go", "internal/cmd/milestone_verify_gate.go", "internal/cmd/milestone_verify_gate_test.go", "internal/cmd/milestone_closeout_cmd_test.go", "internal/cmd/milestone_test.go"]
  description = """
Open mode refuses with the full report when Blocking() > 0; --force-unverified drops only the unverified kind and records nothing. PR body appends a 'Close-out acknowledgements' section (item, reason, current detail) for applied acks only. `--check` runs right after the --finalize branch, before the [remote] check, milestonePRBase (git fetch) and routeMilestoneHead; it honours --force-unverified and is refused with --finalize. --finalize never calls the collector. msPRCapture gains a body field; existing gate tests re-seeded with a complete changes.json.
"""
  covers = ["c-1", "c-2", "c-3", "c-4", "c-5", "c-6", "c-8", "c-9", "c-10", "c-11"]
  test_contract = [
    "if the refusal stops at the first kind, the all-kinds test fails: with all four kinds seeded, complete returns one error containing all four headings and cap.created==0",
    "if --force-unverified widens or vanishes, the force test fails: on the same seed it still refuses without the unverified heading; with only unverified seeded it opens the PR and the body has no ack line; a not-done phase still refuses under the flag naming phase:<slug>",
    "c-5: if acks don't reach the PR body, the test running `milestone ack phase:built --reason \"moved to v2.0\"` then complete fails: created==1 and cap.body contains both strings",
    "c-6: if --check writes or pushes anything, the check test fails: it exits non-zero with item lines equal to the refusal's, lists the acked item and reason, cap.posts==0, sha256 of every file under .dross, `git for-each-ref` and origin's milestone ref are identical before and after, no .git/FETCH_HEAD appears, an unpushed local commit stays unpushed, and --check works with no [remote] configured",
    "if `--check --finalize` is accepted, the conflicting-flags test fails",
    "c-8: if the empty path regresses, the test with no record or empty phases fails: --check exits 0 printing 'nothing unresolved' and the PR body is byte-equal to today's",
    "c-9: if --check output is non-deterministic after an ack, the test running --check twice fails on non-identical stdout",
    "c-10: if --finalize runs the close-out check, the test with finalizeFixture plus a not-done phase and an unabsorbed deferred item fails: --finalize must succeed, status becomes complete, and no close-out heading appears",
    "c-11: if stale acks leak, the test that acks phase:p then sets p complete fails: --check exits 0 with p under the stale heading and the PR body lacks phase:p",
    "if TestMilestoneCompleteOpensWhenEveryPhasePasses or TestMilestoneCompleteForceUnverifiedOverrides lose their complete changes.json seed, they trip the not-done kind and fail",
  ]
  status = "pending"
