[phase]
  id = "milestone-closeout-check"

[[task]]
  id = "t-1"
  wave = 1
  title = "Persist undisposed out-of-scope survivors in verify.toml"
  files = ["internal/verify/verify.go", "internal/verify/verify_test.go", "internal/verify/lifecycle.go", "internal/verify/lifecycle_test.go", "assets/prompts/verify.md", "internal/cmd/verify_prompt_test.go", "internal/pathfence/fields.go", "internal/pathfence/fields_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = """
Add `SurvivorRecord{Key, File, Line, Op, Ambiguous}` and `Verify.Survivors` (`toml:"survivor,omitempty"`). The skeleton fills it from every out-of-scope row whose lifecycle is unclassified (neither accepted nor routed), including rows whose lifecycle was never set. ApplyLifecycle stamps Ambiguous onto out-of-scope mutants whose acceptance was withheld as ambiguous. Keyless rows are recorded, not skipped. Same file/line/op recorded once. verify.md §3 gains one line telling the agent to leave `[[survivor]]` records exactly as written.
"""
  covers = ["c-3"]
  test_contract = [
    "if accepted, routed or in-scope survivors leak into the records, or the keyless unclassified row is dropped, TestSkeletonRecordsUndisposedSurvivors fails: OutOfScope = unclassified k1 f.go:12, accepted k2, routed k3, unclassified keyless, plus one in-scope unclassified must yield exactly k1 and the keyless row, each with file/line/op",
    "if lifecycle stops stamping the ambiguous flag, the test for an accepted-but-ambiguous out-of-scope survivor fails: it must be recorded with ambiguous=true",
    "if two out-of-scope rows at the same file/line/op produce two records, the re-run idempotency test fails (exactly one record)",
    "if Save→LoadVerify drops any Survivors field, or a legacy verify.toml with no [[survivor]] loads non-nil Survivors or re-saves with a `survivor` table, the round-trip test fails",
    "if verify.md §3 loses the 'leave [[survivor]] records as written' line, verify_prompt_test fails; if verify.md grows past 15000 B, TestPromptByteBudget fails",
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add closeout_ack records and item-id grammar"
  files = ["internal/milestone/milestone.go", "internal/milestone/milestone_test.go", "internal/cmd/testdata/pathfence_scan/not_paths.txt"]
  description = """
Add `CloseoutAck{Item, Reason, At}` and `Milestone.Closeout` (`toml:"closeout_ack,omitempty"`). `(*Milestone).Ack(item, reason, at)` upserts by item and refuses a blank/whitespace reason. `ParseAckItem(id)` / `FormatAckItem` accept only `phase:<slug>`, `deferred:<source>#<int>`, `survivor:<key>`; shared by collector and ack command.
"""
  covers = ["c-5", "c-9"]
  test_contract = ["if Ack accepts a whitespace-only reason, the test calling Ack(\"phase:p\", \"   \", t) fails: it must error and leave len(m.Closeout) unchanged", "if Ack appends instead of upserting, the test calling Ack(item,\"r1\",t1) then Ack(item,\"r2\",t2) fails: len must be 1 with Reason \"r2\" and At t2", "if ParseAckItem accepts any of \"bogus\", \"phase:\", \"deferred:src\", \"deferred:src#x\", \"deferred:x#-1\", \"survivor:\" or an unknown prefix, or rejects \"deferred:_project#0\", or Parse(Format(x)) does not round-trip, the ParseAckItem table test fails", "if Save→Load loses item/reason/at, or a toml with no acks loads non-nil Closeout or re-saves with a closeout_ack key, TestRoundTrip fails", "if ParseAckItem splits a survivor payload on its inner colons, or FormatAckItem does not round-trip it, the ParseAckItem table fails: survivor:f.go:12:op must be accepted with key \"f.go:12:op\" and Parse(Format(x)) must round-trip"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 6
  title = "Run close-out check in milestone completion arm"
  files = ["assets/prompts/milestone.md", "assets/prompts/_milestone.closeout.md", "assets/partials.go", "assets/partials_test.go", "internal/cmd/milestone_dispatch_prompt_test.go", "internal/cmd/prompt_expand_test.go"]
  description = "§8 step 1 runs `dross milestone complete <version> --check` before the close-out AskUserQuestion. A `**When** closeout=unresolved` fetch line pulls the new `closeout` partial (_milestone.closeout.md), which walks each unresolved item one per turn (resolve now / acknowledge with a reason via `dross milestone ack`; unverified items route to /dross-verify or --force-unverified) and re-runs --check; the PR opens only once --check exits 0. milestone.md has 313 B headroom: move existing §8 close-out prose into the partial to stay under 15000 B. Add `\"closeout\": {\"clean\",\"unresolved\"}` to TriggerVocabulary. Runs last so every command it names exists."
  covers = ["c-7"]
  test_contract = ["if the --check command no longer precedes the close-out AskUserQuestion and the bare `dross milestone complete <version>` open command in '## 8. Completion arm', or the closeout=unresolved fetch line is missing, TestMilestonePromptCompletionArmChecksFirst fails", "if the expanded closeout partial loses any of: 'one per turn', AskUserQuestion, a resolve option, an acknowledge option, `dross milestone ack`, `--reason`, or re-running --check until exit 0 before the PR opens, TestMilestonePromptCloseoutPartialWalksOnePerTurn fails", "if milestone.md grows past 15000 B, TestPromptByteBudget fails; if the closeout key is missing from TriggerVocabulary, the partial fetch-line lint fails", "if TestCommonPathVocabularyPinned in assets/partials_test.go is not updated, it fails: the pinned CommonPath() map must gain \"closeout\": \"clean\"", "if the closeout partial offers `dross milestone ack` for an unverified item, or stops routing unverified items to /dross-verify or --force-unverified, TestMilestonePromptCloseoutPartialWalksOnePerTurn fails", "if milestone.md or _milestone.closeout.md names a `dross milestone` subcommand or flag that does not resolve (ack, complete --check, --reason, --force-unverified), the command-resolve test in the TestProtectedPromptCommandsResolve pattern fails"]
  status = "done"
  depends_on = ["t-5", "t-7"]

[[task]]
  id = "t-4"
  wave = 2
  depends_on = ["t-1", "t-2"]
  title = "Build the four close-out collectors"
  files = ["internal/cmd/milestone_closeout.go", "internal/cmd/milestone_closeout_test.go", "cmd/dross/main_test.go"]
  description = "`milestoneCloseout(root, version)` collects four kinds: unverified (milestoneUnverifiedPhases; no ack id — unverified clears only via /dross-verify or --force-unverified, per locked force_unverified, which is how c-5 any-item is read), not-done (phase done over the phases array, deduped), unabsorbed deferred items (read-only; a plain item clears on an absorb record; a routed-survivor entry targeting a milestone phase clears only when boardsync.Disposed holds), undisposed survivors (verify.toml records re-classified against acceptedReasons/routedSurvivors, honouring Ambiguous). Each item carries its ack id and the clearing command that actually clears it. A collector error becomes a blocking, non-ackable line under its kind; other kinds still run."
  covers = ["c-1", "c-2", "c-3", "c-4"]
  test_contract = ["c-1: if the not-done kind mis-classifies, the test with phases [done, shipped, built (dir, no status), ghost (no dir), built listed twice] fails: NotDone must equal [built, ghost] in roadmap order with built once; a malformed changes.json counts as not done", "c-2: if absorb filtering breaks, the deferred-kind test fails: src#1 targeting p1 is listed with source, index and target; absorbing it into a p1 criterion removes it; absorption by a different phase criterion does not; dismissed, someday and out-of-milestone entries are never listed; `_project` routed to p1 lists as deferred:_project#0; an unscaffolded target lists its items; a pre-identity item is listed and its source spec stays byte-identical (no EnsureIDs mint)", "c-2: if a same-milestone routed survivor slips through, the routed-survivor test fails: p1 routes survivor K to p2 (both in the milestone) and it is listed under the deferred kind naming `dross survivor accept` or re-verify of p2 (not `deferred absorb`); it clears when survivors.toml accepts K, or when p2 has a finalized verify run newer than p1, scoped to K file, not listing K; a p2 run that never mutated K file does not clear it; K routed to a phase outside the milestone is never listed", "c-3: if survivor re-classification breaks, the survivor-kind test fails: p1 record K f.go:12 is listed naming f.go:12 and p1; a survivors.toml acceptance clears it unless ambiguous=true (only a route clears that); a targeted deferred entry with survivor=K clears it from the survivor kind, a dismissed or target-less one does not; K recorded by p1 and p2 is one survivor:K item naming both; a keyless record lists as survivor:<file>:<line>:<op>; a phase with no records contributes nothing", "if an item names a command that cannot clear it, the clearing-command test fails: a keyed non-ambiguous survivor names `dross survivor accept|route`; a keyless or ambiguous survivor names `dross survivor route` or `dross milestone ack` and never `dross survivor accept`; an unverified phase names /dross-verify or --force-unverified and never `dross milestone ack`", "c-4: if the collector returns early, the test with an erroring collector stub alongside an item-returning one fails: both must appear", "c-4: if a malformed source spec.toml or survivors.toml yields an empty kind instead of a blocking error line, the collector-error test fails"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 3
  title = "Join acks and render the close-out report"
  files = ["internal/cmd/milestone_closeout_render.go", "internal/cmd/milestone_closeout_render_test.go"]
  description = "Join the collected items with the milestone [[closeout_ack]] records: acks split into Applied (item still produced) and Stale; Blocking() counts unacked items plus non-ackable error lines. Render: fixed kind order, sorted within kind, each line with its clearing command, acknowledged items with reasons, stale acks under their own heading, no wall-clock values."
  covers = ["c-4", "c-8", "c-11"]
  test_contract = ["c-4: if render drops a kind or a clearing command, the render test fails: one item per kind yields four headings in fixed order, each line naming its clearing command", "c-11: if acks are mis-partitioned, the ack-join test fails: an ack for an item no longer produced lands in Stale, not Applied, and Blocking() ignores it; ack phase:x where x is only unverified does not clear the unverified item; an error line is never cleared by an ack", "c-8: if an empty milestone errors or blocks, the empty test fails: no milestone toml and phases = [] both give Blocking()==0 with no error; two renders of the same tree are byte-identical with no wall-clock value"]
  status = "done"
  depends_on = ["t-4"]

[[task]]
  id = "t-5"
  wave = 3
  depends_on = ["t-2", "t-4"]
  title = "Add the dross milestone ack command"
  files = ["internal/cmd/milestone_ack.go", "internal/cmd/milestone_ack_test.go", "internal/cmd/milestone.go", "README.md", "cmd/dross/main_test.go", "cmd/dross/testdata/cli_tree.txt"]
  description = "`dross milestone ack <item> [version] --reason \"...\"` (default version: state.current_milestone) validates via ParseAckItem, requires the item to be currently unresolved OR already acknowledged, then upserts and saves. Unverified phases are not ackable: they clear only via /dross-verify or --force-unverified (locked force_unverified; this is how c-5 any-item is read). Register in Milestone(); add `ack` to the README milestone subcommand row."
  covers = ["c-5", "c-9"]
  test_contract = ["if ack does not write the record, the test running `ack phase:built --reason \"moved to v2.0\"` fails: exactly one [[closeout_ack]] with that item, reason and a non-zero at", "if an empty reason is accepted, the test with --reason \"\" and --reason \"  \" fails: both exit non-zero and the toml sha256 is unchanged", "if re-ack is refused as unknown or duplicates the record, the re-ack test fails: one record carrying the latest reason", "if membership validation breaks, the refusal test fails: `bogus` (error lists the three forms), `phase:done`, `phase:nope` (not in milestone) and phase:<slug> for a done-but-unverified phase (error points at /dross-verify or --force-unverified) are refused with the toml unchanged", "if ack with no milestone toml creates a file, the no-milestone test fails: refused with 'nothing to acknowledge' and no file created", "if the struct-based writers drop acks, the test running `dross milestone add <v> phases p-z` after an ack fails: the [[closeout_ack]] record must survive", "if acks for keyless survivors are refused, the keyless-ack test fails: with an undisposed keyless survivor recorded, `ack survivor:f.go:12:op --reason r` writes one [[closeout_ack]] with that item", "if the temporary narratedIgnore entry for `dross milestone ack` added in t-4 is not removed once ack is registered, TestNarratedCommandsResolveAgainstTheTree fails (ignore entry resolves against the tree)"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 4
  depends_on = ["t-5", "t-8"]
  title = "Gate milestone complete on the close-out check"
  files = ["internal/cmd/milestone.go", "internal/cmd/milestone_verify_gate.go", "internal/cmd/milestone_verify_gate_test.go", "internal/cmd/milestone_closeout_cmd_test.go", "internal/cmd/milestone_test.go"]
  description = "Open mode refuses with the full report when Blocking() > 0; --force-unverified drops only the unverified kind and records nothing. PR body appends a Close-out acknowledgements section (item, reason, current detail) for applied acks only. --finalize never calls the collector. msPRCapture gains a body field; existing gate tests re-seeded with a complete changes.json."
  covers = ["c-1", "c-2", "c-3", "c-4", "c-5", "c-8", "c-10", "c-11"]
  test_contract = ["if the refusal stops at the first kind, the all-kinds test fails: with all four kinds seeded, complete returns one error containing all four headings and cap.created==0", "if --force-unverified widens or vanishes, the force test fails: on the same seed it still refuses without the unverified heading; with only unverified seeded it opens the PR and the body has no ack line; a not-done phase still refuses under the flag naming phase:<slug>", "c-5: if acks do not reach the PR body, the test running `milestone ack phase:built --reason \"moved to v2.0\"` then complete fails: created==1 and cap.body contains both strings", "c-8: if the empty path regresses, the test with no milestone record or empty phases fails: complete opens the PR and the body is byte-equal to today", "c-10: if --finalize runs the close-out check, the test with finalizeFixture plus a not-done phase and an unabsorbed deferred item fails: --finalize must succeed, status becomes complete, and no close-out heading appears", "c-11: if stale acks leak into the PR body, the test that acks phase:p then sets p complete and opens the PR fails: the body must lack phase:p", "if TestMilestoneCompleteOpensWhenEveryPhasePasses or TestMilestoneCompleteForceUnverifiedOverrides lose their complete changes.json seed, they trip the not-done kind and fail", "if a refused complete pushes, the all-kinds refusal test fails: origin milestone ref and `git for-each-ref` are identical before and after the refusal and an unpushed local commit stays unpushed"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 5
  title = "Add side-effect-free --check to milestone complete"
  files = ["internal/cmd/milestone.go", "internal/cmd/milestone_check_test.go", "README.md", "cmd/dross/testdata/cli_tree.txt"]
  description = "`--check` runs right after the --finalize branch, before the [remote] check, milestonePRBase (git fetch) and routeMilestoneHead; prints the refusal enumeration plus acknowledged items and stale acks, exits non-zero when Blocking() > 0. Honours --force-unverified; refused with --finalize. README milestone row gains --check, the close-out refusal and acks; tick this phase roadmap checkbox. Also update the --force-unverified flag usage (left stale by t-6): it now skips only the unverified close-out kind, not every gate; regenerate cli_tree.txt for both flag lines."
  covers = ["c-6", "c-8", "c-9", "c-11"]
  test_contract = ["c-6: if --check writes or pushes anything, the check test fails: it exits non-zero with item lines equal to the refusal, lists the acked item and reason, cap.posts==0, sha256 of every file under .dross, `git for-each-ref` and origin milestone ref are identical before and after, no .git/FETCH_HEAD appears, an unpushed local commit stays unpushed, and --check works with no [remote] configured", "if `--check --finalize` is accepted, the conflicting-flags test fails", "if --check ignores --force-unverified, the test with only unverified phases seeded fails: --check --force-unverified must exit 0", "c-8: if the empty path regresses, the test with no milestone record or empty phases fails: --check exits 0 printing \"nothing unresolved\"", "c-9: if --check output is non-deterministic after an ack, the test running --check twice fails on non-identical stdout", "c-11: if a stale ack counts as blocking, the test that acks phase:p then sets p complete fails: --check exits 0 with p under the stale heading", "if the --force-unverified usage still claims it skips the whole verify gate, or cli_tree.txt is not updated for the --check and --force-unverified lines, TestCLITreeGolden or the usage assertion fails"]
  status = "done"
  depends_on = ["t-6"]

