name: pin-currency

# Weekly check of every version pin Dependabot cannot reach: run-block
# `go install …@vX.Y.Z` pins (in composite actions), setup-node's version file,
# go.mod's toolchain, goreleaser's pin, and the pins dross holds in Go source
# (gremlinsPin, strykerPin). `go run ./cmd/pincheck` classifies each against its
# upstream's release list; a pin with a newer release on its own line that has
# been public for more than 7 days (Dependabot's cooldown) is stale. A stale,
# unpinned or unreadable pin turns the check red — an upstream that cannot be
# reached never passes as current. When something is stale, the bump job
# rewrites it and opens (or updates) one PR, then dispatches CI on it.
#
# Repo setting this workflow depends on:
#   "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions), enabled 2026-09-29.
# Without it the bump job's `gh pr create` is refused even with
# pull-requests: write. The default workflow permissions stay read.
# Check it with:
#   gh api repos/Rivil/dross/actions/permissions/workflow
# which must report "can_approve_pull_request_reviews": true.
# TestPinCurrencyRecordsRepoSetting keeps this note here.
on:
  schedule:
    - cron: '23 5 * * 1'  # Mondays 05:23 UTC
  workflow_dispatch:

# Least privilege: read-only by default. Only the bump job is granted write,
# and only the three scopes it uses (TestPinCurrencyPermissions).
permissions:
  contents: read

# One run at a time: a manual dispatch during the scheduled run queues behind
# it rather than racing it for the bump branch.
concurrency:
  group: pin-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # Written by pincheck to $GITHUB_OUTPUT whether the step passes or
      # fails, so the bump job can tell "red because stale" from "red because
      # an upstream was unreachable".
      stale: ${{ steps.pincheck.outputs.stale }}
    env:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod  # single source: go.mod's toolchain directive
          cache: true

      # Strict: no `|| true`, no continue-on-error. A stale or unknown pin is
      # the red run that makes it visible (TestPinCurrencyRunsWeekly).
      - name: pincheck
        id: pincheck
        run: go run ./cmd/pincheck

  bump:
    needs: check
    # The check job fails exactly when something is stale, so this must run
    # past a failed dependency — but only when the failure was staleness.
    if: ${{ !cancelled() && needs.check.outputs.stale == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open, update or comment on the bump PR
      actions: write         # dispatch ci.yml on the bump branch
    env:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      BUMP_BRANCH: pin-currency/bump
      BASE_BRANCH: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the PR script compares the bump branch against main
          # to tell the bot's commits from anyone else's.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod  # single source: go.mod's toolchain directive
          cache: true

      # Rewrites only files outside .github/workflows/ (locked decision
      # bump_reach — GitHub rejects a GITHUB_TOKEN push that changes a
      # workflow) and never strykerPin (bot_bump_scope).
      - name: bump stale pins
        run: go run ./cmd/pincheck bump

      - name: open or update the bump PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pin-bump-pr.sh

      # A PR opened with GITHUB_TOKEN triggers no pull_request workflow;
      # workflow_dispatch is the documented exception, and its checks land on
      # the branch head the PR shows (locked decision bump_ci).
      - name: dispatch CI on the bump branch
        if: steps.pr.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BUMP_BRANCH"
