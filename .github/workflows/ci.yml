name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. No job pushes anywhere.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Supply-chain hardening: pin the module proxy + checksum DB and refuse any
      # mid-CI mutation of go.mod/go.sum.
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history: TestRedProofPinsBaseCommit resolves the base commit
          # fixtures/hostile-config-c5/RUN.md pins, which a depth-1 checkout
          # does not carry. Without this the check degrades to a log line.
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          # Pinned to an exact patch, not the '1.25' minor. Two reasons, and
          # the second is why it is not just style:
          #
          # Pinning lower than go.mod's `go 1.25.0` directive would not pin
          # anything — GOTOOLCHAIN=auto silently fetches the newer toolchain
          # mid-run, so the declared version is a fiction and the real one is
          # whatever the proxy served.
          #
          # And the floating minor is what the govulncheck gate below trips
          # over: '1.25' resolved to a patch carrying four stdlib advisories
          # (GO-2026-6218 net/url, GO-2026-6090 crypto/tls, GO-2026-5972
          # encoding/asn1, GO-2026-5026 net/http), all fixed in go1.25.13.
          # A floating version means the toolchain — the largest dependency
          # here — is the one thing this hardened workflow did not pin.
          # Bump this deliberately when a new advisory lands.
          go-version: '1.25.13'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./cmd/dross

      # Supply-chain gate: pinned, never @latest — a compromised release must
      # not be able to walk in on the next CI run. No allowlist and no
      # `|| true`: a finding fails the build and the dep gets upgraded.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck
        run: govulncheck ./...

  # The non-Go mutation leg. Until this job existed, dross's TypeScript adapter
  # was only ever exercised where a developer happened to have Node installed —
  # everywhere else TestStrykerRunsEndToEnd skipped, and a skipped test reports
  # the same green as one that ran. So the adapter that scores every JS/TS repo
  # dross verifies had no gate on any pull request.
  mutation-ts:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      # Turns the test's own skip into a failure. Without it this job is
      # theatre: a runner that lost Node would go green having measured
      # nothing, which is the exact vacuous-pass this repo keeps removing.
      DROSS_REQUIRE_E2E: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: '1.25.13'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # Exact patch, not '24' or '24.x' — same reasoning as the Go pin
          # above. A floating version means the largest dependency in this job
          # is the one thing it did not pin.
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: internal/mutation/testdata/ts-project/package-lock.json

      # --ignore-scripts: install scripts are npm's biggest execution vector,
      # and this tree runs them as root-equivalent on the runner. Verified safe
      # for these deps — esbuild 0.28 ships per-platform binaries as optional
      # dependencies rather than fetching one in a postinstall, and fsevents is
      # macOS-only. `ci`, never `install`: it fails if the lockfile has drifted
      # instead of quietly resolving something else.
      - name: npm ci (fixture)
        working-directory: internal/mutation/testdata/ts-project
        run: npm ci --ignore-scripts

      # No allowlist and no `|| true`: a high-or-critical advisory fails the
      # build and the dependency gets upgraded. --omit=dev is deliberately NOT
      # passed — every dependency here is a devDependency, so omitting them
      # would audit nothing and pass by construction.
      - name: npm audit (fixture)
        working-directory: internal/mutation/testdata/ts-project
        run: npm audit --audit-level=high

      - name: stryker end-to-end mutation run
        run: go test -count=1 -run TestStrykerRunsEndToEnd ./internal/mutation/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # shellcheck is preinstalled on ubuntu-latest runners — no third-party action.
      # Every shipped shell script is linted, not just the installer: release.yml
      # shells out to scripts/release-version.sh to compute the release tag.
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
