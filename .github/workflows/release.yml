name: release

# Automatic releasing: every merge to main reads the project version from
# .dross/project.toml (via scripts/release-version.sh) and projects it to a
# 3-part semver tag (0.6.13.0 → v0.6.13 — valid semver for `dross update`,
# dropping the dev-only .internal part). project.toml is the tracked home of the
# version, so a clean CI checkout of main carries the value dross last bumped. If
# that tag does not already exist it tags the commit and goreleaser publishes the
# per-platform archives + checksums.txt that install.sh and `dross update` consume.
# A phase ship bumps the patch (phase ordinal) so it cuts a release; a quick task
# only bumps .internal, leaving the 3-part tag unchanged, so it cuts none.
# workflow_dispatch with an explicit `version` is the manual override.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit release tag, e.g. v0.6.0 (blank = auto-compute)'
        required: false
        default: ''

# Least privilege: only the release flow needs write (push the tag + create the
# GitHub release). No other permission is granted.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Same hardening as ci.yml: pin proxy + checksum DB and refuse any mid-job
      # mutation of go.mod/go.sum. -mod=readonly is what makes the govulncheck
      # step below meaningful — the graph it scans is, by construction, the
      # graph goreleaser then builds from, because neither step may change it.
      # (goreleaser's `go mod tidy` before-hook, which needed a writable graph,
      # is gone: a tidy tree is CI's job, not the release's.)
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history + tags for version computation

      - name: Determine release tag
        id: tag
        # Expressions reach the shell through env:, never inline in run: — an
        # inline `${{ }}` is substituted into the script text before bash sees
        # it, so its value is parsed as code. TestWorkflowsHaveNoExpressionsInRun
        # fails on any `${{` inside a run: block.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          input="$INPUT_VERSION"
          if [ -n "$input" ]; then
            echo "Manual release: $input"
            echo "new_tag=$input" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolves [project].version from the tracked .dross/project.toml and
          # projects it to the 3-part tag, using nothing but a POSIX shell and
          # coreutils — this runs before setup-go, on a bare runner.
          new="$(sh scripts/release-version.sh)"
          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "Tag $new already exists (project version unchanged on this merge); nothing to release."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release tag from project version → $new"
          echo "new_tag=$new" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.tag.outputs.new_tag != ''
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          tag="$NEW_TAG"
          git tag "$tag"
          git push origin "$tag"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.tag.outputs.new_tag != ''
        with:
          # Same single source as ci.yml: go.mod's `toolchain` directive. This
          # is the toolchain that builds the binaries users download, so it
          # must be exactly the one CI gated on — reading both from go.mod
          # makes that a structural fact rather than two strings kept in sync
          # by hand. TestToolchainSingleSource fails on any `go-version:` key.
          go-version-file: go.mod
          cache: true

      - name: go version
        if: steps.tag.outputs.new_tag != ''
        run: go version

      # Supply-chain gate on the release itself. CI already runs this on every
      # PR, but an advisory can land between that green and the merge to main;
      # scanning here — on the readonly graph the binaries are about to be built
      # from — is the only run that proves the shipped graph is clean. Pinned,
      # never @latest; no allowlist and no `|| true`: a finding fails the
      # release (TestReleaseJobRunsGovulncheck pins all three properties).
      - name: install govulncheck
        if: steps.tag.outputs.new_tag != ''
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck
        if: steps.tag.outputs.new_tag != ''
        run: govulncheck ./...

      # goreleaser's `signs:` block shells out to the `minisign` CLI, which is not
      # present on the runner by default. Install it from Ubuntu's signed apt repo
      # (distro-signed, not a mutable registry @latest tag — within the CI hardening
      # rules). Without this the signing step fails: "minisign: not found in $PATH".
      - name: Install minisign
        if: steps.tag.outputs.new_tag != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Write minisign secret key
        if: steps.tag.outputs.new_tag != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"

      - uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf  # v6.1.0
        if: steps.tag.outputs.new_tag != ''
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
